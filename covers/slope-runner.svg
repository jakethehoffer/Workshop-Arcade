<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="slope-track" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0c121e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Perspective track lines -->
  <line x1="320" y1="40" x2="50" y2="280" stroke="#5eead4" stroke-width="1.5" opacity="0.3"/>
  <line x1="320" y1="40" x2="590" y2="280" stroke="#5eead4" stroke-width="1.5" opacity="0.3"/>
  <line x1="320" y1="40" x2="220" y2="280" stroke="#5eead4" stroke-width="0.8" opacity="0.2"/>
  <line x1="320" y1="40" x2="420" y2="280" stroke="#5eead4" stroke-width="0.8" opacity="0.2"/>
  <line x1="320" y1="40" x2="320" y2="280" stroke="#5eead4" stroke-width="0.8" opacity="0.15"/>
  <!-- Horizontal track lines (perspective) -->
  <line x1="290" y1="80" x2="350" y2="80" stroke="#5eead4" stroke-width="0.5" opacity="0.15"/>
  <line x1="260" y1="120" x2="380" y2="120" stroke="#5eead4" stroke-width="0.5" opacity="0.2"/>
  <line x1="220" y1="160" x2="420" y2="160" stroke="#5eead4" stroke-width="0.8" opacity="0.2"/>
  <line x1="170" y1="200" x2="470" y2="200" stroke="#5eead4" stroke-width="0.8" opacity="0.25"/>
  <line x1="110" y1="240" x2="530" y2="240" stroke="#5eead4" stroke-width="1" opacity="0.3"/>
  <!-- Ball -->
  <circle cx="340" cy="190" r="20" fill="#5eead4"/>
  <circle cx="335" cy="184" r="6" fill="white" opacity="0.3"/>
  <!-- Speed lines -->
  <line x1="310" y1="175" x2="280" y2="155" stroke="#5eead4" stroke-width="2" opacity="0.5"/>
  <line x1="315" y1="185" x2="275" y2="170" stroke="#5eead4" stroke-width="1.5" opacity="0.4"/>
  <line x1="318" y1="195" x2="285" y2="185" stroke="#5eead4" stroke-width="1.5" opacity="0.3"/>
  <!-- Obstacle blocks -->
  <rect x="160" y="235" width="40" height="30" rx="3" fill="#fb7185" opacity="0.5"/>
  <rect x="450" y="235" width="40" height="30" rx="3" fill="#fb7185" opacity="0.5"/>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="2">SLOPE RUNNER</text>
</svg>