<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Grid -->
  <g transform="translate(170,30)">
    <!-- Grid cells (6x4) -->
    <g fill="#1a2335" stroke="#2a3a55" stroke-width="1">
      <rect x="0" y="0" width="50" height="50"/><rect x="50" y="0" width="50" height="50"/>
      <rect x="100" y="0" width="50" height="50"/><rect x="150" y="0" width="50" height="50"/>
      <rect x="200" y="0" width="50" height="50"/><rect x="250" y="0" width="50" height="50"/>
      <rect x="0" y="50" width="50" height="50"/><rect x="50" y="50" width="50" height="50"/>
      <rect x="100" y="50" width="50" height="50"/><rect x="150" y="50" width="50" height="50"/>
      <rect x="200" y="50" width="50" height="50"/><rect x="250" y="50" width="50" height="50"/>
      <rect x="0" y="100" width="50" height="50"/><rect x="50" y="100" width="50" height="50"/>
      <rect x="100" y="100" width="50" height="50"/><rect x="150" y="100" width="50" height="50"/>
      <rect x="200" y="100" width="50" height="50"/><rect x="250" y="100" width="50" height="50"/>
      <rect x="0" y="150" width="50" height="50"/><rect x="50" y="150" width="50" height="50"/>
      <rect x="100" y="150" width="50" height="50"/><rect x="150" y="150" width="50" height="50"/>
      <rect x="200" y="150" width="50" height="50"/><rect x="250" y="150" width="50" height="50"/>
      <rect x="0" y="200" width="50" height="50"/><rect x="50" y="200" width="50" height="50"/>
      <rect x="100" y="200" width="50" height="50"/><rect x="150" y="200" width="50" height="50"/>
      <rect x="200" y="200" width="50" height="50"/><rect x="250" y="200" width="50" height="50"/>
    </g>
    <!-- Revealed cells (lighter) -->
    <rect x="50" y="50" width="50" height="50" fill="#0f1a2e"/>
    <rect x="100" y="50" width="50" height="50" fill="#0f1a2e"/>
    <rect x="50" y="100" width="50" height="50" fill="#0f1a2e"/>
    <rect x="100" y="100" width="50" height="50" fill="#0f1a2e"/>
    <rect x="150" y="100" width="50" height="50" fill="#0f1a2e"/>
    <rect x="100" y="150" width="50" height="50" fill="#0f1a2e"/>
    <!-- Numbers -->
    <text x="75" y="85" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="bold" fill="#7c9eff" text-anchor="middle">1</text>
    <text x="125" y="85" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="bold" fill="#34d399" text-anchor="middle">2</text>
    <text x="75" y="135" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="bold" fill="#34d399" text-anchor="middle">2</text>
    <text x="125" y="135" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="bold" fill="#fb7185" text-anchor="middle">3</text>
    <text x="175" y="135" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="bold" fill="#7c9eff" text-anchor="middle">1</text>
    <text x="125" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="bold" fill="#7c9eff" text-anchor="middle">1</text>
    <!-- Flag -->
    <g transform="translate(25,225)">
      <line x1="0" y1="-15" x2="0" y2="10" stroke="#ccc" stroke-width="2"/>
      <polygon points="0,-15 18,-8 0,-1" fill="#fb7185"/>
    </g>
    <!-- Mine/bomb -->
    <g transform="translate(225,225)">
      <circle cx="0" cy="0" r="12" fill="#5eead4"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#5eead4" stroke-width="2"/>
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#5eead4" stroke-width="2"/>
      <line x1="-12" y1="-12" x2="12" y2="12" stroke="#5eead4" stroke-width="2"/>
      <line x1="12" y1="-12" x2="-12" y2="12" stroke="#5eead4" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#0c121e"/>
      <circle cx="-3" cy="-3" r="2" fill="white" opacity="0.6"/>
    </g>
  </g>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="2">MINESWEEPER</text>
</svg>