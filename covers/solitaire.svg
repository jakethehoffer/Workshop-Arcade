<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0c121e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#felt)"/>
  <!-- Card 1 (back, fanned left) -->
  <g transform="translate(220,80) rotate(-20,50,120)">
    <rect x="0" y="0" width="100" height="140" rx="8" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="8" y="8" width="84" height="124" rx="4" fill="none" stroke="#5eead4" stroke-width="0.5" opacity="0.4"/>
    <line x1="50" y1="30" x2="50" y2="110" stroke="#5eead4" stroke-width="0.5" opacity="0.3"/>
    <line x1="20" y1="70" x2="80" y2="70" stroke="#5eead4" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- Card 2 (back, fanned slightly left) -->
  <g transform="translate(250,70) rotate(-10,50,120)">
    <rect x="0" y="0" width="100" height="140" rx="8" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="8" y="8" width="84" height="124" rx="4" fill="none" stroke="#5eead4" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- Card 3 (Ace of Spades, center) -->
  <g transform="translate(270,60)">
    <rect x="0" y="0" width="100" height="140" rx="8" fill="#f0f0f0" stroke="#5eead4" stroke-width="2"/>
    <text x="12" y="28" font-family="Georgia,serif" font-size="20" font-weight="bold" fill="#1a1a2e">A</text>
    <!-- Spade symbol -->
    <g transform="translate(50,75)">
      <path d="M0,-25 C-15,-15 -20,5 -10,12 C-5,8 0,10 0,20 C0,10 5,8 10,12 C20,5 15,-15 0,-25Z" fill="#1a1a2e"/>
      <rect x="-3" y="12" width="6" height="12" fill="#1a1a2e"/>
    </g>
    <text x="88" y="132" font-family="Georgia,serif" font-size="20" font-weight="bold" fill="#1a1a2e" text-anchor="end">A</text>
  </g>
  <!-- Card 4 (fanned right) -->
  <g transform="translate(300,70) rotate(10,50,120)">
    <rect x="0" y="0" width="100" height="140" rx="8" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="8" y="8" width="84" height="124" rx="4" fill="none" stroke="#5eead4" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- Card 5 (fanned far right) -->
  <g transform="translate(320,80) rotate(20,50,120)">
    <rect x="0" y="0" width="100" height="140" rx="8" fill="#1e293b" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="8" y="8" width="84" height="124" rx="4" fill="none" stroke="#5eead4" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="32" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="2">SOLITAIRE</text>
</svg>