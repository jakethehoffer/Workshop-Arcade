<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c121e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="#0a0a0f"/>
  <rect width="640" height="360" fill="url(#vignette)"/>
  <!-- Static noise lines (decorative) -->
  <line x1="0" y1="80" x2="640" y2="80" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="160" x2="640" y2="160" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="240" x2="640" y2="240" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  <!-- Bear face silhouette -->
  <g transform="translate(320,150)">
    <!-- Ears -->
    <circle cx="-65" cy="-60" r="28" fill="#1a1520"/>
    <circle cx="65" cy="-60" r="28" fill="#1a1520"/>
    <circle cx="-65" cy="-60" r="18" fill="#251a2a"/>
    <circle cx="65" cy="-60" r="18" fill="#251a2a"/>
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="80" ry="75" fill="#1a1520"/>
    <!-- Muzzle -->
    <ellipse cx="0" cy="25" rx="40" ry="28" fill="#211828"/>
    <!-- Glowing eyes -->
    <circle cx="-30" cy="-10" r="12" fill="url(#glow1)"/>
    <circle cx="30" cy="-10" r="12" fill="url(#glow2)"/>
    <circle cx="-30" cy="-10" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="30" cy="-10" r="5" fill="#ffffff" opacity="0.9"/>
    <!-- Nose -->
    <ellipse cx="0" cy="15" rx="8" ry="5" fill="#0a0a0f"/>
    <!-- Mouth -->
    <path d="M-20,30 Q-10,42 0,35 Q10,42 20,30" fill="none" stroke="#0a0a0f" stroke-width="2"/>
    <!-- Teeth hints -->
    <rect x="-8" y="32" width="4" height="6" rx="1" fill="#ddd" opacity="0.3"/>
    <rect x="4" y="32" width="4" height="6" rx="1" fill="#ddd" opacity="0.3"/>
  </g>
  <!-- "12 AM" indicator -->
  <text x="320" y="45" font-family="monospace" font-size="16" fill="#5eead4" text-anchor="middle" opacity="0.5">12:00 AM</text>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="3">FNAF GUESSER</text>
</svg>