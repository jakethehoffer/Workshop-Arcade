<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Graph grid lines -->
  <line x1="100" y1="260" x2="540" y2="260" stroke="#1e293b" stroke-width="1"/>
  <line x1="100" y1="210" x2="540" y2="210" stroke="#1e293b" stroke-width="0.5" opacity="0.5"/>
  <line x1="100" y1="160" x2="540" y2="160" stroke="#1e293b" stroke-width="0.5" opacity="0.5"/>
  <line x1="100" y1="110" x2="540" y2="110" stroke="#1e293b" stroke-width="0.5" opacity="0.5"/>
  <line x1="100" y1="60" x2="540" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.5"/>
  <!-- Upward arrow graph line -->
  <polyline points="120,250 200,240 280,220 340,180 400,120 450,70 500,40" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <!-- Glow under graph -->
  <polygon points="120,250 200,240 280,220 340,180 400,120 450,70 500,40 500,260 120,260" fill="#34d399" opacity="0.08"/>
  <!-- Arrow head -->
  <polygon points="500,40 490,55 505,52" fill="#34d399"/>
  <!-- Stacked coins -->
  <g transform="translate(180,140)">
    <ellipse cx="0" cy="30" rx="28" ry="8" fill="#d97706"/>
    <rect x="-28" y="20" width="56" height="10" fill="#f59e0b"/>
    <ellipse cx="0" cy="20" rx="28" ry="8" fill="#fbbf24"/>
    <rect x="-28" y="10" width="56" height="10" fill="#f59e0b"/>
    <ellipse cx="0" cy="10" rx="28" ry="8" fill="#fbbf24"/>
    <rect x="-28" y="0" width="56" height="10" fill="#f59e0b"/>
    <ellipse cx="0" cy="0" rx="28" ry="8" fill="#fbbf24"/>
    <text x="0" y="4" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>
  </g>
  <!-- Money bag -->
  <g transform="translate(130,180)">
    <ellipse cx="0" cy="10" rx="20" ry="22" fill="#f59e0b" opacity="0.8"/>
    <path d="M-8,-12 Q0,-22 8,-12" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>
    <text x="0" y="16" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>
  </g>
  <!-- Dollar signs floating -->
  <text x="420" y="100" font-family="Arial,sans-serif" font-size="18" fill="#5eead4" opacity="0.4">$</text>
  <text x="460" y="80" font-family="Arial,sans-serif" font-size="14" fill="#5eead4" opacity="0.3">$</text>
  <text x="480" y="60" font-family="Arial,sans-serif" font-size="22" fill="#5eead4" opacity="0.5">$</text>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="2">IDLE TYCOON</text>
</svg>