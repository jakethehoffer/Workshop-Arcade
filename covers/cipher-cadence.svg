<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Cipher Cadence cover</title>
  <desc id="desc">Four glowing word lanes converge on a golden pulse line in a neon rhythm word puzzle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset=".58" stop-color="#0b2131"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5f75"/>
      <stop offset="1" stop-color="#0d2d40"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="84" cy="36" r="150" fill="#5eead4" opacity=".13"/>
  <circle cx="600" cy="36" r="142" fill="#ffd166" opacity=".11"/>
  <g stroke="#7dd3fc" stroke-opacity=".12" stroke-width="2">
    <path d="M42 86h556M42 136h556M42 186h556M42 236h556"/>
    <path d="M96 52 18 330M214 52 136 330M332 52 254 330M450 52 372 330M568 52 490 330"/>
  </g>
  <line x1="468" y1="70" x2="468" y2="287" stroke="#ffd166" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <text x="468" y="315" text-anchor="middle" fill="#ffd166" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="900">PULSE</text>
  <g font-family="system-ui,Segoe UI,sans-serif" font-weight="900" text-anchor="middle">
    <g filter="url(#glow)">
      <rect x="124" y="106" width="138" height="44" rx="12" fill="url(#tile)" stroke="#5eead4" stroke-width="3"/>
      <text x="193" y="135" fill="#f5fbff" font-size="22">FIND</text>
    </g>
    <rect x="238" y="156" width="148" height="44" rx="12" fill="#142d42" stroke="#7dd3fc" stroke-opacity=".7" stroke-width="2"/>
    <text x="312" y="185" fill="#f5fbff" font-size="22">QUIET</text>
    <rect x="332" y="206" width="136" height="44" rx="12" fill="#14364a" stroke="#ffd166" stroke-width="3"/>
    <text x="400" y="235" fill="#f5fbff" font-size="22">CODE</text>
    <rect x="166" y="256" width="138" height="44" rx="12" fill="#142d42" stroke="#7dd3fc" stroke-opacity=".7" stroke-width="2"/>
    <text x="235" y="285" fill="#f5fbff" font-size="22">CLOCK</text>
  </g>
  <g transform="translate(42 34)">
    <text x="0" y="0" fill="#5eead4" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="900" letter-spacing="3">WORKSHOP ARCADE</text>
    <text x="0" y="44" fill="#f5fbff" font-family="system-ui,Segoe UI,sans-serif" font-size="46" font-weight="950">Cipher Cadence</text>
    <text x="0" y="72" fill="#9db7c9" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="750">Word lanes. Beat timing. Clean decoding.</text>
  </g>
</svg>
