<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Radial glow -->
  <circle cx="320" cy="160" r="140" fill="none" stroke="#5eead4" stroke-width="0.5" opacity="0.15"/>
  <circle cx="320" cy="160" r="100" fill="none" stroke="#5eead4" stroke-width="0.5" opacity="0.2"/>
  <!-- Bullet trail lines -->
  <line x1="100" y1="60" x2="280" y2="140" stroke="#fb7185" stroke-width="1.5" opacity="0.4"/>
  <line x1="540" y1="50" x2="360" y2="140" stroke="#fb7185" stroke-width="1.5" opacity="0.4"/>
  <line x1="80" y1="280" x2="280" y2="180" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <line x1="560" y1="270" x2="360" y2="180" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <line x1="320" y1="10" x2="320" y2="120" stroke="#7c9eff" stroke-width="1.5" opacity="0.3"/>
  <line x1="320" y1="310" x2="320" y2="200" stroke="#7c9eff" stroke-width="1.5" opacity="0.3"/>
  <!-- Crosshair reticle -->
  <circle cx="320" cy="160" r="50" fill="none" stroke="#5eead4" stroke-width="2.5" opacity="0.9"/>
  <circle cx="320" cy="160" r="30" fill="none" stroke="#5eead4" stroke-width="1.5" opacity="0.6"/>
  <circle cx="320" cy="160" r="4" fill="#fb7185"/>
  <!-- Crosshair lines -->
  <line x1="320" y1="100" x2="320" y2="145" stroke="#5eead4" stroke-width="2" opacity="0.9"/>
  <line x1="320" y1="175" x2="320" y2="220" stroke="#5eead4" stroke-width="2" opacity="0.9"/>
  <line x1="260" y1="160" x2="305" y2="160" stroke="#5eead4" stroke-width="2" opacity="0.9"/>
  <line x1="335" y1="160" x2="380" y2="160" stroke="#5eead4" stroke-width="2" opacity="0.9"/>
  <!-- Small tick marks -->
  <line x1="310" y1="160" x2="315" y2="160" stroke="#5eead4" stroke-width="1" opacity="0.5"/>
  <line x1="325" y1="160" x2="330" y2="160" stroke="#5eead4" stroke-width="1" opacity="0.5"/>
  <line x1="320" y1="150" x2="320" y2="155" stroke="#5eead4" stroke-width="1" opacity="0.5"/>
  <line x1="320" y1="165" x2="320" y2="170" stroke="#5eead4" stroke-width="1" opacity="0.5"/>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="32" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="4">ARENA</text>
</svg>