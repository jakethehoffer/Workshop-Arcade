<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Platforms at various heights -->
  <rect x="100" y="260" width="80" height="12" rx="6" fill="#34d399" opacity="0.7"/>
  <rect x="250" y="200" width="80" height="12" rx="6" fill="#34d399" opacity="0.8"/>
  <rect x="400" y="250" width="80" height="12" rx="6" fill="#34d399" opacity="0.6"/>
  <rect x="180" y="140" width="80" height="12" rx="6" fill="#34d399" opacity="0.9"/>
  <rect x="350" y="100" width="80" height="12" rx="6" fill="#5eead4"/>
  <rect x="480" y="160" width="80" height="12" rx="6" fill="#34d399" opacity="0.5"/>
  <rect x="70" y="80" width="80" height="12" rx="6" fill="#34d399" opacity="0.4"/>
  <!-- Spring on a platform -->
  <g transform="translate(290,195)">
    <path d="M0,0 L8,-5 L-8,-10 L8,-15 L-8,-20 L8,-25 L0,-30" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Broken platform -->
  <g transform="translate(480,160)">
    <rect x="0" y="0" width="35" height="12" rx="4" fill="#f59e0b" opacity="0.5" transform="rotate(10,17,6)"/>
    <rect x="42" y="2" width="35" height="12" rx="4" fill="#f59e0b" opacity="0.5" transform="rotate(-8,17,6)"/>
  </g>
  <!-- Character (on upper platform) -->
  <g transform="translate(390,68)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="14" ry="16" fill="#5eead4"/>
    <!-- Legs -->
    <rect x="-10" y="14" width="7" height="12" rx="3" fill="#5eead4"/>
    <rect x="3" y="14" width="7" height="12" rx="3" fill="#5eead4"/>
    <!-- Eyes -->
    <circle cx="-5" cy="-4" r="4" fill="white"/>
    <circle cx="5" cy="-4" r="4" fill="white"/>
    <circle cx="-4" cy="-4" r="2" fill="#0c121e"/>
    <circle cx="6" cy="-4" r="2" fill="#0c121e"/>
    <!-- Nose/trunk -->
    <ellipse cx="0" cy="4" rx="4" ry="3" fill="#4dd8c2"/>
  </g>
  <!-- Jump arc lines (motion trail) -->
  <path d="M295,190 Q340,120 390,95" fill="none" stroke="#5eead4" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4"/>
  <!-- Score indicator -->
  <text x="560" y="40" font-family="monospace" font-size="16" fill="#5eead4" text-anchor="end" opacity="0.5">12450</text>
  <!-- Stars -->
  <circle cx="520" cy="50" r="1.5" fill="#f59e0b" opacity="0.4"/>
  <circle cx="140" cy="35" r="1" fill="#f59e0b" opacity="0.3"/>
  <circle cx="300" cy="30" r="1.5" fill="#f59e0b" opacity="0.4"/>
  <!-- Title -->
  <text x="320" y="335" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="2">DOODLE JUMP</text>
</svg>