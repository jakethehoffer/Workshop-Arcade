<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Comic starburst -->
  <g transform="translate(320,155)">
    <polygon points="0,-120 20,-50 80,-90 35,-35 100,-20 50,0 100,30 35,30 80,80 20,45 0,110 -20,45 -80,80 -35,30 -100,30 -50,0 -100,-20 -35,-35 -80,-90 -20,-50" fill="#7c9eff" opacity="0.12"/>
    <polygon points="0,-90 15,-40 60,-65 28,-25 75,-15 40,0 75,22 28,22 60,60 15,35 0,82 -15,35 -60,60 -28,22 -75,22 -40,0 -75,-15 -28,-25 -60,-65 -15,-40" fill="#7c9eff" opacity="0.08"/>
  </g>
  <!-- Cape silhouette -->
  <g transform="translate(320,130)">
    <!-- Shoulders/collar -->
    <path d="M-15,-50 Q-5,-60 0,-60 Q5,-60 15,-50" fill="none" stroke="#7c9eff" stroke-width="2" opacity="0.7"/>
    <!-- Cape body -->
    <path d="M-15,-50 Q-25,-30 -40,0 Q-60,40 -80,90 Q-50,80 -30,75 Q-10,70 0,68 Q10,70 30,75 Q50,80 80,90 Q60,40 40,0 Q25,-30 15,-50Z" fill="#1a1530" stroke="#7c9eff" stroke-width="1.5" opacity="0.7"/>
    <!-- Cape inner folds -->
    <path d="M-10,-40 Q-20,0 -35,50" fill="none" stroke="#7c9eff" stroke-width="0.8" opacity="0.3"/>
    <path d="M10,-40 Q20,0 35,50" fill="none" stroke="#7c9eff" stroke-width="0.8" opacity="0.3"/>
    <path d="M0,-45 Q0,0 0,60" fill="none" stroke="#7c9eff" stroke-width="0.5" opacity="0.2"/>
  </g>
  <!-- Question mark -->
  <text x="320" y="155" font-family="Georgia,serif" font-size="50" font-weight="bold" fill="#5eead4" text-anchor="middle" opacity="0.7">?</text>
  <!-- Comic dots (halftone) -->
  <circle cx="130" cy="60" r="3" fill="#7c9eff" opacity="0.15"/>
  <circle cx="150" cy="50" r="3" fill="#7c9eff" opacity="0.15"/>
  <circle cx="145" cy="75" r="3" fill="#7c9eff" opacity="0.15"/>
  <circle cx="500" cy="70" r="3" fill="#7c9eff" opacity="0.15"/>
  <circle cx="520" cy="55" r="3" fill="#7c9eff" opacity="0.15"/>
  <circle cx="510" cy="85" r="3" fill="#7c9eff" opacity="0.15"/>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="bold" fill="#7c9eff" text-anchor="middle" letter-spacing="2">DC GUESSER</text>
</svg>