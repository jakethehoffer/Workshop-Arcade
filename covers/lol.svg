<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="lol-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#0f1828"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#lol-bg)"/>
  <!-- Radial glow behind -->
  <circle cx="320" cy="150" r="120" fill="#7c9eff" opacity="0.04"/>
  <!-- Sword (left, angled) -->
  <g transform="translate(260,145) rotate(-30)">
    <!-- Blade -->
    <rect x="-4" y="-90" width="8" height="100" rx="2" fill="#7c9eff" opacity="0.8"/>
    <polygon points="0,-95 -6,-85 6,-85" fill="#7c9eff" opacity="0.9"/>
    <!-- Highlight on blade -->
    <rect x="-1" y="-85" width="2" height="80" fill="white" opacity="0.2"/>
    <!-- Guard -->
    <rect x="-18" y="10" width="36" height="6" rx="3" fill="#f59e0b"/>
    <!-- Handle -->
    <rect x="-4" y="16" width="8" height="30" rx="2" fill="#8B6914"/>
    <rect x="-3" y="20" width="6" height="3" fill="#a07818" opacity="0.6"/>
    <rect x="-3" y="30" width="6" height="3" fill="#a07818" opacity="0.6"/>
    <!-- Pommel -->
    <circle cx="0" cy="50" r="6" fill="#f59e0b"/>
  </g>
  <!-- Shield (right, behind sword) -->
  <g transform="translate(370,145)">
    <!-- Shield shape -->
    <path d="M0,-70 L55,-50 L60,10 L35,55 L0,75 L-35,55 L-60,10 L-55,-50 Z" fill="#1a2540" stroke="#5eead4" stroke-width="2"/>
    <!-- Shield inner border -->
    <path d="M0,-55 L42,-38 L46,8 L27,42 L0,58 L-27,42 L-46,8 L-42,-38 Z" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.4"/>
    <!-- Shield emblem lines -->
    <line x1="0" y1="-45" x2="0" y2="55" stroke="#5eead4" stroke-width="1" opacity="0.3"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#5eead4" stroke-width="1" opacity="0.3"/>
    <!-- Center diamond -->
    <polygon points="0,-20 15,0 0,20 -15,0" fill="#5eead4" opacity="0.2" stroke="#5eead4" stroke-width="1"/>
  </g>
  <!-- Question mark overlay -->
  <text x="330" y="175" font-family="Georgia,serif" font-size="60" font-weight="bold" fill="#5eead4" text-anchor="middle" opacity="0.6">?</text>
  <!-- Particle effects -->
  <circle cx="220" cy="80" r="2" fill="#7c9eff" opacity="0.4"/>
  <circle cx="440" cy="90" r="2" fill="#5eead4" opacity="0.4"/>
  <circle cx="200" cy="200" r="1.5" fill="#f59e0b" opacity="0.3"/>
  <circle cx="460" cy="210" r="1.5" fill="#7c9eff" opacity="0.3"/>
  <circle cx="310" cy="50" r="1.5" fill="#5eead4" opacity="0.3"/>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="bold" fill="#7c9eff" text-anchor="middle" letter-spacing="2">LoL GUESSER</text>
</svg>