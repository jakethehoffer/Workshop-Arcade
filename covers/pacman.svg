<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Maze lines (decorative) -->
  <rect x="50" y="50" width="540" height="240" rx="8" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="80" y="80" width="200" height="60" rx="4" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="360" y="80" width="200" height="60" rx="4" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="80" y="200" width="120" height="60" rx="4" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="440" y="200" width="120" height="60" rx="4" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <!-- Dots -->
  <circle cx="160" cy="170" r="4" fill="#5eead4" opacity="0.6"/>
  <circle cx="200" cy="170" r="4" fill="#5eead4" opacity="0.6"/>
  <circle cx="240" cy="170" r="4" fill="#5eead4" opacity="0.6"/>
  <circle cx="280" cy="170" r="4" fill="#5eead4" opacity="0.6"/>
  <circle cx="320" cy="170" r="4" fill="#5eead4" opacity="0.6"/>
  <circle cx="360" cy="170" r="4" fill="#5eead4" opacity="0.6"/>
  <!-- Power pellet -->
  <circle cx="120" cy="170" r="8" fill="#5eead4" opacity="0.9"/>
  <!-- Pac-Man -->
  <g transform="translate(420,170)">
    <path d="M0,0 L30,-25 A35,35 0 1,0 30,25 Z" fill="#f59e0b"/>
  </g>
  <!-- Ghost -->
  <g transform="translate(200,155)">
    <path d="M-20,20 L-20,-5 Q-20,-25 0,-25 Q20,-25 20,-5 L20,20 L14,14 L8,20 L2,14 L-4,20 L-10,14 L-16,20 Z" fill="#fb7185"/>
    <!-- Ghost eyes -->
    <circle cx="-7" cy="-8" r="5" fill="white"/>
    <circle cx="7" cy="-8" r="5" fill="white"/>
    <circle cx="-5" cy="-8" r="2.5" fill="#1a1a2e"/>
    <circle cx="9" cy="-8" r="2.5" fill="#1a1a2e"/>
  </g>
  <!-- Title -->
  <text x="320" y="335" font-family="'Segoe UI',Arial,sans-serif" font-size="32" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="3">PAC-MAN</text>
</svg>