<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Grid lines (subtle) -->
  <g stroke="#1a2030" stroke-width="0.3" opacity="0.3">
    <line x1="100" y1="30" x2="100" y2="290"/><line x1="130" y1="30" x2="130" y2="290"/>
    <line x1="160" y1="30" x2="160" y2="290"/><line x1="190" y1="30" x2="190" y2="290"/>
    <line x1="220" y1="30" x2="220" y2="290"/><line x1="250" y1="30" x2="250" y2="290"/>
    <line x1="280" y1="30" x2="280" y2="290"/><line x1="310" y1="30" x2="310" y2="290"/>
    <line x1="340" y1="30" x2="340" y2="290"/><line x1="370" y1="30" x2="370" y2="290"/>
    <line x1="400" y1="30" x2="400" y2="290"/><line x1="430" y1="30" x2="430" y2="290"/>
    <line x1="460" y1="30" x2="460" y2="290"/><line x1="490" y1="30" x2="490" y2="290"/>
    <line x1="520" y1="30" x2="520" y2="290"/><line x1="550" y1="30" x2="550" y2="290"/>
    <line x1="100" y1="30" x2="550" y2="30"/><line x1="100" y1="60" x2="550" y2="60"/>
    <line x1="100" y1="90" x2="550" y2="90"/><line x1="100" y1="120" x2="550" y2="120"/>
    <line x1="100" y1="150" x2="550" y2="150"/><line x1="100" y1="180" x2="550" y2="180"/>
    <line x1="100" y1="210" x2="550" y2="210"/><line x1="100" y1="240" x2="550" y2="240"/>
    <line x1="100" y1="270" x2="550" y2="270"/><line x1="100" y1="290" x2="550" y2="290"/>
  </g>
  <!-- Snake body (connected squares) -->
  <rect x="190" y="180" width="26" height="26" rx="3" fill="#34d399" opacity="0.5"/>
  <rect x="190" y="150" width="26" height="26" rx="3" fill="#34d399" opacity="0.55"/>
  <rect x="220" y="150" width="26" height="26" rx="3" fill="#34d399" opacity="0.6"/>
  <rect x="250" y="150" width="26" height="26" rx="3" fill="#34d399" opacity="0.65"/>
  <rect x="280" y="150" width="26" height="26" rx="3" fill="#34d399" opacity="0.7"/>
  <rect x="280" y="120" width="26" height="26" rx="3" fill="#34d399" opacity="0.75"/>
  <rect x="310" y="120" width="26" height="26" rx="3" fill="#34d399" opacity="0.8"/>
  <rect x="340" y="120" width="26" height="26" rx="3" fill="#34d399" opacity="0.85"/>
  <rect x="370" y="120" width="26" height="26" rx="3" fill="#34d399" opacity="0.9"/>
  <rect x="370" y="150" width="26" height="26" rx="3" fill="#34d399" opacity="0.95"/>
  <!-- Snake head -->
  <rect x="370" y="180" width="26" height="26" rx="3" fill="#5eead4"/>
  <!-- Eyes on head -->
  <circle cx="380" cy="190" r="3" fill="#0c121e"/>
  <circle cx="390" cy="190" r="3" fill="#0c121e"/>
  <circle cx="380" cy="189" r="1.2" fill="white"/>
  <circle cx="390" cy="189" r="1.2" fill="white"/>
  <!-- Apple/food -->
  <g transform="translate(370,240)">
    <circle cx="13" cy="13" r="11" fill="#fb7185"/>
    <circle cx="10" cy="9" r="3" fill="#fca5b5" opacity="0.5"/>
    <path d="M13,2 Q16,-4 20,0" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="17" cy="4" rx="4" ry="2.5" fill="#34d399" opacity="0.7"/>
  </g>
  <!-- Score -->
  <text x="530" y="25" font-family="monospace" font-size="14" fill="#5eead4" text-anchor="end" opacity="0.5">Score: 110</text>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="32" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="4">SNAKE</text>
</svg>