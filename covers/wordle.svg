    <rect x="120" y="60" width="52" height="52" rx="4" fill="#34d399"/><text x="146" y="96" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">A</text>
    <rect x="180" y="60" width="52" height="52" rx="4" fill="#f59e0b"/><text x="206" y="96" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">N</text>
    <rect x="240" y="60" width="52" height="52" rx="4" fill="#4b5563"/><text x="266" y="96" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">K</text>
    <!-- Row 3 (solved!) -->
    <rect x="0" y="120" width="52" height="52" rx="4" fill="#34d399"/><text x="26" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">S</text>
    <rect x="60" y="120" width="52" height="52" rx="4" fill="#34d399"/><text x="86" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">N</text>
    <rect x="120" y="120" width="52" height="52" rx="4" fill="#34d399"/><text x="146" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">A</text>
    <rect x="180" y="120" width="52" height="52" rx="4" fill="#34d399"/><text x="206" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">C</text>
