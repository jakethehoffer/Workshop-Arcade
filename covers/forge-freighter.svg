<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Forge Freighter</title>
<desc id="desc">Load hot cargo through factory lanes, balance hull strain, and dock before the route overheats.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#071018"/>
    <stop offset=".62" stop-color="hsl(32, 68%, 16%)"/>
    <stop offset="1" stop-color="#03070d"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="640" height="360" fill="url(#bg)"/>
