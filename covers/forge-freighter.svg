<text x="42" y="330" fill="#f4fbff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900">Forge Freighter</text>
<text x="466" y="318" fill="#8df0a9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900">CRATE</text>
