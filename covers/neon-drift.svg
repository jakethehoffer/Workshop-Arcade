<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Neon Drift cover</title>
  <desc id="desc">A glowing race car drifts along a neon track with checkpoint gates and boost trail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".58" stop-color="#071827"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="road" x1="120" y1="280" x2="520" y2="80">
      <stop offset="0" stop-color="#0b2f3f"/>
      <stop offset=".5" stop-color="#0f3f3d"/>
      <stop offset="1" stop-color="#0b2338"/>
    </linearGradient>
    <linearGradient id="car" x1="-22" y1="0" x2="28" y2="0">
      <stop offset="0" stop-color="#e6fff9"/>
      <stop offset=".45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c9eff"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g opacity=".26" stroke="#5eead4" stroke-width="1">
    <path d="M0 64h640M0 128h640M0 192h640M0 256h640M64 0v360M128 0v360M192 0v360M256 0v360M320 0v360M384 0v360M448 0v360M512 0v360M576 0v360"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M126 248C206 307 417 295 503 210C574 140 495 80 365 85C229 90 116 139 104 216C98 257 121 286 170 296" stroke="#5eead4" stroke-width="114" opacity=".72"/>
    <path d="M126 248C206 307 417 295 503 210C574 140 495 80 365 85C229 90 116 139 104 216C98 257 121 286 170 296" stroke="url(#road)" stroke-width="82"/>
    <path d="M126 248C206 307 417 295 503 210C574 140 495 80 365 85C229 90 116 139 104 216C98 257 121 286 170 296" stroke="#e6fff9" stroke-width="3" stroke-dasharray="18 16" opacity=".45"/>
  </g>
  <g filter="url(#glow)" stroke-linecap="round">
    <path d="M496 191l60 40" stroke="#6cf0d8" stroke-width="7"/>
    <path d="M338 86l-8 73" stroke="#7c9eff" stroke-width="6" opacity=".85"/>
    <path d="M146 246l-54 39" stroke="#6cf0d8" stroke-width="6"/>
  </g>
  <g transform="translate(330 238) rotate(-24)" filter="url(#glow)">
    <path d="M-94 0C-65-18-40-22-8-19" stroke="#7c9eff" stroke-width="9" stroke-linecap="round" opacity=".55"/>
    <path d="M-74 22C-47 8-26 3-4 2" stroke="#5eead4" stroke-width="6" stroke-linecap="round" opacity=".58"/>
    <rect x="-28" y="-15" width="58" height="30" rx="8" fill="url(#car)" stroke="#06121f" stroke-width="4"/>
    <path d="M32 0l-15-10v20z" fill="#06121f"/>
    <circle cx="-14" cy="-18" r="5" fill="#06121f"/>
    <circle cx="15" cy="-18" r="5" fill="#06121f"/>
    <circle cx="-14" cy="18" r="5" fill="#06121f"/>
    <circle cx="15" cy="18" r="5" fill="#06121f"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" letter-spacing="0">
    <text x="42" y="34" fill="#5eead4" font-size="13" font-weight="800">WORKSHOP ARCADE</text>
    <text x="42" y="333" fill="#e6edf3" font-size="34" font-weight="900">NEON DRIFT</text>
    <g transform="translate(440 255)">
      <rect width="116" height="35" rx="12" fill="#0b1628" stroke="#5eead4" opacity=".94"/>
      <text x="14" y="23" fill="#5eead4" font-size="14" font-weight="800">LAP 2</text>
      <text x="70" y="23" fill="#e6edf3" font-size="14" font-weight="900">18.4</text>
    </g>
  </g>
</svg>
