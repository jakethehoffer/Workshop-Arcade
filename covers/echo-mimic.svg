<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="0.15" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-indigo" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#7c9eff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a31a2a"/><stop offset="1" stop-color="#5d0f1a"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6911d"/><stop offset="1" stop-color="#6e570f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a7d4f"/><stop offset="1" stop-color="#0b4a2d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2152a3"/><stop offset="1" stop-color="#0e2c66"/>
    </linearGradient>
    <radialGradient id="green-glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow-teal)"/>
  <rect width="640" height="360" fill="url(#glow-indigo)"/>

  <!-- 2x2 pads, centered right. Each 110x110 with 14 gap. -->
  <g transform="translate(330 56)">
    <rect width="110" height="110" rx="18" fill="url(#red)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
    <rect x="124" y="0" width="110" height="110" rx="18" fill="url(#yellow)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
    <!-- green pad shown "active" (mid-flash) -->
    <rect x="0" y="124" width="110" height="110" rx="18" fill="url(#green)" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
    <rect x="0" y="124" width="110" height="110" rx="18" fill="url(#green-glow)"/>
    <rect x="124" y="124" width="110" height="110" rx="18" fill="url(#blue)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  </g>

  <!-- Title -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <text x="34" y="64" font-size="13" letter-spacing="4" fill="#5eead4" font-weight="700">WORKSHOP ARCADE</text>
    <text x="34" y="106" font-size="38" letter-spacing="3" fill="#e6edf3" font-weight="800">ECHO</text>
    <text x="34" y="146" font-size="38" letter-spacing="3" fill="#e6edf3" font-weight="800">MIMIC</text>
    <text x="34" y="190" font-size="13" fill="#9fb0c8">Watch the sequence.</text>
    <text x="34" y="210" font-size="13" fill="#9fb0c8">Repeat it back.</text>
    <text x="34" y="230" font-size="13" fill="#9fb0c8">Each round adds one step.</text>
  </g>
</svg>
