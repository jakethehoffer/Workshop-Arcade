<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Grid background -->
  <rect x="220" y="20" width="200" height="280" fill="#0f1520" stroke="#1e293b" stroke-width="1" rx="4"/>
  <!-- Grid lines -->
  <g stroke="#1a2030" stroke-width="0.5" opacity="0.5">
    <line x1="260" y1="20" x2="260" y2="300"/>
    <line x1="300" y1="20" x2="300" y2="300"/>
    <line x1="340" y1="20" x2="340" y2="300"/>
    <line x1="380" y1="20" x2="380" y2="300"/>
  </g>
  <!-- T-piece (falling, teal) -->
  <g transform="translate(260,40)">
    <rect x="0" y="0" width="38" height="38" rx="3" fill="#5eead4" stroke="#4dd8c2" stroke-width="1"/>
    <rect x="40" y="0" width="38" height="38" rx="3" fill="#5eead4" stroke="#4dd8c2" stroke-width="1"/>
    <rect x="80" y="0" width="38" height="38" rx="3" fill="#5eead4" stroke="#4dd8c2" stroke-width="1"/>
    <rect x="40" y="40" width="38" height="38" rx="3" fill="#5eead4" stroke="#4dd8c2" stroke-width="1"/>
  </g>
  <!-- L-piece (right side, blue) -->
  <g transform="translate(470,60)">
    <rect x="0" y="0" width="32" height="32" rx="3" fill="#7c9eff" stroke="#6b8fee" stroke-width="1"/>
    <rect x="0" y="34" width="32" height="32" rx="3" fill="#7c9eff" stroke="#6b8fee" stroke-width="1"/>
    <rect x="0" y="68" width="32" height="32" rx="3" fill="#7c9eff" stroke="#6b8fee" stroke-width="1"/>
    <rect x="34" y="68" width="32" height="32" rx="3" fill="#7c9eff" stroke="#6b8fee" stroke-width="1"/>
  </g>
  <!-- S-piece (left side, green) -->
  <g transform="translate(100,80)">
    <rect x="32" y="0" width="30" height="30" rx="3" fill="#34d399" stroke="#2ab888" stroke-width="1"/>
    <rect x="64" y="0" width="30" height="30" rx="3" fill="#34d399" stroke="#2ab888" stroke-width="1"/>
    <rect x="0" y="32" width="30" height="30" rx="3" fill="#34d399" stroke="#2ab888" stroke-width="1"/>
    <rect x="32" y="32" width="30" height="30" rx="3" fill="#34d399" stroke="#2ab888" stroke-width="1"/>
  </g>
  <!-- Z-piece (left bottom, pink) -->
  <g transform="translate(90,190)">
    <rect x="0" y="0" width="30" height="30" rx="3" fill="#fb7185" stroke="#ea6070" stroke-width="1"/>
    <rect x="32" y="0" width="30" height="30" rx="3" fill="#fb7185" stroke="#ea6070" stroke-width="1"/>
    <rect x="32" y="32" width="30" height="30" rx="3" fill="#fb7185" stroke="#ea6070" stroke-width="1"/>
    <rect x="64" y="32" width="30" height="30" rx="3" fill="#fb7185" stroke="#ea6070" stroke-width="1"/>
  </g>
  <!-- Stacked blocks at bottom of well -->
  <g>
    <rect x="220" y="260" width="40" height="40" rx="2" fill="#7c9eff" opacity="0.6"/>
    <rect x="260" y="260" width="40" height="40" rx="2" fill="#fb7185" opacity="0.6"/>
    <rect x="300" y="260" width="40" height="40" rx="2" fill="#34d399" opacity="0.6"/>
    <rect x="340" y="260" width="40" height="40" rx="2" fill="#f59e0b" opacity="0.6"/>
    <rect x="380" y="260" width="40" height="40" rx="2" fill="#5eead4" opacity="0.6"/>
    <rect x="260" y="220" width="40" height="40" rx="2" fill="#f59e0b" opacity="0.5"/>
    <rect x="300" y="220" width="40" height="40" rx="2" fill="#7c9eff" opacity="0.5"/>
    <rect x="380" y="220" width="40" height="40" rx="2" fill="#fb7185" opacity="0.5"/>
  </g>
  <!-- I-piece (right, amber) -->
  <g transform="translate(510,170)">
    <rect x="0" y="0" width="28" height="28" rx="3" fill="#f59e0b" stroke="#d48a09" stroke-width="1"/>
    <rect x="0" y="30" width="28" height="28" rx="3" fill="#f59e0b" stroke="#d48a09" stroke-width="1"/>
    <rect x="0" y="60" width="28" height="28" rx="3" fill="#f59e0b" stroke="#d48a09" stroke-width="1"/>
    <rect x="0" y="90" width="28" height="28" rx="3" fill="#f59e0b" stroke="#d48a09" stroke-width="1"/>
  </g>
  <!-- Title -->
  <text x="320" y="335" font-family="'Segoe UI',Arial,sans-serif" font-size="32" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="4">TETRIS</text>
</svg>