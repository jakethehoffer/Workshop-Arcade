<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Pinball Foundry</title>
  <desc id="desc">A neon pinball table with gold rails, teal bumpers, flippers, and a steel ball.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#07101a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".35" r=".55">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".34"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx=".32" cy=".28" r=".72">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#64748b"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="620" cy="260" r="420" fill="url(#glow)"/>
  <g transform="translate(320 44)">
    <path d="M92 520V126C92 62 186 28 302 30c150 2 268 70 292 160l34 330" fill="#0b1625" stroke="#5eead4" stroke-width="12"/>
    <path d="M548 130v392" stroke="#fbbf24" stroke-width="12"/>
    <path d="M108 430l142 72M560 430l-142 72" stroke="#5eead4" stroke-width="28" stroke-linecap="round"/>
    <path d="M558 458l-118 60" stroke="#fbbf24" stroke-width="28" stroke-linecap="round"/>
    <g fill="#111827" stroke-width="10">
      <circle cx="270" cy="202" r="52" stroke="#5eead4"/>
      <circle cx="400" cy="268" r="48" stroke="#fbbf24"/>
      <circle cx="234" cy="342" r="45" stroke="#7c9eff"/>
    </g>
    <g fill="#fbbf24" stroke="#fde68a" stroke-width="6">
      <circle cx="214" cy="106" r="24"/>
      <circle cx="330" cy="86" r="24"/>
      <circle cx="446" cy="106" r="24"/>
    </g>
    <circle cx="560" cy="438" r="25" fill="url(#ball)" stroke="#e6edf3" stroke-width="3"/>
    <path d="M562 514v-86" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
    <rect x="542" y="524" width="40" height="20" rx="8" fill="#fbbf24"/>
  </g>
  <g filter="url(#soft)" opacity=".45">
    <circle cx="258" cy="128" r="64" fill="#fbbf24"/>
    <circle cx="896" cy="142" r="82" fill="#5eead4"/>
  </g>
  <text x="72" y="122" fill="#5eead4" font-family="ui-sans-serif, system-ui, Segoe UI, Arial" font-size="34" font-weight="900" letter-spacing="4">WORKSHOP ARCADE</text>
  <text x="72" y="198" fill="#f8fbff" font-family="ui-sans-serif, system-ui, Segoe UI, Arial" font-size="84" font-weight="950">Pinball</text>
  <text x="72" y="288" fill="#fbbf24" font-family="ui-sans-serif, system-ui, Segoe UI, Arial" font-size="90" font-weight="950">Foundry</text>
  <text x="74" y="352" fill="#b6c4dc" font-family="ui-sans-serif, system-ui, Segoe UI, Arial" font-size="28" font-weight="700">Launch. Flip. Forge the multiplier.</text>
</svg>
