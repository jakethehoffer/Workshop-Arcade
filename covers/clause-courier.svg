<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">Clause Courier cover</title>
<desc id="d">A neon courier rail with shuffled word tiles being restored into a clear dispatch phrase.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#0a2230"/></linearGradient>
<linearGradient id="tile" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#153a50"/><stop offset="1" stop-color="#0b1f30"/></linearGradient>
<linearGradient id="good" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#1d5a43"/><stop offset="1" stop-color="#10342b"/></linearGradient>
<filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="640" height="360" fill="url(#bg)"/>
<circle cx="86" cy="28" r="138" fill="#5eead4" opacity=".12"/>
<circle cx="578" cy="52" r="150" fill="#7dd3fc" opacity=".12"/>
<path d="M0 284h640v76H0z" fill="#04070f" opacity=".58"/>
<g stroke="#5eead4" stroke-opacity=".18" stroke-width="2">
<path d="M78 92v196M178 76v216M278 84v212M378 76v216M478 92v196"/>
</g>
<g transform="translate(62 134)" font-family="system-ui,Segoe UI,sans-serif" font-weight="950">
<rect x="0" y="0" width="104" height="68" rx="14" fill="url(#tile)" stroke="#7dd3fc" stroke-width="3"/>
<text x="52" y="43" text-anchor="middle" fill="#f2fbff" font-size="25">MAIL</text>
<rect x="118" y="0" width="104" height="68" rx="14" fill="url(#good)" stroke="#86efac" stroke-width="3"/>
<text x="170" y="43" text-anchor="middle" fill="#d7ffe7" font-size="25">SORT</text>
<rect x="236" y="0" width="104" height="68" rx="14" fill="url(#good)" stroke="#86efac" stroke-width="3"/>
<text x="288" y="43" text-anchor="middle" fill="#d7ffe7" font-size="25">THE</text>
<rect x="354" y="0" width="104" height="68" rx="14" fill="url(#tile)" stroke="#ffd166" stroke-width="4" filter="url(#glow)"/>
<text x="406" y="43" text-anchor="middle" fill="#fff4ca" font-size="24">DAWN</text>
<rect x="472" y="0" width="104" height="68" rx="14" fill="url(#tile)" stroke="#7dd3fc" stroke-width="3"/>
<text x="524" y="43" text-anchor="middle" fill="#f2fbff" font-size="22">BEFORE</text>
</g>
<path d="M90 244h460" stroke="#5eead4" stroke-width="7" stroke-linecap="round" opacity=".55"/>
<path d="M90 244h260" stroke="#86efac" stroke-width="7" stroke-linecap="round"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="320" y="64" text-anchor="middle" fill="#5eead4" font-size="15" font-weight="950" letter-spacing="4">WORD ORDER PUZZLE</text>
<text x="320" y="314" text-anchor="middle" fill="#f2fbff" font-size="38" font-weight="950">CLAUSE COURIER</text>
<text x="320" y="342" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="900" letter-spacing="3">WORKSHOP ARCADE</text>
</g>
</svg>
