<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="0.15" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-indigo" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#7c9eff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-hidden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142036"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <linearGradient id="card-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(45 75 120 / 0.65)"/>
      <stop offset="1" stop-color="rgb(20 38 70 / 0.75)"/>
    </linearGradient>
    <linearGradient id="card-matched" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(94 234 212 / 0.28)"/>
      <stop offset="1" stop-color="rgb(20 38 70 / 0.75)"/>
    </linearGradient>
    <linearGradient id="dotg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cf8e2"/>
      <stop offset="1" stop-color="#7c9eff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow-teal)"/>
  <rect width="640" height="360" fill="url(#glow-indigo)"/>

  <!-- 4x4 grid of cards, centered. card 62×62, gap 10, total grid 278×278, offset (181, 41) -->
  <g transform="translate(181 41)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle">
    <!-- Row 1 -->
    <g transform="translate(0 0)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <g transform="translate(72 0)"><rect width="62" height="62" rx="10" fill="url(#card-matched)" stroke="rgba(94,234,212,0.75)"/><text x="31" y="42" fill="#5eead4">⭐</text></g>
    <g transform="translate(144 0)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <g transform="translate(216 0)"><rect width="62" height="62" rx="10" fill="url(#card-up)" stroke="rgba(94,234,212,0.55)"/><text x="31" y="42" fill="#e6edf3">🎮</text></g>
    <!-- Row 2 -->
    <g transform="translate(0 72)"><rect width="62" height="62" rx="10" fill="url(#card-matched)" stroke="rgba(94,234,212,0.75)"/><text x="31" y="42" fill="#5eead4">⭐</text></g>
    <g transform="translate(72 72)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <g transform="translate(144 72)"><rect width="62" height="62" rx="10" fill="url(#card-up)" stroke="rgba(94,234,212,0.55)"/><text x="31" y="42" fill="#e6edf3">🎮</text></g>
    <g transform="translate(216 72)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <!-- Row 3 -->
    <g transform="translate(0 144)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <g transform="translate(72 144)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <g transform="translate(144 144)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <g transform="translate(216 144)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <!-- Row 4 -->
    <g transform="translate(0 216)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <g transform="translate(72 216)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <g transform="translate(144 216)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
    <g transform="translate(216 216)"><rect width="62" height="62" rx="10" fill="url(#card-hidden)" stroke="rgba(94,234,212,0.22)"/><circle cx="31" cy="31" r="14" fill="url(#dotg)" opacity="0.45"/></g>
  </g>

  <!-- Title -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <text x="34" y="64" font-size="13" letter-spacing="4" fill="#5eead4" font-weight="700">WORKSHOP ARCADE</text>
    <text x="34" y="106" font-size="38" letter-spacing="3" fill="#e6edf3" font-weight="800">MEMORY</text>
    <text x="34" y="146" font-size="38" letter-spacing="3" fill="#e6edf3" font-weight="800">MATCH</text>
    <text x="34" y="190" font-size="13" fill="#9fb0c8">Flip cards.</text>
    <text x="34" y="210" font-size="13" fill="#9fb0c8">Find pairs.</text>
    <text x="34" y="230" font-size="13" fill="#9fb0c8">Beat your best.</text>
  </g>
</svg>
