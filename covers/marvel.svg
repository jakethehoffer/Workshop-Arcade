<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Comic starburst -->
  <g transform="translate(320,160)">
    <polygon points="0,-120 20,-50 80,-90 35,-35 100,-20 50,0 100,30 35,30 80,80 20,45 0,110 -20,45 -80,80 -35,30 -100,30 -50,0 -100,-20 -35,-35 -80,-90 -20,-50" fill="#fb7185" opacity="0.15"/>
    <polygon points="0,-90 15,-40 60,-65 28,-25 75,-15 40,0 75,22 28,22 60,60 15,35 0,82 -15,35 -60,60 -28,22 -75,22 -40,0 -75,-15 -28,-25 -60,-65 -15,-40" fill="#fb7185" opacity="0.1"/>
  </g>
  <!-- Mask silhouette -->
  <g transform="translate(320,140)">
    <!-- Head shape -->
    <path d="M0,-60 Q50,-55 55,-10 Q55,30 35,50 Q20,65 0,70 Q-20,65 -35,50 Q-55,30 -55,-10 Q-50,-55 0,-60Z" fill="#1a1525" stroke="#fb7185" stroke-width="1.5" opacity="0.8"/>
    <!-- Eye cutouts -->
    <path d="M-30,-15 Q-25,-25 -12,-18 Q-8,-5 -20,-5 Q-32,-5 -30,-15Z" fill="#fb7185" opacity="0.6"/>
    <path d="M30,-15 Q25,-25 12,-18 Q8,-5 20,-5 Q32,-5 30,-15Z" fill="#fb7185" opacity="0.6"/>
    <!-- Forehead detail -->
    <line x1="-15" y1="-45" x2="0" y2="-35" stroke="#fb7185" stroke-width="1" opacity="0.4"/>
    <line x1="15" y1="-45" x2="0" y2="-35" stroke="#fb7185" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Question mark -->
  <text x="320" y="165" font-family="Georgia,serif" font-size="50" font-weight="bold" fill="#5eead4" text-anchor="middle" opacity="0.7">?</text>
  <!-- Comic dots (halftone) -->
  <circle cx="130" cy="60" r="3" fill="#fb7185" opacity="0.15"/>
  <circle cx="150" cy="50" r="3" fill="#fb7185" opacity="0.15"/>
  <circle cx="145" cy="75" r="3" fill="#fb7185" opacity="0.15"/>
  <circle cx="500" cy="70" r="3" fill="#fb7185" opacity="0.15"/>
  <circle cx="520" cy="55" r="3" fill="#fb7185" opacity="0.15"/>
  <circle cx="510" cy="85" r="3" fill="#fb7185" opacity="0.15"/>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="bold" fill="#fb7185" text-anchor="middle" letter-spacing="2">MARVEL GUESSER</text>
</svg>