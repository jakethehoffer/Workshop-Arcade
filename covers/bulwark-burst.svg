<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Bulwark Burst cover</title>
  <desc id="desc">A central neon cannon fires at angular drones around a defensive core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset=".55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#180816"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".55">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset=".35" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g opacity=".22" stroke="#67e8f9" fill="none">
    <circle cx="320" cy="180" r="52"/>
    <circle cx="320" cy="180" r="96"/>
    <circle cx="320" cy="180" r="142"/>
    <circle cx="320" cy="180" r="190"/>
    <path d="M320 26v308M84 180h472M153 55l434 250M587 55 153 305"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="320" cy="180" r="45" fill="#071426" stroke="#67e8f9" stroke-width="5"/>
    <circle cx="320" cy="180" r="24" fill="url(#core)"/>
    <path d="M332 150 456 92" stroke="#f97316" stroke-width="16" stroke-linecap="round"/>
    <circle cx="463" cy="89" r="13" fill="#fff7ed"/>
    <path d="M385 118 545 45" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g fill="#fb7185" stroke="#fff7ed" stroke-width="2" filter="url(#glow)">
    <path d="M118 88 139 118 100 119z"/>
    <path d="M515 268 548 285 517 304z"/>
    <path d="M520 88 545 111 507 122z"/>
    <path d="M126 267 155 250 154 292z"/>
    <path d="M315 38 339 66 304 68z"/>
  </g>
  <g fill="#facc15" opacity=".95">
    <circle cx="500" cy="73" r="5"/>
    <circle cx="488" cy="79" r="3"/>
    <circle cx="475" cy="85" r="2"/>
  </g>
  <text x="36" y="58" fill="#67e8f9" font-family="Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="3">WORKSHOP ARCADE</text>
  <text x="36" y="313" fill="#fff7ed" font-family="Arial, sans-serif" font-size="48" font-weight="900">Bulwark Burst</text>
  <text x="39" y="336" fill="#bae6fd" font-family="Arial, sans-serif" font-size="17" font-weight="700">Radial defense shooter</text>
</svg>
