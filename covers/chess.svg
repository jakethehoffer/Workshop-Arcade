<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Partial chessboard -->
  <g transform="translate(170,40)">
    <g opacity="0.3">
      <rect x="0" y="0" width="50" height="50" fill="#2a3a55"/><rect x="50" y="0" width="50" height="50" fill="#1a2335"/>
      <rect x="100" y="0" width="50" height="50" fill="#2a3a55"/><rect x="150" y="0" width="50" height="50" fill="#1a2335"/>
      <rect x="200" y="0" width="50" height="50" fill="#2a3a55"/><rect x="250" y="0" width="50" height="50" fill="#1a2335"/>
      <rect x="0" y="50" width="50" height="50" fill="#1a2335"/><rect x="50" y="50" width="50" height="50" fill="#2a3a55"/>
      <rect x="100" y="50" width="50" height="50" fill="#1a2335"/><rect x="150" y="50" width="50" height="50" fill="#2a3a55"/>
      <rect x="200" y="50" width="50" height="50" fill="#1a2335"/><rect x="250" y="50" width="50" height="50" fill="#2a3a55"/>
      <rect x="0" y="100" width="50" height="50" fill="#2a3a55"/><rect x="50" y="100" width="50" height="50" fill="#1a2335"/>
      <rect x="100" y="100" width="50" height="50" fill="#2a3a55"/><rect x="150" y="100" width="50" height="50" fill="#1a2335"/>
      <rect x="200" y="100" width="50" height="50" fill="#2a3a55"/><rect x="250" y="100" width="50" height="50" fill="#1a2335"/>
      <rect x="0" y="150" width="50" height="50" fill="#1a2335"/><rect x="50" y="150" width="50" height="50" fill="#2a3a55"/>
      <rect x="100" y="150" width="50" height="50" fill="#1a2335"/><rect x="150" y="150" width="50" height="50" fill="#2a3a55"/>
      <rect x="200" y="150" width="50" height="50" fill="#1a2335"/><rect x="250" y="150" width="50" height="50" fill="#2a3a55"/>
    </g>
  </g>
  <!-- King piece (center) -->
  <g transform="translate(320,140)" fill="#5eead4">
    <rect x="-3" y="-55" width="6" height="15"/>
    <rect x="-8" y="-48" width="16" height="6"/>
    <circle cx="0" cy="-32" r="10"/>
    <path d="M-15,-22 L15,-22 L18,10 Q18,20 0,22 Q-18,20 -18,10 Z"/>
    <rect x="-22" y="22" width="44" height="8" rx="2"/>
    <rect x="-26" y="30" width="52" height="6" rx="2"/>
  </g>
  <!-- Queen piece (left) -->
  <g transform="translate(200,160)" fill="#7c9eff" opacity="0.7">
    <circle cx="0" cy="-42" r="5"/>
    <circle cx="-14" cy="-35" r="4"/>
    <circle cx="14" cy="-35" r="4"/>
    <path d="M-18,-30 L-12,5 L0,-5 L12,5 L18,-30"/>
    <path d="M-14,5 L14,5 L16,15 Q16,22 0,24 Q-16,22 -16,15 Z"/>
    <rect x="-18" y="24" width="36" height="6" rx="2"/>
  </g>
  <!-- Knight piece (right) -->
  <g transform="translate(440,160)" fill="#f59e0b" opacity="0.7">
    <path d="M-5,-45 Q-10,-40 -12,-30 L-15,-15 Q-18,-5 -10,5 L-8,10 Q-12,15 -12,20 L12,20 L12,5 Q15,-5 10,-20 Q8,-35 0,-42 Z"/>
    <circle cx="-2" cy="-30" r="2" fill="#0c121e"/>
    <rect x="-14" y="20" width="28" height="6" rx="2"/>
    <rect x="-16" y="26" width="32" height="5" rx="2"/>
  </g>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="32" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="4">CHESS</text>
</svg>