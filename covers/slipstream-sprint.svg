<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Slipstream Sprint cover</title>
  <desc id="desc">A neon three-lane sprint road with a cyan player car drafting behind glowing rivals.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#071a2d"/>
      <stop offset=".62" stop-color="#06111f"/>
      <stop offset="1" stop-color="#030713"/>
    </linearGradient>
    <linearGradient id="road" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#102f4e"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="84" cy="56" r="96" fill="#67e8f9" opacity=".15"/>
  <circle cx="566" cy="42" r="112" fill="#fb7185" opacity=".13"/>
  <g opacity=".6">
    <circle cx="64" cy="84" r="2" fill="#eff9ff"/>
    <circle cx="126" cy="48" r="1.5" fill="#eff9ff"/>
    <circle cx="202" cy="74" r="1.4" fill="#eff9ff"/>
    <circle cx="478" cy="66" r="1.7" fill="#eff9ff"/>
    <circle cx="584" cy="96" r="1.2" fill="#eff9ff"/>
  </g>
  <path d="M164 340 248 78h144l84 262z" fill="url(#road)" stroke="#67e8f9" stroke-width="4"/>
  <g stroke-linecap="round" filter="url(#glow)">
    <path d="M256 340 294 82" stroke="#facc15" stroke-width="7" stroke-dasharray="20 18"/>
    <path d="M384 340 346 82" stroke="#facc15" stroke-width="7" stroke-dasharray="20 18"/>
    <path d="M180 314h280" stroke="#67e8f9" stroke-width="3" opacity=".35"/>
    <path d="M206 238h228" stroke="#67e8f9" stroke-width="3" opacity=".25"/>
    <path d="M230 166h180" stroke="#67e8f9" stroke-width="3" opacity=".2"/>
  </g>
  <g filter="url(#glow)">
    <rect x="278" y="238" width="84" height="74" rx="14" fill="#06111e" stroke="#67e8f9" stroke-width="5"/>
    <rect x="292" y="248" width="56" height="16" rx="4" fill="#67e8f9"/>
    <rect x="286" y="286" width="68" height="13" rx="5" fill="#eff9ff"/>
    <path d="M294 315 256 352h34l30-30 30 30h34l-38-37z" fill="#facc15" opacity=".75"/>
  </g>
  <g filter="url(#glow)">
    <rect x="225" y="144" width="56" height="50" rx="11" fill="#190712" stroke="#fb7185" stroke-width="4"/>
    <rect x="399" y="176" width="58" height="50" rx="11" fill="#171006" stroke="#facc15" stroke-width="4"/>
    <rect x="306" y="96" width="56" height="36" rx="10" fill="#052018" stroke="#a3e635" stroke-width="4"/>
  </g>
  <text x="320" y="47" text-anchor="middle" fill="#eff9ff" font-family="Arial, sans-serif" font-size="36" font-weight="900">SLIPSTREAM</text>
  <text x="320" y="83" text-anchor="middle" fill="#67e8f9" font-family="Arial, sans-serif" font-size="30" font-weight="900">SPRINT</text>
</svg>
