<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">Blackjack cover</title><desc id="d">Two neon playing cards, an ace of spades and a king of hearts forming a natural twenty-one, with a glowing 21 badge and Blackjack title art.</desc>
<defs>
