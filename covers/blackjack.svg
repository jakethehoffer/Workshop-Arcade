<filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="640" height="360" fill="url(#b)"/>
<circle cx="84" cy="26" r="132" fill="#2dd4bf" opacity=".12"/><circle cx="566" cy="40" r="150" fill="#6366f1" opacity=".13"/>
