<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Breachline cover</title>
  <desc id="desc">Two neon infiltrators plot synchronized routes around patrol cones toward a signal core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset=".58" stop-color="#07111f"/>
      <stop offset="1" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="92" cy="40" r="160" fill="#22d3ee" opacity=".12"/>
  <circle cx="580" cy="8" r="190" fill="#a855f7" opacity=".11"/>
  <g opacity=".18" stroke="#67e8f9" stroke-width="1">
    <path d="M80 70h480M80 122h480M80 174h480M80 226h480M80 278h480"/>
    <path d="M116 52v280M176 52v280M236 52v280M296 52v280M356 52v280M416 52v280M476 52v280M536 52v280"/>
  </g>
  <g filter="url(#glow)">
    <path d="M430 92 L560 140 L430 188 Z" fill="#fbbf24" opacity=".22"/>
    <circle cx="430" cy="140" r="24" fill="#fb7185"/>
    <path d="M430 140h35" stroke="#fecdd3" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g fill="#233044" stroke="#94a3b8" stroke-width="3">
    <rect x="232" y="116" width="52" height="52" rx="9"/>
    <rect x="232" y="222" width="52" height="52" rx="9"/>
    <rect x="356" y="168" width="52" height="52" rx="9"/>
  </g>
  <rect x="404" y="220" width="56" height="56" rx="10" fill="#facc15" opacity=".22" stroke="#facc15" stroke-width="5" filter="url(#glow)"/>
  <text x="432" y="257" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="950" fill="#facc15">C</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <path d="M112 250 C180 250 196 198 250 198 C304 198 318 250 404 250" stroke="#5eead4" filter="url(#glow)"/>
    <path d="M112 304 C178 304 212 304 260 272 C316 234 356 236 404 250" stroke="#60a5fa" filter="url(#glow)"/>
  </g>
  <g filter="url(#glow)">
    <path d="M112 232 l24 54 h-48z" fill="#5eead4"/>
    <text x="112" y="265" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="950" fill="#051018">A</text>
    <path d="M112 286 l24 54 h-48z" fill="#60a5fa"/>
    <text x="112" y="319" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="950" fill="#051018">B</text>
  </g>
  <g stroke="#67e8f9" stroke-width="5" fill="rgba(34,211,238,.16)" filter="url(#glow)">
    <rect x="500" y="246" width="58" height="58" rx="12"/>
    <path d="M515 275h28m-14-14v28" stroke-linecap="round"/>
  </g>
  <text x="42" y="70" font-family="system-ui,Segoe UI,sans-serif" font-size="42" font-weight="950" fill="#f8fbff">BREACHLINE</text>
  <text x="44" y="102" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="850" fill="#93e8ff">Synchronized stealth tactics</text>
</svg>
