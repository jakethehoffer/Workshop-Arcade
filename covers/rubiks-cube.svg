<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- 3D Rubik's Cube -->
  <g transform="translate(320,170)">
    <!-- Top face (looking down, parallelogram) -->
    <g>
      <polygon points="-90,-70 0,-110 90,-70 0,-30" fill="#1e293b" stroke="#0c121e" stroke-width="2"/>
      <!-- Top face cells -->
      <polygon points="-90,-70 -60,-83 -30,-70 0,-57 -30,-43" fill="#fb7185" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-60,-83 -30,-97 0,-83 -30,-70" fill="#f59e0b" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-30,-97 0,-110 30,-97 0,-83" fill="#5eead4" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="0,-57 30,-70 60,-57 30,-43" fill="#34d399" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="30,-70 60,-83 90,-70 60,-57" fill="#fb7185" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="0,-83 30,-97 60,-83 30,-70" fill="white" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-30,-43 0,-57 30,-43 0,-30" fill="#7c9eff" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-60,-57 -30,-70 0,-57 -30,-43" fill="#5eead4" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="0,-57 30,-70 60,-57 30,-43" fill="#34d399" stroke="#0c121e" stroke-width="1.5"/>
    </g>
    <!-- Left face -->
    <g>
      <polygon points="-90,-70 0,-30 0,60 -90,20" fill="#162030" stroke="#0c121e" stroke-width="2"/>
      <polygon points="-90,-70 -60,-57 -60,-27 -90,-40" fill="#fb7185" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-60,-57 -30,-43 -30,-13 -60,-27" fill="#f59e0b" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-30,-43 0,-30 0,0 -30,-13" fill="#7c9eff" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-90,-40 -60,-27 -60,3 -90,-10" fill="white" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-60,-27 -30,-13 -30,17 -60,3" fill="#5eead4" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-30,-13 0,0 0,30 -30,17" fill="#fb7185" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-90,-10 -60,3 -60,33 -90,20" fill="#34d399" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-60,3 -30,17 -30,47 -60,33" fill="#7c9eff" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="-30,17 0,30 0,60 -30,47" fill="#f59e0b" stroke="#0c121e" stroke-width="1.5"/>
    </g>
    <!-- Right face -->
    <g>
      <polygon points="90,-70 0,-30 0,60 90,20" fill="#1a2540" stroke="#0c121e" stroke-width="2"/>
      <polygon points="0,-30 30,-43 30,-13 0,0" fill="#34d399" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="30,-43 60,-57 60,-27 30,-13" fill="#5eead4" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="60,-57 90,-70 90,-40 60,-27" fill="#f59e0b" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="0,0 30,-13 30,17 0,30" fill="white" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="30,-13 60,-27 60,3 30,17" fill="#fb7185" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="60,-27 90,-40 90,-10 60,3" fill="#7c9eff" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="0,30 30,17 30,47 0,60" fill="#5eead4" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="30,17 60,3 60,33 30,47" fill="#34d399" stroke="#0c121e" stroke-width="1.5"/>
      <polygon points="60,3 90,-10 90,20 60,33" fill="white" stroke="#0c121e" stroke-width="1.5"/>
    </g>
  </g>
  <!-- Title -->
  <text x="320" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="2">RUBIK'S CUBE</text>
</svg>