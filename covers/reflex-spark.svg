<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="0.18" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-indigo" cx="0.85" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#7c9eff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ready" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f6f4a"/>
      <stop offset="1" stop-color="#08402a"/>
    </linearGradient>
    <radialGradient id="ready-glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow-teal)"/>
  <rect width="640" height="360" fill="url(#glow-indigo)"/>

  <!-- Stage panel mid-flash (the "CLICK!" state) -->
  <g transform="translate(280 60)">
    <rect width="320" height="180" rx="18" fill="url(#ready)" stroke="#5eead4" stroke-opacity="0.85" stroke-width="1.5"/>
    <rect width="320" height="180" rx="18" fill="url(#ready-glow)"/>
    <text x="160" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="6" fill="#dbfff3" text-anchor="middle">CLICK!</text>
    <text x="160" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="rgba(219,255,243,0.78)" text-anchor="middle">Tap now</text>
  </g>

  <!-- Round slots strip -->
  <g transform="translate(280 260)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="0.5">
    <g><rect width="56" height="46" rx="8" fill="#0f1522" stroke="rgba(94,234,212,0.55)"/><text x="28" y="29" text-anchor="middle" fill="#dbfff3">218</text></g>
    <g transform="translate(64 0)"><rect width="56" height="46" rx="8" fill="#0f1522" stroke="rgba(94,234,212,0.55)"/><text x="28" y="29" text-anchor="middle" fill="#dbfff3">241</text></g>
    <g transform="translate(128 0)"><rect width="56" height="46" rx="8" fill="#2a1318" stroke="rgba(251,113,133,0.55)"/><text x="28" y="29" text-anchor="middle" fill="#ffd6d6" font-size="11">FALSE</text></g>
    <g transform="translate(192 0)"><rect width="56" height="46" rx="8" fill="#0f1522" stroke="rgba(94,234,212,0.22)"/><text x="28" y="29" text-anchor="middle" fill="rgba(230,237,243,0.35)" font-size="13">4</text></g>
    <g transform="translate(256 0)"><rect width="56" height="46" rx="8" fill="#0f1522" stroke="rgba(94,234,212,0.22)"/><text x="28" y="29" text-anchor="middle" fill="rgba(230,237,243,0.35)" font-size="13">5</text></g>
  </g>

  <!-- Title -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <text x="34" y="64" font-size="13" letter-spacing="4" fill="#5eead4" font-weight="700">WORKSHOP ARCADE</text>
    <text x="34" y="106" font-size="38" letter-spacing="3" fill="#e6edf3" font-weight="800">REFLEX</text>
    <text x="34" y="146" font-size="38" letter-spacing="3" fill="#e6edf3" font-weight="800">SPARK</text>
    <text x="34" y="190" font-size="13" fill="#9fb0c8">Wait for the spark.</text>
    <text x="34" y="210" font-size="13" fill="#9fb0c8">Tap as fast as you can.</text>
    <text x="34" y="230" font-size="13" fill="#9fb0c8">Five rounds. Lower wins.</text>
  </g>
</svg>
