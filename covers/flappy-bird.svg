<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#0c121e"/>
  <!-- Stars -->
  <circle cx="80" cy="40" r="1.5" fill="#5eead4" opacity="0.4"/>
  <circle cx="200" cy="70" r="1" fill="#5eead4" opacity="0.3"/>
  <circle cx="500" cy="30" r="1.5" fill="#5eead4" opacity="0.4"/>
  <circle cx="560" cy="90" r="1" fill="#5eead4" opacity="0.3"/>
  <!-- Left pipe (top) -->
  <rect x="180" y="0" width="60" height="100" rx="4" fill="#34d399" opacity="0.8"/>
  <rect x="172" y="95" width="76" height="20" rx="4" fill="#34d399" opacity="0.9"/>
  <!-- Left pipe (bottom) -->
  <rect x="172" y="220" width="76" height="20" rx="4" fill="#34d399" opacity="0.9"/>
  <rect x="180" y="235" width="60" height="125" rx="4" fill="#34d399" opacity="0.8"/>
  <!-- Right pipe (top) -->
  <rect x="420" y="0" width="60" height="140" rx="4" fill="#34d399" opacity="0.6"/>
  <rect x="412" y="135" width="76" height="20" rx="4" fill="#34d399" opacity="0.7"/>
  <!-- Right pipe (bottom) -->
  <rect x="412" y="260" width="76" height="20" rx="4" fill="#34d399" opacity="0.7"/>
  <rect x="420" y="275" width="60" height="85" rx="4" fill="#34d399" opacity="0.6"/>
  <!-- Bird -->
  <g transform="translate(310,160)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="22" ry="18" fill="#f59e0b"/>
    <!-- Wing -->
    <ellipse cx="-8" cy="2" rx="14" ry="8" fill="#fbbf24" transform="rotate(-10)"/>
    <!-- Eye (white) -->
    <circle cx="10" cy="-6" r="7" fill="white"/>
    <!-- Eye (pupil) -->
    <circle cx="12" cy="-6" r="4" fill="#1a1a2e"/>
    <!-- Beak -->
    <polygon points="20,-2 32,2 20,6" fill="#fb7185"/>
    <!-- Tail feathers -->
    <polygon points="-20,-4 -30,-10 -22,0" fill="#d97706" opacity="0.8"/>
    <polygon points="-20,4 -30,10 -22,0" fill="#d97706" opacity="0.8"/>
  </g>
  <!-- Title -->
  <text x="320" y="335" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="2">FLAPPY BIRD</text>
</svg>