<div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Crate Circuit</span></div>

    <div class="pill"><span class="label">Par</span><span class="value" id="parValue">4</span></div>
    <div class="pill"><span class="label">Score</span><span class="value" id="scoreValue">0</span></div>
    <div class="pill" id="bestPill"><span class="label">Best</span><span class="value" id="bestValue">0</span></div>

  <div class="stage"><canvas id="game" width="900" height="560" tabindex="0" aria-label="Sokoban puzzle canvas. Push crates onto glowing powered pads. Use arrows or WASD to move."></canvas></div>

  <div class="help">Arrows/WASD move. U undo. R restarts the room. F fullscreen. M sound. On touch, use the pad, tap around the runner, or swipe on the board.</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  if (!ctx || !(ctx instanceof CanvasRenderingContext2D)) throw new Error("CanvasRenderingContext2D unavailable");

  const W = canvas.width;
  const H = canvas.height;
  const TAU = Math.PI * 2;
  const BEST_KEY = "crate-circuit.best.v1";
  const SOUND_KEY = "crate-circuit.sound.v1";
  const ROOMS = [
    {
      name: "Starter Rail",
      par: 4,
      layout: [
        "########",
        "#@  $ .#",
        "#      #",
        "########"
      ]
    },
    {
      name: "Twin Feed",
      par: 10,
      layout: [
        "#########",
        "#@ $ .  #",
        "#  $ .  #",
        "#       #",
        "#########"
      ]
    },
    {
      name: "Drop Link",
      par: 14,
      layout: [
        "##########",
        "#@       #",
        "#  $     #",
        "#  .  $ .#",
        "#        #",
        "##########"
      ]
    },
    {
      name: "Breaker Bay",
      par: 22,
      layout: [
        "###########",
        "#@        #",
        "#  $ .    #",
        "#  ###    #",
        "#  $ .  $.#",
        "#         #",
        "###########"
      ]
    },
    {
      name: "Final Bus",
      par: 16,
      layout: [
        "############",
        "#@         #",
        "#  $ .     #",
        "#  $ .     #",
        "#  $ .     #",
        "#          #",
        "############"
      ]
    }
  ];

  const els = {
    room: document.getElementById("roomValue"),
    roomPill: document.getElementById("roomPill"),
    moves: document.getElementById("movesValue"),
    par: document.getElementById("parValue"),
    score: document.getElementById("scoreValue"),
    best: document.getElementById("bestValue"),
    bestPill: document.getElementById("bestPill"),
    undo: document.getElementById("undoValue"),
    status: document.getElementById("statusLine"),
    next: document.getElementById("nextBtn"),
    undoBtn: document.getElementById("undoBtn"),
    restart: document.getElementById("restartBtn"),
    sound: document.getElementById("soundBtn"),
    full: document.getElementById("fullBtn")
  };

  const state = {
    mode: "playing",
    roomIndex: 0,
    room: null,
    player: { x: 1, y: 1 },
    crates: [],
    undo: [],
    moves: 0,
    totalMoves: 0,
    score: 0,
    bestScore: readNumber(BEST_KEY, 0),
    roomAward: 0,
    feedback: "Push every crate onto a powered pad.",
    feedbackMs: 900,
    timeMs: 0,
    soundEnabled: loadSound(),
    lastSound: "none",
    userGesture: false,
    complete: false,
    gameOver: false
  };

  let audioCtx = null;
  let pointerStart = null;
  let raf = 0;
  let last = 0;

  function storage() {
    try { return window.localStorage; } catch (_) { return window.workshopStorage || null; }
  }

  function safeGet(key, fallback) {
    try {
      const store = storage();
      const raw = store ? store.getItem(key) : null;
      if (raw === null || raw === undefined || raw === "") return fallback;
      try { return JSON.parse(raw); } catch (_) { return raw; }
    } catch (_) {
      return fallback;
    }
  }

  function safeSet(key, value) {
    try {
      const store = storage();
      if (store) store.setItem(key, typeof value === "string" ? value : JSON.stringify(value));
    } catch (_) {}
  }

  function readNumber(key, fallback) {
    const raw = safeGet(key, fallback);
    const num = Number(raw && typeof raw === "object" && "bestScore" in raw ? raw.bestScore : raw);
    return Number.isFinite(num) ? num : fallback;
  }

  function loadSound() {
    const raw = safeGet(SOUND_KEY, null);
    if (raw === null) return true;
    if (typeof raw === "boolean") return raw;
    if (raw && typeof raw === "object") {
      if (typeof raw.soundEnabled === "boolean") return raw.soundEnabled;
      if (typeof raw.muted === "boolean") return !raw.muted;
    }
    const value = String(raw).toLowerCase();
    if (["0", "false", "off", "muted", "disabled"].includes(value)) return false;
    if (["1", "true", "on", "unmuted", "enabled"].includes(value)) return true;
    return true;
  }

  function persistSound() {
    safeSet(SOUND_KEY, { soundEnabled: state.soundEnabled, muted: !state.soundEnabled });
  }

  function markGesture() {
    state.userGesture = true;
  }

  function play(name) {
    if (!state.soundEnabled) {
      state.lastSound = "muted-" + name;
      return;
    }
    if (!state.userGesture) {
      state.lastSound = "blocked-" + name;
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) {
      state.lastSound = "unavailable-" + name;
      return;
    }
    if (!audioCtx) {
      try { audioCtx = new AC(); } catch (_) { audioCtx = null; }
    }
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const freq = { move: 260, push: 370, wall: 120, undo: 210, clear: 620, win: 760, restart: 180, toggle: 420, next: 520 }[name] || 300;
    osc.type = name === "wall" || name === "restart" ? "sawtooth" : "triangle";
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(name === "win" ? 0.07 : 0.045, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + (name === "win" ? 0.28 : 0.15));
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + (name === "win" ? 0.3 : 0.17));
    state.lastSound = name;
  }

  function posKey(x, y) {
    return x + "," + y;
  }

  function parseRoom(spec) {
    const width = Math.max(...spec.layout.map((row) => row.length));
    const height = spec.layout.length;
    const walls = new Set();
    const pads = [];
    const crates = [];
    let player = { x: 1, y: 1 };
    for (let y = 0; y < height; y += 1) {
      const row = spec.layout[y].padEnd(width, " ");
      for (let x = 0; x < width; x += 1) {
        const cell = row[x];
        if (cell === "#") walls.add(posKey(x, y));
        if (cell === "." || cell === "*" || cell === "+") pads.push({ x, y });
        if (cell === "$" || cell === "*") crates.push({ x, y });
        if (cell === "@" || cell === "+") player = { x, y };
      }
    }
    return { name: spec.name, par: spec.par, width, height, walls, pads, start: player, startCrates: crates };
  }

  function cloneCrates(crates = state.crates) {
    return crates.map((crate) => ({ x: crate.x, y: crate.y }));
  }

  function sortedCrates() {
    return cloneCrates().sort((a, b) => a.y - b.y || a.x - b.x);
  }

  function loadRoom(index) {
    state.roomIndex = Math.max(0, Math.min(ROOMS.length - 1, index));
    state.room = parseRoom(ROOMS[state.roomIndex]);
    state.player = { ...state.room.start };
    state.crates = cloneCrates(state.room.startCrates);
    state.undo = [];
    state.moves = 0;
    state.roomAward = 0;
    state.mode = "playing";
    state.complete = false;
    state.gameOver = false;
    setFeedback(state.room.name, 850);
    render();
  }

  function startRun(silent) {
    state.score = 0;
    state.totalMoves = 0;
    state.bestScore = readNumber(BEST_KEY, state.bestScore || 0);
    loadRoom(0);
    setFeedback("Push every crate onto a powered pad.", 950);
    if (!silent) play("restart");
    render();
  }

  function setFeedback(message, ms) {
    state.feedback = message;
    state.feedbackMs = Math.max(state.feedbackMs, ms || 520);
    ensureLoop();
  }

  function crateIndexAt(x, y) {
    return state.crates.findIndex((crate) => crate.x === x && crate.y === y);
  }

  function isWall(x, y) {
    return state.room.walls.has(posKey(x, y));
  }

  function isInside(x, y) {
    return x >= 0 && y >= 0 && x < state.room.width && y < state.room.height;
  }

  function isBlocked(x, y) {
    return !isInside(x, y) || isWall(x, y) || crateIndexAt(x, y) >= 0;
  }

  function padPowered(pad) {
    return crateIndexAt(pad.x, pad.y) >= 0;
  }

  function roomSolved() {
    return state.room.pads.every((pad) => padPowered(pad));
  }

  function pushUndo() {
    state.undo.push({
      player: { ...state.player },
      crates: cloneCrates(),
      moves: state.moves,
      totalMoves: state.totalMoves,
      score: state.score,
      roomAward: state.roomAward,
      mode: state.mode,
      complete: state.complete,
      gameOver: state.gameOver
    });
    if (state.undo.length > 96) state.undo.shift();
  }

  function restoreSnapshot(snap) {
    state.player = { ...snap.player };
    state.crates = cloneCrates(snap.crates);
    state.moves = snap.moves;
    state.totalMoves = snap.totalMoves;
    state.score = snap.score;
    state.roomAward = snap.roomAward;
    state.mode = snap.mode;
    state.complete = snap.complete;
    state.gameOver = snap.gameOver;
  }

  function move(dx, dy) {
    if (state.mode === "room-complete") {
      nextRoom();
      return;
    }
    if (state.mode === "run-complete") return;
    const tx = state.player.x + dx;
    const ty = state.player.y + dy;
    if (isWall(tx, ty) || !isInside(tx, ty)) {
      setFeedback("Wall blocks the circuit.", 420);
      play("wall");
      render();
      return;
    }
    const crateIndex = crateIndexAt(tx, ty);
    if (crateIndex >= 0) {
      const bx = tx + dx;
      const by = ty + dy;
      if (isBlocked(bx, by)) {
        setFeedback("Crate has no clearance.", 460);
        play("wall");
        render();
        return;
      }
      pushUndo();
      state.crates[crateIndex] = { x: bx, y: by };
      state.player = { x: tx, y: ty };
      state.moves += 1;
      state.totalMoves += 1;
      setFeedback(state.room.pads.some((pad) => pad.x === bx && pad.y === by) ? "Pad powered." : "Crate shifted.", 520);
      play("push");
    } else {
      pushUndo();
      state.player = { x: tx, y: ty };
      state.moves += 1;
      state.totalMoves += 1;
      setFeedback("Runner moved.", 360);
      play("move");
    }
    if (roomSolved()) completeRoom();
    render();
  }

  function completeRoom() {
    const parBonus = Math.max(0, state.room.par - state.moves) * 35;
    const powerBonus = state.room.pads.length * 100;
    state.roomAward = 500 + powerBonus + parBonus;
    state.score += state.roomAward;
    if (state.roomIndex === ROOMS.length - 1) {
      state.mode = "run-complete";
      state.complete = true;
      state.gameOver = false;
      if (state.score > state.bestScore) {
        state.bestScore = state.score;
        safeSet(BEST_KEY, String(state.bestScore));
      }
      setFeedback("Run complete. Circuit fully powered.", 1500);
      play("win");
    } else {
      state.mode = "room-complete";
      setFeedback("Room powered. Advance to the next circuit.", 1200);
      play("clear");
    }
  }

  function nextRoom() {
    markGesture();
    if (state.mode === "run-complete") {
      startRun(false);
      return;
    }
    if (state.mode !== "room-complete") return;
    loadRoom(state.roomIndex + 1);
    setFeedback("Next room online.", 850);
    play("next");
  }

  function restartRoom() {
    markGesture();
    if (state.mode === "run-complete") {
      startRun(false);
      return;
    }
    if (state.mode === "room-complete" && state.roomAward > 0) state.score = Math.max(0, state.score - state.roomAward);
    loadRoom(state.roomIndex);
    setFeedback("Room restarted.", 700);
    play("restart");
  }

  function undo() {
    markGesture();
    const snap = state.undo.pop();
    if (!snap) {
      setFeedback("Undo buffer empty.", 420);
      play("wall");
      render();
      return;
    }
    restoreSnapshot(snap);
    setFeedback("Move reversed.", 520);
    play("undo");
    render();
  }

  function toggleSound() {
    markGesture();
    state.soundEnabled = !state.soundEnabled;
    persistSound();
    play("toggle");
    render();
  }

  function toggleFullscreen() {
    markGesture();
    const doc = document;
    if (doc.fullscreenElement) {
      if (doc.exitFullscreen) doc.exitFullscreen().catch(() => {});
    } else {
      const target = document.documentElement;
      if (target.requestFullscreen) target.requestFullscreen().catch(() => {});
    }
  }

  function boardGeometry() {
    const cell = Math.floor(Math.min((W - 96) / state.room.width, (H - 120) / state.room.height));
    const boardW = cell * state.room.width;
    const boardH = cell * state.room.height;
    return { cell, ox: Math.round((W - boardW) / 2), oy: Math.round(72 + (H - 92 - boardH) / 2), boardW, boardH };
  }

  function canvasPointFromEvent(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * W / rect.width,
      y: (event.clientY - rect.top) * H / rect.height
    };
  }

  function tileFromPoint(point) {
    const g = boardGeometry();
    const x = Math.floor((point.x - g.ox) / g.cell);
    const y = Math.floor((point.y - g.oy) / g.cell);
    return isInside(x, y) ? { x, y } : null;
  }

  function directionFromDelta(dx, dy) {
    if (Math.abs(dx) >= Math.abs(dy)) return { dx: Math.sign(dx) || 1, dy: 0 };
    return { dx: 0, dy: Math.sign(dy) || 1 };
  }

  function handleTap(point) {
    const tile = tileFromPoint(point);
    if (!tile) return;
    const dx = tile.x - state.player.x;
    const dy = tile.y - state.player.y;
    if (Math.abs(dx) + Math.abs(dy) === 1) move(dx, dy);
    else {
      const dir = directionFromDelta(dx, dy);
      move(dir.dx, dir.dy);
    }
  }

  function stepTime(ms) {
    let left = Math.max(0, Number(ms) || 0);
    if (left === 0) {
      render();
      return;
    }
    while (left > 0) {
      const dt = Math.min(1000 / 60, left);
      state.feedbackMs = Math.max(0, state.feedbackMs - dt);
      state.timeMs += dt;
      left -= dt;
    }
    render();
  }

  function loopActive() {
    return state.feedbackMs > 0;
  }

  function ensureLoop() {
    if (raf || !loopActive()) return;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function stopLoop() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    last = 0;
  }

  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, "#071018");
    grad.addColorStop(1, "#101827");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(94,234,212,.08)";
    ctx.lineWidth = 1;
    for (let x = -80; x < W + 120; x += 48) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + 170, H);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(244,114,182,.06)";
    for (let y = 48; y < H; y += 58) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }

  function drawPad(x, y, cell, powered) {
    const cx = x + cell / 2;
    const cy = y + cell / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.PI / 4);
    ctx.shadowColor = powered ? "#fbbf24" : "#22d3ee";
    ctx.shadowBlur = powered ? 24 : 10;
    ctx.fillStyle = powered ? "rgba(251,191,36,.22)" : "rgba(34,211,238,.13)";
    ctx.strokeStyle = powered ? "#fbbf24" : "rgba(94,234,212,.8)";
    ctx.lineWidth = 3;
    roundRect(-cell * .22, -cell * .22, cell * .44, cell * .44, 5, true, true);
    ctx.restore();
    if (powered) {
      ctx.strokeStyle = "rgba(251,191,36,.85)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - cell * .08, cy - cell * .18);
      ctx.lineTo(cx + cell * .03, cy - cell * .02);
      ctx.lineTo(cx - cell * .04, cy - cell * .02);
      ctx.lineTo(cx + cell * .09, cy + cell * .18);
      ctx.stroke();
    }
  }

  function drawCrate(x, y, cell, powered) {
    const pad = Math.max(5, cell * .1);
    ctx.save();
    ctx.shadowColor = powered ? "#fbbf24" : "#f472b6";
    ctx.shadowBlur = powered ? 20 : 14;
    const grad = ctx.createLinearGradient(x, y, x + cell, y + cell);
    grad.addColorStop(0, powered ? "#fbbf24" : "#f472b6");
    grad.addColorStop(1, powered ? "#a855f7" : "#7c3aed");
    ctx.fillStyle = grad;
    ctx.strokeStyle = "rgba(255,255,255,.26)";
    ctx.lineWidth = 2;
    roundRect(x + pad, y + pad, cell - pad * 2, cell - pad * 2, 8, true, true);
    ctx.strokeStyle = "rgba(4,10,24,.55)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + pad * 1.7, y + cell / 2);
    ctx.lineTo(x + cell - pad * 1.7, y + cell / 2);
    ctx.moveTo(x + cell / 2, y + pad * 1.7);
    ctx.lineTo(x + cell / 2, y + cell - pad * 1.7);
    ctx.stroke();
    ctx.restore();
  }

  function drawPlayer(x, y, cell) {
    const cx = x + cell / 2;
    const cy = y + cell / 2;
    ctx.save();
    ctx.shadowColor = "#5eead4";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#5eead4";
    ctx.beginPath();
    ctx.arc(cx, cy, cell * .28, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#051018";
    ctx.beginPath();
    ctx.arc(cx + cell * .08, cy - cell * .06, cell * .07, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, cell * .34, -0.45, Math.PI + 0.35);
    ctx.stroke();
    ctx.restore();
  }

  function drawOverlay(title, sub, color) {
    ctx.save();
    ctx.fillStyle = "rgba(3,7,18,.72)";
    ctx.fillRect(0, H / 2 - 74, W, 148);
    ctx.textAlign = "center";
    ctx.fillStyle = color;
    ctx.font = "900 34px system-ui";
    ctx.fillText(title, W / 2, H / 2 - 12);
    ctx.fillStyle = "#e6edf3";
    ctx.font = "800 15px system-ui";
    ctx.fillText(sub, W / 2, H / 2 + 24);
    ctx.restore();
  }

  function renderBoard() {
    const g = boardGeometry();
    ctx.fillStyle = "rgba(3,7,18,.48)";
    ctx.strokeStyle = "rgba(94,234,212,.28)";
    ctx.lineWidth = 1;
    roundRect(g.ox - 10, g.oy - 10, g.boardW + 20, g.boardH + 20, 16, true, true);
    for (let y = 0; y < state.room.height; y += 1) {
      for (let x = 0; x < state.room.width; x += 1) {
        const px = g.ox + x * g.cell;
        const py = g.oy + y * g.cell;
        if (isWall(x, y)) {
          const grad = ctx.createLinearGradient(px, py, px, py + g.cell);
          grad.addColorStop(0, "#17243a");
          grad.addColorStop(1, "#0c1526");
          ctx.fillStyle = grad;
          ctx.strokeStyle = "rgba(94,234,212,.24)";
          roundRect(px + 2, py + 2, g.cell - 4, g.cell - 4, 8, true, true);
        } else {
          ctx.fillStyle = "rgba(15,23,42,.62)";
          ctx.strokeStyle = "rgba(94,234,212,.08)";
          roundRect(px + 3, py + 3, g.cell - 6, g.cell - 6, 7, true, true);
        }
      }
    }
    for (const pad of state.room.pads) {
      drawPad(g.ox + pad.x * g.cell, g.oy + pad.y * g.cell, g.cell, padPowered(pad));
    }
    for (const crate of sortedCrates()) {
      drawCrate(g.ox + crate.x * g.cell, g.oy + crate.y * g.cell, g.cell, state.room.pads.some((pad) => pad.x === crate.x && pad.y === crate.y));
    }
    drawPlayer(g.ox + state.player.x * g.cell, g.oy + state.player.y * g.cell, g.cell);
  }

  function render() {
    drawBackground();
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(94,234,212,.9)";
    ctx.font = "900 12px system-ui";
    ctx.fillText(state.room ? state.room.name.toUpperCase() : "CRATE CIRCUIT", W / 2, 34);
    ctx.restore();
    renderBoard();
    if (state.mode === "room-complete") drawOverlay("ROOM POWERED", "Press Next, Space, or any move key.", "#fbbf24");
    if (state.mode === "run-complete") drawOverlay("RUN COMPLETE", "Score " + state.score + " - Best " + state.bestScore, "#5eead4");
    updateHud();
  }

  function updateHud() {
    els.room.textContent = (state.roomIndex + 1) + "/" + ROOMS.length;
    els.moves.textContent = String(state.moves);
    els.par.textContent = String(state.room ? state.room.par : 0);
    els.score.textContent = String(state.score);
    els.best.textContent = String(state.bestScore);
    els.undo.textContent = String(state.undo.length);
    els.status.textContent = state.feedback;
    els.roomPill.dataset.hot = String(state.mode === "room-complete");
    els.bestPill.dataset.hot = String(state.mode === "run-complete" && state.score >= state.bestScore && state.score > 0);
    els.next.disabled = state.mode !== "room-complete" && state.mode !== "run-complete";
    els.next.textContent = state.mode === "run-complete" ? "New Run" : "Next Room";
    els.restart.textContent = state.mode === "run-complete" ? "New Run" : "Restart Room";
    els.sound.textContent = state.soundEnabled ? "Sound On" : "Sound Off";
    els.sound.setAttribute("aria-pressed", String(state.soundEnabled));
  }

  function wallsSummary() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const wall of state.room.walls) {
      const [x, y] = wall.split(",").map(Number);
      minX = Math.min(minX, x); minY = Math.min(minY, y);
      maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
    }
    return {
      count: state.room.walls.size,
      rows: state.room.height,
      cols: state.room.width,
      bounds: state.room.walls.size ? { minX, minY, maxX, maxY } : null
    };
  }

  function renderGameToText() {
    return JSON.stringify({
      mode: state.mode,
      room: {
        index: state.roomIndex,
        number: state.roomIndex + 1,
        total: ROOMS.length,
        name: state.room.name
      },
      moves: state.moves,
      par: state.room.par,
      score: state.score,
      bestScore: state.bestScore,
      player: { ...state.player },
      crates: sortedCrates().map((crate) => ({ ...crate, onPad: state.room.pads.some((pad) => pad.x === crate.x && pad.y === crate.y) })),
      pads: state.room.pads.map((pad) => ({ ...pad, powered: padPowered(pad) })),
      walls: wallsSummary(),
      undoDepth: state.undo.length,
      soundEnabled: state.soundEnabled,
      lastSound: state.lastSound,
      feedback: state.feedback,
      feedbackActive: state.feedbackMs > 0,
      complete: state.complete,
      gameOver: state.gameOver,
      totalMoves: state.totalMoves
    });
  }

  window.render_game_to_text = renderGameToText;
  window.advanceTime = function advanceTime(ms) {
    stopLoop();
    stepTime(ms);
    ensureLoop();
    return renderGameToText();
  };

  window.addEventListener("keydown", (event) => {
    if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
    const key = event.key;
    const dir = {
      ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
      ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
      ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
    }[key];
    if (dir) {
      event.preventDefault();
      markGesture();
      move(dir[0], dir[1]);
    } else if (key === "u" || key === "U") {
      event.preventDefault();
      undo();
    } else if (key === "r" || key === "R") {
      event.preventDefault();
      restartRoom();
    } else if (key === "m" || key === "M") {
      event.preventDefault();
      toggleSound();
    } else if (key === "f" || key === "F") {
      event.preventDefault();
      toggleFullscreen();
    } else if (key === " " || key === "Enter") {
      event.preventDefault();
      markGesture();
      if (state.mode === "room-complete" || state.mode === "run-complete") nextRoom();
    }
  });

  canvas.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    canvas.focus();
    markGesture();
    pointerStart = { x: event.clientX, y: event.clientY, point: canvasPointFromEvent(event) };
    try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
  });

  canvas.addEventListener("pointerup", (event) => {
    event.preventDefault();
    if (!pointerStart) return;
    const dx = event.clientX - pointerStart.x;
    const dy = event.clientY - pointerStart.y;
    if (Math.hypot(dx, dy) > 24) {
      const dir = directionFromDelta(dx, dy);
      move(dir.dx, dir.dy);
    } else {
      handleTap(pointerStart.point);
    }
    pointerStart = null;
  });

  document.querySelectorAll("[data-dir]").forEach((button) => {
    button.addEventListener("click", () => {
      markGesture();
      const [dx, dy] = button.dataset.dir.split(",").map(Number);
      move(dx, dy);
    });
  });
  els.next.addEventListener("click", nextRoom);
  els.undoBtn.addEventListener("click", undo);
  els.restart.addEventListener("click", restartRoom);
  els.sound.addEventListener("click", toggleSound);
  els.full.addEventListener("click", toggleFullscreen);
  window.addEventListener("resize", render);
  document.addEventListener("fullscreenchange", render);

  function frame(now) {
    raf = 0;
    const dt = Math.min(50, last ? now - last : 0);
    last = now;
    state.feedbackMs = Math.max(0, state.feedbackMs - dt);
    state.timeMs += dt;
    render();
    if (loopActive()) raf = requestAnimationFrame(frame);
    else last = 0;
  }

  startRun(true);
})();
</script>
</body>
</html>
