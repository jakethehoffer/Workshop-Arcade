<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Relay Choir</span></div>
    <div class="hud" aria-label="Relay Choir status">
      <span class="pill"><span class="label">Stage</span><span class="value" id="stageValue">1/5</span></span>
      <span class="pill"><span class="label">Beat</span><span class="value" id="beatValue">1</span></span>
      <span class="pill" id="targetPill"><span class="label">Targets</span><span class="value" id="targetValue">0/0</span></span>
      <span class="pill"><span class="label">Score</span><span class="value" id="scoreValue">0</span></span>
      <span class="pill"><span class="label">Best</span><span class="value" id="bestValue">0</span></span>
    </div>
  </header>
  <main aria-label="Relay Choir game">
    <div class="stage"><canvas id="game" width="900" height="560" tabindex="0" aria-label="Relay Choir sequencer. Move the cursor with arrows or WASD, place triggers and gates, and time pulses into target beat windows."></canvas></div>
  </main>
  <div class="status" id="statusLine" aria-live="polite" data-tone="info">First: tap the glowing source pads.</div>
  <div class="tools" aria-label="Edit tools">
    <button class="btn primary" type="button" data-tool="cycle" aria-pressed="true">Cycle</button>
    <button class="btn" type="button" data-tool="trigger" aria-pressed="false">Trigger</button>
    <button class="btn" type="button" data-tool="gateUp" aria-pressed="false">Gate Up</button>
    <button class="btn" type="button" data-tool="gateDown" aria-pressed="false">Gate Down</button>
    <button class="btn warn" type="button" data-tool="erase" aria-pressed="false">Erase</button>
  </div>
  <div class="actions" aria-label="Playback controls">
    <button class="btn primary" id="playBtn" type="button">Pause</button>
    <button class="btn" id="nextBtn" type="button" disabled>Next</button>
    <button class="btn warn" id="restartBtn" type="button">Restart</button>
    <button class="btn" id="soundBtn" type="button" aria-pressed="true">Sound On</button>
    <button class="btn" id="fullBtn" type="button">Fullscreen</button>
  </div>
  <div class="help"><span class="kbd">Arrows</span> move <span class="kbd">Space</span> cycle <span class="kbd">T</span>/<span class="kbd">G</span>/<span class="kbd">E</span> edit <span class="kbd">Enter</span> play <span class="kbd">N</span> next <span class="kbd">M</span> sound <span class="kbd">F</span> fullscreen</div>
</div>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const ROWS = 4;
  const STEPS = 8;
  const BEAT_MS = 360;
  const BOARD = { x: 94, y: 112, w: 720, h: 304 };
  const CELL_W = BOARD.w / STEPS;
  const CELL_H = BOARD.h / ROWS;
  const STORE_KEY = "relay-choir.v1";
  const VOICES = ["Sop", "Alto", "Tenor", "Bass"];
  const COLORS = ["#38ddea", "#ffd166", "#b39cff", "#57e389"];
  const TOOLS = ["cycle", "trigger", "gateUp", "gateDown", "erase"];
  const STAGES = [
    {
      name: "Four Count",
      maxTriggers: 2,
      maxGates: 0,
      pads: [[1, 0], [3, 1]],
      targets: [[1, 4], [3, 5]],
      blocks: []
    },
    {
      name: "Lift Window",
      maxTriggers: 1,
      maxGates: 1,
      pads: [[2, 1]],
      targets: [[1, 5]],
      blocks: []
    },
    {
      name: "Falling Third",
      maxTriggers: 1,
      maxGates: 2,
      pads: [[0, 0]],
      targets: [[1, 2], [2, 4]],
      blocks: []
    },
    {
      name: "Counterline",
      maxTriggers: 3,
      maxGates: 2,
      pads: [[1, 0], [2, 0], [0, 2]],
      targets: [[0, 4], [3, 4], [0, 6]],
      blocks: []
    },
    {
      name: "Late Gate",
      maxTriggers: 1,
      maxGates: 3,
      pads: [[3, 7]],
      targets: [[2, 3], [1, 5], [0, 7]],
      blocks: [[2, 7]]
    }
  ];

  const els = {
    stage: document.getElementById("stageValue"),
    beat: document.getElementById("beatValue"),
    target: document.getElementById("targetValue"),
    targetPill: document.getElementById("targetPill"),
    score: document.getElementById("scoreValue"),
    best: document.getElementById("bestValue"),
    status: document.getElementById("statusLine"),
    play: document.getElementById("playBtn"),
    next: document.getElementById("nextBtn"),
    restart: document.getElementById("restartBtn"),
    sound: document.getElementById("soundBtn"),
    full: document.getElementById("fullBtn")
  };
  const toolButtons = Array.from(document.querySelectorAll("[data-tool]"));

  function storage() {
    if (window.workshopStorage) return window.workshopStorage;
    try { return window.localStorage; } catch (_) { return null; }
  }
  const safeStore = {
    get(key, fallback) {
      const store = storage();
      if (!store) return fallback;
      try {
        const raw = store.getItem(key);
        return raw == null || raw === "" ? fallback : JSON.parse(raw);
      } catch (_) {
        return fallback;
      }
    },
    set(key, value) {
      const store = storage();
      if (!store) return;
      try { store.setItem(key, JSON.stringify(value)); } catch (_) {}
    }
  };
  const saved = safeStore.get(STORE_KEY, {});
  const state = {
    stageIndex: 0,
    grid: emptyGrid(),
    cursor: { r: 1, c: 0 },
    tool: "cycle",
    beat: 0,
    beatMs: 0,
    playing: true,
    pulses: [],
    flashes: [],
    cycleHits: [],
    lastHits: [],
    stageSolved: false,
    runComplete: false,
    score: 0,
    best: Number(saved.best) || 0,
    sound: saved.sound !== false,
    lastSound: "none",
    soundCount: 0,
    feedback: "First: tap the glowing source pads.",
    feedbackTone: "info",
    feedbackMs: 1400,
    suggestTool: "",
    suggestMs: 0,
    gesture: false,
    moves: 0,
    solvedStages: []
  };
  let audio = null;
  let pulseId = 0;

  function emptyGrid() {
    return Array.from({ length: ROWS }, () => Array.from({ length: STEPS }, () => ""));
  }
  function stage() { return STAGES[state.stageIndex]; }
  function keyOf(r, c) { return r + "," + c; }
  function plural(count, single, many = single + "s") { return count === 1 ? single : many; }
  function listHas(list, r, c) { return list.some((p) => p[0] === r && p[1] === c); }
  function isPad(r, c) { return listHas(stage().pads, r, c); }
  function isTarget(r, c) { return listHas(stage().targets, r, c); }
  function isBlock(r, c) { return listHas(stage().blocks, r, c); }
  function targetIndex(r, c) { return stage().targets.findIndex((p) => p[0] === r && p[1] === c); }
  function countTriggers() { return state.grid.flat().filter((v) => v === "trigger").length; }
  function countGates() { return state.grid.flat().filter((v) => v === "gateUp" || v === "gateDown").length; }
  function hitCount() { return state.lastHits.filter(Boolean).length; }
  function center(r, c) {
    return { x: BOARD.x + c * CELL_W + CELL_W / 2, y: BOARD.y + r * CELL_H + CELL_H / 2 };
  }
  function firstActionPrompt() {
    const triggers = stage().maxTriggers;
    if (stage().maxGates === 0) return "First: tap " + triggers + " glowing source " + plural(triggers, "pad") + ". No gates needed.";
    return "First: arm " + triggers + " source " + plural(triggers, "pad") + ", then bend voices with gates.";
  }
  function idleFeedback() {
    const missingTriggers = Math.max(0, stage().maxTriggers - countTriggers());
    const gatesLeft = Math.max(0, stage().maxGates - countGates());
    const hits = hitCount();
    if (missingTriggers > 0) {
      return "First: arm " + missingTriggers + " more source " + plural(missingTriggers, "pad") + ".";
    }
    if (stage().maxGates === 0) {
      return "Sources armed. Watch pulses hit the WIN windows.";
    }
    if (hits < stage().targets.length && gatesLeft > 0) {
      return "Use " + gatesLeft + " open " + plural(gatesLeft, "gate") + " to lift or drop a voice.";
    }
    if (hits < stage().targets.length && stage().maxGates > 0) {
      return "All gates used. If a WIN ring stays dark, erase or flip a gate.";
    }
    return stage().name + ": " + countTriggers() + "/" + stage().maxTriggers + " triggers, " + countGates() + "/" + stage().maxGates + " gates.";
  }
  function canvasCue() {
    if (state.runComplete) return "Next: new run";
    if (state.stageSolved) return "Next: continue";
    if (countTriggers() < stage().maxTriggers) return "Next: tap source pads";
    if (stage().maxGates > 0 && countGates() < stage().maxGates && hitCount() < stage().targets.length) return "Next: add or flip gates";
    return "Watch for green WIN rings";
  }
  function syncFeedbackAttrs() {
    els.status.dataset.tone = state.feedbackTone;
    for (const button of toolButtons) {
      const suggested = state.suggestMs > 0 && button.dataset.tool === state.suggestTool;
      button.dataset.suggested = String(suggested);
    }
  }
  function setFeedback(text, ms = 1300, tone = "info", suggestTool = "") {
    state.feedback = text;
    state.feedbackTone = tone;
    state.feedbackMs = ms;
    state.suggestTool = suggestTool;
    state.suggestMs = suggestTool ? Math.max(ms, 1200) : 0;
    els.status.textContent = text;
    syncFeedbackAttrs();
  }
  function persist() {
    if (state.score > state.best) state.best = state.score;
    safeStore.set(STORE_KEY, { best: state.best, sound: state.sound });
  }
  function markGesture() {
    state.gesture = true;
  }
  function ensureAudio() {
    if (!state.sound || !state.gesture) return null;
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { audio = null; }
    }
    if (audio && audio.state === "suspended") audio.resume().catch(() => {});
    return audio;
  }
  function tone(name, freq, dur = 0.055, type = "sine") {
    state.lastSound = state.sound ? name : "muted-" + name;
    if (!state.sound) return;
    const ac = ensureAudio();
    if (!ac) return;
    state.soundCount += 1;
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.042, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t);
    osc.stop(t + dur + 0.03);
  }
  function resetBeat() {
    state.beat = 0;
    state.beatMs = 0;
    state.pulses = [];
    state.flashes = [];
    state.cycleHits = stage().targets.map(() => false);
    state.lastHits = stage().targets.map(() => false);
  }
  function loadStage(index, keepScore = true) {
    state.stageIndex = Math.max(0, Math.min(STAGES.length - 1, index));
    state.grid = emptyGrid();
    state.cursor = { r: stage().pads[0][0], c: stage().pads[0][1] };
    state.stageSolved = false;
    state.runComplete = false;
    state.playing = true;
    state.moves = 0;
    if (!keepScore) {
      state.score = 0;
      state.solvedStages = [];
    }
    resetBeat();
    setFeedback(firstActionPrompt(), 1900);
    syncHud();
    render();
  }
  function restartRun() {
    markGesture();
    loadStage(0, false);
    tone("restart", 220, 0.08, "triangle");
  }
  function invalidateSolution() {
    if (state.stageSolved || state.runComplete) {
      state.stageSolved = false;
      state.runComplete = false;
      state.playing = true;
    }
    resetBeat();
  }
  function canPlace(type, r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= STEPS) return false;
    if (isTarget(r, c) || isBlock(r, c)) return false;
    if (type === "trigger") return isPad(r, c);
    if (type === "gateUp" || type === "gateDown") return !isPad(r, c);
    return true;
  }
  function place(type, r = state.cursor.r, c = state.cursor.c) {
    if (type === "erase") {
      if (state.grid[r][c]) {
        state.grid[r][c] = "";
        state.moves += 1;
        invalidateSolution();
        setFeedback("Cell cleared. Budget freed.");
        tone("erase", 240, 0.05, "sawtooth");
      } else {
        setFeedback("Nothing to erase here.", 900, "warn");
      }
      syncHud();
      render();
      return;
    }
    if (!canPlace(type, r, c)) {
      let message = "That cell is locked.";
      let suggestion = "cycle";
      if (type === "trigger") message = "Triggers only fit source pads.";
      else if (isPad(r, c)) message = "Source pads only hold triggers.";
      else if (isTarget(r, c)) message = "WIN windows are locked. Route pulses into them.";
      else if (isBlock(r, c)) message = "Blocked beats cannot hold tools.";
      if (type === "trigger") suggestion = "cycle";
      else if (isPad(r, c)) suggestion = "trigger";
      else suggestion = "erase";
      setFeedback(message, 1600, "warn", suggestion);
      tone("blocked", 150, 0.08, "square");
      return;
    }
    const was = state.grid[r][c];
    const nextTriggerCount = countTriggers() + (type === "trigger" && was !== "trigger" ? 1 : 0) - (was === "trigger" && type !== "trigger" ? 1 : 0);
    const wasGate = was === "gateUp" || was === "gateDown";
    const nextGateCount = countGates() + ((type === "gateUp" || type === "gateDown") && !wasGate ? 1 : 0) - (wasGate && type === "trigger" ? 1 : 0);
    if (nextTriggerCount > stage().maxTriggers) {
      setFeedback("Trigger budget full: erase or cycle a source trigger.", 2000, "warn", "erase");
      tone("budget", 160, 0.08, "square");
      return;
    }
    if (nextGateCount > stage().maxGates) {
      if (stage().maxGates === 0) {
        setFeedback("No gates on this stage: arm the source pads instead.", 2200, "warn", "trigger");
      } else {
        setFeedback("Gate budget full: erase one gate or cycle an existing gate.", 2400, "warn", "erase");
      }

      update(step);
      left -= step;
    }
    render();
    return renderGameToText();
  };

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, Math.max(0, now - last));
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  loadStage(0, false);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
