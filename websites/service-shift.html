<body>
<main class="shell" aria-label="Service Shift game">
  <div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Service Shift</span></div>
  <div class="hud" aria-label="Shift status">
    <div class="pill"><span class="label">Time</span><span class="value" id="timeValue">0.0</span></div>
    <div class="pill"><span class="label">Score</span><span class="value" id="scoreValue">0</span></div>
    <div class="pill"><span class="label">Best</span><span class="value" id="bestValue">0</span></div>
    <div class="pill" id="comboPill"><span class="label">Combo</span><span class="value" id="comboValue">0</span></div>
    <div class="pill" id="queuePill"><span class="label">Queue</span><span class="value" id="queueValue">0</span></div>
    <div class="pill" id="missPill"><span class="label">Miss</span><span class="value" id="missValue">0/3</span></div>
  </div>
  <div class="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Service Shift kitchen canvas. Select one of three stations, prepare matching orders, then serve before customer patience expires."></canvas></div>
  <div class="status" id="statusLine" aria-live="polite">Select a station and prepare the first matching order.</div>
  <div class="stations" aria-label="Station selection">
    <button class="btn station primary" type="button" data-station="0" aria-current="true">1 Grill</button>
    <button class="btn station" type="button" data-station="1" aria-current="false">2 Pour</button>
    <button class="btn station" type="button" data-station="2" aria-current="false">3 Pack</button>
  </div>
  <div class="controls" aria-label="Game controls">
    <button class="btn primary" id="actionBtn" type="button">Prepare</button>
    <button class="btn" id="restartBtn" type="button">Restart</button>
    <button class="btn" id="soundBtn" type="button" aria-pressed="true">Sound On</button>
    <button class="btn" id="fullBtn" type="button">Fullscreen</button>
  </div>
  <div class="help">1/2/3 select stations. Arrows/WASD move focus. Enter/Space prepares or serves. R restart. F fullscreen. M sound.</div>
</main>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height, TAU = Math.PI * 2;
  const BEST_KEY = "service-shift.best.v1";
  const SOUND_KEY = "service-shift.sound.v1";
  const DAY_MS = 78000, MISS_LIMIT = 3;
  const stations = [
    { id: "grill", name: "Grill", color: "#f97316", x: 190, y: 350, prep: 2800 },
    { id: "pour", name: "Pour", color: "#22d3ee", x: 480, y: 350, prep: 2200 },
    { id: "pack", name: "Pack", color: "#a78bfa", x: 770, y: 350, prep: 2500 }
  ];
  const menu = [
    { item: "Noodle Box", station: 2, patience: 17500, value: 120 },
    { item: "Sizzle Plate", station: 0, patience: 16000, value: 130 },
    { item: "Citrus Fizz", station: 1, patience: 14500, value: 115 },
    { item: "Fire Skewer", station: 0, patience: 13500, value: 150 },
    { item: "Ice Tea", station: 1, patience: 15000, value: 105 },
    { item: "Parcel Set", station: 2, patience: 15500, value: 125 },
    { item: "Steam Bun", station: 2, patience: 12500, value: 140 },
    { item: "Griddle Roll", station: 0, patience: 12000, value: 160 },
    { item: "Berry Soda", station: 1, patience: 11800, value: 145 }
  ];
  const els = {
    time: document.getElementById("timeValue"), score: document.getElementById("scoreValue"), best: document.getElementById("bestValue"),
    combo: document.getElementById("comboValue"), queue: document.getElementById("queueValue"), miss: document.getElementById("missValue"),
    comboPill: document.getElementById("comboPill"), queuePill: document.getElementById("queuePill"), missPill: document.getElementById("missPill"),
    status: document.getElementById("statusLine"), action: document.getElementById("actionBtn"), restart: document.getElementById("restartBtn"),
    sound: document.getElementById("soundBtn"), full: document.getElementById("fullBtn"), stationButtons: [...document.querySelectorAll("[data-station]")]
  };
  function storage() {
    if (window.workshopStorage) return window.workshopStorage;
    try { return window.localStorage; } catch (_) { return null; }
  }
  const safe = {
    get(k, fallback) {
      const store = storage();
      if (!store) return fallback;
      try { const raw = store.getItem(k); return raw == null ? fallback : JSON.parse(raw); } catch (_) { return fallback; }
    },
    set(k, v) {
      const store = storage();
      if (!store) return;
      try { store.setItem(k, JSON.stringify(v)); } catch (_) {}
    }
  };
  let audioCtx = null, orderSeq = 1, lastTs = performance.now();
  // Honor prefers-reduced-motion: gate decorative particle bursts and event
  // rings (cosmetic, no gameplay effect) for motion-sensitive players.
  let reducedMotion = false;
  try {
    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    reducedMotion = motionQuery.matches;
    motionQuery.addEventListener("change", (event) => { reducedMotion = event.matches; });
  } catch (_) {}
  function loadSound() {
    const raw = safe.get(SOUND_KEY, true);
    if (typeof raw === "boolean") return raw;
    if (raw && typeof raw === "object") {
      if (typeof raw.sound === "boolean") return raw.sound;
      if (typeof raw.soundEnabled === "boolean") return raw.soundEnabled;
      if (typeof raw.muted === "boolean") return !raw.muted;
    }
    const text = String(raw).toLowerCase();
    if (["0", "false", "off", "muted", "disabled"].includes(text)) return false;
    if (["1", "true", "on", "unmuted", "enabled"].includes(text)) return true;
    return true;
  }
  function finiteOr0(v) { const n = Number(v); return Number.isFinite(n) && n >= 0 ? Math.floor(n) : 0; }
  const state = {
    mode: "ready", timeMs: 0, score: 0, best: finiteOr0(safe.get(BEST_KEY, 0)), combo: 0, misses: 0,
    selected: 0, queue: [], completed: [], spawnIndex: 0, spawnTimer: 300, served: 0,
    stationState: stations.map(() => ({ orderId: null, progress: 0, ready: false })),
    sound: loadSound(), userGesture: false, lastSound: "none", feedback: "Shift open.", feedbackMs: 900,
    runComplete: false, gameOver: false, particles: []
  };
  function orderAt(index) {
    const base = menu[(index * 5 + 2) % menu.length];
    return { id: orderSeq++, item: base.item, station: base.station, stationName: stations[base.station].name, patienceMax: base.patience - Math.min(3200, index * 90), patience: base.patience - Math.min(3200, index * 90), value: base.value + (index % 4) * 10 };
  }
  function setFeedback(text, ms = 700) { state.feedback = text; state.feedbackMs = Math.max(state.feedbackMs, ms);  ensureLoop(); }
  function updateBest() { if (state.score > state.best) { state.best = state.score; safe.set(BEST_KEY, state.best); } }
  function markGesture() { state.userGesture = true; canvas.focus({ preventScroll: true }); }
  function play(name) {
    state.lastSound = state.sound ? name : "muted-" + name;
    if (!state.sound || !state.userGesture) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { if (!audioCtx) audioCtx = new AC(); } catch (_) { audioCtx = null; }
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    const freq = { select: 300, prep: 440, serve: 760, miss: 120, over: 90, done: 620, toggle: 520 }[name] || 360;
    osc.type = name === "miss" || name === "over" ? "sawtooth" : "triangle";
    osc.frequency.setValueAtTime(freq, now);
    if (name === "serve") osc.frequency.linearRampToValueAtTime(freq + 180, now + .12);
    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(name === "over" ? .07 : .045, now + .012);
    gain.gain.exponentialRampToValueAtTime(.0001, now + .18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now + .2);
  }
  function restart() {
    orderSeq = 1;
    Object.assign(state, { mode: "playing", timeMs: 0, score: 0, combo: 0, misses: 0, selected: 0, queue: [], completed: [], spawnIndex: 0, spawnTimer: 300, served: 0, runComplete: false, gameOver: false, particles: [], feedback: "Shift open.", feedbackMs: 900 });
    state.stationState = stations.map(() => ({ orderId: null, progress: 0, ready: false }));
    play("prep"); render();
  }
  function spawnOrder() {
    if (state.spawnIndex >= 18 || state.timeMs >= DAY_MS - 9000) return;
    state.queue.push(orderAt(state.spawnIndex));
    state.spawnIndex += 1;
    state.spawnTimer = 2600 + (state.spawnIndex % 4) * 520;
    setFeedback("New customer at the counter.", 520);
  }
  function selectedStation() { return state.stationState[state.selected]; }
  function findOrderForStation(index) { return state.queue.find((order) => order.station === index); }
  function act() {
    if (state.gameOver || state.runComplete) { restart(); return; }
    const st = selectedStation();
    if (st.orderId && st.ready) return serve(st.orderId);
    if (st.orderId) { setFeedback(stations[state.selected].name + " is still preparing.", 460); play("select"); return; }
    const order = findOrderForStation(state.selected);
    if (!order) { setFeedback("No " + stations[state.selected].name + " orders waiting.", 480); play("select"); return; }
    st.orderId = order.id; st.progress = 0; st.ready = false;
    setFeedback("Preparing " + order.item + ".", 620); play("prep");
  }
  // What serving the ready order pays right now. Patience keeps draining while
  // it sits ready, so the bonus visibly decays - that pressure was never shown.
  function servePayout(order) { if (!order) return null; const ratio = Math.max(0, order.patience / order.patienceMax);
    const patienceBonus = Math.round(ratio * 70), comboBonus = (state.combo + 1) * 12;
    return { base: order.value, patienceBonus, comboBonus, total: order.value + patienceBonus + comboBonus }; }
  function serve(id) {
    const st = selectedStation();
    const index = state.queue.findIndex((order) => order.id === id);
    if (index < 0) { st.orderId = null; st.progress = 0; st.ready = false; return; }
    const order = state.queue.splice(index, 1)[0];
    const patienceRatio = Math.max(0, order.patience / order.patienceMax);
    state.combo += 1;
    state.served += 1;
    const gain = order.value + Math.round(patienceRatio * 70) + state.combo * 12;   // matches servePayout(order) taken before the combo bump
    state.score += gain;
    state.completed.push({ id: order.id, item: order.item, score: gain, combo: state.combo });
    if (state.completed.length > 8) state.completed.shift();
    st.orderId = null; st.progress = 0; st.ready = false;
    state.particles.push({ x: stations[state.selected].x, y: stations[state.selected].y - 40, text: "+" + gain, life: 850 });
    updateBest(); setFeedback("Served " + order.item + " +" + gain + ".", 800); play("serve");
  }
  function miss(order, reason) {
    const qi = state.queue.findIndex((o) => o.id === order.id);
    if (qi >= 0) state.queue.splice(qi, 1);
    for (const st of state.stationState) if (st.orderId === order.id) { st.orderId = null; st.progress = 0; st.ready = false; }
    state.combo = 0; state.misses += 1;
    setFeedback(reason + ": " + order.item + ".", 900); play("miss");
    if (state.misses >= MISS_LIMIT) finish(false, "Too many missed customers.");
  }
  function finish(won, text) {
    state.mode = won ? "run-complete" : "game-over";
    state.runComplete = won; state.gameOver = !won;
    updateBest(); setFeedback(text, 1400); play(won ? "done" : "over");
  }
  function update(dt) {
    if (state.mode === "ready" || state.gameOver || state.runComplete) { state.feedbackMs = Math.max(0, state.feedbackMs - dt); return; }
    state.timeMs += dt;
    state.feedbackMs = Math.max(0, state.feedbackMs - dt);
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) spawnOrder();
    for (const order of [...state.queue]) {
      order.patience -= dt;
      if (order.patience <= 0) miss(order, "Customer left");
    }
    state.stationState.forEach((st, i) => {
      if (!st.orderId || st.ready) return;
      st.progress += dt;
      if (st.progress >= stations[i].prep) { st.ready = true; setFeedback(stations[i].name + " order ready.", 560); play("done"); }
    });
    state.particles.forEach((p) => { p.life -= dt; p.y -= dt * .035; });
    state.particles = state.particles.filter((p) => p.life > 0);
    const allOrdersOut = state.spawnIndex >= 18 && state.queue.length === 0 && state.stationState.every((st) => !st.orderId);
    if (allOrdersOut || (state.timeMs >= DAY_MS && state.queue.length === 0 && state.stationState.every((st) => !st.orderId))) finish(true, "Day complete. Shift closed clean.");
  }
  const TICK_MS = 1000 / 60;
  let stepAccumulator = 0;
  function step(ms) {
    const d = Number(ms);
    stepAccumulator += d > 0 ? d : 0;
    let ticks = 0;
    while (stepAccumulator >= TICK_MS && ticks < 100000) { update(TICK_MS); stepAccumulator -= TICK_MS; ticks++; }
    render();
  }
  function beginShift() { if (state.mode !== "ready") return; state.mode = "playing"; stepAccumulator = 0; state.timeMs = 0; setFeedback("Shift open. Orders are arriving.", 900); ensureLoop(); }
  function selectStation(index) {
    state.selected = (index + stations.length) % stations.length;
    els.stationButtons.forEach((b, i) => { b.classList.toggle("primary", i === state.selected); b.setAttribute("aria-current", String(i === state.selected)); });
    setFeedback(stations[state.selected].name + " selected.", 360); play("select"); render();
  }
  function toggleSound() { state.sound = !state.sound; safe.set(SOUND_KEY, state.sound); play("toggle"); render(); }
  function toggleFullscreen() {
    const target = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
    if (target && target.catch) target.catch(() => {});
  }
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.stroke();}
  function drawBackground() {
    const g = ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,"#071018"); g.addColorStop(1,"#101827"); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = "rgba(94,234,212,.07)"; ctx.lineWidth = 1;
    for (let x=-100;x<W+160;x+=46){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+170,H);ctx.stroke();}
    ctx.fillStyle = "rgba(34,211,238,.08)"; ctx.beginPath(); ctx.arc(820,70,120,0,TAU); ctx.fill();
  }
  function drawOrder(order, i) {
    const x = 38, y = 72 + i * 46, w = 310, h = 36, ratio = Math.max(0, order.patience / order.patienceMax);
    ctx.fillStyle = "rgba(15,23,42,.88)"; ctx.strokeStyle = i === 0 ? "rgba(251,191,36,.82)" : "rgba(94,234,212,.24)"; ctx.lineWidth = 2; roundRect(x,y,w,h,8);
    ctx.fillStyle = stations[order.station].color; ctx.fillRect(x+8,y+27,Math.max(0,(w-16)*ratio),4);
    ctx.fillStyle = "#e6edf3"; ctx.font = "800 14px system-ui"; ctx.textAlign = "left"; ctx.fillText("#"+order.id+" "+order.item, x+12, y+22);
    ctx.fillStyle = stations[order.station].color; ctx.textAlign = "right"; ctx.fillText(order.stationName, x+w-12, y+22);
  }
  function drawStation(station, i) {
    const ss = state.stationState[i], selected = i === state.selected, x = station.x - 92, y = station.y - 66, w = 184, h = 132;
    ctx.save(); ctx.shadowColor = station.color; ctx.shadowBlur = selected ? 25 : 10;
    ctx.fillStyle = selected ? "rgba(30,41,59,.96)" : "rgba(15,23,42,.9)"; ctx.strokeStyle = selected ? "#fbbf24" : "rgba(94,234,212,.32)"; ctx.lineWidth = selected ? 4 : 2; roundRect(x,y,w,h,12);
    ctx.shadowBlur = 0; ctx.fillStyle = station.color; ctx.font = "900 20px system-ui"; ctx.textAlign = "center"; ctx.fillText((i+1)+" "+station.name, station.x, y+32);
    if (ss.orderId) {
      const order = state.queue.find((o) => o.id === ss.orderId), pct = ss.ready ? 1 : Math.min(1, ss.progress / station.prep);
      ctx.fillStyle = "#e6edf3"; ctx.font = "800 13px system-ui"; ctx.fillText(order ? order.item : "Order", station.x, y+62);
      ctx.fillStyle = "rgba(2,6,23,.8)"; ctx.fillRect(x+24,y+82,w-48,12); ctx.fillStyle = ss.ready ? "#fbbf24" : station.color; ctx.fillRect(x+24,y+82,(w-48)*pct,12);
      const pay = ss.ready ? servePayout(order) : null;
      ctx.fillStyle = ss.ready ? "#fbbf24" : "#aab8d2"; ctx.font = "900 12px system-ui";
      ctx.fillText(ss.ready ? "SERVE NOW +" + pay.total : "PREP", station.x, y+112);
      if (pay) { ctx.fillStyle = "#9fb3c8"; ctx.font = "800 10px system-ui"; ctx.fillText(pay.base + " + " + pay.patienceBonus + " fresh + " + pay.comboBonus + " combo", station.x, y+126); }
    } else {
      ctx.fillStyle = "#94a3b8"; ctx.font = "800 13px system-ui"; ctx.fillText("Idle", station.x, y+76);
    }
    ctx.restore();
  }
  function render() {
    els.time.textContent = Math.max(0, (DAY_MS - state.timeMs) / 1000).toFixed(1);
    els.score.textContent = state.score; els.best.textContent = state.best; els.combo.textContent = state.combo; els.queue.textContent = state.queue.length; els.miss.textContent = state.misses + "/" + MISS_LIMIT;
    els.comboPill.dataset.hot = String(state.combo >= 4); els.queuePill.dataset.warn = String(state.queue.length >= 7); els.missPill.dataset.warn = String(state.misses > 0);
    els.status.textContent = state.feedback; els.action.textContent = state.gameOver || state.runComplete ? "New Run" : selectedStation().ready ? "Serve" : selectedStation().orderId ? "Working" : "Prepare";
    els.sound.textContent = state.sound ? "Sound On" : "Sound Off"; els.sound.setAttribute("aria-pressed", String(state.sound));
    drawBackground();
    ctx.fillStyle = "#5eead4"; ctx.font = "900 13px system-ui"; ctx.textAlign = "left"; ctx.fillText("ORDER QUEUE", 40, 46);
    state.queue.slice(0, 8).forEach(drawOrder);
    stations.forEach(drawStation);
    if (!reducedMotion) for (const p of state.particles) { ctx.globalAlpha = Math.max(0, p.life / 850); ctx.fillStyle = "#fbbf24"; ctx.font = "900 22px system-ui"; ctx.textAlign = "center"; ctx.fillText(p.text, p.x, p.y); ctx.globalAlpha = 1; }
    if (state.mode === "ready") {
      ctx.fillStyle = "rgba(3,7,18,.72)"; ctx.fillRect(0,0,W,H); ctx.textAlign = "center";
      ctx.fillStyle = "#5eead4"; ctx.font = "900 34px system-ui"; ctx.fillText("SHIFT READY", W/2, H/2-16);
      ctx.fillStyle = "#e6edf3"; ctx.font = "800 16px system-ui";
      ctx.fillText("Press 1, 2, 3, Space or tap a station to open the doors.", W/2, H/2+18);
      ctx.fillStyle = "#9fb3c8"; ctx.font = "800 13px system-ui";
      ctx.fillText("Customers only start waiting once you do.", W/2, H/2+44);
    }
    if (state.gameOver || state.runComplete) {
      ctx.fillStyle = "rgba(3,7,18,.74)"; ctx.fillRect(0,0,W,H); ctx.textAlign = "center"; ctx.fillStyle = state.runComplete ? "#5eead4" : "#fb7185"; ctx.font = "900 38px system-ui"; ctx.fillText(state.runComplete ? "DAY COMPLETE" : "SHIFT MISSED", W/2, H/2-18);
      ctx.fillStyle = "#e6edf3"; ctx.font = "800 16px system-ui"; ctx.fillText("Score "+state.score+" · Served "+state.served+" · Best "+state.best, W/2, H/2+20);
    }
  }
  function snapshot() {
    return JSON.stringify({
      mode: state.mode, time: Number((state.timeMs / 1000).toFixed(3)), timeRemaining: Number(Math.max(0, (DAY_MS - state.timeMs) / 1000).toFixed(3)),
      score: state.score, best: state.best, orders: state.queue.map((o) => ({ id: o.id, item: o.item, station: o.stationName, patience: Math.max(0, Math.round(o.patience)), max: o.patienceMax })),
      stations: stations.map((s, i) => ({ id: s.id, name: s.name, selected: i === state.selected, orderId: state.stationState[i].orderId, progress: Math.round(state.stationState[i].progress), ready: state.stationState[i].ready })),
      queue: state.queue.map((o) => o.id), selectedStation: stations[state.selected].id, "selected station": stations[state.selected].id,
      patience: state.queue.map((o) => Math.max(0, Math.round(o.patience))), combo: state.combo, misses: state.misses, sound: state.sound,
      fullscreen: Boolean(document.fullscreenElement), feedbackActive: state.feedbackMs > 0 || state.particles.length > 0,
      gameOver: state.gameOver, "game-over": state.gameOver, runComplete: state.runComplete, "run-complete": state.runComplete,
      served: state.served, servePayout: (() => { const st = state.stationState[state.selected]; if (!st.ready || !st.orderId) return null; const o = state.queue.find((q) => q.id === st.orderId); const pay = servePayout(o); return pay && { orderId: st.orderId, ...pay }; })(), completed: state.completed, feedback: state.feedback, lastSound: state.lastSound,
      reducedMotion
    });
  }
  canvas.addEventListener("pointerdown", (e) => {
    markGesture();
    const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
    const hit = stations.findIndex((s) => Math.abs(x - s.x) < 115 && Math.abs(y - s.y) < 85);
    beginShift();
    if (hit >= 0) { selectStation(hit); act(); }
  });
  els.stationButtons.forEach((b) => b.addEventListener("click", () => { markGesture(); beginShift(); selectStation(Number(b.dataset.station)); }));
  els.action.addEventListener("click", () => { markGesture(); beginShift(); act(); render(); });
  els.restart.addEventListener("click", () => { markGesture(); restart(); });
  els.sound.addEventListener("click", () => { markGesture(); toggleSound(); });
  els.full.addEventListener("click", () => { markGesture(); toggleFullscreen(); });
  window.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
    const k = e.key, moves = { ArrowLeft:-1, ArrowUp:-1, a:-1, A:-1, w:-1, W:-1, ArrowRight:1, ArrowDown:1, d:1, D:1, s:1, S:1 };
    if (["1","2","3"," ","Enter","r","R","f","F","m","M"].includes(k) || moves[k]) e.preventDefault();
    markGesture();
    if (["1","2","3"," ","Enter"].includes(k) || moves[k]) beginShift();
    if (k === "1" || k === "2" || k === "3") selectStation(Number(k)-1);
    else if (moves[k]) selectStation(state.selected + moves[k]);
    else if (k === " " || k === "Enter") { act(); render(); }
    else if (k === "r" || k === "R") restart();
    else if (k === "f" || k === "F") toggleFullscreen();
    else if (k === "m" || k === "M") toggleSound();
  });
  window.render_game_to_text = snapshot;
  window.advanceTime = (ms = 0) => { beginShift(); step(Number(ms) || 0); return snapshot(); };
  // The board is still while the shift is closed or over, so the loop sleeps
  // there instead of stepping and repainting for ever. Real elapsed time was
  // already handled correctly by step()'s accumulator.
  let raf = 0;
  function loopActive() { return state.mode === "playing" || state.feedbackMs > 0 || state.particles.length > 0; }
  function ensureLoop() { if (raf || !loopActive() || document.hidden) return; lastTs = 0; raf = requestAnimationFrame(frame); }
  function frame(now) { raf = 0; step(Math.min(50, lastTs ? now - lastTs : TICK_MS)); lastTs = now;
    if (loopActive() && !document.hidden) raf = requestAnimationFrame(frame); else lastTs = 0; }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) ensureLoop(); });
  render(); ensureLoop();
})();
</script>
