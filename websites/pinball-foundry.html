<div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Pinball Foundry</span></div>
<main class="panel" aria-label="Pinball Foundry game">
  <div class="hud" aria-label="Pinball status">
    <div class="pill"><span class="label">Score</span><span class="value" id="scoreValue">0</span></div>
    <div class="pill"><span class="label">Best</span><span class="value" id="bestValue">0</span></div>
    <div class="pill"><span class="label">Balls</span><span class="value" id="ballsValue">3</span></div>
    <div class="pill"><span class="label">Multi</span><span class="value" id="multiValue">1x</span></div>
    <div class="pill"><span class="label">Plunger</span><span class="value" id="chargeValue">0%</span></div>
  </div>
  <div class="charge-cue" id="launchCue" data-state="ready" aria-label="Launch charge">
    <span class="cue-label" id="launchCueText">Ready to launch</span>
    <span class="charge-track" aria-hidden="true"><span class="charge-fill" id="chargeMeter"></span></span>
  </div>
  <div class="stage"><canvas id="game" width="720" height="980" tabindex="0" aria-label="Pinball Foundry canvas. Hold the Hold Launch button, Space, Enter, or Arrow Down to charge the plunger, release to launch. A and D or Arrow keys move flippers."></canvas></div>
  <div class="status" id="statusLine" aria-live="polite">Hold Launch, Space, or Enter to charge the plunger.</div>
  <div class="toolbar" aria-label="Pinball controls">
    <button class="btn primary launch-btn" type="button" id="launchBtn" aria-pressed="false">Hold Launch</button>
    <button class="btn" type="button" id="restartBtn">Reset</button>
    <button class="btn" type="button" id="soundBtn" aria-pressed="true">Sound On</button>
    <button class="btn" type="button" id="fullBtn">Fullscreen</button>
  </div>
  <div class="help">Hold Launch, Space, Enter, or ArrowDown charges the plunger; release to launch. A/Left and D/Right flip. R resets, F fullscreen.</div>
</main>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const BALL_R = 10;
  const keys = { best: "pinball-foundry.bestScore.v1", sound: "pinball-foundry.sound.v1" };
  const els = {
    score: document.getElementById("scoreValue"),
    best: document.getElementById("bestValue"),
    balls: document.getElementById("ballsValue"),
    multi: document.getElementById("multiValue"),
    charge: document.getElementById("chargeValue"),
    cue: document.getElementById("launchCue"),
    cueText: document.getElementById("launchCueText"),
    chargeMeter: document.getElementById("chargeMeter"),
    status: document.getElementById("statusLine"),
    launch: document.getElementById("launchBtn"),
    restart: document.getElementById("restartBtn"),
    sound: document.getElementById("soundBtn"),
    full: document.getElementById("fullBtn")
  };
  const storage = {
    get(key, fallback){ try { const value = localStorage.getItem(key); return value === null ? fallback : value; } catch (_) { return fallback; } },
    set(key, value){ try { localStorage.setItem(key, String(value)); } catch (_) {} }
  };
  const bumpers = [
    { x: 300, y: 260, r: 38, color: "#5eead4", hits: 0 },
    { x: 430, y: 320, r: 34, color: "#fbbf24", hits: 0 },
    { x: 235, y: 405, r: 32, color: "#7c9eff", hits: 0 }
  ];
  // Rollovers sit along the right-of-bumpers descent corridor — the table's
  // most ball-reached open lane (each cell here is crossed by ~30-40% of balls,
  // measured densely over 60 balls / ~16k frames). The previous row at y128-148
  // sat inside the arc deflector's (360,86 r170) 180px ejection radius, so the
  // ball could never reach the 26px trigger and they were unhittable. These
  // positions are outside that ejection zone, clear of the three bumpers and the
  // x>586 launch chute, and spread down the corridor so a clean descent can
  // sweep them while the all-rollovers bonus still accrues across several balls.
  const rollovers = [
    { x: 500, y: 330, r: 16, lit: false },
    { x: 484, y: 388, r: 16, lit: false },
    { x: 452, y: 446, r: 16, lit: false }
  ];
  const lanes = [
    { name: "left", x: 112, y: 550, w: 42, h: 150, lit: false },
    { name: "right", x: 526, y: 550, w: 42, h: 150, lit: false }
  ];
  const flippers = {
    left: { pivot: { x: 306, y: 838 }, len: 118, rest: Math.PI * .84, active: Math.PI * 1.08, angle: Math.PI * .84, down: false },
    right: { pivot: { x: 414, y: 838 }, len: 118, rest: Math.PI * .16, active: -Math.PI * .08, angle: Math.PI * .16, down: false }
  };
  const ball = { x: 634, y: 836, vx: 0, vy: 0, stuck: true, trail: [] };
  const state = {
    mode: "ready",
    score: 0,
    best: Number(storage.get(keys.best, "0")) || 0,
    balls: 3,
    multiplier: 1,
    plungerCharge: 0,
    charging: false,
    ballSave: 0,
    ballSaveSpent: false,
    feedback: "Hold Launch, Space, or Enter to charge the plunger.",
    feedbackTime: 1.8,
    bumperHits: 0,
    laneHits: 0,
    launchCount: 0,
    lastLaunchPower: 0,
    lastLaunchAt: 0,
    lastLaunchFeedback: "Ready to launch",
    launchSource: "",
    now: 0,
    sound: storage.get(keys.sound, "1") !== "0",
    gameOver: false
  };
  let audioCtx = null;
  let lastStamp = 0;
  const pressed = new Set();
  const pointers = new Map();
  // Honor prefers-reduced-motion: gate the decorative ball trail and bumper-hit
  // rings (cosmetic, no gameplay effect) for motion-sensitive players.
  let reducedMotion = false;
  try {
    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    reducedMotion = motionQuery.matches;
    motionQuery.addEventListener("change", (event) => { reducedMotion = event.matches; });
  } catch (_) {}

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
  function setFeedback(text, seconds = 1.4){
    state.feedback = text;
    state.feedbackTime = seconds;
  }
  function launchAvailable(){
    return ball.stuck && !state.gameOver;
  }
  function launchCueState(){
    if (state.gameOver) return { state: "locked", label: "Game over", fill: 0 };
    if (state.charging && launchAvailable()) {
      return { state: "charging", label: "Charging " + Math.round(state.plungerCharge * 100) + "%", fill: Math.max(8, state.plungerCharge * 100) };
    }
    if (launchAvailable()) return { state: "ready", label: "Ready to launch", fill: 8 };
    return { state: "launched", label: state.lastLaunchFeedback || "Ball launched", fill: 100 };
  }
  function updateHud(){
    const cue = launchCueState();
    const canLaunch = launchAvailable();
    els.score.textContent = String(state.score);
    els.best.textContent = String(state.best);
    els.balls.textContent = String(state.balls);
    els.multi.textContent = state.multiplier + "x";
    els.charge.textContent = Math.round(state.plungerCharge * 100) + "%";
    els.cue.dataset.state = cue.state;
    els.cueText.textContent = cue.label;
    els.chargeMeter.style.width = clamp(cue.fill, 0, 100) + "%";
    els.status.textContent = state.feedback;
    els.launch.disabled = !canLaunch && !state.charging;
    els.launch.textContent = state.charging ? "Release Launch" : canLaunch ? "Hold Launch" : state.gameOver ? "Reset to Launch" : "Ball Launched";
    els.launch.setAttribute("aria-pressed", state.charging ? "true" : "false");
    els.launch.setAttribute("aria-disabled", els.launch.disabled ? "true" : "false");
    els.sound.textContent = state.sound ? "Sound On" : "Sound Off";
    els.sound.setAttribute("aria-pressed", state.sound ? "true" : "false");
  }
  function ensureAudio(){
    if (!state.sound || audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
  }
  function beep(freq, dur = .06, gain = .035, type = "sine"){
    if (!state.sound) return;
    ensureAudio();
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") { try { audioCtx.resume(); } catch (_) {} }
    const start = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const amp = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    amp.gain.setValueAtTime(.0001, start);
    amp.gain.exponentialRampToValueAtTime(gain, start + .012);
    amp.gain.exponentialRampToValueAtTime(.0001, start + dur);
    osc.connect(amp).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + .02);
  }
  function award(points, text, tone){
    const gained = points * state.multiplier;
    state.score += gained;
    if (state.score > state.best) {
      state.best = state.score;
      storage.set(keys.best, state.best);
    }
    setFeedback(text + " +" + gained);
    if (tone) beep(tone, .07, .04, "square");
  }
  function beginLaunchCharge(source = "input"){
    if (!launchAvailable()) {
      setFeedback(state.gameOver ? "Reset to play again." : "Ball already launched.", 1);
      updateHud();
      return false;
    }
    state.charging = true;
    state.launchSource = source;
    setFeedback("Release to launch.", .8);
    updateHud();
    return true;
  }
  function releaseLaunchCharge(source = "input"){
    if (!state.charging) return false;
    state.launchSource = source;
    if (launchAvailable()) launch();
    else state.charging = false;
    updateHud();
    render();
    return true;
  }
  function resetBall(saveBall){
    ball.x = 634;
    ball.y = 836;
    ball.vx = 0;
    ball.vy = 0;
    ball.stuck = true;
    ball.trail.length = 0;
    state.mode = saveBall ? "ready" : state.balls > 0 ? "ready" : "gameover";
    state.charging = false;
    state.launchSource = "";
    state.plungerCharge = 0;
    state.ballSave = 0;
    setFeedback(state.mode === "ready" ? "Hold Launch, Space, or Enter to charge the plunger." : "Game over. Press R to restart.", 2);
  }
  function restart(){
    state.mode = "ready";
    state.score = 0;
    state.balls = 3;
    state.multiplier = 1;
    state.bumperHits = 0;
    state.laneHits = 0;
    state.launchCount = 0;
    state.lastLaunchPower = 0;
    state.lastLaunchAt = 0;
    state.lastLaunchFeedback = "Ready to launch";
    state.launchSource = "";
    state.gameOver = false;
    state.ballSaveSpent = false;
    for (const bumper of bumpers) bumper.hits = 0;
    for (const lane of lanes) lane.lit = false;
    for (const lane of rollovers) lane.lit = false;
    resetBall(true);
    updateHud();
    render();
  }
  function launch(){
    if (state.gameOver || !ball.stuck) return;
    const power = .38 + state.plungerCharge * .62;
    state.launchCount += 1;
    state.lastLaunchPower = power;
    state.lastLaunchAt = state.now;
    state.lastLaunchFeedback = "Launched " + Math.round(power * 100) + "%";
    ball.stuck = false;
    ball.vx = -42 - state.plungerCharge * 34;
    ball.vy = -720 * power;
    state.mode = "playing";
    // Arm ball save only for this ball's first launch — re-launching a saved
    // ball must not re-arm it, or the lose condition never fires.
    if (!state.ballSaveSpent) state.ballSave = 6;
    state.charging = false;
    state.plungerCharge = 0;
    setFeedback(state.lastLaunchFeedback + ". Ball save is lit.");
    beep(220 + power * 260, .12, .045, "sawtooth");
  }
  function drain(){
    if (state.ballSave > 0 && !state.ballSaveSpent) {
      resetBall(true);
      // One save per ball: consume it so the next drain of this ball counts.
      state.ballSaveSpent = true;
      setFeedback("Ball save returned the ball.", 1.7);
      beep(520, .11, .04, "triangle");
      return;
    }
    state.balls -= 1;
    if (state.balls <= 0) {
      state.balls = 0;
      state.gameOver = true;
      state.mode = "gameover";
      ball.stuck = true;
      setFeedback("Game over. Press R to restart.", 3);
      beep(160, .2, .045, "sawtooth");
    } else {
      state.ballSaveSpent = false;
      resetBall(false);
      beep(190, .12, .04, "triangle");
    }
  }
  function endPoint(flipper){
    return {
      x: flipper.pivot.x + Math.cos(flipper.angle) * flipper.len,
      y: flipper.pivot.y + Math.sin(flipper.angle) * flipper.len
    };
  }
  function segmentHit(flipper){
    const a = flipper.pivot;
    const b = endPoint(flipper);
    const abx = b.x - a.x;
    const aby = b.y - a.y;
    const t = clamp(((ball.x - a.x) * abx + (ball.y - a.y) * aby) / (abx * abx + aby * aby), 0, 1);
    const px = a.x + abx * t;
    const py = a.y + aby * t;
    const dx = ball.x - px;
    const dy = ball.y - py;
    const dist = Math.hypot(dx, dy) || 1;
    if (dist > BALL_R + 9) return;
    const nx = dx / dist;
    const ny = dy / dist;
    const dot = ball.vx * nx + ball.vy * ny;
    if (dot < 80) {
      ball.x = px + nx * (BALL_R + 9);
      ball.y = py + ny * (BALL_R + 9);
      ball.vx -= (1.85 * dot) * nx;
      ball.vy -= (1.85 * dot) * ny;
      if (flipper.down) {
        ball.vx += nx * 90 + (flipper === flippers.left ? 100 : -100);
        ball.vy -= 280;
      }
      award(70, "Flipper strike", 410);
    }
  }
  function circleBounce(cx, cy, r, impulse){
    const dx = ball.x - cx;
    const dy = ball.y - cy;
    const dist = Math.hypot(dx, dy) || 1;
    if (dist > BALL_R + r) return false;
    const nx = dx / dist;
    const ny = dy / dist;
    ball.x = cx + nx * (BALL_R + r);
    ball.y = cy + ny * (BALL_R + r);
    const dot = ball.vx * nx + ball.vy * ny;
    ball.vx -= 1.9 * dot * nx;
    ball.vy -= 1.9 * dot * ny;
    ball.vx += nx * impulse;
    ball.vy += ny * impulse;
    return true;
  }
  function checkScoring(){
    for (const bumper of bumpers) {
      if (circleBounce(bumper.x, bumper.y, bumper.r, 210)) {
        bumper.hits += 1;
        state.bumperHits += 1;
        state.multiplier = Math.min(5, 1 + Math.floor(state.bumperHits / 4));
        award(250, "Bumper forged", 620 + bumper.hits * 22);
      }
    }
    for (const rollover of rollovers) {
      const dx = ball.x - rollover.x;
      const dy = ball.y - rollover.y;
      if (Math.hypot(dx, dy) < BALL_R + rollover.r && !rollover.lit) {
        rollover.lit = true;
        award(180, "Rollover lit", 720);
        if (rollovers.every((item) => item.lit)) {
          for (const item of rollovers) item.lit = false;
          state.multiplier = Math.min(5, state.multiplier + 1);
          award(600, "All rollovers raised multiplier", 880);
        }
      }
    }
    for (const lane of lanes) {
      if (!lane.lit && ball.x > lane.x && ball.x < lane.x + lane.w && ball.y > lane.y && ball.y < lane.y + lane.h) {
        lane.lit = true;
        state.laneHits += 1;
        award(320, lane.name + " lane", 540);
      }
    }
  }
  function updateFlippers(dt){
    const leftTarget = flippers.left.down ? flippers.left.active : flippers.left.rest;
    const rightTarget = flippers.right.down ? flippers.right.active : flippers.right.rest;
    const speed = 15 * dt;
    flippers.left.angle += (leftTarget - flippers.left.angle) * clamp(speed, 0, 1);
    flippers.right.angle += (rightTarget - flippers.right.angle) * clamp(speed, 0, 1);
  }
  function update(dt){
    state.now += dt;
    state.feedbackTime = Math.max(0, state.feedbackTime - dt);
    if (state.feedbackTime <= 0 && state.mode === "playing") {
      state.feedback = state.ballSave > 0 ? "Ball save lit." : "Keep the foundry running.";
    }
    if (state.charging && ball.stuck && !state.gameOver) {
      state.plungerCharge = (state.plungerCharge + dt * .72) % 1;
    }
    updateFlippers(dt);
    if (!ball.stuck && state.mode === "playing") {
      state.ballSave = Math.max(0, state.ballSave - dt);
      ball.vy += 520 * dt;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.vx *= .999;
      ball.vy *= .999;
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 14) ball.trail.shift();
      if (ball.x < 78) { ball.x = 78; ball.vx = Math.abs(ball.vx) * .88; beep(310, .035, .025); }
      if (ball.x > 646) { ball.x = 646; ball.vx = -Math.abs(ball.vx) * .88; beep(310, .035, .025); }
      if (ball.y < 70) { ball.y = 70; ball.vy = Math.abs(ball.vy) * .9; beep(350, .04, .025); }
      if (ball.x > 586 && ball.y > 170 && ball.vy > 0) {
        ball.x = Math.max(ball.x, 614);
        ball.vx = clamp(ball.vx, -12, 45);
      }
      circleBounce(360, 86, 170, 50);
      checkScoring();
      segmentHit(flippers.left);
      segmentHit(flippers.right);
      if (ball.y > 940) drain();
      const speed = Math.hypot(ball.vx, ball.vy);
      if (speed > 980) {
        ball.vx *= 980 / speed;
        ball.vy *= 980 / speed;
      }
    }
    updateHud();
  }
  function drawTable(){
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b1625");
    g.addColorStop(1, "#07101a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(94,234,212,.28)";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(85, 900);
    ctx.lineTo(85, 160);
    ctx.quadraticCurveTo(90, 70, 250, 55);
    ctx.quadraticCurveTo(485, 22, 622, 132);
    ctx.lineTo(650, 900);
    ctx.stroke();
    ctx.strokeStyle = "rgba(251,191,36,.38)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(594, 174);
    ctx.lineTo(594, 896);
    ctx.stroke();
    ctx.fillStyle = "rgba(251,191,36,.08)";
    ctx.fillRect(596, 170, 56, 728);
    ctx.fillStyle = "rgba(94,234,212,.09)";
    ctx.beginPath();
    ctx.moveTo(110, 730);
    ctx.lineTo(250, 820);
    ctx.lineTo(210, 865);
    ctx.lineTo(112, 796);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(610, 730);
    ctx.lineTo(470, 820);
    ctx.lineTo(510, 865);
    ctx.lineTo(608, 796);
    ctx.closePath();
    ctx.fill();
  }
  function drawTargets(){
    for (const lane of lanes) {
      ctx.fillStyle = lane.lit ? "rgba(251,191,36,.42)" : "rgba(124,158,255,.13)";
      ctx.fillRect(lane.x, lane.y, lane.w, lane.h);
      ctx.strokeStyle = lane.lit ? "#fbbf24" : "rgba(124,158,255,.45)";
      ctx.lineWidth = 3;
      ctx.strokeRect(lane.x, lane.y, lane.w, lane.h);
    }
    for (const rollover of rollovers) {
      ctx.fillStyle = rollover.lit ? "#fbbf24" : "#1f3a5a";
      ctx.strokeStyle = rollover.lit ? "#fde68a" : "#5eead4";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(rollover.x, rollover.y, rollover.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    for (const bumper of bumpers) {
      // Decorative hit-ring halo (scales with hit count): gate under reduced motion.
      if (!reducedMotion) {
        const pulse = Math.min(.35, bumper.hits * .025);
        ctx.fillStyle = bumper.color;
        ctx.globalAlpha = .18 + pulse;
        ctx.beginPath();
        ctx.arc(bumper.x, bumper.y, bumper.r + 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = "#111827";
      ctx.beginPath();
      ctx.arc(bumper.x, bumper.y, bumper.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = bumper.color;
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.fillStyle = bumper.color;
      ctx.font = "900 18px ui-sans-serif,system-ui";
      ctx.textAlign = "center";
      ctx.fillText(String(bumper.hits), bumper.x, bumper.y + 6);
    }
  }
  function drawFlipper(flipper, color){
    const end = endPoint(flipper);
    ctx.strokeStyle = color;
    ctx.lineWidth = 18;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(flipper.pivot.x, flipper.pivot.y);
    ctx.lineTo(end.x, end.y);
    ctx.stroke();
    ctx.fillStyle = "#07101a";
    ctx.beginPath();
    ctx.arc(flipper.pivot.x, flipper.pivot.y, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#e6edf3";
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  function drawBall(){
    // Decorative trailing echo behind the ball: gate under reduced motion.
    // The solid ball body below always renders so gameplay stays visible.
    if (!reducedMotion) {
      ctx.globalAlpha = .28;
      ctx.fillStyle = "#f8fbff";
      for (let i = 0; i < ball.trail.length; i += 1) {
        const p = ball.trail[i];
        ctx.globalAlpha = .05 + i / ball.trail.length * .18;
        ctx.beginPath();
        ctx.arc(p.x, p.y, BALL_R * (i / ball.trail.length), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    const g = ctx.createRadialGradient(ball.x - 4, ball.y - 5, 2, ball.x, ball.y, BALL_R + 5);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(.48, "#dbeafe");
    g.addColorStop(1, "#64748b");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
  }
  function drawPlunger(){
    ctx.strokeStyle = "#fbbf24";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(622, 905);
    ctx.lineTo(622, 905 - state.plungerCharge * 85);
    ctx.stroke();
    ctx.fillStyle = "rgba(251,191,36,.78)";
    ctx.fillRect(607, 912, 30, 14);
  }
  function render(){
    drawTable();
    drawTargets();
    drawFlipper(flippers.left, "#5eead4");
    drawFlipper(flippers.right, "#fbbf24");
    drawPlunger();
    drawBall();
    ctx.textAlign = "left";
    ctx.font = "900 17px ui-sans-serif,system-ui";
    ctx.fillStyle = state.ballSave > 0 ? "#fbbf24" : "rgba(230,237,243,.72)";
    ctx.fillText(state.ballSave > 0 ? "BALL SAVE " + state.ballSave.toFixed(1) : "FOUNDRY LANES", 112, 92);
    if (state.mode === "gameover") {
      ctx.fillStyle = "rgba(3,7,18,.72)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#f8fbff";
      ctx.textAlign = "center";
      ctx.font = "950 36px ui-sans-serif,system-ui";
      ctx.fillText("GAME OVER", W / 2, H / 2 - 12);
      ctx.font = "800 18px ui-sans-serif,system-ui";
      ctx.fillStyle = "#5eead4";
      ctx.fillText("Press R or Restart", W / 2, H / 2 + 24);
    }
  }
  function frame(stamp){
    const dt = Math.min(.033, (stamp - lastStamp) / 1000 || 1 / 60);
    lastStamp = stamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  function setFlipper(key, value){
    if (key === "left") flippers.left.down = value;
    if (key === "right") flippers.right.down = value;
  }
  function keyName(event){
    if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") return "left";
    if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") return "right";
    if (event.key === " " || event.key === "Enter" || event.key === "ArrowDown") return "plunger";
    return "";
  }
  function isUiControl(event){
    const target = event.target;
    return target && target !== document && target !== canvas && target.closest?.("button,input,textarea,select,[contenteditable='true']");
  }
  document.addEventListener("keydown", (event) => {
    if (isUiControl(event)) return;
    if (event.repeat && event.key !== " " && event.key !== "ArrowDown") return;
    const name = keyName(event);
    if (name) event.preventDefault();
    if (event.repeat && name === "plunger") return;
    if (name === "left" || name === "right") setFlipper(name, true);
    if (name === "plunger") beginLaunchCharge("keyboard");
    if (event.key === "r" || event.key === "R") restart();
    if (event.key === "f" || event.key === "F") toggleFullscreen();
  });
  document.addEventListener("keyup", (event) => {
    if (isUiControl(event)) return;
    const name = keyName(event);
    if (name) event.preventDefault();
    if (name === "left" || name === "right") setFlipper(name, false);
    if (name === "plunger") releaseLaunchCharge("keyboard");
  });
  function canvasPoint(event){
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left) / rect.width * W, y: (event.clientY - rect.top) / rect.height * H };
  }
  canvas.addEventListener("pointerdown", (event) => {
    canvas.focus();
    canvas.setPointerCapture?.(event.pointerId);
    const p = canvasPoint(event);
    const zone = p.x > 560 && p.y > 610 ? "plunger" : p.x < W / 2 ? "left" : "right";
    pointers.set(event.pointerId, zone);
    if (zone === "plunger") beginLaunchCharge("canvas");
    else setFlipper(zone, true);
  });
  function finishCanvasPointer(event){
    const zone = pointers.get(event.pointerId);
    if (!zone) return;
    pointers.delete(event.pointerId);
    try { canvas.releasePointerCapture?.(event.pointerId); } catch (_) {}
    if (zone === "plunger") releaseLaunchCharge("canvas");
    else setFlipper(zone, false);
  }
  canvas.addEventListener("pointerup", finishCanvasPointer);
  canvas.addEventListener("pointercancel", finishCanvasPointer);
  canvas.addEventListener("pointerleave", finishCanvasPointer);
  function toggleFullscreen(){
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.();
  }
  let launchPointerId = null;
  function launchButtonRelease(event){
    if (launchPointerId !== event.pointerId) return;
    event.preventDefault();
    event.stopPropagation();
    launchPointerId = null;
    releaseLaunchCharge("button");
  }
  els.launch.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    event.stopPropagation();
    if (!beginLaunchCharge("button")) return;
    launchPointerId = event.pointerId;
    els.launch.setPointerCapture?.(event.pointerId);
  });
  els.launch.addEventListener("pointerup", launchButtonRelease);
  els.launch.addEventListener("pointercancel", launchButtonRelease);
  els.launch.addEventListener("pointerleave", (event) => {
    if (event.buttons) launchButtonRelease(event);
  });
  els.launch.addEventListener("keydown", (event) => {
    if (event.key !== " " && event.key !== "Enter") return;
    event.preventDefault();
    event.stopPropagation();
    if (!event.repeat) beginLaunchCharge("button-key");
  });
  els.launch.addEventListener("keyup", (event) => {
    if (event.key !== " " && event.key !== "Enter") return;
    event.preventDefault();
    event.stopPropagation();
    releaseLaunchCharge("button-key");
  });
  els.launch.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
  });
  els.restart.addEventListener("click", restart);
  els.full.addEventListener("click", toggleFullscreen);
  els.sound.addEventListener("click", () => {
    state.sound = !state.sound;
    storage.set(keys.sound, state.sound ? "1" : "0");
    if (state.sound) beep(640, .07, .04);
    updateHud();
  });
  function snapshot(){
    const launchRect = els.launch.getBoundingClientRect();
    const launchControlVisible = launchRect.width > 0 && launchRect.height > 0;
    const recentLaunch = state.lastLaunchAt > 0 && state.now - state.lastLaunchAt < 2.4;
    return {
      mode: state.mode,
      score: state.score,
      best: state.best,
      ballCount: state.balls,
      ball: { x: Math.round(ball.x), y: Math.round(ball.y), vx: Math.round(ball.vx), vy: Math.round(ball.vy), stuck: ball.stuck },
      flipperAngles: { left: Number(flippers.left.angle.toFixed(3)), right: Number(flippers.right.angle.toFixed(3)) },
      plungerCharge: Number(state.plungerCharge.toFixed(3)),
      plungerActive: state.charging,
      launchCount: state.launchCount,
      launchControl: {
        present: Boolean(els.launch),
        visible: launchControlVisible,
        beforeReset: Boolean(els.launch.compareDocumentPosition(els.restart) & Node.DOCUMENT_POSITION_FOLLOWING),
        label: els.launch.textContent,
        disabled: els.launch.disabled,
        cue: els.cueText.textContent,
        charge: Number(state.plungerCharge.toFixed(3)),
        active: state.charging,
        available: launchAvailable(),
        launches: state.launchCount,
        lastPower: Number(state.lastLaunchPower.toFixed(3)),
        recentLaunch,
        recentFeedback: recentLaunch ? state.lastLaunchFeedback : ""
      },
      multiplier: state.multiplier,
      litLanes: {
        rollovers: rollovers.map((item) => item.lit),
        side: lanes.filter((lane) => lane.lit).map((lane) => lane.name)
      },
      bumperHits: state.bumperHits,
      feedback: { text: state.feedback, active: state.feedbackTime > 0, time: Number(state.feedbackTime.toFixed(2)) },
      sound: state.sound,
      gameOver: state.gameOver,
      ballSave: Number(state.ballSave.toFixed(2)),
      reducedMotion,
      coordinateSystem: "canvas pixels, origin top-left, y increases downward"
    };
  }
  window.render_game_to_text = () => JSON.stringify(snapshot());
  window.advanceTime = (ms) => {
    const steps = Math.max(1, Math.round(ms / (1000 / 60)));
    for (let i = 0; i < steps; i += 1) update(1 / 60);
    render();
    return window.render_game_to_text();
  };

  updateHud();
  render();
  requestAnimationFrame(frame);
})();
</script>
<script>
(()=>{
  const fullShortcutLabel = "F";
  const editable = (el) => el && (el.closest?.('input,textarea,select,button,[contenteditable="true"]') || el.isContentEditable);
  const active = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  const root = () => document.querySelector('.stage') || document.documentElement;
  let created = false;
  let button = document.getElementById('fullBtn') || document.querySelector('[data-fullscreen-control]');
  if (!button) {
    button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn wa-game-fullscreen';
    button.dataset.fullscreenControl = 'true';
    const host = document.querySelector('.toolbar,.controls,.actions,.topbar,header,main') || document.body;
    host.appendChild(button);
    created = true;
  }
  button.setAttribute('aria-label', 'Toggle game fullscreen');
  function sync(){
    const isActive = active();
    button.textContent = isActive ? 'Exit Fullscreen' : 'Fullscreen';
    button.title = isActive ? 'Exit fullscreen' : 'Enter fullscreen (' + fullShortcutLabel + ')';
    button.setAttribute('aria-pressed', String(isActive));
  }
  function toggle(){
    if (active()) {
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    } else {
      const target = root();
      (target.requestFullscreen || target.webkitRequestFullscreen)?.call(target);
    }
    setTimeout(sync, 0);
  }
  button.addEventListener('keydown', (event) => {
    if (event.key === ' ' || event.key === 'Enter') event.stopPropagation();
  });
  if (created) button.addEventListener('click', toggle);
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  window.addEventListener('keydown', (event) => {
    if (event.defaultPrevented || editable(event.target)) return;
    const wants = event.key && event.key.toLowerCase() === 'f' && !event.shiftKey && !event.ctrlKey && !event.altKey && !event.metaKey;
    if (!wants) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    toggle();
  }, true);
  const previousRenderGameToText = window.render_game_to_text;
  if (typeof previousRenderGameToText === 'function') {
    window.render_game_to_text = function render_game_to_text_with_fullscreen(){
      const raw = previousRenderGameToText();
      try {
        const data = JSON.parse(String(raw));
        data.fullscreenActive = active();
        data.fullscreenShortcut = fullShortcutLabel;
        return JSON.stringify(data);
      } catch {
        return raw;
      }
    };
  }
  sync();
})();
</script>
