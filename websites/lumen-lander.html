<body>
<main class="app" id="app" aria-label="Lumen Lander lunar landing game">
  <header class="top">
    <div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Lumen Lander</span></div>
    <div class="help">Arrows or A/D rotate. Up, W, or Space burns fuel. Land on the lit pad below the velocity and tilt limits.</div>
  </header>
  <section class="hud" aria-label="Lander status">
    <div class="pill"><span class="label">Stage</span><span class="value" id="stageValue">1/4</span></div>
    <div class="pill"><span class="label">Fuel</span><span class="value" id="fuelValue">100</span></div>
    <div class="pill"><span class="label">Velocity</span><span class="value" id="velocityValue">0/0</span></div>
    <div class="pill"><span class="label">Tilt</span><span class="value" id="tiltValue">0 deg</span></div>
    <div class="pill"><span class="label">Score</span><span class="value" id="scoreValue">0</span></div>
    <div class="pill"><span class="label">Best</span><span class="value" id="bestValue">0</span></div>
  </section>
  <div class="stage">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Lumen Lander playfield. Rotate and thrust a lunar craft onto lit pads."></canvas>
  </div>
  <section class="feedback" id="feedbackStrip" aria-label="Visible flight feedback">
    <div class="cue" id="startCue" data-active="false"><span>Start</span><strong id="startCueValue">Ready</strong></div>
    <div class="cue" id="thrustCue" data-tone="thrust" data-active="false"><span>Thrust</span><strong id="thrustCueValue">Idle</strong></div>
    <div class="cue" id="landingCue" data-tone="landing" data-active="false"><span>Landing</span><strong id="landingCueValue">Armed</strong></div>
  </section>
  <div class="status" id="statusLine" aria-live="polite">Press Start. Safe pad limit: horizontal 34, vertical 48, tilt 12 deg.</div>
  <section class="bar" aria-label="Run controls">
    <button class="btn primary" id="startBtn" type="button">Start</button>
    <button class="btn" id="nextBtn" type="button">Next Stage</button>
    <button class="btn" id="restartBtn" type="button">Restart</button>
    <button class="btn" id="soundBtn" type="button" aria-pressed="true">Sound On</button>
    <button class="btn" id="fullBtn" type="button">Fullscreen</button>
  </section>
  <section class="touch" aria-label="Touch flight controls">
    <button id="leftPad" type="button" aria-label="Hold to rotate counterclockwise">Rotate Left</button>
    <button class="thrust" id="thrustPad" type="button" aria-label="Hold to thrust">Thrust</button>
    <button id="rightPad" type="button" aria-label="Hold to rotate clockwise">Rotate Right</button>
  </section>
</main>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const STEP = 1 / 60;
  const TAU = Math.PI * 2;
  const SAFE = { vx: 34, vy: 48, tilt: 12 };
  const BEST_KEY = "lumen-lander.best.v1";
  const SOUND_KEY = "lumen-lander.sound.v1";
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const round = (n) => Math.round(n * 10) / 10;
  const $ = (id) => document.getElementById(id);
  const els = {
    stage: $("stageValue"), fuel: $("fuelValue"), velocity: $("velocityValue"), tilt: $("tiltValue"),
    score: $("scoreValue"), best: $("bestValue"), status: $("statusLine"), start: $("startBtn"),
    next: $("nextBtn"), restart: $("restartBtn"), sound: $("soundBtn"), full: $("fullBtn"),
    left: $("leftPad"), thrust: $("thrustPad"), right: $("rightPad"), app: $("app"),
    startCue: $("startCue"), thrustCue: $("thrustCue"), landingCue: $("landingCue"),
    startCueValue: $("startCueValue"), thrustCueValue: $("thrustCueValue"), landingCueValue: $("landingCueValue")
  };

  const stages = [
    {
      name: "Glow Basin", gravity: 36, fuel: 118, start: [612, 92, 15, 8],
      pad: [680, 430, 144], peaks: [[0, 454], [136, 405], [282, 452], [430, 396], [576, 458], [680, 430], [824, 430], [960, 474]]
    },
    {
      name: "Crater Relay", gravity: 41, fuel: 132, start: [616, 86, -16, 6],
      pad: [408, 404, 118], peaks: [[0, 438], [108, 466], [226, 424], [344, 478], [408, 404], [526, 404], [612, 386], [762, 448], [960, 420]]
    },
    {
      name: "Needle Rim", gravity: 46, fuel: 136, start: [658, 76, 24, 10],
      pad: [746, 392, 102], peaks: [[0, 416], [120, 470], [252, 370], [402, 458], [542, 382], [650, 458], [746, 392], [848, 392], [960, 458]]
    },
    {
      name: "Last Lantern", gravity: 52, fuel: 188, start: [520, 66, -6, 14],
      pad: [440, 454, 86], peaks: [[0, 384], [112, 452], [220, 354], [340, 466], [440, 454], [526, 454], [632, 352], [748, 474], [862, 382], [960, 444]]
    }
  ];
  const stars = Array.from({ length: 64 }, (_, i) => ({
    x: (i * 173 + i * i * 11) % W,
    y: 22 + (i * 97 + i * i * 5) % 286,
    r: i % 9 === 0 ? 1.7 : 0.7 + (i % 3) * 0.35
  }));
  const input = { left: false, right: false, thrust: false };
  let audio = null;
  let stamp = 0;
  let manualClock = false;

  function storage() {
    if (window.workshopStorage) return window.workshopStorage;
    try { return window.localStorage; } catch (_) { return null; }
  }
  function readStore(key, fallback) {
    const source = storage();
    if (!source) return fallback;
    try {
      const value = source.getItem(key);
      return value === null ? fallback : value;
    } catch (_) {
      return fallback;
    }
  }
  function writeStore(key, value) {
    const source = storage();
    if (!source) return;
    try { source.setItem(key, String(value)); } catch (_) {}
  }
  function readSound() {
    return !["0", "false", "off"].includes(String(readStore(SOUND_KEY, "1")).toLowerCase());
  }
  const state = {
    mode: "ready",
    stage: 0,
    score: 0,
    best: Number(readStore(BEST_KEY, "0")) || 0,
    message: "Press Start. Safe pad limit: horizontal 34, vertical 48, tilt 12 deg.",
    sound: readSound(),
    lastSound: "none",
    time: 0,
    flashes: 0,
    thrusting: false,
    wasThrusting: false,
    lander: null,
    lastInput: "none",
    lastAction: "ready",
    touchActive: false,
    feedback: { startPulse: 0, thrustPulse: 0, landingPulse: 0, crashFlash: 0 },
    feedbackCounts: { starts: 0, thrusts: 0, landings: 0, crashes: 0 },
    lastFeedback: "ready"
  };

  function stageData() {
    return stages[state.stage];
  }
  function makeLander(stage) {
    return { x: stage.start[0], y: stage.start[1], vx: stage.start[2], vy: stage.start[3], angle: 0, spin: 0, fuel: stage.fuel, r: 18 };
  }
  function resetStage(mode) {
    state.mode = mode || "ready";
    state.lander = makeLander(stageData());
    state.thrusting = false;
    state.wasThrusting = false;
    state.flashes = 0;
    clearFeedback();
    clearInput();
  }
  function clearInput() {
    input.left = false;
    input.right = false;
    input.thrust = false;
    setHeld(els.left, false);
    setHeld(els.right, false);
    setHeld(els.thrust, false);
  }
  function wrapAngle(angle) {
    while (angle > Math.PI) angle -= TAU;
    while (angle < -Math.PI) angle += TAU;
    return angle;
  }
  function tiltDegrees() {
    return Math.abs(wrapAngle(state.lander.angle)) * 180 / Math.PI;
  }
  function padSurface(stage, x) {
    const points = stage.peaks;
    for (let i = 1; i < points.length; i++) {
      if (x <= points[i][0]) {
        const a = points[i - 1];
        const b = points[i];
        const t = clamp((x - a[0]) / Math.max(1, b[0] - a[0]), 0, 1);
        return a[1] + (b[1] - a[1]) * t;
      }
    }
    return points[points.length - 1][1];
  }
  function onPad(x) {
    const pad = stageData().pad;
    return x >= pad[0] && x <= pad[0] + pad[2];
  }
  function status(text) {
    state.message = text;
  }
  function clearFeedback() {
    state.feedback.startPulse = 0;
    state.feedback.thrustPulse = 0;
    state.feedback.landingPulse = 0;
    state.feedback.crashFlash = 0;
  }
  function feedbackKey(kind) {
    return { start: "startPulse", thrust: "thrustPulse", landing: "landingPulse", crash: "crashFlash" }[kind];
  }
  function pulseFeedback(kind, seconds, count = true) {
    const key = feedbackKey(kind);
    if (!key) return;
    state.feedback[key] = Math.max(state.feedback[key], seconds);
    state.lastFeedback = kind;
    if (count && kind === "start") state.feedbackCounts.starts += 1;
    if (count && kind === "thrust") state.feedbackCounts.thrusts += 1;
    if (count && kind === "landing") state.feedbackCounts.landings += 1;
    if (count && kind === "crash") state.feedbackCounts.crashes += 1;
  }
  function holdFeedback(kind, seconds) {
    pulseFeedback(kind, seconds, false);
  }
  function decayFeedback(dt) {
    for (const key of Object.keys(state.feedback)) {
      state.feedback[key] = Math.max(0, state.feedback[key] - dt);
    }
  }
  function visibleFeedback() {
    const f = state.feedback;
    const channels = [];
    if (f.startPulse > 0) channels.push("start");
    if (f.thrustPulse > 0) channels.push("thrust");
    if (f.landingPulse > 0) channels.push("landing");
    if (f.crashFlash > 0) channels.push("crash");
    return {
      active: channels.length > 0,
      channels,
      last: state.lastFeedback,
      startPulse: round(f.startPulse),
      thrustPulse: round(f.thrustPulse),
      landingPulse: round(f.landingPulse),
      crashFlash: round(f.crashFlash)
    };
  }
  function noteInput(source, action) {
    state.lastInput = source;
    state.lastAction = action;
    state.touchActive = source === "touch" || source === "pen";
    if (state.touchActive && navigator.vibrate) {
      try { navigator.vibrate(8); } catch (_) {}
    }
  }

  function ensureAudio() {
    if (!state.sound || audio) return audio;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audio = AudioContext ? new AudioContext() : null;
    } catch (_) {
      audio = null;
    }
    return audio;
  }
  function sound(kind) {
    state.lastSound = state.sound ? kind : "muted-" + kind;
    if (!state.sound) return;
    const ac = ensureAudio();
    if (!ac) return;
    const tone = {
      start: [300, .08, "triangle"], burn: [128, .04, "sawtooth"], land: [620, .18, "sine"],
      crash: [84, .24, "sawtooth"], next: [430, .1, "triangle"], complete: [760, .22, "sine"]
    }[kind] || [260, .07, "triangle"];
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const now = ac.currentTime;
    osc.type = tone[2];
    osc.frequency.setValueAtTime(tone[0], now);
    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(kind === "burn" ? .026 : .055, now + .012);
    gain.gain.exponentialRampToValueAtTime(.0001, now + tone[1]);
    osc.connect(gain).connect(ac.destination);
    osc.start(now);
    osc.stop(now + tone[1] + .02);
  }
  function saveBest() {
    if (state.score > state.best) {
      state.best = state.score;
      writeStore(BEST_KEY, state.best);
    }
  }
  function beginRun() {
    if (state.mode === "ready" && state.stage === 0 && state.score === 0) {
      state.mode = "flying";
      status("Stage 1: settle on the lit pad.");
      pulseFeedback("start", 1.05);
      sound("start");
    } else if (state.mode === "ready") {
      state.mode = "flying";
      status(stageData().name + ": engines live.");
      pulseFeedback("start", .9);
      sound("next");
    }
    canvas.focus();
    draw();
  }
  function restartRun() {
    state.stage = 0;
    state.score = 0;
    resetStage("ready");
    status("Run reset. Press Start for Glow Basin.");
    sound("start");
    draw();
  }
  function nextStage() {
    if (state.mode !== "stageClear") return;
    state.stage += 1;
    resetStage("ready");
    status("Stage " + (state.stage + 1) + ": " + stageData().name + ". Press Start.");
    sound("next");
    draw();
  }
  function stageLanding() {
    const craft = state.lander;
    const fuelBonus = Math.round(craft.fuel * 2);
    const calmBonus = Math.max(0, 160 - Math.round(Math.abs(craft.vx) * 2 + Math.abs(craft.vy)));
    const award = 240 + fuelBonus + calmBonus + state.stage * 80;
    state.score += award;
    saveBest();
    craft.vx = 0;
    craft.vy = 0;
    craft.spin = 0;
    craft.angle *= .25;
    state.thrusting = false;
    state.wasThrusting = false;
    pulseFeedback("landing", 1.35);
    sound(state.stage === stages.length - 1 ? "complete" : "land");
    if (state.stage === stages.length - 1) {
      state.mode = "complete";
      status("All lantern pads lit. Final score " + state.score + ". Restart to fly again.");
    } else {
      state.mode = "stageClear";
      status("Soft landing for " + award + ". Next Stage is ready.");
    }
  }
  function crash(reason) {
    if (state.mode !== "flying") return;
    state.mode = "crashed";
    state.thrusting = false;
    state.wasThrusting = false;
    state.flashes = .7;
    pulseFeedback("crash", 1.05);
    sound("crash");
    status(reason + " Press Restart.");
  }
  function contact() {
    const craft = state.lander;
    const ground = padSurface(stageData(), craft.x);
    if (craft.y + craft.r < ground) return;
    craft.y = ground - craft.r;
    const tilted = tiltDegrees();
    if (onPad(craft.x) && Math.abs(craft.vx) <= SAFE.vx && craft.vy <= SAFE.vy && tilted <= SAFE.tilt) {
      stageLanding();
    } else if (!onPad(craft.x)) {
      crash("Hull struck the crater rim.");
    } else {
      crash("Pad rejected speed or tilt.");
    }
  }
  function step(dt) {
    state.time += dt;
    decayFeedback(dt);
    state.flashes = Math.max(0, state.flashes - dt);
    const craft = state.lander;
    if (state.mode !== "flying") {
      state.thrusting = false;
      state.wasThrusting = false;
      return;
    }
    const steer = Number(input.right) - Number(input.left);
    craft.spin += steer * 5.8 * dt;
    craft.spin *= .985;
    craft.spin = clamp(craft.spin, -2.7, 2.7);
    craft.angle = wrapAngle(craft.angle + craft.spin * dt);
    craft.vy += stageData().gravity * dt;
    state.thrusting = input.thrust && craft.fuel > 0;
    if (state.thrusting) {
      if (!state.wasThrusting) pulseFeedback("thrust", .72);
      else holdFeedback("thrust", .72);
      craft.vx += Math.sin(craft.angle) * 94 * dt;
      craft.vy -= Math.cos(craft.angle) * 94 * dt;
      craft.fuel = Math.max(0, craft.fuel - 12 * dt);
      if (Math.floor(state.time * 11) % 5 === 0) sound("burn");
    }
    state.wasThrusting = state.thrusting;
    craft.x += craft.vx * dt;
    craft.y += craft.vy * dt;
    if (craft.x - craft.r < 0 || craft.x + craft.r > W || craft.y - craft.r < -42) {
      crash("Lander left the marked descent corridor.");
      return;
    }
    contact();
  }

  function setHeld(button, held) {
    button.dataset.held = held ? "true" : "false";
  }
  function bindHold(button, name) {
    const hold = (event) => {
      event.preventDefault();
      noteInput(event.pointerType || "pointer", name + "-hold");
      input[name] = true;
      setHeld(button, true);
      canvas.focus();
      if (state.mode === "ready") beginRun();
      try { button.setPointerCapture?.(event.pointerId); } catch (_) {}
    };
    const release = (event) => {
      event.preventDefault();
      noteInput(event.pointerType || "pointer", name + "-release");
      input[name] = false;
      setHeld(button, false);
    };
    button.addEventListener("pointerdown", hold);
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
  }
  bindHold(els.left, "left");
  bindHold(els.thrust, "thrust");
  bindHold(els.right, "right");

  function toggleSound() {
    state.sound = !state.sound;
    writeStore(SOUND_KEY, state.sound ? "1" : "0");
    syncHud();
    if (state.sound) sound("next");
  }
  function fullActive() {
    return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function syncFull() {
    els.full.textContent = fullActive() ? "Exit Fullscreen" : "Fullscreen";
  }
  function toggleFull() {
    try {
      if (fullActive()) {
        (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
      } else {
        (els.app.requestFullscreen || els.app.webkitRequestFullscreen)?.call(els.app);
      }
    } catch (_) {}
  }

  els.start.addEventListener("click", () => { noteInput("button", "start"); beginRun(); });
  els.next.addEventListener("click", () => { noteInput("button", "next"); nextStage(); });
  els.restart.addEventListener("click", () => { noteInput("button", "restart"); restartRun(); });
  els.sound.addEventListener("click", () => { noteInput("button", "sound"); toggleSound(); });
  els.full.addEventListener("click", () => { noteInput("button", "fullscreen"); toggleFull(); });
  document.addEventListener("fullscreenchange", syncFull);
  document.addEventListener("webkitfullscreenchange", syncFull);
  window.addEventListener("blur", clearInput);
  window.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();
    if (["arrowleft", "arrowright", "arrowup", "a", "d", "w", " ", "enter"].includes(key)) event.preventDefault();
    if (["arrowleft", "arrowright", "arrowup", "a", "d", "w", " ", "enter", "r", "m", "f"].includes(key)) noteInput("keyboard", key === " " ? "space" : key);
    if (key === "arrowleft" || key === "a") input.left = true;
    if (key === "arrowright" || key === "d") input.right = true;
    if (key === "arrowup" || key === "w" || key === " ") input.thrust = true;
    if (key === "enter" && state.mode === "stageClear") nextStage();
    else if ((key === "enter" || key === " ") && state.mode === "ready") beginRun();
    if (key === "r") restartRun();
    if (key === "m") toggleSound();
    if (key === "f") toggleFull();
  });
  window.addEventListener("keyup", (event) => {
    const key = event.key.toLowerCase();
    if (key === "arrowleft" || key === "a") input.left = false;
    if (key === "arrowright" || key === "d") input.right = false;
    if (key === "arrowup" || key === "w" || key === " ") input.thrust = false;
  });

  function syncHud() {
    const craft = state.lander;
    els.stage.textContent = (state.stage + 1) + "/" + stages.length;
    els.fuel.textContent = Math.ceil(craft.fuel);
    els.velocity.textContent = Math.round(Math.abs(craft.vx)) + "/" + Math.round(Math.abs(craft.vy));
    els.tilt.textContent = Math.round(tiltDegrees()) + " deg";
    els.score.textContent = state.score;
    els.best.textContent = state.best;
    els.status.textContent = state.message;
    els.sound.textContent = state.sound ? "Sound On" : "Sound Off";
    els.sound.setAttribute("aria-pressed", String(state.sound));
    els.fuel.className = "value" + (craft.fuel < 22 ? " warn" : "");
    els.velocity.className = "value" + ((Math.abs(craft.vx) > SAFE.vx || Math.abs(craft.vy) > SAFE.vy) ? " bad" : "");
    els.tilt.className = "value" + (tiltDegrees() > SAFE.tilt ? " bad" : "");
    els.start.disabled = state.mode === "flying" || state.mode === "stageClear" || state.mode === "complete";
    els.next.disabled = state.mode !== "stageClear";
    syncFeedback();
  }
  function syncFeedback() {
    const startState = state.mode === "stageClear" ? "Stage Clear" : (state.mode === "complete" ? "Complete" : (state.mode === "flying" ? "In Flight" : "Ready"));
    els.startCue.dataset.active = String(state.feedback.startPulse > 0);
    els.startCueValue.textContent = state.feedback.startPulse > 0 ? "Engines" : startState;
    els.thrustCue.dataset.active = String(state.feedback.thrustPulse > 0);
    els.thrustCueValue.textContent = state.feedback.thrustPulse > 0 ? "Burning" : (state.lander.fuel <= 0 ? "Dry" : "Idle");
    const landingActive = state.feedback.landingPulse > 0 || state.feedback.crashFlash > 0;
    els.landingCue.dataset.active = String(landingActive);
    els.landingCue.dataset.tone = state.feedback.crashFlash > 0 ? "bad" : "landing";
    els.landingCueValue.textContent = state.feedback.landingPulse > 0 ? "Pad Lit" : (state.feedback.crashFlash > 0 ? "Rejected" : (onPad(state.lander.x) ? "Over Pad" : "Armed"));
  }
  function pathTerrain(stage) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    stage.peaks.forEach((point) => ctx.lineTo(point[0], point[1]));
    ctx.lineTo(W, H);
    ctx.closePath();
  }
  function drawTerrain(stage) {
    pathTerrain(stage);
    const dirt = ctx.createLinearGradient(0, 330, 0, H);
    dirt.addColorStop(0, "#19354e");
    dirt.addColorStop(.55, "#0b1628");
    dirt.addColorStop(1, "#060912");
    ctx.fillStyle = dirt;
    ctx.fill();
    pathTerrain(stage);
    ctx.strokeStyle = "rgba(125,249,255,.46)";
    ctx.lineWidth = 3;
    ctx.stroke();
    const pad = stage.pad;
    ctx.fillStyle = "#06131f";
    ctx.fillRect(pad[0], pad[1] - 7, pad[2], 14);
    ctx.strokeStyle = "#facc15";
    ctx.shadowBlur = 18;
    ctx.shadowColor = "#facc15";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(pad[0], pad[1] - 1);
    ctx.lineTo(pad[0] + pad[2], pad[1] - 1);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fef3c7";
    for (let x = pad[0] + 12; x < pad[0] + pad[2]; x += 24) ctx.fillRect(x, pad[1] - 5, 8, 4);
  }
  function drawLander() {
    const craft = state.lander;
    ctx.save();
    ctx.translate(craft.x, craft.y);
    ctx.rotate(craft.angle);
    if (state.thrusting && state.mode === "flying") {
      ctx.fillStyle = state.time % .1 < .05 ? "#facc15" : "#fb7185";
      ctx.beginPath();
      ctx.moveTo(-7, 15);
      ctx.lineTo(0, 29 + (state.time * 37 % 8));
      ctx.lineTo(7, 15);
      ctx.closePath();
      ctx.fill();
    }
    ctx.strokeStyle = "#d8fbff";
    ctx.fillStyle = "#123149";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -24);
    ctx.lineTo(15, 11);
    ctx.lineTo(8, 17);
    ctx.lineTo(-8, 17);
    ctx.lineTo(-15, 11);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#67e8f9";
    ctx.beginPath();
    ctx.arc(0, -5, 7, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, 13);
    ctx.lineTo(-20, 23);
    ctx.lineTo(-9, 23);
    ctx.moveTo(10, 13);
    ctx.lineTo(20, 23);
    ctx.lineTo(9, 23);
    ctx.stroke();
    ctx.restore();
  }
  function overlay(title, copy) {
    ctx.fillStyle = "rgba(3,7,18,.64)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#f8fbff";
    ctx.textAlign = "center";
    ctx.font = "950 44px system-ui,Segoe UI,sans-serif";
    ctx.fillText(title, W / 2, H / 2 - 32);
    ctx.fillStyle = "#9fdceb";
    ctx.font = "850 19px system-ui,Segoe UI,sans-serif";
    ctx.fillText(copy, W / 2, H / 2 + 8);
  }
  function drawFeedbackBadge(text, color, index, pulse) {
    const alpha = clamp(.3 + pulse * .7, .3, .95);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = "950 16px system-ui,Segoe UI,sans-serif";
    const width = Math.min(260, ctx.measureText(text).width + 30);
    const x = W - width - 22;
    const y = 24 + index * 38;
    ctx.fillStyle = "rgba(3,7,18,.72)";
    ctx.fillRect(x, y, width, 28);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, width, 28);
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.fillText(text, x + width / 2, y + 20);
    ctx.restore();
  }
  function drawFeedback(stage) {
    const craft = state.lander;
    const badges = [];
    if (state.feedback.startPulse > 0) badges.push(["ENGINES LIVE", "#67e8f9", state.feedback.startPulse]);
    if (state.feedback.thrustPulse > 0) badges.push(["THRUST BURN", "#facc15", state.feedback.thrustPulse]);
    if (state.feedback.landingPulse > 0) badges.push(["PAD LIT", "#7df9ff", state.feedback.landingPulse]);
    if (state.feedback.crashFlash > 0) badges.push(["LANDING REJECTED", "#fb7185", state.feedback.crashFlash]);
    if (state.feedback.thrustPulse > 0) {
      const pulse = clamp(state.feedback.thrustPulse / .72, 0, 1);
      ctx.save();
      ctx.globalAlpha = .2 + pulse * .38;
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(craft.x, craft.y + 26, 18 + (1 - pulse) * 20, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
    if (state.feedback.landingPulse > 0 || state.feedback.crashFlash > 0) {
      const pad = stage.pad;
      const pulse = clamp(Math.max(state.feedback.landingPulse, state.feedback.crashFlash) / 1.35, 0, 1);
      ctx.save();
      ctx.globalAlpha = .24 + pulse * .42;
      ctx.strokeStyle = state.feedback.crashFlash > 0 ? "#fb7185" : "#7df9ff";
      ctx.lineWidth = 6;
      ctx.strokeRect(pad[0] - 10, pad[1] - 19, pad[2] + 20, 32);
      ctx.restore();
    }
    badges.forEach((badge, index) => drawFeedbackBadge(badge[0], badge[1], index, badge[2]));
  }
  function draw() {
    const stage = stageData();
    ctx.clearRect(0, 0, W, H);
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#071827");
    sky.addColorStop(.7, "#080b19");
    sky.addColorStop(1, "#050711");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#dff9ff";
    stars.forEach((star, i) => {
      ctx.globalAlpha = .32 + ((i % 5) * .08);
      ctx.fillRect(star.x, star.y, star.r, star.r);
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(34,211,238,.08)";
    ctx.beginPath();
    ctx.arc(stage.pad[0] + stage.pad[2] / 2, stage.pad[1], 160, Math.PI, TAU);
    ctx.fill();
    drawTerrain(stage);
    drawLander();
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(237,247,255,.82)";
    ctx.font = "900 15px system-ui,Segoe UI,sans-serif";
    ctx.fillText(stage.name, 22, 32);
    ctx.fillStyle = "rgba(125,211,252,.82)";
    ctx.font = "800 12px system-ui,Segoe UI,sans-serif";
    ctx.fillText("SAFE: HX <= 34  VY <= 48  TILT <= 12", 22, 52);
    if (state.mode === "ready") overlay("LUMEN LANDER", "Start, then feather thrust onto the lit pad.");
    if (state.mode === "stageClear") overlay("PAD LIT", "Press Next Stage or Enter.");
    if (state.mode === "complete") overlay("RUN COMPLETE", "Final score " + state.score + ". Restart for another run.");
    if (state.mode === "crashed") {
      if (state.flashes > 0) {
        ctx.fillStyle = "rgba(251,113,133," + (.12 + state.flashes * .22) + ")";
        ctx.fillRect(0, 0, W, H);
      }
      overlay("CRASH", "Restart and meet every safe landing rule.");
    }
    drawFeedback(stage);
    syncHud();
  }

  function snapshot() {
    const craft = state.lander;
    const pad = stageData().pad;
    const feedback = visibleFeedback();
    return {
      coordinates: "origin top-left; x right; y down; velocities px/s",
      mode: state.mode,
      stage: { index: state.stage + 1, total: stages.length, name: stageData().name },
      lander: { x: round(craft.x), y: round(craft.y), vx: round(craft.vx), vy: round(craft.vy), angleDeg: round(wrapAngle(craft.angle) * 180 / Math.PI), tiltDeg: round(tiltDegrees()), fuel: round(craft.fuel), thrusting: state.thrusting },
      pad: { x: pad[0], y: pad[1], width: pad[2] },
      safe: SAFE,
      score: state.score,
      best: state.best,
      sound: state.sound,
      lastSound: state.lastSound,
      input: { left: input.left, right: input.right, thrust: input.thrust, last: state.lastInput, action: state.lastAction, touchActive: state.touchActive },
      feedbackActive: feedback.active,
      visibleFeedback: feedback,
      feedback: { startPulse: feedback.startPulse, thrustPulse: feedback.thrustPulse, landingPulse: feedback.landingPulse, crashFlash: feedback.crashFlash },
      feedbackCounts: state.feedbackCounts,
      fullscreen: fullActive(),
      message: state.message
    };
  }
  window.render_game_to_text = () => JSON.stringify(snapshot());
  window.advanceTime = (ms) => {
    manualClock = true;
    const steps = Math.max(1, Math.min(1200, Math.round(Math.max(0, Number(ms) || 0) / (STEP * 1000))));
    for (let i = 0; i < steps; i++) step(STEP);
    draw();
    return window.render_game_to_text();
  };

  function frame(time) {
    if (!stamp) stamp = time;
    const elapsed = manualClock ? 0 : clamp(time - stamp, 0, 80);
    stamp = time;
    if (!manualClock) {
      const steps = Math.max(1, Math.round(elapsed / (STEP * 1000)));
      for (let i = 0; i < steps; i++) step(STEP);
    }
    draw();
    requestAnimationFrame(frame);
  }
  resetStage("ready");
  syncFull();
  draw();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
