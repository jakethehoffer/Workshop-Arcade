<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Idle Tycoon — Neon Edition (Cycles + Skills + Music)</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#070b12;
    --panel:#0c1320;
    --ink:#e6edf3;
    --muted:#93a4b8;
    --accent:#5eead4;
    --accent-2:#7c9eff;
    --warn:#fbbf24;
    --danger:#fb7185;
    --ok:#34d399;
    --card:#0e1726;
    --stroke:#233249;
    --ring:#1ae3c9;
  }
  html,body{margin:0;height:100%;background:
    radial-gradient(1200px 900px at 15% -10%, #0b1222 0%, #070b12 60%),
    radial-gradient(900px 700px at 110% 0%, #0a1322 0%, transparent 60%),
    var(--bg);
    color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji");
    overflow:auto}
  body::after{
    content:""; position:fixed; inset:-40% -20% auto -20%; height:120%;
    pointer-events:none; background:
    radial-gradient(800px 800px at 70% 30%, rgba(94,234,212,.08), transparent 60%) ,
    radial-gradient(600px 600px at 20% 10%, rgba(124,158,255,.06), transparent 60%);
    filter: blur(20px); opacity:.9; z-index:-1;
  }

  .app{min-height:100svh; display:flex; flex-direction:column;}

  /* Top bar */
  .topbar{position:sticky; top:0; z-index:20; padding:10px 12px;
    background:linear-gradient(180deg, rgba(7,11,18,.92), rgba(7,11,18,.6) 70%, transparent);
    display:flex; gap:12px; align-items:center; justify-content:space-between; backdrop-filter: blur(8px)}
  .pill{background:linear-gradient(180deg,#0f1a2b,#0a1220);
        border:1px solid var(--stroke); padding:10px 12px; border-radius:14px;
        display:flex; gap:14px; align-items:center; box-shadow:0 8px 28px rgba(0,0,0,.4)}
  .row{display:flex; gap:8px; align-items:center}
  .tag{font-size:12px; letter-spacing:.3px; color:var(--muted)}
  .value{font-weight:900; letter-spacing:.2px}
  .btn{user-select:none; background:#0e1626; border:1px solid var(--stroke); padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:800}
  .btn:hover{filter:brightness(1.09)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent}
  .btn.small{padding:6px 10px; font-size:13px; border-radius:8px}
  .btn.bulk.active{outline:2px solid var(--accent)}
  .btn.warn{background:rgba(251,191,36,.16); border-color:#644d14; color:#f7d379}
  .btn.ok{background:rgba(52,211,153,.18); border-color:#114b3b; color:#9af2cf}
  .toggle{display:inline-flex; gap:8px; align-items:center; padding:6px 10px; border-radius:999px; border:1px solid var(--stroke); background:#0b1220}

  /* Bars */
  .bar{--p:0%; height:8px; background:#0b1526; border:1px solid #172236; border-radius:999px; overflow:hidden}
  .bar>i{display:block; height:100%; width:var(--p); background:
      linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow:0 0 18px rgba(94,234,212,.35) inset}

  /* Layout */
  .main{flex:1; display:grid; grid-template-columns: 1fr 500px 1fr; gap:16px; padding:12px; max-width:1500px; margin:0 auto; width:100%;}
  @media (max-width: 1200px){ .main{grid-template-columns: 1fr; } .center{order:-1} }
  .panel{background:var(--panel); border:1px solid var(--stroke); border-radius:16px; display:flex; flex-direction:column; min-height:380px; box-shadow:0 14px 50px rgba(0,0,0,.35)}
  .panel h3{margin:0; padding:12px; color:var(--muted); font-size:12px;
    border-bottom:1px solid var(--stroke); display:flex; align-items:center; gap:10px}
  .panel h3 .chip{padding:3px 8px; border-radius:999px; background:#0d192c; border:1px solid #1e2a43; font-weight:800; font-size:11px; color:#b8c7de}
  .panel .body{padding:10px; overflow:auto; max-height:calc(100svh - 240px);}

  /* Producers list */
  .producer{display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:center; padding:10px; border:1px solid transparent; border-radius:12px; position:relative}
  .producer:hover{background:rgba(255,255,255,.03); border-color:rgba(255,255,255,.07)}
  .producer .name{font-weight:900; font-size:14px; letter-spacing:.2px}
  .producer .meta{color:var(--muted); font-size:12px; margin-top:2px}
  .producer .pbar{margin-top:8px}
  .right{display:flex; gap:8px; align-items:center; white-space:nowrap}
  .buy{min-width:170px; justify-content:center; display:inline-flex; align-items:center; gap:6px; height:36px; border-radius:9px}
  .buy.can{background:var(--ok); color:#08131f; border:1px solid #0a3c2d}
  .buy.cant{background:#1a2439; color:#a7b4c8; border:1px solid #233249}

  /* Tabs */
  .tabs{display:flex; gap:8px; padding:10px; border-bottom:1px solid var(--stroke)}
  .tab{padding:6px 10px; border-radius:8px; font-weight:800; cursor:pointer; border:1px solid var(--stroke); background:#0e1727}
  .tab.active{outline:2px solid var(--accent)}
  .upgrade,.boost,.achievement,.skill{display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:center; padding:10px; border:1px solid transparent; border-radius:12px}
  .upgrade:hover,.boost:hover,.skill:hover{background:rgba(255,255,255,.03); border-color:rgba(255,255,255,.07)}
  .upgrade .title,.boost .title,.skill .title{font-weight:900; font-size:14px}
  .upgrade .desc,.boost .desc,.skill .desc{color:var(--muted); font-size:12px; margin-top:2px}
  .badge{font-size:12px; padding:3px 7px; border:1px solid #29415f; border-radius:999px; background:#0e1a2e; color:#b8c7de; font-weight:800}
  .achv-pop{animation: pop .35s ease both}
  @keyframes pop{0%{transform:scale(.85); opacity:0}100%{transform:scale(1); opacity:1}}

  /* Center clicker */
  .center{display:flex; align-items:center; justify-content:center; position:relative}
  .clicker-wrap{display:flex; flex-direction:column; align-items:center; gap:12px}
  .clicker{width:280px; height:280px; border-radius:50%; border:1px solid var(--stroke);
           background: radial-gradient(130px 130px at 50% 36%, #182647, #0f192e 70%);
           display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
           box-shadow:
              0 0 0 28px rgba(94,234,212,.07),
              0 16px 60px rgba(0,0,0,.45),
              0 0 30px rgba(26,227,201,.08) inset;
           position:relative; overflow:hidden}
  .clicker .ring{position:absolute; inset:10px; border-radius:50%; border:2px dashed rgba(124,158,255,.35); animation:spin 14s linear infinite; pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .clicker .label{font-size:28px; font-weight:900; letter-spacing:.5px}
  .clicker .sublabel{font-size:12px; color:var(--muted)}
  .clicker:active{transform:scale(.985)}
  .meter{width:280px; display:flex; flex-direction:column; gap:8px}
  .hint{position:absolute; bottom:10px; left:50%; transform:translateX(-50%); color:var(--muted); font-size:12px; text-align:center}

  /* Floating text / particles */
  .float{position:fixed; pointer-events:none; font-weight:900; text-shadow:0 2px 8px rgba(0,0,0,.5); will-change: transform, opacity}
  .spark{position:fixed; width:6px; height:6px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #fff, #5eead4 70%, transparent 100%); pointer-events:none; will-change: transform, opacity; mix-blend-mode:screen}

  /* Toast / Modal */
  .toast{position:fixed; top:56px; left:50%; transform:translateX(-50%) translateY(-8px);
         background:#0e1727; border:1px solid var(--stroke);
         padding:8px 12px; border-radius:10px; font-weight:800; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:40}
  .overlay.show{display:flex}
  .modal{width:min(520px, calc(100% - 40px)); background:#0f1a2b; border:1px solid var(--stroke); border-radius:12px; padding:16px}
  .modal h4{margin:0 0 8px 0; font-size:18px}
  .modal p{margin:4px 0; color:var(--muted)}
  .modal .actions{display:flex; gap:12px; justify-content:center; margin-top:16px}

  /* Simple range */
  input[type="range"]{ width:110px; }
  .tag.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .hide{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="pill" id="moneyPill">
      <div class="row"><span class="tag">Cash</span><strong class="value" id="cash">$0</strong></div>
      <div class="row"><span class="tag">/s</span><strong class="value" id="cps">0</strong></div>
      <div class="row" style="min-width:220px">
        <div style="flex:1">
          <div class="tag">Next Cycle in</div>
          <div class="bar" title="Progress to the next forced reset"><i id="cycleBar" style="--p:0%"></i></div>
        </div>
      </div>
      <div class="row"><span class="tag">Cycles</span><strong class="value" id="cycleCount">0</strong></div>
      <div class="row"><span class="tag">Cycle Points</span><strong class="value" id="cyclePts">0</strong></div>
      <div class="row">
        <label class="toggle" title="Mute SFX">
          <input type="checkbox" id="mute" />
          <span class="tag">SFX</span>
        </label>
        <label class="toggle" title="Background Music">
          <input type="checkbox" id="musicToggle" />
          <span class="tag">Music ♫</span>
        </label>
        <div class="row">
          <span class="tag">Vol</span>
          <input type="range" id="musicVol" min="0" max="1" step="0.01" value="0.5" />
        </div>
      </div>
    </div>

    <div class="row">
      <div class="pill">
        <span class="tag">Buy</span>
        <button class="btn bulk" data-bulk="1">x1</button>
        <button class="btn bulk" data-bulk="10">x10</button>
        <button class="btn bulk" data-bulk="100">x100</button>
        <button class="btn bulk" data-bulk="max">Max</button>
      </div>
      <button id="btnReset" class="btn ghost" title="Manual reset">Reset</button>
      <button id="btnPause" class="btn">Pause</button>
    </div>
  </div>

  <!-- Main layout -->
  <div class="main">
    <!-- Producers -->
    <section class="panel">
      <h3>PRODUCERS <span class="chip" id="ownedTotal">0 owned</span></h3>
      <div class="body" id="producers"></div>
    </section>

    <!-- Center -->
    <section class="panel center">
      <div class="clicker-wrap">
        <div class="clicker" id="clicker">
          <div class="ring"></div>
          <div class="label">INVEST</div>
          <div class="sublabel" id="clickValue">+$1 per click</div>
        </div>
        <div class="meter">
          <div class="row" style="gap:12px; align-items:flex-end">
            <div style="flex:1">
              <div class="row" style="justify-content:space-between">
                <div class="tag">Click Combo</div>
                <div class="tag" id="comboTag">x1.0</div>
              </div>
              <div class="bar" title="Click in quick succession to build a combo"><i id="comboBar" style="--p:0%"></i></div>
            </div>
            <div style="flex:1">
              <div class="row" style="justify-content:space-between">
                <div class="tag">Active Boost</div>
                <div class="tag" id="boostTag">—</div>
              </div>
              <div class="bar"><i id="boostBar" style="--p:0%"></i></div>
            </div>
          </div>
        </div>
      </div>
      <div class="hint">Space: Click • 1/2/3/M: Bulk • P: Pause • Click fast for combo • Tap the ✨ star for Golden Surge</div>
    </section>

    <!-- Right: tabs -->
    <section class="panel">
      <div class="tabs">
        <div class="tab active" data-tab="upgrades">Upgrades</div>
        <div class="tab" data-tab="boosts">Boosts</div>
        <div class="tab" data-tab="achievements">Achievements</div>
        <div class="tab" data-tab="skills">Skills</div>
      </div>
      <div class="body">
        <div id="upgrades" class="tabpage"></div>
        <div id="boosts" class="tabpage hide"></div>
        <div id="achievements" class="tabpage hide"></div>
        <div id="skills" class="tabpage hide"></div>
      </div>
    </section>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h4 id="modalTitle">Confirm</h4>
    <p id="modalText">Are you sure?</p>
    <div class="actions">
      <button class="btn small" id="modalCancel">Cancel</button>
      <button class="btn small" id="modalOk">OK</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ===== Cycle & Skill tuning =====
  const CYCLE_BASE = 100_000;  // first threshold
  const CYCLE_GROWTH = 6;      // harder each time
  const CYCLE_MULT_PER = 1.5;  // permanent cycle multiplier
  // Skill definitions (id, cost, prereq ids, effects)
  const SKILLS = [
    {id:'s1', name:'Lean Ops',       cost:1, prereq:[],    desc:'+10% all production',            fx:{prodMult:1.10}},
    {id:'s2', name:'Firm Handshake', cost:1, prereq:[],    desc:'+25% click power',               fx:{clickMult:1.25}},
    {id:'s3', name:'Coupons',        cost:1, prereq:[],    desc:'5% discount on all purchases',   fx:{costMult:0.95}},
    {id:'s4', name:'Brand Momentum', cost:2, prereq:['s1'],desc:'+20% all production',            fx:{prodMult:1.20}},
    {id:'s5', name:'Caffeine Rush',  cost:2, prereq:['s2'],desc:'+25% boost durations',           fx:{boostDurMult:1.25}},
    {id:'s6', name:'Long Fuse',      cost:2, prereq:['s3'],desc:'Combo decays 25% slower',        fx:{comboDecayMult:1.25}},
    {id:'s7', name:'Golden Math',    cost:3, prereq:['s4'],desc:'Golden Surge +15% power',        fx:{surgeMult:1.15}},
  ];

  // ===== Audio Core (shared) =====
  let audioCtx = null;
  const ensureAudio = () => audioCtx || (audioCtx = new (window.AudioContext||window.webkitAudioContext)());

  const sfxEnabled = () => !$('#mute').checked;
  function beep(freq=440, dur=0.06, type='sine', gain=0.04){
    if(!sfxEnabled()) return;
    const ctx = ensureAudio();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = gain; o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur);
  }
  const sfx = {
    click: ()=>beep(520, .05, 'triangle', .03),
    buy:   ()=>{ beep(320,.05,'square',.03); setTimeout(()=>beep(540,.05,'square',.025), 40); },
    upg:   ()=>{ beep(300,.05,'sine',.03); setTimeout(()=>beep(600,.07,'sine',.03), 60); },
    surge: ()=>{ beep(700,.12,'sawtooth',.035); setTimeout(()=>beep(1000,.12,'sawtooth',.03), 120); },
    cycle: ()=>{ [540,680,820,980].forEach((f,i)=>setTimeout(()=>beep(f,.09,'sine',.035), i*90)); },
    skill: ()=>{ [600,760,920].forEach((f,i)=>setTimeout(()=>beep(f,.06,'triangle',.03), i*70)); },
  };

  // ===== Procedural Music (no assets) =====
  const music = {
    ctx:null, master:null, gain:null,
    running:false, timerId:null,
    lookahead:25/1000, scheduleAhead:0.2,
    baseTempo:92, tempo:92,
    nextNoteTime:0, current16:0,
    noiseBuffer:null,

    init(){
      this.ctx = ensureAudio();
      if(!this.master){
        this.master = this.ctx.createGain(); this.master.gain.value = 0.7; this.master.connect(this.ctx.destination);
        this.gain = this.ctx.createGain(); this.gain.gain.value = parseFloat($('#musicVol').value||'0.5'); this.gain.connect(this.master);
      }
      this.makeNoiseBuffer();
    },
    start(){ if(this.running) return; this.init(); this.running=true; this.tempo=this.baseTempo; this.nextNoteTime=this.ctx.currentTime+0.05; this.current16=0; this.timerId=setInterval(()=>this.scheduler(), this.lookahead*1000); },
    stop(){ if(!this.running) return; clearInterval(this.timerId); this.timerId=null; this.running=false; },
    setVolume(v){ if(this.gain) this.gain.gain.value = v; },
    setTempo(bpm){ this.tempo = Math.max(60, Math.min(180, bpm)); },
    secondsPer16th(){ return 60 / this.tempo / 4; },
    scheduler(){
      const now=this.ctx.currentTime;
      while(this.nextNoteTime < now + this.scheduleAhead){
        this.scheduleNote(this.current16, this.nextNoteTime);
        this.advanceNote();
      }
    },
    advanceNote(){ this.nextNoteTime += this.secondsPer16th(); this.current16=(this.current16+1)%16; },

    // Pattern + synths
    chordProg:[0,-3,2,-2], // Am–F–C–G (relative)
    scale:[0,2,3,5,7,8,10],
    baseFreq:220, // A3
    scaleNote(step){
      const bar=Math.floor(step/4)%4; const root=this.chordProg[bar];
      const deg=this.scale[(step%7)]; const semitones=root+deg; return this.baseFreq*Math.pow(2,semitones/12);
    },
    makeNoiseBuffer(){
      const len=this.ctx.sampleRate*1.0; const b=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.noiseBuffer=b;
    },
    scheduleNote(beat,time){
      // drums
      if(beat%8===0) this.kick(time, 1.0);
      if(beat%8===4) this.snare(time, 0.8);
      if(beat%2===0) this.hat(time, 0.22);
      // bass
      if(beat%4===0) this.bass(time, this.scaleNote(beat), 0.6);
      // arp
      if([2,6,10,14].includes(beat)) this.arp(time, this.scaleNote(beat+2), 0.35);
    },
    kick(time, vol){
      const o=this.ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(140,time); o.frequency.exponentialRampToValueAtTime(40,time+0.12);
      const g=this.ctx.createGain(); g.gain.setValueAtTime(0.001,time); g.gain.exponentialRampToValueAtTime(vol,time+0.005); g.gain.exponentialRampToValueAtTime(0.0001,time+0.15);
      o.connect(g).connect(this.gain); o.start(time); o.stop(time+0.16);
    },
    snare(time, vol){
      const n=this.ctx.createBufferSource(); n.buffer=this.noiseBuffer;
      const bp=this.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.7;
      const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.12);
      n.connect(bp).connect(g).connect(this.gain); n.start(time); n.stop(time+0.13);
    },
    hat(time, vol){
      const n=this.ctx.createBufferSource(); n.buffer=this.noiseBuffer;
      const hp=this.ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000; hp.Q.value=0.7;
      const g=this.ctx.createGain(); g.gain.setValueAtTime(vol*0.8,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
      n.connect(hp).connect(g).connect(this.gain); n.start(time); n.stop(time+0.06);
    },
    bass(time, freq, vol){
      const o=this.ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(freq/2,time);
      const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600; lp.Q.value=0.7;
      const g=this.ctx.createGain(); g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(vol,time+0.01); g.gain.exponentialRampToValueAtTime(0.0001,time+0.28);
      o.connect(lp).connect(g).connect(this.gain); o.start(time); o.stop(time+0.3);
    },
    arp(time, freq, vol){
      const o=this.ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(freq,time);
      const hp=this.ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=300; hp.Q.value=0.7;
      const g=this.ctx.createGain(); g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(vol,time+0.01); g.gain.exponentialRampToValueAtTime(0.0001,time+0.22);
      o.connect(hp).connect(g).connect(this.gain); o.start(time); o.stop(time+0.24);
    },
    // celebratory chord stab
    stab(){
      const t=this.ctx.currentTime+0.02;
      const freqs=[this.baseFreq, this.baseFreq*1.26, this.baseFreq*1.5];
      freqs.forEach((f,i)=>{
        const o=this.ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(f,t);
        const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800; lp.Q.value=0.7;
        const g=this.ctx.createGain(); g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.5/(i+1),t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
        o.connect(lp).connect(g).connect(this.gain); o.start(t); o.stop(t+0.46);
      });
    }
  };

  // ===== State =====
  const state = {
    money: 0,
    totalEarned: 0,
    clickBase: 1,
    clickMult: 1,

    permMult: 1,     // upgrades/achievements this run
    cycleMult: 1,    // permanent from cycles
    cycle: { count: 0, earnedBase: 0, target: CYCLE_BASE },
    cyclePoints: 0,

    skills: null,
    skill: { prodMult:1, clickMult:1, costMult:1, boostDurMult:1, surgeMult:1, comboDecayMult:1 },

    globalMult: 1,   // perm × cycle × skill.prod × boost × surge(+skill)

    bulkMode: '1',
    paused: false,
    lastTime: performance.now(),
    lastSave: Date.now(),

    // Combo & events
    combo: 0, comboPower: 0, comboDecay: 1.6, lastClickT: 0,
    boost: { name:null, mult:1, t:0, dur:0, cdEnd:0 },
    surge: { t:0, dur:10, mult:7, nextAt: performance.now() + 5000 + Math.random()*15000 },

    // Producers (Lemonade > $1/s)
    producers: [

      { id:2, name:'🫧 Car Wash',       count:0, baseCost:1100,     cost:1100,     baseRate:85,       mult:1, tick:0, period:2.0 },
      { id:3, name:'🍕 Pizza Shop',     count:0, baseCost:12000,    cost:12000,    baseRate:480,      mult:1, tick:0, period:1.8 },
      { id:4, name:'🍩 Donut Factory',  count:0, baseCost:130000,   cost:130000,   baseRate:2700,     mult:1, tick:0, period:1.6 },

    ],

  // ===== Utilities =====
  const $  = (s)=>document.querySelector(s);
  const $$ = (s)=>Array.from(document.querySelectorAll(s));
  const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
  const SUFFIX=["","K","M","B","T","aa","ab","ac","ad","ae","af","ag","ah","ai","aj","ak","al","am","an","ao"];
  function format(n){
    if(!isFinite(n)) return '∞';
    const neg = n<0; n=Math.abs(n);
    if(n<1000) return (neg?-n:n).toLocaleString(undefined,{maximumFractionDigits:0});
    const tier=Math.floor(Math.log10(n)/3);
    const suffix=SUFFIX[tier]||`e${tier*3}`;
    const scaled=n/Math.pow(10,tier*3);
    const str = (neg?-scaled:scaled).toFixed(scaled<10?2:scaled<100?1:0);
    return `${str}${suffix}`;
  }

  // cost helpers (apply skill discount everywhere)
  const COST_R = 1.15;
  const nextCost = (cost)=> cost*COST_R;
  function seriesCost(startCost, r, n){ if(n<=0) return 0; return startCost * (Math.pow(r,n)-1)/(r-1); }
  function maxAffordable(startCost, r, money){
    const sc = startCost * state.skill.costMult;
    if(money < sc) return 0;
    const a = 1 + (money*(r-1))/(startCost*state.skill.costMult);
    let n = Math.floor(Math.log(a)/Math.log(r));
    while(seriesCost(startCost, r, n) * state.skill.costMult > money) n--;
    return Math.max(0,n);
  }
  const effSumCost = (sum)=> sum * state.skill.costMult;
  const effCost    = (base)=> base * state.skill.costMult;

  // ===== Global multiplier =====
  function recomputeGlobalMult(){
    const boostMult = (state.boost?.mult || 1);
    const surgeFactor = isSurging()? (state.surge.mult * state.skill.surgeMult) : 1;
    state.globalMult = state.permMult * state.cycleMult * state.skill.prodMult * boostMult * surgeFactor;
  }

  // ===== Persistence =====
  const SAVE_KEY='idle-tycoon-neon-cycles-skills-music';
  function save(){
    const payload={...state, lastSave: Date.now()};
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    toast('Game saved!');
  }
  function load(){
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw) return;
      const data=JSON.parse(raw);
      Object.assign(state, data);
      state.cycle ||= { count: 0, earnedBase: state.totalEarned||0, target: CYCLE_BASE };
      state.cycleMult ||= 1;
      if (!state.skills) seedSkills();
      if (!state.skill)  state.skill = {prodMult:1, clickMult:1, costMult:1, boostDurMult:1, surgeMult:1, comboDecayMult:1};
      rebuildSkillAggregates();
      recomputeGlobalMult();
      const elapsedSec = Math.max(0, (Date.now() - (data.lastSave||Date.now()))/1000);
      const cps = computeCPS();
      const offline = cps*elapsedSec;
      if(offline>0){ state.money += offline; state.totalEarned += offline; }
    }catch(e){ console.warn('Failed to load save', e); }
  }
  setInterval(()=>save(), 30000);

  // ===== Game math =====
  function computeCPS(){
    let cps=0;
    for(const p of state.producers){ cps += p.count * p.baseRate * p.mult; }
    cps *= state.globalMult;
    return cps;
  }
  const clickValue = ()=>{
    const comboMult = 1 + state.comboPower * 9; // up to ×10
    return state.clickBase * state.clickMult * state.skill.clickMult * comboMult * state.globalMult;
  };

  // ===== Upgrades seed =====
  function seedUpgrades(){
    const milestones=[25,50,100,200];
    const ups=[];
    for(const p of state.producers){
      for(const m of milestones){
        const id=`p${p.id}-m${m}`;
        const name=`${p.name.replace(/^..../,'')} x2 @ ${m}`;
        const costGuess = p.baseCost * Math.pow(COST_R, m) * 0.75;
        ups.push({id, name, desc:`Doubles ${p.name} output.`, target:p.id, kind:'prod-mult', at:m, mult:2, cost:Math.max(1,Math.floor(costGuess)), bought:false});
      }
    }
    ups.push({id:'click-10', name:'Better Gloves', desc:'Clicks ×2', kind:'click-mult', mult:2, cost:500, bought:false});
    ups.push({id:'click-20', name:'Titanium Finger', desc:'Clicks ×3', kind:'click-mult', mult:3, cost:5000, bought:false});
    ups.push({id:'ops-10', name:'Ops Overhaul', desc:'All production ×1.5', kind:'global-mult', mult:1.5, cost:120000, bought:false});
    state.upgrades = ups;
  }

  function isUpgradeVisible(u){
    if(u.kind==='click-mult' || u.kind==='global-mult') return true;
    if(u.kind==='prod-mult'){
      const p = state.producers[u.target];
      return p.count >= Math.max(1, Math.floor(u.at*0.6));
    }
    return true;
  }
  function applyUpgrade(u){
    if(u.kind==='click-mult') state.clickMult *= u.mult;
    if(u.kind==='global-mult'){ state.permMult *= u.mult; }
    if(u.kind==='prod-mult'){ state.producers[u.target].mult *= u.mult; }
    u.bought = true; sfx.upg(); popToast(`Purchased: ${u.name}`, '#9af2cf');
    recomputeGlobalMult();
  }

  // ===== Achievements =====
  const ACH = [
    {id:'a1', name:'First Blood', desc:'Buy your first producer', cond:()=>state.producers.some(p=>p.count>=1), bonus:0.01},
    {id:'a2', name:'Millionaire', desc:'Reach $1M total earned',  cond:()=>state.totalEarned>=1e6, bonus:0.02},
    {id:'a3', name:'Click Storm', desc:'Hit ×10 combo once',      cond:()=>state._hitMaxCombo, bonus:0.02},
    {id:'a4', name:'Surge Rider', desc:'Trigger Golden Surge',    cond:()=>state._usedSurge, bonus:0.02},
  ];
  function checkAchievements(){
    let gained = 0;
    for(const a of ACH){
      if(state.achievements.includes(a.id)) continue;
      if(a.cond()){
        state.achievements.push(a.id);
        state.permMult *= (1 + a.bonus);
        recomputeGlobalMult();
        pushAchievement(a);
        gained++;
      }
    }
    if(gained) renderAchievements();
  }

  // ===== Boosts =====
  const BOOST_SHOP = [
    {id:'b1', name:'Ad Campaign', desc:'×2 for 30s • 3m CD', mult:2, dur:30, cd:180, cost:5000},
    {id:'b2', name:'Insider Tips', desc:'×3 for 20s • 4m CD', mult:3, dur:20, cd:240, cost:25000},
  ];
  function canBuyBoost(b){
    const price = effCost(b.cost);
    return state.money >= price && (state.boost.name!==b.id) && (performance.now()/1000 >= state.boost.cdEnd);
  }
  function buyBoost(bid){
    const b = BOOST_SHOP.find(x=>x.id===bid);
    if(!b || !canBuyBoost(b)) return;
    const price = effCost(b.cost);
    spend(price);

  }
  function activateBoost(b){
    state.boost.name = b.id;

  }

  // ===== Golden Surge =====
  function isSurging(){ return state.surge.t > 0; }
  function maybeSpawnSurge(){
    const now = performance.now();
    if(now >= state.surge.nextAt && !isSurging()){
      spawnSurgeStar();
      state.surge.nextAt = now + 60000 + Math.random()*60000;
    }
  }
  function spawnSurgeStar(){
    const star = document.createElement('div');
    star.textContent = '✨';
    star.style.position='fixed';
    star.style.left = (10 + Math.random()*80) + 'vw';
    star.style.top = (10 + Math.random()*70) + 'vh';
    star.style.fontSize = '28px';
    star.style.filter = 'drop-shadow(0 0 10px rgba(255,255,255,.6))';
    star.style.cursor = 'pointer';
    star.style.userSelect='none';
    star.style.zIndex = 30;
    document.body.appendChild(star);
    const t0 = performance.now();
    const drift = ()=> {
      const t=(performance.now()-t0)/1000;
      star.style.transform=`translateY(${Math.sin(t*1.2)*6}px)`;
      if(!document.body.contains(star)) return;
      requestAnimationFrame(drift);
    }; drift();
    const kill = ()=> star.remove();
    setTimeout(kill, 12000);
    star.addEventListener('click', ()=>{
      state.surge.t = state.surge.dur;

  // ===== Money =====
  function earn(val){ state.money += val; state.totalEarned += val; }
  function spend(val){ state.money -= val; }

  // ===== Reset helpers =====
  function softReset(){
    state.producers = state.producers.map(p => ({...p, count:0, cost:p.baseCost, mult:1, tick:0}));
    state.money = 0;
    state.clickBase = 1;
    state.clickMult = 1;
    state.combo = 0; state.comboPower = 0;
    state.boost = { name:null, mult:1, t:0, dur:0, cdEnd:0 };
    state.surge.t = 0; state.surge.nextAt = performance.now()+15000;

  // ===== Cycle logic =====
  function earnedSinceCycle(){ return Math.max(0, state.totalEarned - (state.cycle.earnedBase||0)); }
  function cycleProgress(){ return clamp(earnedSinceCycle() / state.cycle.target, 0, 1); }
  function maybeForceCycle(){
    if (earnedSinceCycle() >= state.cycle.target){
      state.cycle.count += 1;
      state.cyclePoints += 1; // +1 Skill point
      state.cycleMult *= CYCLE_MULT_PER;
      sfx.cycle();
      popToast(`Cycle ${state.cycle.count} complete! +1 Cycle Point • Permanent ×${CYCLE_MULT_PER.toFixed(2)} gained.`);

      softReset();

  // ===== Skills =====
  function seedSkills(){

  function rebuildSkillAggregates(){
    state.skill = { prodMult:1, clickMult:1, costMult:1, boostDurMult:1, surgeMult:1, comboDecayMult:1 };
    if(!state.skills) return;
    for(const s of state.skills){
      if(!s.bought) continue;
      const fx = s.fx || {};
      if(fx.prodMult)      state.skill.prodMult      *= fx.prodMult;
      if(fx.clickMult)     state.skill.clickMult     *= fx.clickMult;
      if(fx.costMult)      state.skill.costMult      *= fx.costMult;
      if(fx.boostDurMult)  state.skill.boostDurMult  *= fx.boostDurMult;
      if(fx.surgeMult)     state.skill.surgeMult     *= fx.surgeMult;
      if(fx.comboDecayMult)state.skill.comboDecayMult*= fx.comboDecayMult;
    }
    recomputeGlobalMult();
  }
  function hasSkill(id){ return state.skills?.find(s=>s.id===id)?.bought; }

    state.cyclePoints -= s.cost;

  // Particles
  function confetti(x,y,count=60){
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className='spark';
      s.style.left=x+'px'; s.style.top=y+'px';
      document.body.appendChild(s);
      const ang = Math.random()*Math.PI*2, spd= (60+Math.random()*140);
      const vx = Math.cos(ang)*spd, vy = Math.sin(ang)*spd - 80;
      const life = 700+Math.random()*900;
      const t0 = performance.now();
      (function step(){
        const t = performance.now()-t0;
        const tt = t/1000;
        const px = x + vx*tt;
        const py = y + vy*tt + 120*tt*tt;
        s.style.transform = `translate(${px-x}px, ${py-y}px)`;
        s.style.opacity = (1 - t/life).toFixed(3);
        if(t<life){ requestAnimationFrame(step); } else s.remove();
      })();
    }

  function floatText(x,y, text, color='#d8fff7'){

  // Producers

  function tryBuyProducer(idx){
    const p = state.producers[idx];

  function renderProducers(){

  function updateProducerUI(){
    for(const row of producersUI){
      const idx = row.idx;

      const nBulk = (state.bulkMode==='max') 
        ? Math.max(1, maxAffordable(p.cost, COST_R, state.money)) 
        : parseInt(state.bulkMode,10);

      const raw = seriesCost(p.cost, COST_R, nBulk);
      const cost = effSumCost(raw);
      const canAfford = (nBulk>0) && (state.money >= cost);

      row.btn.classList.toggle('can', canAfford);
      row.btn.classList.toggle('cant', !canAfford);
      row.btn.innerHTML = `Buy ${state.bulkMode==='max' ? 'MAX' : 'x'+nBulk} &nbsp; <span class="mono">$${format(cost)}</span>`;

  // Upgrades
  function tryBuyUpgrade(id){
    const u = state.upgrades.find(x=>x.id===id && !x.bought);
    if(!u) return;
    const cost = effCost(u.cost);
    if(state.money < cost) return;
    spend(cost);
    applyUpgrade(u);
    renderAll();
  }
  function renderUpgrades(){
    const root = elTabPages.upgrades;
    root.innerHTML = '';
    upgradesUI.length = 0;

    const list = state.upgrades
      .filter(u => !u.bought && isUpgradeVisible(u))
      .sort((a,b)=>a.cost-b.cost)
      .slice(0, 14);

    list.forEach(u=>{
      const wrap = document.createElement('div');
      wrap.className = 'upgrade';

      const left = document.createElement('div');
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = u.name;
      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = u.desc;
      left.appendChild(title);
      left.appendChild(desc);

      const right = document.createElement('div');
      const btn = document.createElement('button');
      const can = state.money >= effCost(u.cost);
      btn.className = 'btn buy ' + (can ? 'can' : 'cant');
      btn.innerHTML = `<span class="mono">$${format(effCost(u.cost))}</span>`;
      btn.addEventListener('click', ()=>tryBuyUpgrade(u.id));
      right.appendChild(btn);

      wrap.appendChild(left);
      wrap.appendChild(right);
      root.appendChild(wrap);

      upgradesUI.push({ id: u.id, btn });
    });
  }
  function updateUpgradeUI(){
    if (upgradesUI.length === 0) return;
    for (const row of upgradesUI){
      const u = state.upgrades.find(x => x.id === row.id && !x.bought);
      if (!u) {
        if (currentTab() === 'upgrades') renderUpgrades();
        continue;
      }
      const can = state.money >= effCost(u.cost);
      row.btn.classList.toggle('can', can);
      row.btn.classList.toggle('cant', !can);
      row.btn.innerHTML = `<span class="mono">$${format(effCost(u.cost))}</span>`;
    }
  }

  // Boosts
  function renderBoosts(){
    const root = elTabPages.boosts;
    root.innerHTML = '';
    boostsUI.length = 0;

    BOOST_SHOP.forEach(b=>{
      const wrap = document.createElement('div');
      wrap.className = 'boost';
      const left = document.createElement('div');
      left.innerHTML = `<div class="title">${b.name}</div><div class="desc">${b.desc}</div>`;
      const right = document.createElement('div');
      const btn = document.createElement('button');

      const cdLeft = Math.max(0, Math.ceil((state.boost.cdEnd - performance.now()/1000)));
      const active = state.boost.t > 0 && state.boost.name === b.id;
      const can = !active && cdLeft<=0 && state.money >= effCost(b.cost);

      btn.className = 'btn buy ' + (can ? 'can' : 'cant');
      btn.innerHTML = active ? 'Active' : (cdLeft>0 ? `CD ${cdLeft}s` : `<span class="mono">$${format(effCost(b.cost))}</span>`);
      btn.addEventListener('click', ()=>buyBoost(b.id));

      right.appendChild(btn);
      wrap.appendChild(left); wrap.appendChild(right);
      root.appendChild(wrap);

      boostsUI.push({ id: b.id, btn });
    });
  }
  function updateBoostUI(){
    if (boostsUI.length === 0) return;
    const nowS = performance.now()/1000;
    for (const row of boostsUI){
      const b = BOOST_SHOP.find(x => x.id === row.id);
      if (!b) continue;

      const cdLeft = Math.max(0, Math.ceil(state.boost.cdEnd - nowS));
      const active = state.boost.t > 0 && state.boost.name === b.id;
      const can = !active && cdLeft<=0 && state.money >= effCost(b.cost);

      row.btn.classList.toggle('can', can);
      row.btn.classList.toggle('cant', !can);
      const wanted = active ? 'Active' : (cdLeft>0 ? `CD ${cdLeft}s` : `<span class="mono">$${format(effCost(b.cost))}</span>`);
      if (row.btn.innerHTML !== wanted) row.btn.innerHTML = wanted;
    }
  }

  // Achievements tab
  function pushAchievement(a){
    const root = elTabPages.achievements;
    const row = document.createElement('div');
    row.className = 'achievement achv-pop';
    row.innerHTML = `<div><div class="title">🏆 ${a.name}</div><div class="desc">${a.desc} • Permanent +${Math.round(a.bonus*100)}% production</div></div><div><span class="badge">NEW</span></div>`;
    root.prepend(row);
    confetti(window.innerWidth/2, 80, 80);
  }
  function renderAchievements(){
    const root = elTabPages.achievements;
    root.innerHTML = '';
    for(const id of state.achievements){
      const a = ACH.find(x=>x.id===id);
      if(!a) continue;
      const row = document.createElement('div');
      row.className = 'achievement';
      row.innerHTML = `<div><div class="title">🏆 ${a.name}</div><div class="desc">${a.desc} • +${Math.round(a.bonus*100)}%</div></div><div><span class="badge">OWNED</span></div>`;
      root.appendChild(row);
    }
  }

  // Skills tab
  function renderSkills(){
    const root = elTabPages.skills;
    root.innerHTML = '';
    skillsUI.length = 0;

    const hdr = document.createElement('div');
    hdr.className = 'skill';
    hdr.innerHTML = `<div><div class="title">Skill Tree</div><div class="desc">Spend Cycle Points on permanent upgrades. Points: <b class="mono">${state.cyclePoints}</b></div></div><div><span class="badge">PERMANENT</span></div>`;
    root.appendChild(hdr);

    state.skills.forEach(s=>{
      const wrap = document.createElement('div');
      wrap.className = 'skill';

      const left = document.createElement('div');
      const prereqTxt = (s.prereq?.length)
        ? 'Requires: ' + s.prereq.map(pid => SKILLS.find(x=>x.id===pid)?.name || pid).join(', ')
        : 'No prerequisites';
      left.innerHTML = `<div class="title">${s.name}</div><div class="desc">${s.desc} • Cost: ${s.cost} pt${s.cost>1?'s':''} • ${prereqTxt}</div>`;

      const right = document.createElement('div');
      const btn = document.createElement('button');

      if (s.bought){
        btn.className = 'btn buy cant';
        btn.textContent = 'Owned';
      }else{
        const can = canBuySkill(s);
        btn.className = 'btn buy ' + (can ? 'can' : 'cant');
        btn.textContent = `Unlock (${s.cost})`;
        btn.addEventListener('click', ()=>buySkill(s.id));
      }

      right.appendChild(btn);
      wrap.appendChild(left);
      wrap.appendChild(right);
      root.appendChild(wrap);

      skillsUI.push({ id: s.id, btn });
    });
  }
  function updateSkillsUI(){
    if(skillsUI.length===0) return;
    for(const row of skillsUI){
      const s = state.skills.find(x=>x.id===row.id);
      if(!s) continue;
      if(s.bought){
        row.btn.className='btn buy cant';
        row.btn.textContent='Owned';
      }else{
        const can = canBuySkill(s);
        row.btn.className = 'btn buy ' + (can ? 'can' : 'cant');
        row.btn.textContent = `Unlock (${s.cost})`;
      }
    }
  }

  // Tabs
  elTabs.forEach(t=>{
    t.addEventListener('click', ()=>{
      elTabs.forEach(x=>x.classList.remove('active')); t.classList.add('active');
      const key = t.dataset.tab;
      Object.keys(elTabPages).forEach(k=>{
        elTabPages[k].classList.toggle('hide', k!==key);
      });
      renderRightTab();
    });
  });
  function currentTab(){ return document.querySelector('.tab.active')?.dataset.tab || 'upgrades'; }
  function renderRightTab(){
    const tab = currentTab();
    if(tab==='upgrades') renderUpgrades();
    if(tab==='boosts') renderBoosts();
    if(tab==='achievements') renderAchievements();
    if(tab==='skills') renderSkills();
  }

  // Topbar + center
  function renderTopbar(){
    elCash.textContent = `$${format(state.money)}`;
    elCps.textContent = `${format(computeCPS())}`;
    elClickVal.textContent = `+$${format(clickValue())} per click`;

    // combo
    const comboMult = 1 + state.comboPower * 9;
    elComboTag.textContent = `x${comboMult.toFixed(1)}`;
    elComboBar.style.setProperty('--p', (state.combo*100).toFixed(1)+'%');

    // boost/surge bar
    const bActive = state.boost.t > 0;
    const sActive = isSurging();
    if (bActive && sActive) {
      const totalMult = state.boost.mult * (state.surge.mult * state.skill.surgeMult);
      elBoostTag.textContent = `Boost x${state.boost.mult} + Surge x${Math.round(state.surge.mult*state.skill.surgeMult*10)/10} = x${Math.round(totalMult*10)/10}`;
      const p = Math.min(state.boost.t/state.boost.dur, state.surge.t/state.surge.dur);
      elBoostBar.style.setProperty('--p', (p*100).toFixed(1)+'%');
      elBoostBar.parentElement.title = 'Time until the next effect ends';
    } else if (bActive) {
      elBoostTag.textContent = `${(BOOST_SHOP.find(b=>b.id===state.boost.name)?.name||'Boost')} x${state.boost.mult}`;
      elBoostBar.style.setProperty('--p', ((state.boost.t/state.boost.dur)*100).toFixed(1)+'%');
      elBoostBar.parentElement.title = 'Active Boost time remaining';
    } else if (sActive) {
      elBoostTag.textContent = `Golden Surge x${Math.round(state.surge.mult*state.skill.surgeMult*10)/10}`;
      elBoostBar.style.setProperty('--p', ((state.surge.t/state.surge.dur)*100).toFixed(1)+'%');
      elBoostBar.parentElement.title = 'Golden Surge time remaining';
    } else {
      const cdLeft = Math.max(0, Math.ceil((state.boost.cdEnd - performance.now()/1000)));
      elBoostTag.textContent = cdLeft>0 ? `Cooldown ${cdLeft}s` : '—';
      elBoostBar.style.setProperty('--p', '0%');
      elBoostBar.parentElement.title = cdLeft>0 ? 'Boost cooldown' : '';
    }

    // cycle
    elCycleCount.textContent = `${state.cycle.count}`;
    elCyclePts.textContent = `${state.cyclePoints}`;
    elCycleBar.style.setProperty('--p', (cycleProgress()*100).toFixed(1)+'%');
    elCycleBar.parentElement.title = `Earn $${format(state.cycle.target - Math.min(state.cycle.target, earnedSinceCycle()))} more to complete Cycle`;
    $$('.btn.bulk').forEach(b => b.classList.toggle('active', b.dataset.bulk===state.bulkMode));
  }
  function renderAll(){
    renderTopbar();
    renderProducers();
    renderRightTab();
  }

  // Loop
  function tick(){
    const t = performance.now();
    const dt = clamp((t - state.lastTime)/1000, 0, 0.1);
    state.lastTime = t;

    if(!state.paused){
      for(const p of state.producers){
        const inc = p.count * p.baseRate * p.mult * state.globalMult * dt;
        if(inc>0){ earn(inc); }
        p.tick += dt;
        if(p.tick >= p.period) p.tick -= p.period;
      }
      // Boosts & Surge
      if(state.boost.t>0){
        state.boost.t -= dt;
        if(state.boost.t<=0){ state.boost.t=0; state.boost.name=null; state.boost.mult=1; recomputeGlobalMult(); popToast('Boost ended'); }
      }
      if(state.surge.t>0){
        state.surge.t -= dt;
        if(state.surge.t<=0){
          state.surge.t=0; recomputeGlobalMult(); popToast('Golden Surge faded');
          // restore base tempo after surge
          if($('#musicToggle').checked && music.running){ music.setTempo(music.baseTempo); }
        }
      } else {
        maybeSpawnSurge();
      }
      // Combo decay (slower with skills)
      if(t - state.lastClickT > 120){
        state.combo = Math.max(0, state.combo - dt/(state.comboDecay*state.skill.comboDecayMult));
        state.comboPower = Math.pow(state.combo, 0.75);
        if(state.comboPower>=0.999) state._hitMaxCombo = true;
      }
    }

    // live ui
    updateProducerUI();
    if (currentTab() === 'upgrades')    updateUpgradeUI();
    if (currentTab() === 'boosts')      updateBoostUI();
    if (currentTab() === 'skills')      updateSkillsUI();

    renderTopbar();
    checkAchievements();
    maybeForceCycle();

    requestAnimationFrame(tick);
  }

  // Boot
  function boot(){
    if (!state.cycle || !Number.isFinite(state.cycle.target)){
      state.cycle = { count: 0, earnedBase: state.totalEarned, target: CYCLE_BASE };
    }
    if (state.cycleMult === 1 && state.cycle?.count>0){
      state.cycleMult = Math.pow(CYCLE_MULT_PER, state.cycle.count);
    }
    seedUpgrades();
    if (!state.skills) seedSkills();
    rebuildSkillAggregates();
    load();
    setBulk('1');
    renderAll();
    requestAnimationFrame(tick);
  }
  boot();

})();
</script>
</body>
</html>
