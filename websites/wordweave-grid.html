    ctx.fillStyle = "rgba(4,16,23,.76)"; ctx.strokeStyle = "rgba(111,227,240,.28)"; ctx.lineWidth = 2; roundRect(x, y, width, 382, 16, true, true);
    ctx.fillStyle = "#f2fcff"; ctx.font = "950 24px system-ui"; ctx.fillText(stage().name, x + 20, y + 42);
    ctx.fillStyle = "rgba(165,192,202,.95)"; ctx.font = "850 13px system-ui"; ctx.fillText("Spend thread on target traces.", x + 20, y + 67);
    currentTargets().forEach((target, index) => {
      const yy = y + 108 + index * 58;
      ctx.fillStyle = target.found ? "rgba(127,240,166,.18)" : "rgba(255,255,255,.045)";
      ctx.strokeStyle = target.found ? "rgba(127,240,166,.7)" : "rgba(111,227,240,.18)";
      roundRect(x + 18, yy - 27, width - 36, 42, 9, true, true);
      ctx.fillStyle = target.found ? "#7ff0a6" : "#f2fcff"; ctx.font = "950 18px system-ui"; ctx.fillText(target.found ? "DONE " + target.word : target.word, x + 34, yy);
    });
    ctx.fillStyle = "#54dcec"; ctx.font = "950 12px system-ui"; ctx.fillText("CURRENT TRACE", x + 20, y + 300);
    ctx.fillStyle = "#f2fcff"; ctx.font = "950 28px system-ui"; ctx.fillText(activeWord() || ".....", x + 20, y + 337);
    ctx.fillStyle = "rgba(165,192,202,.95)"; ctx.font = "850 13px system-ui";
    ctx.fillText("Chain " + state.chain + " - start beside the last end.", x + 20, y + 365);
  }
  function paintOverlay() {
    if (state.mode === "playing") return;
    const lost = state.mode === "out-of-thread";
    ctx.save(); ctx.fillStyle = "rgba(2,8,12,.69)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(5,20,28,.95)"; ctx.strokeStyle = lost ? "#ff7d96" : "#7ff0a6"; ctx.lineWidth = 2;
    roundRect(173, 188, 554, 175, 17, true, true);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = lost ? "#ff7d96" : state.mode === "run-complete" ? "#ffd166" : "#7ff0a6"; ctx.font = "950 35px system-ui";
    ctx.fillText(lost ? "OUT OF THREAD" : state.mode === "run-complete" ? "RUN COMPLETE" : "BOARD COMPLETE", W / 2, 247);
    ctx.fillStyle = "#f2fcff"; ctx.font = "900 17px system-ui"; ctx.fillText("Score " + state.score + " / Best " + state.best, W / 2, 285);
    ctx.fillStyle = "rgba(165,192,202,.98)"; ctx.font = "850 13px system-ui";
    ctx.fillText(lost || state.mode === "run-complete" ? "Press R or Restart." : "Press N or Next Board.", W / 2, 317);
    ctx.restore();
  }
  function render() { paintBackground(); paintGrid(); paintPanel(); paintOverlay(); }
  function tick(ms) {
    state.clock += Math.max(0, ms);
    state.feedbackMs = Math.max(0, state.feedbackMs - Math.max(0, ms));
    if (state.feedbackMs === 0) {
      const idle = state.mode === "playing" ? "Start beside the last end to raise the chain bonus." : state.feedback;
      if (els.status.textContent !== idle) els.status.textContent = idle;
    }
    render();
  }
  function snapshot() {
    return JSON.stringify({
      mode: state.mode,
      board: { index: state.stageIndex + 1, total: STAGES.length, name: stage().name, rows: stage().rows },
      targets: currentTargets(),
      trace: { word: activeWord(), cells: state.path.map((cell) => ({ r: cell.r, c: cell.c })), length: state.path.length },
      cursor: { r: state.cursor.r, c: state.cursor.c, letter: letterAt(state.cursor.r, state.cursor.c) },
      budget: { remaining: state.budget, start: stage().budget },
      score: state.score,
      streak: state.streak,
      chain: state.chain,
      best: state.best,
      lastEnd: state.lastEnd,
      solvedBoards: state.solvedBoards,
      feedback: state.feedback,
      input: { last: state.lastInput, action: state.lastAction, touchActive: state.touchActive },
      soundEnabled: state.soundEnabled,
      lastSound: state.lastSound,
      toneCount: state.toneCount,
      fullscreen: Boolean(document.fullscreenElement),
      coordinateSystem: "5x5 letter grid; r/c are zero-based from top-left and touching cells include diagonals."
    });
  }
  function isUiTarget(target) { return target instanceof HTMLElement && target !== canvas && target.matches("button,input,textarea,select,[contenteditable=true]"); }
  canvas.addEventListener("pointerdown", (event) => {
    const cell = cellFromEvent(event); if (!cell) return;
    event.preventDefault(); markGesture(event.pointerType || "pointer", "trace-start"); canvas.focus(); state.pointerId = event.pointerId; canvas.setPointerCapture(event.pointerId); beginTrace(cell);
  });
  canvas.addEventListener("pointermove", (event) => {
    if (state.pointerId !== event.pointerId || !state.path.length) return;
    const cell = cellFromEvent(event); if (cell) { markGesture(event.pointerType || "pointer", "trace-drag"); extendTrace(cell); }
  });
  canvas.addEventListener("pointerup", (event) => {
    if (state.pointerId !== event.pointerId) return;
    state.pointerId = null;
    if (state.path.length > 1) submitTrace(); else clearTrace();
  });
  canvas.addEventListener("pointercancel", () => { state.pointerId = null; clearTrace(); });
  els.submit.addEventListener("click", () => { markGesture("button", "submit"); submitTrace(); });
  els.clear.addEventListener("click", () => { markGesture("button", "undo"); if (state.path.length > 1) undoCell(); else clearTrace(); canvas.focus(); });
  els.next.addEventListener("click", () => { markGesture("button", "next"); nextBoard(); });
  els.restart.addEventListener("click", () => { markGesture("button", "restart"); restart(); });
  els.sound.addEventListener("click", () => { markGesture("button", "sound"); toggleSound(); });
  els.full.addEventListener("click", () => { markGesture("button", "fullscreen"); toggleFullscreen(); });
  document.addEventListener("fullscreenchange", () => { syncHud(); render(); });
  window.addEventListener("keydown", (event) => {
    if (event.altKey || event.ctrlKey || event.metaKey || isUiTarget(event.target)) return;
    const key = event.key.toLowerCase();
    const move = { arrowup: [-1,0], w: [-1,0], arrowdown: [1,0], s: [1,0], arrowleft: [0,-1], a: [0,-1], arrowright: [0,1], d: [0,1] }[key];
    if (move) { event.preventDefault(); markGesture("keyboard", key); moveCursor(move[0], move[1]); return; }
    if (key === "enter" || event.code === "Space") { event.preventDefault(); markGesture("keyboard", key === "enter" ? "enter" : "space"); if (state.path.length) submitTrace(); else beginTrace(state.cursor); }
    else if (key === "backspace") { event.preventDefault(); undoCell(); }
    else if (key === "escape") { if (state.path.length) { event.preventDefault(); clearTrace(); } }
    else if (key === "n") { event.preventDefault(); nextBoard(); }
    else if (key === "r") { event.preventDefault(); restart(); }
    else if (key === "m") { event.preventDefault(); toggleSound(); }
    else if (key === "f") { event.preventDefault(); toggleFullscreen(); }
  });
  window.render_game_to_text = snapshot;
  window.advanceTime = (ms = 0) => {
    const total = Math.max(0, Number(ms) || 0), step = 1000 / 60;
    if (total === 0) tick(0);
    for (let left = total; left > 0; left -= step) tick(Math.min(step, left));
    return snapshot();
  };
  function frame(now) { tick(Math.min(50, Math.max(0, now - lastFrame))); lastFrame = now; requestAnimationFrame(frame); }
  loadBoard(0, false);
  requestAnimationFrame(frame);
})();
</script>
