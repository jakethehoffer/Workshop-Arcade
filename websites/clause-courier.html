<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const STATS_KEY = "clause-courier.stats.v1";
  const SOUND_KEY = "clause-courier.sound.v1";
  const STAGES = [
    { name: "Dawn Drop", target: ["SORT","THE","MAIL","BEFORE","DAWN"], start: ["MAIL","SORT","THE","DAWN","BEFORE"], par: 5, budget: 9 },
    { name: "Crew Notice", target: ["SEND","CLEAR","MAPS","TO","THE","CREW"], start: ["MAPS","THE","SEND","CREW","CLEAR","TO"], par: 9, budget: 13 },
    { name: "Fog Line", target: ["GUIDE","THE","NIGHT","TRAIN","PAST","FOG"], start: ["FOG","GUIDE","TRAIN","THE","PAST","NIGHT"], par: 10, budget: 14 },
    { name: "Safe Order", target: ["STACK","EVERY","TOKEN","IN","SAFE","ORDER"], start: ["TOKEN","SAFE","STACK","ORDER","EVERY","IN"], par: 11, budget: 15 },
    { name: "Final Clause", target: ["CARRY","THE","FINAL","CLAUSE","HOME","AT","NOON"], start: ["CLAUSE","AT","CARRY","NOON","THE","HOME","FINAL"], par: 13, budget: 17 }
  ];
  const $ = (id) => document.getElementById(id);
  const els = {
    stage: $("stageValue"), moves: $("movesValue"), par: $("parValue"), budget: $("budgetValue"), score: $("scoreValue"), best: $("bestValue"), togo: $("togoValue"),
    status: $("statusLine"), live: $("liveStatus"), select: $("selectBtn"), left: $("leftBtn"), right: $("rightBtn"), next: $("nextBtn"),
    restart: $("restartBtn"), sound: $("soundBtn"), full: $("fullBtn"), app: $("app")
  };
  function store() { if (window.workshopStorage) return window.workshopStorage; try { return window.localStorage; } catch (_) { return null; } }
  function read(key, fallback) { const s = store(); if (!s) return fallback; try { const value = s.getItem(key); return value == null ? fallback : value; } catch (_) { return fallback; } }
  function write(key, value) { const s = store(); if (!s) return; try { s.setItem(key, String(value)); } catch (_) {} }
  // A stored 1e400 parses to Infinity and sails straight through Number(x) || 0:
  // it printed "Infinity" on the scoreboard, and JSON.stringify writes Infinity
  // as null, so the diagnostics contract broke outright. Negatives and absurd
  // magnitudes got through the same way, the latter printing as "1e+24".
  const MAX_SCORE = 9999999, MAX_STAGE = STAGES.length;
  function sane(value, cap) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return 0;
    return Math.min(Math.floor(n), cap);
  }
  function readStats() {
    try {
      const value = JSON.parse(read(STATS_KEY, "{}"));
      if (!value || typeof value !== "object") return { bestScore: 0, bestStage: 0 };
      return { bestScore: sane(value.bestScore, MAX_SCORE), bestStage: sane(value.bestStage, MAX_STAGE) };
    } catch (_) {
      return { bestScore: 0, bestStage: 0 };
    }
  }
  const saved = readStats();
  const soundRaw = String(read(SOUND_KEY, "1")).toLowerCase();
  const state = {
    stageIndex: 0, tiles: [], cursor: 0, selected: null, moves: 0, score: 0, stageStartScore: 0, solvedStages: 0,
    mode: "playing", feedback: "Select a word tile, then swap with a neighbor.", feedbackMs: 1800,
    bestScore: saved.bestScore, bestStage: saved.bestStage, soundEnabled: !["0","false","off","muted"].includes(soundRaw),
    lastSound: "none", toneCount: 0, userGesture: false, lastAction: "ready", lastInput: "none", time: 0, flash: 0, tileRects: []
  };
  let audio = null;
  const stage = () => STAGES[state.stageIndex];
  const activeIndex = () => state.selected == null ? state.cursor : state.selected;
  const correctAt = (i) => state.tiles[i] === stage().target[i];
  const isSolved = () => state.tiles.every((word, i) => word === stage().target[i]);
  // The exact number of adjacent swaps still required is the inversion count of
  // the current rail against the target. Not an estimate: no shorter route
  // exists, and every single swap either lowers it by one or raises it by one.
  function swapsNeeded(tiles, target) {
    const slots = new Map();
    target.forEach((word, i) => { if (!slots.has(word)) slots.set(word, []); slots.get(word).push(i); });
    const taken = new Map();
    const perm = [];
    for (const word of tiles) {
      const list = slots.get(word);
      if (!list) return null;
      const k = taken.get(word) || 0;
      if (k >= list.length) return null;
      taken.set(word, k + 1);
      perm.push(list[k]);
    }
    let inversions = 0;
    for (let i = 0; i < perm.length; i += 1) {
      for (let j = i + 1; j < perm.length; j += 1) if (perm[i] > perm[j]) inversions += 1;
    }
    return inversions;
  }
  // The stage payout, parameterised on the move count so the preview and the
  // real award run through one function and cannot drift apart.
  function stagePayout(moves, stageIndex = state.stageIndex) {
    const st = STAGES[stageIndex];
    const underPar = Math.max(0, st.par - moves);
    const overPar = Math.max(0, moves - st.par);
    const raw = 650 + Math.max(0, st.budget - moves) * 55 + underPar * 90 - overPar * 20 + (stageIndex + 1) * 35;
    return Math.max(250, raw);
  }
  // Everything the rail can tell you before you commit another swap.
  function outlook() {
    const st = stage();
    const needed = swapsNeeded(state.tiles, st.target);
    const movesLeft = Math.max(0, st.budget - state.moves);
    if (needed == null) return { needed: null, movesLeft, doomed: false, finishClean: 0, wasteCost: 0, slack: 0 };
    const cleanTotal = state.moves + needed;
    const finishClean = stagePayout(cleanTotal);
    // A wasted swap costs two moves in the end: the swap itself, and undoing it.
    const wasteCost = finishClean - stagePayout(cleanTotal + 2);
    return { needed, movesLeft, doomed: needed > movesLeft, finishClean, wasteCost, slack: movesLeft - needed };
  }
  function feedback(text, ms = 1800) {
    state.feedback = text;
    state.feedbackMs = ms;
    els.status.textContent = text;
    els.live.textContent = text;
  }
  function markGesture(source = "keyboard", action = "input") {
    state.userGesture = true;
    state.lastInput = source;
    state.lastAction = action;
    if ((source === "touch" || source === "pen") && navigator.vibrate) {
      try { navigator.vibrate(8); } catch (_) {}
    }
  }
  function ensureAudio() {
    if (!state.soundEnabled || !state.userGesture) return null;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume().catch(() => {});
      return audio;
    } catch (_) {
      audio = null;
      return null;
    }
  }
  function tone(name) {
    state.lastSound = state.soundEnabled ? name : "muted-" + name;
    if (!state.soundEnabled) return;
    state.toneCount += 1;
    const ac = ensureAudio();
    if (!ac) return;
    const frequencies = { select: 340, swap: 460, complete: 720, fail: 150, next: 560, restart: 240, toggle: 400 };
    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    const freq = frequencies[name] || 360;
    osc.type = name === "fail" ? "sawtooth" : "triangle";
    osc.frequency.setValueAtTime(freq, now);
    if (name === "complete") osc.frequency.linearRampToValueAtTime(freq + 220, now + .16);
    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(.055, now + .012);
    gain.gain.exponentialRampToValueAtTime(.0001, now + .22);
    osc.connect(gain).connect(ac.destination);
    osc.start(now);
    osc.stop(now + .24);
  }
  function saveStats() {
    write(STATS_KEY, JSON.stringify({ bestScore: state.bestScore, bestStage: state.bestStage }));
  }
  function saveSound() { write(SOUND_KEY, state.soundEnabled ? "1" : "0"); }
  function syncHud() {
    const st = stage();
    els.stage.textContent = (state.stageIndex + 1) + "/" + STAGES.length;
    els.moves.textContent = String(state.moves);
    els.par.textContent = String(st.par);
    els.budget.textContent = String(st.budget);
    els.score.textContent = String(state.score);
    els.best.textContent = String(state.bestScore);
    const view = outlook();
    els.togo.textContent = view.needed == null ? "--" : String(view.needed);
    els.togo.style.color = view.doomed ? "#fb7185" : view.needed === 0 ? "#86efac" : "";
    els.select.textContent = state.selected == null ? "Select" : "Release";
    els.select.disabled = state.mode !== "playing";
    els.left.disabled = state.mode !== "playing" || activeIndex() <= 0;
    els.right.disabled = state.mode !== "playing" || activeIndex() >= state.tiles.length - 1;
    els.next.disabled = state.mode !== "stage-complete" && state.mode !== "run-complete";
    els.next.textContent = state.mode === "run-complete" ? "New Run" : "Next Stage";
    els.sound.textContent = state.soundEnabled ? "Sound On" : "Sound Off";
    els.sound.setAttribute("aria-pressed", String(state.soundEnabled));
    const full = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    els.full.textContent = full ? "Exit Fullscreen" : "Fullscreen";
    els.full.setAttribute("aria-pressed", String(full));
  }
  function beginStage(index, preserveScore) {
    state.stageIndex = Math.max(0, Math.min(STAGES.length - 1, index));
    if (!preserveScore) {
      state.score = 0;
      state.solvedStages = 0;
    }
    state.stageStartScore = state.score;
    state.tiles = stage().start.slice();
    state.cursor = 0;
    state.selected = null;
    state.moves = 0;
    state.mode = "playing";
    state.flash = 0;
    const view = outlook();
    feedback(stage().name + ": " + view.needed + " swaps is the shortest route, and you have "
      + view.movesLeft + " moves. Finish clean for " + view.finishClean + ".", 2800);
    syncHud();
    render();
  }
  function restartStage() {
    markGesture("button", "restart");
    state.score = state.stageStartScore;
    beginStage(state.stageIndex, true);
    tone("restart");
  }
  function newRun() {
    markGesture("button", "new-run");
    beginStage(0, false);
    tone("restart");
  }
  function toggleSelection(source) {
    if (state.mode !== "playing") return;
    markGesture(source, "select");
    if (state.selected === state.cursor) {
      state.selected = null;
      feedback("Selection cleared.", 1200);
    } else if (state.selected != null && Math.abs(state.selected - state.cursor) === 1) {
      swapTiles(state.selected, state.cursor, source);
      state.selected = null;
      return;
    } else {
      state.selected = state.cursor;
      feedback("Selected " + state.tiles[state.cursor] + ". Choose a neighbor.", 1500);
    }
    tone("select");
    syncHud();
    render();
  }
  function moveCursor(delta, source = "keyboard") {
    if (state.mode !== "playing") return;
    markGesture(source, "cursor");
    state.cursor = Math.max(0, Math.min(state.tiles.length - 1, state.cursor + delta));
    feedback("Cursor on " + state.tiles[state.cursor] + ".", 900);
    syncHud();
    render();
  }
  function swapActive(delta, source = "keyboard") {
    if (state.mode !== "playing") return;
    const from = activeIndex();
    const to = from + delta;
    if (to < 0 || to >= state.tiles.length) {
      markGesture(source, "blocked");
      feedback("That word has no neighbor on that side.", 1200);
      tone("fail");
      return;
    }
    swapTiles(from, to, source);
  }
  function swapTiles(a, b, source = "keyboard") {
    if (state.mode !== "playing" || Math.abs(a - b) !== 1) return;
    markGesture(source, "swap");
    const before = swapsNeeded(state.tiles, stage().target);
    const temp = state.tiles[a];
    state.tiles[a] = state.tiles[b];
    state.tiles[b] = temp;
    state.cursor = b;
    state.selected = null;
    state.moves += 1;
    state.flash = 1;
    tone("swap");
    if (isSolved()) {
      completeStage();
    } else if (state.moves >= stage().budget) {
      state.mode = "failed";
      feedback("Move budget spent. Restart this dispatch and try a shorter route.", 3600);
      tone("fail");
    } else {
      // Every swap moves the needed count by exactly one, either way, so the rail
      // can always say plainly whether the move you just made was worth making.
      const view = outlook();
      const helped = view.needed != null && before != null && view.needed < before;
      const lead = helped ? "Good swap. " : "Wasted swap, that went the wrong way. ";
      if (view.doomed) {
        feedback(lead + view.needed + " swaps still needed but only " + view.movesLeft + " moves left. Restart this dispatch.", 4000);
        tone("fail");
      } else {
        feedback(lead + view.needed + " more needed, " + view.movesLeft + " moves left. Finish clean for " + view.finishClean + ".", 1800);
      }
    }
    syncHud();
    render();
  }
  function completeStage() {
    const st = stage();
    const overPar = Math.max(0, state.moves - st.par);
    state.score += stagePayout(state.moves);
    state.solvedStages = Math.max(state.solvedStages, state.stageIndex + 1);
    state.bestStage = Math.max(state.bestStage, state.solvedStages);
    if (state.score > state.bestScore) state.bestScore = state.score;
    saveStats();
    state.mode = state.stageIndex === STAGES.length - 1 ? "run-complete" : "stage-complete";
    const pace = overPar ? "Over par by " + overPar + "." : "At or under par.";
    feedback(st.name + " delivered. " + pace + " Score " + state.score + ".", 3800);
    tone("complete");
  }
  function nextStage() {
    markGesture("button", "next");
    if (state.mode === "run-complete") {
      newRun();
      return;
    }
    if (state.mode !== "stage-complete") return;
    beginStage(state.stageIndex + 1, true);
    tone("next");
  }
  function toggleSound() {
    markGesture("button", "sound");
    state.soundEnabled = !state.soundEnabled;
    saveSound();
    tone("toggle");
    feedback(state.soundEnabled ? "Sound on." : "Sound off.", 1000);
    syncHud();
  }
  function toggleFullscreen() {
    markGesture("button", "fullscreen");
    const active = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (active) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const target = els.app;
        (target.requestFullscreen || target.webkitRequestFullscreen).call(target);
      }
    } catch (_) {
      feedback("Fullscreen is not available in this browser.", 1600);
    }
    syncHud();
    setTimeout(() => { syncHud(); render(); }, 120);
  }
  function layoutTiles() {
    const words = state.tiles;
    const gap = 10;
    const tileW = Math.floor(Math.min(132, (W - 110 - gap * (words.length - 1)) / words.length));
    const tileH = 72;
    const startX = Math.round((W - words.length * tileW - (words.length - 1) * gap) / 2);
    const y = 275;
    state.tileRects = words.map((_, i) => ({ x: startX + i * (tileW + gap), y, w: tileW, h: tileH }));
    return state.tileRects;
  }
  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }
  function drawTextFit(text, x, y, maxWidth, baseSize, color, align = "center") {
    let size = baseSize;
    ctx.textAlign = align;
    ctx.fillStyle = color;
    do {
      ctx.font = "950 " + size + "px system-ui,-apple-system,Segoe UI,sans-serif";
      if (ctx.measureText(text).width <= maxWidth || size <= 11) break;
      size -= 1;
    } while (size > 11);
    ctx.fillText(text, x, y);
  }
  function render() {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#081a25");
    bg.addColorStop(1, "#050916");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(94,234,212,.1)";
    for (let i = 0; i < 9; i++) {
      ctx.fillRect(54 + i * 104, 92, 2, 350);
    }
    const st = stage();
    ctx.fillStyle = "#5eead4";
    ctx.font = "950 22px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Clause Courier", 34, 44);
    ctx.fillStyle = "#a8bfd0";
    ctx.font = "700 13px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.fillText("Restore the dispatch by moving one word at a time along the courier rail.", 34, 64);
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "950 14px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.fillText("TARGET DISPATCH", 52, 118);
    ctx.fillStyle = "rgba(7,16,28,.66)";
    ctx.strokeStyle = "rgba(125,211,252,.28)";
    ctx.lineWidth = 2;
    roundRect(52, 132, W - 104, 82, 14, true, true);
    const target = st.target.join(" ");
    drawTextFit(target, W / 2, 182, W - 150, 33, "#f2fbff");
    ctx.fillStyle = "#7dd3fc";
    ctx.font = "950 14px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("CURRENT ORDER", 52, 250);
    const rects = layoutTiles();
    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      const isCursor = i === state.cursor;
      const isSelected = i === state.selected;
      const correct = correctAt(i);
      const grad = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      grad.addColorStop(0, correct ? "#164b3a" : isSelected ? "#15465a" : "#122b3f");
      grad.addColorStop(1, correct ? "#0d3028" : isSelected ? "#0d3043" : "#0a1b2b");
      ctx.fillStyle = grad;
      ctx.strokeStyle = isSelected ? "#ffd166" : isCursor ? "#7dd3fc" : correct ? "#86efac" : "rgba(125,211,252,.38)";
      ctx.lineWidth = isSelected || isCursor ? 4 : 2;
      roundRect(r.x, r.y, r.w, r.h, 12, true, true);
      ctx.fillStyle = "rgba(255,255,255,.08)";
      ctx.fillRect(r.x + 12, r.y + 10, r.w - 24, 2);
      drawTextFit(state.tiles[i], r.x + r.w / 2, r.y + 44, r.w - 18, 22, correct ? "#d7ffe7" : "#f2fbff");
      ctx.fillStyle = correct ? "#86efac" : "#8fb1c6";
      ctx.font = "900 11px system-ui,-apple-system,Segoe UI,sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(i + 1), r.x + r.w / 2, r.y + r.h - 10);
    }
    const railY = 392;
    ctx.strokeStyle = "rgba(125,211,252,.34)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(72, railY);
    ctx.lineTo(W - 72, railY);
    ctx.stroke();
    const progress = state.tiles.filter((word, i) => word === st.target[i]).length / state.tiles.length;
    ctx.strokeStyle = "#5eead4";
    ctx.beginPath();
    ctx.moveTo(72, railY);
    ctx.lineTo(72 + (W - 144) * progress, railY);
    ctx.stroke();
    // The one number the rail never showed: exactly how many swaps are left to
    // make, and whether the budget can still cover them.
    const view = outlook();
    if (state.mode === "playing" && view.needed != null) {
      const tone = view.doomed ? "#fb7185" : view.needed === 0 ? "#86efac" : "#ffd166";
      const label = view.doomed
        ? "NO ROUTE LEFT: " + view.needed + " SWAPS NEEDED, " + view.movesLeft + " MOVES LEFT"
        : view.needed + " SWAP" + (view.needed === 1 ? "" : "S") + " STILL NEEDED"
          + "  ·  " + view.movesLeft + " LEFT IN BUDGET"
          + "  ·  CLEAN FINISH " + view.finishClean;
      ctx.fillStyle = "rgba(7,16,28,.72)";
      ctx.strokeStyle = tone;
      ctx.lineWidth = 2;
      roundRect(72, 404, W - 144, 32, 10, true, true);
      drawTextFit(label, W / 2, 425, W - 176, 16, tone);
    }
    const message = state.mode === "failed" ? "BUDGET SPENT" : state.mode === "run-complete" ? "ALL DISPATCHES DELIVERED" : state.mode === "stage-complete" ? "DISPATCH DELIVERED" : (state.selected == null ? "SELECT A WORD" : "SWAP WITH A NEIGHBOR");
    ctx.fillStyle = state.mode === "failed" ? "#fb7185" : state.mode === "playing" ? "#ffd166" : "#86efac";
    ctx.font = "950 24px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(message, W / 2, 465);
    ctx.fillStyle = "#a8bfd0";
    ctx.font = "800 13px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.fillText(state.feedback, W / 2, 482);
    ctx.textAlign = "left";
  }
  function tileFromEvent(event) {
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) * (canvas.width / rect.width);
    const y = (event.clientY - rect.top) * (canvas.height / rect.height);
    layoutTiles();
    return state.tileRects.findIndex((r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
  }
  function pressTile(index, source) {
    if (state.mode !== "playing" || index < 0) return;
    markGesture(source, "tile");
    if (state.selected != null && Math.abs(state.selected - index) === 1) {
      swapTiles(state.selected, index, source);
      return;
    }
    state.cursor = index;
    if (state.selected === index) {
      state.selected = null;
      feedback("Selection cleared.", 1000);
      tone("select");
    } else {
      state.selected = index;
      feedback("Selected " + state.tiles[index] + ". Tap a neighbor to swap.", 1400);
      tone("select");
    }
    syncHud();
    render();
  }
  function tick(ms) {
    state.time += ms;
    if (state.feedbackMs > 0) state.feedbackMs = Math.max(0, state.feedbackMs - ms);
    if (state.flash > 0) state.flash = Math.max(0, state.flash - ms / 320);
    render();
  }
  window.advanceTime = (ms) => {
    const total = Number(ms) || 0;
    const steps = Math.max(1, Math.ceil(total / 40));
    for (let i = 0; i < steps; i++) tick(total / steps);
    return window.render_game_to_text();
  };
  window.render_game_to_text = function render_game_to_text() {
    const st = stage();
    return JSON.stringify({
      title: "Clause Courier",
      mode: state.mode,
      stageIndex: state.stageIndex,
      stageName: st.name,
      target: st.target.slice(),
      tiles: state.tiles.slice(),
      cursor: state.cursor,
      selected: state.selected,
      moves: state.moves,
      par: st.par,
      budget: st.budget,
      correctCount: state.tiles.filter((word, i) => word === st.target[i]).length,
      outlook: outlook(),
      stageBest: stagePayout(state.moves + (swapsNeeded(state.tiles, st.target) || 0)),
      solved: isSolved(),
      score: state.score,
      bestScore: state.bestScore,
      bestStage: state.bestStage,
      soundEnabled: state.soundEnabled,
      lastSound: state.lastSound,
      toneCount: state.toneCount,
      lastAction: state.lastAction,
      lastInput: state.lastInput,
      feedback: state.feedback,
      feedbackActive: state.feedbackMs > 0,
      coordinateSystem: "Word tiles are ordered left to right. Swap only adjacent tile indexes. Match tiles to target to complete each dispatch."
    });
  };
  canvas.addEventListener("pointerdown", (event) => {
    canvas.focus();
    pressTile(tileFromEvent(event), event.pointerType === "mouse" ? "pointer" : event.pointerType || "touch");
  });
  document.addEventListener("keydown", (event) => {
    const target = event.target;
    if (target && /^(button|input|select|textarea)$/i.test(target.tagName || "")) return;
    const key = event.key;
    if (["ArrowLeft","ArrowRight"," ","Enter","Backspace"].includes(key)) event.preventDefault();
    if (key === "ArrowLeft") moveCursor(-1);
    else if (key === "ArrowRight") moveCursor(1);
    else if (key === " " || key === "Enter" || key.toLowerCase() === "s") toggleSelection("keyboard");
    else if (key.toLowerCase() === "a") swapActive(-1);
    else if (key.toLowerCase() === "d") swapActive(1);
    else if (key.toLowerCase() === "r") restartStage();
    else if (key.toLowerCase() === "n") nextStage();
    else if (key.toLowerCase() === "f") toggleFullscreen();
    else if (key === "Escape" && state.selected != null) {
      state.selected = null;
      feedback("Selection cleared.", 1000);
      syncHud();
      render();
    }
  });
  els.select.addEventListener("click", () => toggleSelection("button"));
  els.left.addEventListener("click", () => swapActive(-1, "button"));
  els.right.addEventListener("click", () => swapActive(1, "button"));
  els.next.addEventListener("click", nextStage);
  els.restart.addEventListener("click", restartStage);
  els.sound.addEventListener("click", toggleSound);
  els.full.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", syncHud);
  document.addEventListener("webkitfullscreenchange", syncHud);
  beginStage(0, true);
})();
</script>
</body>
</html>
