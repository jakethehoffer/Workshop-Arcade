<script>
(() => {
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),W=960,H=540,CX=480,CY=270,TAU=Math.PI*2,STEP=1/60;
const BEST_KEY="beacon-bastion.best.v1",SOUND_KEY="beacon-bastion.sound.v1";
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rnd=n=>Math.round(n*10)/10,dist=(a,b,c,d)=>Math.hypot(a-c,b-d),$=id=>document.getElementById(id);
const els={exp:$("expValue"),beacon:$("beaconValue"),lens:$("lensValue"),wardVal:$("wardValue"),score:$("scoreValue"),best:$("bestValue"),status:$("statusLine"),live:$("liveLine"),start:$("startBtn"),wardBtn:$("wardBtn"),pulse:$("pulseBtn"),restart:$("restartBtn"),sound:$("soundBtn"),full:$("fullBtn")};
const storage=()=>window.workshopStorage||(()=>{try{return localStorage}catch(_){return null}})();
const get=(k,d)=>{try{const v=storage()?.getItem(k);return v==null?d:v}catch(_){return d}},set=(k,v)=>{try{storage()?.setItem(k,String(v))}catch(_){}};
const levels=[
 {name:"Outer Lamps",walls:[[236,152,72,144],[618,260,92,50]],lenses:[[168,132],[800,142],[764,418]],spawns:[[-30,95],[990,160],[520,570]],rate:3.6,speed:46,hp:1},
 {name:"Sunken Steps",walls:[[168,332,128,48],[424,98,56,150],[682,114,54,168]],lenses:[[130,414],[826,108],[566,430]],spawns:[[990,88],[-30,245],[785,570]],rate:3.2,speed:50,hp:1},
 {name:"Amber Gate",walls:[[160,120,60,220],[392,324,180,48],[710,150,74,212]],lenses:[[102,94],[840,412],[510,142]],spawns:[[230,-30],[990,300],[-30,450]],rate:2.85,speed:54,hp:2},
 {name:"Bastion Ring",walls:[[270,170,72,202],[626,170,72,202],[410,92,152,46]],lenses:[[142,270],[812,270],[482,444]],spawns:[[-30,122],[990,132],[480,570]],rate:2.55,speed:58,hp:2},
 {name:"Last Light",walls:[[210,112,70,100],[680,112,70,100],[210,328,70,100],[680,328,70,100],[420,236,120,52]],lenses:[[110,110],[850,112],[480,442]],spawns:[[-30,75],[990,75],[-30,470],[990,470]],rate:2.25,speed:62,hp:3}
];
const state={mode:"ready",exp:0,beacon:100,lenses:0,wardStock:3,score:0,best:+get(BEST_KEY,0)||0,sound:get(SOUND_KEY,"true")!=="false",scout:{x:150,y:390,vx:0,vy:0},target:null,wards:[],threats:[],spawn:0,time:0,pulseCd:0,feedback:"Press Start. Recover lenses and defend the beacon.",lastInput:"none",lastEvent:"ready",flash:0,lensList:[]};
let audio=null,keys=Object.create(null),last=performance.now();
function level(){return levels[state.exp]}function speak(t){state.feedback=t;els.status.textContent=t;els.live.textContent=t}
function tone(type){if(!state.sound)return;if(navigator.userActivation&&!navigator.userActivation.hasBeenActive)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type=type==="win"?"sawtooth":"triangle";o.frequency.value={lens:620,ward:410,pulse:190,hit:145,win:760,start:330}[type]||260;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.06,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+.18);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.2)}catch(_){}}
function start(){canvas.focus({preventScroll:true});state.mode="playing";state.exp=0;state.beacon=100;state.score=0;resetExp();speak("Expedition 1 - gather the three lenses.");tone("start")}
function resetExp(){const L=level();state.lenses=0;state.wardStock=3;state.wards=[];state.threats=[];state.spawn=.75;state.time=0;state.pulseCd=0;state.scout.x=150;state.scout.y=390;state.scout.vx=state.scout.vy=0;state.target=null;state.lastEvent="expedition";state.flash=0;state.lensList=L.lenses.map(([x,y])=>({x,y,taken:false}))}
function fail(msg){state.mode="fail";state.lastEvent="fail";speak(msg||"The beacon went dark. Press Restart.");tone("hit")}
function win(){state.mode="win";state.lastEvent="win";state.best=Math.max(state.best,state.score);set(BEST_KEY,state.best);speak("Beacon restored. All five expeditions cleared.");tone("win")}
function completeExp(){state.score+=300+Math.round(state.beacon)*2+state.wardStock*25;state.best=Math.max(state.best,state.score);set(BEST_KEY,state.best);if(state.exp===levels.length-1){win();return}state.exp++;resetExp();speak("Expedition "+(state.exp+1)+" - "+level().name+".");tone("win")}
function wallHit(x,y,r=15){return x<28||x>W-28||y<38||y>H-28}
function moveScout(dt){let ax=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ay=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);if(!ax&&!ay&&state.target){const dx=state.target.x-state.scout.x,dy=state.target.y-state.scout.y,d=Math.hypot(dx,dy);if(d<8)state.target=null;else{ax=dx/d;ay=dy/d}}else if(ax||ay){state.target=null;const l=Math.hypot(ax,ay);ax/=l;ay/=l}state.scout.vx=ax*180;state.scout.vy=ay*180;let nx=state.scout.x+state.scout.vx*dt,ny=state.scout.y+state.scout.vy*dt;if(!wallHit(nx,state.scout.y))state.scout.x=nx;if(!wallHit(state.scout.x,ny))state.scout.y=ny}
function placeWard(){if(state.mode!=="playing"||state.wardStock<=0)return;const s=state.scout;if(wallHit(s.x,s.y,18)||dist(s.x,s.y,CX,CY)<70)return speak("Move clear of the beacon to place a ward.");state.wardStock--;state.wards.push({x:s.x,y:s.y,life:11,cd:0});state.lastInput="ward";state.lastEvent="ward";speak("Ward placed. It burns nearby shades.");tone("ward")}
function pulse(){if(state.mode!=="playing"||state.pulseCd>0)return;state.pulseCd=5;state.flash=1;let hit=0;for(const t of state.threats){if(dist(t.x,t.y,CX,CY)<220){t.hp-=2;t.x+=Math.cos(t.a)*60;t.y+=Math.sin(t.a)*60;hit++}}state.lastInput="pulse";state.lastEvent="pulse";state.score+=hit*35;speak(hit?"Beacon pulse hit "+hit+" shades.":"Beacon pulse armed the light.");tone("pulse")}
function spawn(){const L=level(),p=L.spawns[Math.floor(state.time*10+state.threats.length)%L.spawns.length],a=Math.atan2(CY-p[1],CX-p[0]);state.threats.push({x:p[0],y:p[1],a,hp:L.hp,s:L.speed+state.exp*4});state.spawn=L.rate}
function updateGame(dt){if(state.mode!=="playing")return;state.time+=dt;state.spawn-=dt;state.pulseCd=Math.max(0,state.pulseCd-dt);state.flash=Math.max(0,state.flash-dt*2);moveScout(dt);if(state.spawn<=0)spawn();
 for(const lens of state.lensList){if(!lens.taken&&dist(state.scout.x,state.scout.y,lens.x,lens.y)<28){lens.taken=true;state.lenses++;state.score+=160;state.lastEvent="lens";speak("Lens recovered: "+state.lenses+"/3.");tone("lens");if(state.lenses>=3)completeExp()}}
 for(const w of state.wards){w.life-=dt;w.cd-=dt;if(w.cd<=0){const target=state.threats.find(t=>dist(t.x,t.y,w.x,w.y)<130);if(target){target.hp--;w.cd=.55;state.score+=20;state.lastEvent="ward-hit";tone("ward")}}}
 state.wards=state.wards.filter(w=>w.life>0);for(const t of state.threats){let tx=CX,ty=CY;if(dist(t.x,t.y,state.scout.x,state.scout.y)<160){tx=state.scout.x;ty=state.scout.y}t.a=Math.atan2(ty-t.y,tx-t.x);t.x+=Math.cos(t.a)*t.s*dt;t.y+=Math.sin(t.a)*t.s*dt;if(dist(t.x,t.y,state.scout.x,state.scout.y)<22){state.beacon-=4;t.hp=0;state.lastEvent="scout-hit";speak("Scout clipped by a shade. Beacon loses focus.");tone("hit")}else if(dist(t.x,t.y,CX,CY)<38){state.beacon-=7;t.hp=0;state.lastEvent="beacon-hit";speak("Shade struck the beacon.");tone("hit")}}
 state.threats=state.threats.filter(t=>t.hp>0);if(state.beacon<=0)fail("The beacon went dark. Press Restart.");}
function hud(){els.exp.textContent=(state.exp+1)+"/"+levels.length;els.beacon.textContent=Math.max(0,Math.round(state.beacon));els.beacon.className="value "+(state.beacon<35?"bad":state.beacon>70?"good":"");els.lens.textContent=state.lenses+"/3";els.wardVal.textContent=state.wardStock;els.score.textContent=state.score;els.best.textContent=state.best;els.sound.textContent=state.sound?"Sound On":"Sound Off";els.sound.setAttribute("aria-pressed",String(state.sound));els.pulse.disabled=state.pulseCd>0||state.mode!=="playing";els.wardBtn.disabled=state.wardStock<=0||state.mode!=="playing"}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);if(fill)ctx.fill();if(stroke)ctx.stroke()}
function draw(){const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#071827");bg.addColorStop(1,"#06110f");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle="rgba(94,234,212,.05)";ctx.beginPath();ctx.arc(CX,CY,235,0,TAU);ctx.fill();ctx.strokeStyle="rgba(94,234,212,.16)";ctx.lineWidth=2;for(let r=90;r<=240;r+=50){ctx.beginPath();ctx.arc(CX,CY,r,0,TAU);ctx.stroke()}
 for(const w of level().walls){ctx.fillStyle="#132033";rr(w[0],w[1],w[2],w[3],10,true,false);ctx.strokeStyle="rgba(125,211,252,.16)";ctx.strokeRect(w[0]+.5,w[1]+.5,w[2]-1,w[3]-1)}
 ctx.save();ctx.shadowColor="#facc15";ctx.shadowBlur=state.flash>0?34:18;ctx.fillStyle="#facc15";ctx.beginPath();ctx.arc(CX,CY,30,0,TAU);ctx.fill();ctx.restore();ctx.strokeStyle="#fef08a";ctx.lineWidth=3;ctx.beginPath();ctx.arc(CX,CY,42,0,TAU);ctx.stroke();
 for(const l of state.lensList){if(l.taken)continue;ctx.save();ctx.shadowColor="#67e8f9";ctx.shadowBlur=16;ctx.fillStyle="#67e8f9";ctx.beginPath();ctx.moveTo(l.x,l.y-14);ctx.lineTo(l.x+14,l.y);ctx.lineTo(l.x,l.y+14);ctx.lineTo(l.x-14,l.y);ctx.closePath();ctx.fill();ctx.restore()}
 for(const w of state.wards){ctx.strokeStyle="rgba(94,234,212,.18)";ctx.beginPath();ctx.arc(w.x,w.y,130,0,TAU);ctx.stroke();ctx.fillStyle="#5eead4";ctx.beginPath();ctx.arc(w.x,w.y,13,0,TAU);ctx.fill()}
 for(const t of state.threats){ctx.fillStyle=t.hp>1?"#fb7185":"#fca5a5";ctx.beginPath();ctx.arc(t.x,t.y,14+t.hp*2,0,TAU);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.45)";ctx.stroke()}
 const s=state.scout;ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle="#e0f2fe";ctx.beginPath();ctx.arc(0,0,16,0,TAU);ctx.fill();ctx.fillStyle="#0f172a";ctx.fillRect(-5,-4,10,14);ctx.restore();
 ctx.fillStyle="#5eead4";ctx.font="900 18px system-ui";ctx.textAlign="left";ctx.fillText(level().name,24,36);ctx.fillStyle="#dbeafe";ctx.font="800 13px system-ui";ctx.fillText("Beacon "+Math.round(Math.max(0,state.beacon))+"  Lenses "+state.lenses+"/3  Shades "+state.threats.length,24,58);
 if(state.mode==="ready")overlay("BEACON BASTION","#facc15","Recover lenses. Place wards. Keep the light alive.");else if(state.mode==="fail")overlay("BEACON LOST","#fb7185",state.feedback);else if(state.mode==="win")overlay("LIGHT RESTORED","#5eead4",state.feedback);hud()}
function overlay(a,c,b){ctx.fillStyle="rgba(2,6,18,.78)";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.fillStyle=c;ctx.font="950 48px system-ui";ctx.fillText(a,W/2,H/2-8);ctx.fillStyle="#dbeafe";ctx.font="800 17px system-ui";ctx.fillText(b,W/2,H/2+28);ctx.textAlign="left"}
function tick(dt){updateGame(dt);draw()}
window.advanceTime=ms=>{const n=Math.max(1,Math.ceil(ms/(STEP*1000)));for(let i=0;i<n;i++)tick(ms/1000/n);return window.render_game_to_text()};
window.render_game_to_text=()=>JSON.stringify({title:"Beacon Bastion",mode:state.mode,coordinateSystem:"canvas 960x540, origin top-left, x right, y down",expedition:state.exp+1,totalExpeditions:levels.length,beacon:Math.round(Math.max(0,state.beacon)),lenses:state.lenses,lensGoal:3,wardStock:state.wardStock,pulseCooldown:rnd(state.pulseCd),score:state.score,best:state.best,scout:{x:rnd(state.scout.x),y:rnd(state.scout.y),vx:rnd(state.scout.vx),vy:rnd(state.scout.vy)},target:state.target?{x:rnd(state.target.x),y:rnd(state.target.y)}:null,wards:state.wards.map(w=>({x:rnd(w.x),y:rnd(w.y),life:rnd(w.life)})),lensesVisible:state.lensList.filter(l=>!l.taken).map(l=>({x:l.x,y:l.y})),threats:state.threats.map(t=>({x:rnd(t.x),y:rnd(t.y),hp:t.hp})).slice(0,8),feedback:state.feedback,lastInput:state.lastInput,lastEvent:state.lastEvent,sound:state.sound});
document.addEventListener("keydown",e=>{const tag=e.target?.tagName||"";if(/^(BUTTON|INPUT|SELECT|TEXTAREA)$/.test(tag))return;const code=e.code;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(code))e.preventDefault();keys[code]=true;if(code==="Space"){state.lastInput="ward";placeWard()}else if(code==="KeyE"||code==="ShiftLeft"||code==="ShiftRight")pulse();else if(code==="KeyR")start();else if(code==="KeyF")toggleFull()});
document.addEventListener("keyup",e=>{keys[e.code]=false});canvas.addEventListener("pointerdown",e=>{canvas.focus();if(state.mode!=="playing")return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;state.target={x:clamp(x,32,W-32),y:clamp(y,42,H-32)};state.lastInput="pointer";speak("Scout moving to marked ground.")});
els.start.onclick=start;els.restart.onclick=start;els.wardBtn.onclick=placeWard;els.pulse.onclick=pulse;els.sound.onclick=()=>{state.sound=!state.sound;set(SOUND_KEY,state.sound);hud();speak(state.sound?"Sound enabled.":"Sound muted.");tone("start")};function toggleFull(){const el=document.fullscreenElement;if(el)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()}els.full.onclick=toggleFull;document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==="ward")placeWard();else if(a==="pulse")pulse();else{const map={up:"ArrowUp",down:"ArrowDown",left:"ArrowLeft",right:"ArrowRight"};keys[map[a]]=true;setTimeout(()=>{keys[map[a]]=false},120)}});draw();hud();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</body>
</html>
