<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Block Drop</title>
<style>
  html, body { margin:0; height:100%; background:#0b0f14; color:#e6edf3; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  canvas { display:block; margin:auto; background:#0e1522; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .hud { position:fixed; top:8px; left:50%; transform:translateX(-50%); display:flex; gap:18px; align-items:center; font-weight:700; letter-spacing:.3px; }
  .hud .pill { background:#111827; border:1px solid #26334a; padding:6px 10px; border-radius:12px; display:flex; flex-direction:column; align-items:center; }
  .btns { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
  .btn { background:#111827aa; border:1px solid #2a344a; color:#e6edf3; padding:10px 14px; border-radius:12px; font-weight:600; cursor:pointer; }
  .btn:active { transform:translateY(1px); }
  @media (min-width: 860px){ .btns { display:none; } }
  #holdCanvas, #nextCanvas { background:#0e1522; margin-top:4px; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" aria-hidden="true">
    <div class="pill" id="score">Score: 0</div>
    <div class="pill" id="lines">Lines: 0</div>
    <div class="pill" id="best">Best: 0</div>
    <div class="pill" id="hold">
      Hold<canvas id="holdCanvas" width="64" height="64"></canvas>
      <div class="keynote">(Key: C / Shift)</div>
    </div>
    <div class="pill" id="next">Next<canvas id="nextCanvas" width="64" height="64"></canvas></div>
    <div class="pill" id="status">Press Space to Start</div>
  </div>
  <div class="btns">
    <button class="btn" id="leftBtn">◀︎</button>
    <button class="btn" id="rotLBtn">⤺</button>
    <button class="btn" id="hardBtn">⬇︎⬇︎</button>
    <button class="btn" id="rotRBtn">⤼</button>
    <button class="btn" id="rightBtn">▶︎</button>
  </div>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const holdCanvas = document.getElementById('holdCanvas');
  const holdCtx = holdCanvas.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nextCtx = nextCanvas.getContext('2d');

  let audioCtx=null;
  function ensureAudio(){ try{ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; audioCtx=new AC(); } if(audioCtx.state==='suspended') audioCtx.resume(); }catch(_){} }
  function sfx(freq=600,dur=0.06,type='square',gain=0.06){ try{ ensureAudio(); if(!audioCtx) return; const t=audioCtx.currentTime; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(t+dur);}catch(_){}}
  const SFX={ move:()=>sfx(520,0.05,'square',0.05), rotate:()=>sfx(740,0.06,'sine',0.06), drop:()=>sfx(280,0.07,'triangle',0.06), clear:()=>sfx(980,0.08,'sine',0.07) };

  const music={ on:false, loop:null, gain:null, note:0, bass:0, tempo:150 };
  const MELODY=[523.25,587.33,659.25,698.46,659.25,587.33,523.25,440.00,523.25,659.25,784.00,659.25,587.33,523.25,440.00,392.00];
  const BASS=[130.81,130.81,98.00,98.00,146.83,146.83,123.47,123.47];
  function startMusic(){
    ensureAudio(); if(!audioCtx) return;
    if(!music.gain){ music.gain=audioCtx.createGain(); music.gain.gain.value=0.16; music.gain.connect(audioCtx.destination); }
    if(music.on) return;
    music.on=true;
    music.loop=setInterval(()=>{
      if(!audioCtx||!music.on) return;
      const now=audioCtx.currentTime;
      const m=audioCtx.createOscillator(), mg=audioCtx.createGain();
      const b=audioCtx.createOscillator(), bg=audioCtx.createGain();
      m.type='square'; b.type='triangle';
      const mf=MELODY[music.note%MELODY.length], bf=BASS[Math.floor(music.note/4)%BASS.length];
      m.frequency.setValueAtTime(mf,now);
      b.frequency.setValueAtTime(bf,now);
      mg.gain.setValueAtTime(0.0001,now);
      mg.gain.exponentialRampToValueAtTime(0.22,now+0.02);
      mg.gain.exponentialRampToValueAtTime(0.0001,now+0.15);
      bg.gain.setValueAtTime(0.0001,now);
      bg.gain.exponentialRampToValueAtTime(0.12,now+0.02);
      bg.gain.exponentialRampToValueAtTime(0.0001,now+0.24);
      m.connect(mg).connect(music.gain);
      b.connect(bg).connect(music.gain);
      m.start(now); m.stop(now+0.16);
      b.start(now); b.stop(now+0.26);
      music.note++;
    }, music.tempo);
  }
  function stopMusic(){ if(music.loop){ clearInterval(music.loop); } music.loop=null; music.on=false; }

  function resize(){
    const pad = 12;
    const availW = Math.max(320, window.innerWidth - pad*2);
    const availH = Math.max(360, window.innerHeight - pad*2);
    let cell = Math.floor(Math.min(availW/10, availH/20));
    cell = Math.max(14, Math.min(cell, 40));
    const w = cell*10;
    const h = cell*20;
    canvas.width = w; canvas.height = h;
  }
  resize();
  window.addEventListener('resize', resize);

  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const bestEl  = document.getElementById('best');
  const statusEl= document.getElementById('status');

  const HS_KEY = 'blockdrop_best';
  let best = 0; try { best = Number(localStorage.getItem(HS_KEY)||0); } catch(_) {}
  bestEl.textContent = 'Best: ' + best;

  const W = 10, H = 20;
  const empty = ()=>Array.from({length:H},()=>Array(W).fill(0));
  const board = empty();

  const COLORS = {
    0:'#0e1522',
    I:'#37b5ff',
    O:'#ffd166',
    T:'#b794f6',
    S:'#37e39f',
    Z:'#ef476f',
    J:'#6aa0ff',
    L:'#f9a857'
  };
  const PIECES = {
    I:[[ [0,0,0,0], ['I','I','I','I'], [0,0,0,0], [0,0,0,0] ]],
    O:[[ ['O','O'], ['O','O'] ]],
    T:[[ [0,'T',0], ['T','T','T'], [0,0,0] ]],
    S:[[ [0,'S','S'], ['S','S',0], [0,0,0] ]],
    Z:[[ ['Z','Z',0], [0,'Z','Z'], [0,0,0] ]],
    J:[[ ['J',0,0], ['J','J','J'], [0,0,0] ]],
    L:[[ [0,0,'L'], ['L','L','L'], [0,0,0] ]]
  };
  function rot90(m){ const h=m.length, w=m[0].length; const r=Array.from({length:w},()=>Array(h).fill(0)); for(let y=0;y<h;y++) for(let x=0;x<w;x++) r[x][h-1-y]=m[y][x]; return r; }
  for(const k of Object.keys(PIECES)){ while(PIECES[k].length<4){ PIECES[k].push(rot90(PIECES[k][PIECES[k].length-1])); } }

  let bag = [];
  function refillBag(){ bag = ['I','O','T','S','Z','J','L'].sort(()=>Math.random()-0.5); }
  refillBag();
  function nextType(){ if(!bag.length) refillBag(); return bag.pop(); }
  function peekNext(){ if(!bag.length) refillBag(); return bag[bag.length-1]; }

  let cur = null;
  let ghostY = 0;
  let rotatedSinceMove = false;

  let holdType = null;
  let holdUsed = false;

  function spawnWithType(type){
    const piece = { x:3, y:-2, type, rot:0, shape: PIECES[type][0] };
    if(collide(piece.x,piece.y,piece.shape)) { gameOver=true; running=false; statusEl.textContent='Game Over — Press R'; saveBest(); stopMusic(); return null; }
    return piece;
  }
  function lock(){
    if(cur.shape.some((row, y)=> row.some((cell, x)=> cell && cur.y + y < 0))){
      merge();
      gameOver=true; running=false; saveBest(); stopMusic(); return;
    }
    const tspin = isTSpin();
    merge();
    const cleared = clearLines();
    SFX.drop();
    if(cleared>0){
      SFX.clear();
      let pts = [0,100,300,500,800][cleared] * level;
      if(tspin){
        const tPts = [0,400,800,1200,1600][cleared] * level;
        pts = Math.max(pts, tPts);
      }
      score += pts;
      lines += cleared;
      if(lines >= level*10) level++;
      fallDelay = speedForLevel(level);
    } else if(tspin){
      score += 400 * level;
    }
    updateHUD();
    spawn();
  }

  function spawn(){
    cur = spawnWithType(nextType());
    if(!cur) return;
    rotatedSinceMove = false; holdUsed = false; updateGhost(); drawHold(); drawNext();
  }

  function drawMini(ctx2, canvas2, type){
    ctx2.clearRect(0,0,canvas2.width,canvas2.height);
    if(!type) return;
    const s = PIECES[type][0];
    const cell = canvas2.width/4;
    for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++){
      const v=s[y][x]; if(!v) continue; ctx2.fillStyle = COLORS[v]; ctx2.fillRect(x*cell+1,y*cell+1,cell-2,cell-2);
    }
  }
  function drawHold(){ drawMini(holdCtx, holdCanvas, holdType); }
  function drawNext(){ drawMini(nextCtx, nextCanvas, peekNext()); }

  function doHold(){
    if(!running||gameOver||!cur||holdUsed) return;
    const prev = holdType;
    holdType = cur.type;
    drawHold();
    if(prev==null){ cur = spawnWithType(nextType()); }
    else { cur = spawnWithType(prev); }
    holdUsed = true; rotatedSinceMove = false; updateGhost(); drawNext();
  }

  function collide(px,py,sh){
    for(let y=0;y<sh.length;y++) for(let x=0;x<sh[y].length;x++){
      const cell = sh[y][x];
      if(!cell) continue;
      const bx = px+x, by = py+y;
      if(bx<0||bx>=W||by>=H) return true;
      if(by>=0 && board[by][bx]) return true;
    }
    return false;
  }

  function merge(){
    const s=cur.shape; for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++){
      const v=s[y][x]; if(!v) continue; const bx=cur.x+x, by=cur.y+y; if(by>=0) board[by][bx]=v;
    }
  }

  function rotate(dir){
    const n = (cur.rot + (dir>0?1:3)) % 4;
    const s = PIECES[cur.type][n];
    const kicks = [0,-1,1,-2,2];
    for(const k of kicks){ if(!collide(cur.x+k, cur.y, s)){ cur.rot=n; cur.shape=s; cur.x+=k; rotatedSinceMove = true; SFX.rotate(); updateGhost(); return; } }
  }

  function hardDrop(){ rotatedSinceMove = false; while(!collide(cur.x, cur.y+1, cur.shape)) { cur.y++; score+=2; } lock(); }
  function softDrop(){ rotatedSinceMove = false; if(!collide(cur.x, cur.y+1, cur.shape)){ cur.y++; score+=1; } else { lock(); } }
  function move(dx){ if(!collide(cur.x+dx,cur.y,cur.shape)){ cur.x+=dx; rotatedSinceMove = false; SFX.move(); updateGhost(); } }

  function isTSpin(){
    if(cur.type!=='T' || !rotatedSinceMove) return false;
    const cx = cur.x + 1, cy = cur.y + 1;
    let c=0;
    const corners = [[-1,-1],[1,-1],[-1,1],[1,1]];
    for(const [dx,dy] of corners){
      const x = cx+dx, y = cy+dy;
      if(x<0||x>=W||y>=H|| (y>=0 && board[y][x])) c++;
    }
    return c>=3;
  }

  function clearLines(){
    let total=0; for(let y=H-1;y>=0;y--){ if(board[y].every(v=>v)){ board.splice(y,1); board.unshift(Array(W).fill(0)); total++; y++; } }
    return total;
  }

  function updateHUD(){
    scoreEl.textContent = 'Score: ' + score;
    linesEl.textContent = 'Lines: ' + lines;
  }

  function saveBest(){ try{ if(score>best){ best=score; localStorage.setItem(HS_KEY,String(best)); bestEl.textContent='Best: '+best; } }catch(_){} }

  function drawCell(x,y,val,alpha=1){
    const cw = canvas.width/ W; const ch = canvas.height/ H;
    const px = Math.floor(x*cw), py=Math.floor(y*ch);
    ctx.globalAlpha = alpha; ctx.fillStyle = COLORS[val]||'#fff';
    ctx.fillRect(px+1, py+1, Math.floor(cw-2), Math.floor(ch-2));
    ctx.globalAlpha = 1;
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(board[y][x]) drawCell(x,y,board[y][x]); else drawCell(x,y,0); }
    if(cur){
      const s=cur.shape;
      for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++){
        const v=s[y][x]; if(!v) continue; const gx=cur.x+x, gy=ghostY+y; if(gy>=0) drawCell(gx,gy,v,0.18);
      }
      for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++){
        const v=s[y][x]; if(!v) continue; const bx=cur.x+x, by=cur.y+y; if(by>=0) drawCell(bx,by,v,1);
      }
    }
    if(gameOver){
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#e6edf3';
      ctx.textAlign = 'center';
      ctx.font = '32px system-ui, sans-serif';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 16);
      ctx.font = '18px system-ui, sans-serif';
      ctx.fillText('Score: '+score+'  |  Best: '+best, canvas.width/2, canvas.height/2 + 10);
      ctx.fillText('Press R or Space to restart', canvas.width/2, canvas.height/2 + 36);
    }
  }

  function updateGhost(){ let y = cur.y; while(!collide(cur.x, y+1, cur.shape)) y++; ghostY = y; }
  function speedForLevel(l){ return Math.max(90, 1000 - (l-1)*80); }

  let dropAcc=0; let fallDelay=speedForLevel(1);
  let running=false, gameOver=false;
  let score=0, lines=0, level=1;

  function newGame(){
    for(let y=0;y<H;y++) for(let x=0;x<W;x++) board[y][x]=0;
    score=0; lines=0; level=1; fallDelay=speedForLevel(1); dropAcc=0; running=true; gameOver=false; statusEl.textContent='Press P to Pause';
    refillBag(); holdType=null; holdUsed=false; drawHold(); drawNext();
    spawn(); updateHUD();
    ensureAudio(); startMusic();
  }

  function togglePause(){
    if(gameOver) return;
    running=!running;
    statusEl.textContent = running? 'Press P to Pause': 'Paused — Press P';
    if(running){ ensureAudio(); startMusic(); } else { stopMusic(); }
  }

  function tick(dt){ if(!running||gameOver) return; dropAcc+=dt; if(dropAcc>=fallDelay){ dropAcc%=fallDelay; softDrop(); } }

  let last = performance.now();
  function loop(){
    const now=performance.now(); const dt=Math.min(48, now-last); last=now;
    tick(dt); draw(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function onKey(e){
    if(e.code==='Space'){ if(!running||gameOver){ newGame(); } else { hardDrop(); } }
    else if(e.code==='ArrowLeft' || e.code==='KeyA'){ e.preventDefault(); if(running) move(-1); }
    else if(e.code==='ArrowRight'|| e.code==='KeyD'){ e.preventDefault(); if(running) move(1); }
    else if(e.code==='ArrowDown'|| e.code==='KeyS'){ e.preventDefault(); if(running) softDrop(); }
    else if(e.code==='ArrowUp'  || e.code==='KeyW'){ e.preventDefault(); if(running) rotate(1); }
    else if(e.code==='KeyZ'){ e.preventDefault(); if(running) rotate(-1); }
    else if(e.code==='KeyX'){ e.preventDefault(); if(running) rotate(1); }
    else if(e.code==='KeyC' || e.code==='ShiftLeft' || e.code==='ShiftRight'){ e.preventDefault(); if(running) doHold(); }
    else if(e.code==='KeyP'){ togglePause(); }
    else if(e.code==='KeyR'){ newGame(); }
  }
  window.addEventListener('keydown', onKey, {passive:false});

  function bindBtn(id, fn){ const el=document.getElementById(id); el.addEventListener('click',()=>{ if(!running||gameOver){ newGame(); } else fn(); }); }
  bindBtn('leftBtn', ()=>move(-1));
  bindBtn('rightBtn',()=>move(1));
  bindBtn('rotLBtn', ()=>rotate(-1));
  bindBtn('rotRBtn', ()=>rotate(1));
  bindBtn('hardBtn', ()=>hardDrop());

  window.addEventListener('blur', ()=>{ if(running) togglePause(); });
  window.addEventListener('beforeunload', saveBest);

  setInterval(()=>{ draw(); }, 200);
})();
</script>
</body>
</html>
