<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const holdCanvas = document.getElementById('holdCanvas');
  const holdCtx = holdCanvas.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nextCtx = nextCanvas.getContext('2d');

  // 📖 HELP refs
  const helpEl   = document.getElementById('help');
  const helpCard = document.getElementById('helpCard');
  const helpPlay = document.getElementById('helpPlay');
  const helpMute = document.getElementById('helpMute');
  const startPanel = document.getElementById('startPanel');
  const playBtn = document.getElementById('playBtn');
  const openHelpBtn = document.getElementById('openHelpBtn');
  const FOCUSABLE_SELECTOR = 'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  let helpTrigger = null;
  let helpUp = false;
  let helpMode = 'start';      // 'start' | 'pause'

  const SOUND_SHORTCUT = 'M';
  const SOUND_STORAGE_KEY = 'blockdrop.sound.v1';

  let audioCtx=null;
  const audioState = {
    gestureSeen: false,
    lastSound: null,
    lastSoundAt: null,
    soundCount: 0
  };
  let muted = !readSoundPreference();

  function readSoundPreference(){
    try{
      const stored = window.localStorage?.getItem(SOUND_STORAGE_KEY);
      if(stored === null || stored === undefined) return true;
      return stored !== 'off' && stored !== 'false' && stored !== '0';
    }catch(_){
      return true;
    }
  }

  function writeSoundPreference(enabled){
    try{ window.localStorage?.setItem(SOUND_STORAGE_KEY, enabled ? 'on' : 'off'); }catch(_){}
  }

  function noteAudioGesture(event){
    if(!event || event.isTrusted !== false) audioState.gestureSeen = true;
  }

  function hasAudioGesture(){
    if(audioState.gestureSeen) return true;
    try{
      return !!(navigator.userActivation && navigator.userActivation.hasBeenActive);
    }catch(_){
      return false;
    }
  }

  function helpFocusables(){
    return helpEl ? [...helpEl.querySelectorAll(FOCUSABLE_SELECTOR)].filter(el => el.getClientRects().length > 0) : [];
  }
  function focusHelp(){
    const target = helpPlay && helpPlay.getClientRects().length > 0 ? helpPlay : (helpFocusables()[0] || helpEl);
    if(target) target.focus({ preventScroll:true });
  }
  function restoreHelpTrigger(){
    const target = helpTrigger;
    helpTrigger = null;
    if(target && target.isConnected && target.getClientRects().length > 0) {
      setTimeout(() => target.focus({ preventScroll:true }), 0);
    }
  }

  function ensureAudio(){
    try{
      if(muted || !hasAudioGesture()) return null;
      if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; audioCtx=new AC(); }
      if(audioCtx.state==='suspended'){
        const resume = audioCtx.resume();
        if(resume && typeof resume.catch === 'function') resume.catch(()=>{});
      }
      return audioCtx;
    }catch(_){
      return null;
    }
  }
  function audioSoundAge(){
    return audioState.lastSoundAt === null ? null : Math.max(0, (performance.now() - audioState.lastSoundAt) / 1000);
  }
  function sfx(name,freq=600,dur=0.06,type='square',gain=0.06){
    audioState.lastSound = name;
    audioState.lastSoundAt = performance.now();
    if(muted) return;
    try{
      const audio = ensureAudio(); if(!audio) return;
      const t=audio.currentTime;
      const o=audio.createOscillator();
      const g=audio.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(gain,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(t+dur);
      audioState.soundCount++;
    }catch(_){}
  }
  const SFX={
    move:()=>sfx('move',520,0.05,'square',0.05),
    rotate:()=>sfx('rotate',740,0.06,'sine',0.06),
    drop:()=>sfx('drop',280,0.07,'triangle',0.06),
    clear:()=>sfx('clear',980,0.08,'sine',0.07),
    hold:()=>sfx('hold',460,0.07,'triangle',0.055),
    invalidHold:()=>sfx('invalid-hold',150,0.08,'sawtooth',0.045),
    pause:()=>sfx('pause',240,0.08,'triangle',0.04),
    resume:()=>sfx('resume',620,0.06,'sine',0.055),
    levelUp:()=>sfx('level-up',1040,0.11,'sine',0.06),
    topOut:()=>sfx('top-out',110,0.18,'triangle',0.07)
  };

  window.addEventListener('pointerdown', noteAudioGesture, { capture:true, passive:true });
  window.addEventListener('click', noteAudioGesture, { capture:true, passive:true });
  window.addEventListener('keydown', noteAudioGesture, { capture:true });

  const music={ on:false, loop:null, gain:null, note:0, bass:0, tempo:150 };
  const MELODY=[523.25,587.33,659.25,698.46,659.25,587.33,523.25,440.00,523.25,659.25,784.00,659.25,587.33,523.25,440.00,392.00];
  const BASS=[130.81,130.81,98.00,98.00,146.83,146.83,123.47,123.47];
  function startMusic(){
    if(muted) return;
    const audio = ensureAudio(); if(!audio) return;
    if(!music.gain){ music.gain=audio.createGain(); music.gain.gain.value=0.16; music.gain.connect(audio.destination); }
    if(music.on) return;
    music.on=true;
    music.loop=setInterval(()=>{
      if(!audioCtx||!music.on) return;
      const now=audioCtx.currentTime;
      const m=audioCtx.createOscillator(), mg=audioCtx.createGain();
      const b=audioCtx.createOscillator(), bg=audioCtx.createGain();
      m.type='square'; b.type='triangle';
      const mf=MELODY[music.note%MELODY.length], bf=BASS[Math.floor(music.note/4)%BASS.length];
      m.frequency.setValueAtTime(mf,now);
      b.frequency.setValueAtTime(bf,now);
      mg.gain.setValueAtTime(0.0001,now);
      mg.gain.exponentialRampToValueAtTime(0.22,now+0.02);
      mg.gain.exponentialRampToValueAtTime(0.0001,now+0.15);
      bg.gain.setValueAtTime(0.0001,now);
      bg.gain.exponentialRampToValueAtTime(0.12,now+0.02);
      bg.gain.exponentialRampToValueAtTime(0.0001,now+0.24);
      m.connect(mg).connect(music.gain);
      b.connect(bg).connect(music.gain);
      m.start(now); m.stop(now+0.16);
      b.start(now); b.stop(now+0.26);
      music.note++;
    }, music.tempo);
  }

  function showHelp(mode){ // mode: 'start' | 'pause'
    helpMode = mode;
    helpUp = true;
    helpTrigger = document.activeElement;
    if (helpEl) helpEl.classList.add('show');
    updateStartPanel();
    if (helpPlay) helpPlay.textContent = (mode === 'pause') ? 'Resume' : 'Play';
    if (mode === 'pause' && statusEl) statusEl.textContent = 'Paused - Press Space/Enter or Play';
    setTimeout(() => focusHelp(), 0);
  }

  function stopMusic(){ if(music.loop){ clearInterval(music.loop); } music.loop=null; music.on=false; }

  function updateStartPanel(){
    if (!startPanel) return;
    const show = !running && !helpUp;
    startPanel.hidden = !show;
    if (show && playBtn) playBtn.textContent = gameOver ? 'Play Again' : 'Play';
  }

  // Viewport-fit resize
  function resize(){
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const compact = vw < 720;
    const topReserve = compact ? 132 : 100;
    const bottomReserve = compact ? 84 : 20;
    const usableW = Math.max(240, vw - (compact ? 16 : 24));
    const usableH = Math.max(360, vh - topReserve - bottomReserve);
    let cell = Math.floor(Math.min(usableW/10, usableH/20));
    if (cell < 6) cell = 6;
    canvas.width = cell * 10;
    canvas.height = cell * 20;
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const levelEl = document.getElementById('level');
  const bestEl  = document.getElementById('best');
  const statusEl= document.getElementById('status');

  const HS_KEY = 'blockdrop_best';
  let best = 0; try { best = Number(localStorage.getItem(HS_KEY)||0); } catch(_) {}
  bestEl.textContent = 'Best: ' + best;

  const W = 10, H = 20;
  const empty = ()=>Array.from({length:H},()=>Array(W).fill(0));
  const board = empty();

  const COLORS = {
    0:'#0e1522',
    I:'#37b5ff',
    O:'#ffd166',
    T:'#b794f6',
    S:'#37e39f',
    Z:'#ef476f',
    J:'#6aa0ff',
    L:'#f9a857'
  };
  const PIECES = {
    I:[[ [0,0,0,0], ['I','I','I','I'], [0,0,0,0], [0,0,0,0] ]],
    O:[[ ['O','O'], ['O','O'] ]],
    T:[[ [0,'T',0], ['T','T','T'], [0,0,0] ]],
    S:[[ [0,'S','S'], ['S','S',0], [0,0,0] ]],
    Z:[[ ['Z','Z',0], [0,'Z','Z'], [0,0,0] ]],
    J:[[ ['J',0,0], ['J','J','J'], [0,0,0] ]],
    L:[[ [0,0,'L'], ['L','L','L'], [0,0,0] ]]
  };
  function rot90(m){ const h=m.length, w=m[0].length; const r=Array.from({length:w},()=>Array(h).fill(0)); for(let y=0;y<h;y++) for(let x=0;x<w;x++) r[x][h-1-y]=m[y][x]; return r; }
  for(const k of Object.keys(PIECES)){ while(PIECES[k].length<4){ PIECES[k].push(rot90(PIECES[k][PIECES[k].length-1])); } }

  const KICKS_JLSTZ = {
    '0>1': [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '1>0': [[0,0],[1,0],[1,1],[0,-2],[1,-2]],
    '1>2': [[0,0],[1,0],[1,1],[0,-2],[1,-2]],
    '2>1': [[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '2>3': [[0,0],[1,0],[1,-1],[0,2],[1,2]],
    '3>2': [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
    '3>0': [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
    '0>3': [[0,0],[1,0],[1,-1],[0,2],[1,2]]
  };
  const KICKS_I = {
    '0>1': [[0,0],[-2,0],[1,0],[-2,1],[1,-2]],
    '1>0': [[0,0],[2,0],[-1,0],[2,-1],[-1,2]],
    '1>2': [[0,0],[-1,0],[2,0],[-1,-2],[2,1]],
    '2>1': [[0,0],[1,0],[-2,0],[1,2],[-2,-1]],
    '2>3': [[0,0],[2,0],[-1,0],[2,-1],[-1,2]],
    '3>2': [[0,0],[-2,0],[1,0],[-2,1],[1,-2]],
    '3>0': [[0,0],[1,0],[-2,0],[1,2],[-2,-1]],
    '0>3': [[0,0],[-1,0],[2,0],[-1,-2],[2,1]]
  };
  function getKickData(type, from, to){
    if (type === 'O') return [[0,0]];
    const key = from + '>' + to;
    return (type === 'I' ? KICKS_I[key] : KICKS_JLSTZ[key]) || [[0,0]];
  }

  let bag = [];
  function shuffleBag(list){
    for (let i = list.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }
  function refillBag(){ bag = shuffleBag(['I','O','T','S','Z','J','L']); }
  refillBag();
  function nextType(){ if(!bag.length) refillBag(); return bag.pop(); }
  function peekNext(){ if(!bag.length) refillBag(); return bag[bag.length-1]; }

  let cur = null;
  let ghostY = 0;
  let rotatedSinceMove = false;

  const DAS = 150;
  const ARR = 30;
  const LOCK_DELAY = 500;
  const LOCK_RESET_LIMIT = 15;

  let lockTimer = 0;
  let lockResets = 0;

  let leftHeld = false;
  let rightHeld = false;
  let moveDir = 0;
  let dasTimer = 0;
  let arrTimer = 0;
  let dasActive = false;

  let combo = -1;
  let b2b = false;

  let holdType = null;
  let holdUsed = false;

  const feedback = {
    time: 0,
    particles: [],
    pops: [],
    rowFlashes: [],
    dropTrails: [],
    screenFlash: 0,
    screenShake: 0,
    lockWarning: 0,
    lastMoveAge: null,
    lastRotateAge: null,
    lastDropAge: null,
    lastLockAge: null,
    lastClearAge: null,
    lastTopOutAge: null,
    lastLevelUpAge: null,
    lastClearRows: [],
    lastClearCount: 0,
    lastClearLabel: null,
    counters: { move: 0, rotate: 0, drop: 0, lock: 0, clear: 0, topOut: 0 },
  };

  function clamp(value, min, max){ return Math.max(min, Math.min(max, value)); }
  function round(value, places = 2){ const scale = Math.pow(10, places); return Math.round(value * scale) / scale; }
  function feedbackAge(value){ return value === null ? null : round(value / 1000); }

  function pushParticle(x, y, color, vx, vy, ttl = 420, size = 0.08){
    feedback.particles.push({ x, y, color, vx, vy, age: 0, ttl, size });
    if(feedback.particles.length > 90) feedback.particles.splice(0, feedback.particles.length - 90);
  }

  function burstCells(cells, color, countPerCell = 3, speed = 0.012){
    cells.forEach((cell, cellIndex)=>{
      if(cell.y < 0) return;
      for(let i = 0; i < countPerCell; i++){
        const angle = ((i + 0.5) / countPerCell) * Math.PI * 2 + Math.sin(cell.x * 9.7 + cell.y * 3.1 + cellIndex) * 0.3;
        pushParticle(cell.x + 0.5, cell.y + 0.5, color, Math.cos(angle) * speed, Math.sin(angle) * speed, 360, 0.07);
      }
    });
  }

  function pushPop(x, y, text, color, ttl = 850, size = 0.72){
    feedback.pops.push({ x, y, text, color, age: 0, ttl, vy: -0.0012, size });
    if(feedback.pops.length > 8) feedback.pops.splice(0, feedback.pops.length - 8);
  }

  function recordMove(){
    feedback.lastMoveAge = 0;
    feedback.counters.move++;
  }

  function recordRotate(piece){
    feedback.lastRotateAge = 0;
    feedback.counters.rotate++;
    if(piece) burstCells(pieceSnapshot(piece).cells, '#a7f3d0', 1, 0.006);
  }

  function recordHardDrop(piece, fromY, toY, dropped){
    feedback.lastDropAge = 0;
    feedback.counters.drop++;
    const snap = pieceSnapshot(piece);
    snap.cells.forEach((cell)=>{
      if(cell.y < 0) return;
      feedback.dropTrails.push({
        x: cell.x,
        fromY: Math.max(0, fromY + (cell.y - toY)),
        toY: cell.y,
        value: cell.value,
        age: 0,
        ttl: 360,
      });
    });
    if(feedback.dropTrails.length > 28) feedback.dropTrails.splice(0, feedback.dropTrails.length - 28);
    burstCells(snap.cells, '#7dd3fc', dropped > 0 ? 3 : 1, 0.009);
    feedback.screenShake = Math.max(feedback.screenShake, dropped > 0 ? 0.28 : 0.12);
    pushPop(piece.x + 1.5, Math.max(1.2, piece.y), dropped > 0 ? 'DROP' : 'LOCK', '#7dd3fc', 520, 0.58);
  }

  function recordLock(piece){
    feedback.lastLockAge = 0;
    feedback.counters.lock++;
    if(piece) burstCells(piece.cells, '#fbbf24', 2, 0.007);
    feedback.screenShake = Math.max(feedback.screenShake, 0.16);
  }

  function recordLineClear(rows, count, label){
    feedback.lastClearAge = 0;
    feedback.lastClearRows = rows.slice();
    feedback.lastClearCount = count;
    feedback.lastClearLabel = label;
    feedback.counters.clear += count;
    rows.forEach((row)=>{
      feedback.rowFlashes.push({ row, age: 0, ttl: 620 });
      for(let x = 0; x < W; x += 1){
        pushParticle(x + 0.5, row + 0.5, '#fef3c7', (x - W / 2) * 0.0012, -0.01, 520, 0.075);
      }
    });
    feedback.screenFlash = Math.max(feedback.screenFlash, 0.34);
    feedback.screenShake = Math.max(feedback.screenShake, 0.18 + count * 0.08);
    pushPop(W / 2, Math.max(2, Math.min(...rows) - 0.3), label, count >= 4 ? '#facc15' : '#e0f2fe', 1050, count >= 4 ? 0.9 : 0.72);
  }

  function recordLevelUp(nextLevel){
    feedback.lastLevelUpAge = 0;
    pushPop(W / 2, 3.1, 'LEVEL ' + nextLevel, '#f9a857', 1000, 0.82);
    feedback.screenFlash = Math.max(feedback.screenFlash, 0.24);
    SFX.levelUp();
  }

  function recordTopOut(piece){
    feedback.lastTopOutAge = 0;
    feedback.counters.topOut++;
    if(piece) burstCells(piece.cells, '#fb7185', 4, 0.012);
    feedback.screenFlash = Math.max(feedback.screenFlash, 0.85);
    feedback.screenShake = Math.max(feedback.screenShake, 0.82);
    pushPop(W / 2, 5, 'TOP OUT', '#fb7185', 1200, 0.9);
    SFX.topOut();
  }

  function updateFeedback(dt){
    feedback.time += dt;
    feedback.screenFlash = Math.max(0, feedback.screenFlash - dt / 520);
    feedback.screenShake = Math.max(0, feedback.screenShake - dt / 480);
    ['lastMoveAge','lastRotateAge','lastDropAge','lastLockAge','lastClearAge','lastTopOutAge','lastLevelUpAge'].forEach((key)=>{
      if(feedback[key] !== null){
        feedback[key] += dt;
        if(feedback[key] > 6000) feedback[key] = null;
      }
    });
    feedback.particles = feedback.particles
      .map((p)=>({ ...p, x:p.x + p.vx * dt, y:p.y + p.vy * dt, age:p.age + dt }))
      .filter((p)=>p.age < p.ttl);
    feedback.pops = feedback.pops
      .map((p)=>({ ...p, y:p.y + p.vy * dt, age:p.age + dt }))
      .filter((p)=>p.age < p.ttl);
    feedback.rowFlashes = feedback.rowFlashes
      .map((flash)=>({ ...flash, age:flash.age + dt }))
      .filter((flash)=>flash.age < flash.ttl);
    feedback.dropTrails = feedback.dropTrails
      .map((trail)=>({ ...trail, age:trail.age + dt }))
      .filter((trail)=>trail.age < trail.ttl);
    feedback.lockWarning = cur && running && !gameOver && isOnGround(cur)
      ? round(clamp(lockTimer / LOCK_DELAY, 0, 1), 3)
      : 0;
  }

  function spawnWithType(type){
    const piece = { x:3, y:-2, type, rot:0, shape: PIECES[type][0] };
    if(collide(piece.x,piece.y,piece.shape)) { recordTopOut(pieceSnapshot(piece)); gameOver=true; running=false; statusEl.textContent='Game Over - Click Reset'; saveBest(); stopMusic(); updateStartPanel(); return null; }
    return piece;
  }
  function lock(){
    const lockedPiece = pieceSnapshot(cur);
    if(cur.shape.some((row, y)=> row.some((cell, x)=> cell && cur.y + y < 0))){
      merge();
      recordLock(lockedPiece);
      recordTopOut(lockedPiece);
      gameOver=true; running=false; saveBest(); stopMusic(); return;
    }
    const tspin = isTSpin();
    merge();
    const clearResult = clearLines();
    const cleared = clearResult.count;
    recordLock(lockedPiece);
    SFX.drop();
    if(cleared > 0){
      SFX.clear();
      const isB2B = (cleared === 4) || (tspin && cleared > 0);
      const baseScores = tspin ? [0,800,1200,1600] : [0,100,300,500,800];
      let pts = (baseScores[cleared] || 0) * level;
      if(isB2B && b2b) pts = Math.floor(pts * 1.5);
      combo = (combo < 0) ? 0 : combo + 1;
      if(combo > 0) pts += combo * 50 * level;
      score += pts;
      lines += cleared;
      const newLevel = 1 + Math.floor(lines / 10);
      if (newLevel !== level){
        level = newLevel;
        fallDelay = speedForLevel(level);
        recordLevelUp(newLevel);
      }
      let baseLabel;
      if(tspin){
        baseLabel = ['T-Spin Single','T-Spin Double','T-Spin Triple','T-Spin Quad'][cleared - 1] || 'T-Spin';
      } else {
        baseLabel = ['','Single!','Double!','Triple!','TETRIS!'][cleared] || 'Line Clear!';
      }
      const parts = [];
      if(isB2B && b2b) parts.push('Back-to-Back');
      parts.push(baseLabel);
      if(combo > 0) parts.push('Combo x' + combo);
      const clearLabel = parts.join(' ');
      triggerCongrats(clearLabel);
      recordLineClear(clearResult.rows, cleared, clearLabel);
      b2b = isB2B;
    } else {
      if(tspin){
        score += 400 * level;
        triggerCongrats('T-Spin!');
        pushPop(cur ? cur.x + 1.5 : W / 2, cur ? Math.max(2, cur.y) : 4, 'T-SPIN', '#c4b5fd', 820, 0.72);
        b2b = false; // zero-line T-Spin breaks B2B chain
      }
      combo = -1;
    }
    updateHUD();
    spawn();
  }

  function spawn(){
    cur = spawnWithType(nextType());
    if(!cur) return;
    rotatedSinceMove = false; holdUsed = false; clearLock(); updateGhost(); drawHold(); drawNext();
  }

  function drawMini(ctx2, canvas2, type){
    ctx2.clearRect(0,0,canvas2.width,canvas2.height);
    if(!type) return;
    const s = PIECES[type][0];
    const cell = canvas2.width/4;
    for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++){
      const v=s[y][x]; if(!v) continue; ctx2.fillStyle = COLORS[v]; ctx2.fillRect(x*cell+1,y*cell+1,cell-2,cell-2);
    }
  }
  function drawHold(){ drawMini(holdCtx, holdCanvas, holdType); }
  function drawNext(){ drawMini(nextCtx, nextCanvas, peekNext()); }

  function doHold(){
    if(!running||gameOver||!cur) return;
    if(holdUsed){ SFX.invalidHold(); return; }
    const prev = holdType;
    holdType = cur.type;
    drawHold();
    SFX.hold();
    if(prev==null){ cur = spawnWithType(nextType()); }
    else { cur = spawnWithType(prev); }
    if(!cur) return;
    holdUsed = true; rotatedSinceMove = false; clearLock(); updateGhost(); drawNext();
  }

  function collide(px,py,sh){
    for(let y=0;y<sh.length;y++) for(let x=0;x<sh[y].length;x++){
      const cell = sh[y][x];
      if(!cell) continue;
      const bx = px+x, by = py+y;
      if(bx<0||bx>=W||by>=H) return true;
      if(by>=0 && board[by][bx]) return true;
    }
    return false;
  }

  function isOnGround(piece){
    const p = piece || cur;
    if(!p) return false;
    return collide(p.x, p.y + 1, p.shape);
  }

  function clearLock(){
    lockTimer = 0;
    lockResets = 0;
  }

  function resetLockOnMove(){
    if(!cur) return;
    if(isOnGround(cur)){
      if(lockResets < LOCK_RESET_LIMIT){
        lockTimer = 0;
        lockResets++;
      }
    } else {
      clearLock();
    }
  }

  function merge(){
    const s=cur.shape; for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++){
      const v=s[y][x]; if(!v) continue; const bx=cur.x+x, by=cur.y+y; if(by>=0) board[by][bx]=v;
    }
  }

  function rotate(dir){
    if(!cur) return false;
    const from = cur.rot;
    const to = (from + (dir > 0 ? 1 : 3)) % 4;
    const s = PIECES[cur.type][to];
    const kicks = getKickData(cur.type, from, to);
    for(const [dx, dy] of kicks){
      if(!collide(cur.x + dx, cur.y + dy, s)){
        cur.rot = to;
        cur.shape = s;
        cur.x += dx;
        cur.y += dy;
        rotatedSinceMove = true;
        SFX.rotate();
        updateGhost();
        resetLockOnMove();
        recordRotate(cur);
        return true;
      }
    }
    return false;
  }

  function hardDrop(){
    if(!cur) return;
    rotatedSinceMove = false;
    const fromY = cur.y;
    let dropped = 0;
    while(!collide(cur.x, cur.y + 1, cur.shape)){
      cur.y++;
      dropped++;
    }
    if(dropped > 0){
      score += dropped * 2;
      updateGhost();
    }
    recordHardDrop(cur, fromY, cur.y, dropped);
    lock();
  }

  function stepDown(addScore){
    if(!cur) return false;
    if(!collide(cur.x, cur.y + 1, cur.shape)){
      cur.y++;
      if(addScore) score += 1;
      rotatedSinceMove = false;
      updateGhost();
      clearLock();
      return true;
    }
    return false;
  }

  function softDrop(){ if(running) stepDown(true); }
  function move(dx){
    if(!cur) return;
    if(!collide(cur.x+dx,cur.y,cur.shape)){
      cur.x+=dx;
      rotatedSinceMove = false;
      SFX.move();
      updateGhost();
      resetLockOnMove();
      recordMove();
    }
  }

  function clearMoveState(){
    leftHeld = false;
    rightHeld = false;
    moveDir = 0;
    dasTimer = 0;
    arrTimer = 0;
    dasActive = false;
  }

  function updateMoveDir(){
    const nextDir = (leftHeld === rightHeld) ? 0 : (leftHeld ? -1 : 1);
    if(nextDir !== moveDir){
      moveDir = nextDir;
      dasTimer = 0;
      arrTimer = 0;
      dasActive = false;
      if(moveDir !== 0 && running && !gameOver) move(moveDir);
    }
  }

  function handleAutoShift(dt){
    if(moveDir === 0 || !running || gameOver) return;
    if(!dasActive){
      dasTimer += dt;
      if(dasTimer < DAS) return;
      dasActive = true;
      arrTimer = 0;
      move(moveDir);
      return;
    }
    const arr = Math.max(ARR, 1);
    arrTimer += dt;
    while(arrTimer >= arr){
      arrTimer -= arr;
      move(moveDir);
      if(!running || gameOver) break;
    }
  }

  function isTSpin(){
    if(cur.type!=='T' || !rotatedSinceMove) return false;
    const cx = cur.x + 1, cy = cur.y + 1;
    let c=0;
    const corners = [[-1,-1],[1,-1],[ -1,1],[1,1]];
    for(const [dx,dy] of corners){
      const x = cx+dx, y = cy+dy;
      if(x<0||x>=W||y>=H|| (y>=0 && board[y][x])) c++;
    }
    return c>=3;
  }

  function clearLines(){
    const rows = [];
    for(let y=H-1;y>=0;y--){
      if(board[y].every(v=>v)){
        rows.push(y);
        board.splice(y,1);
        board.unshift(Array(W).fill(0));
        y++;
      }
    }
    return { count: rows.length, rows };
  }

  function updateHUD(){
    scoreEl.textContent = 'Score: ' + score;
    linesEl.textContent = 'Lines: ' + lines;
    if (levelEl) levelEl.textContent = 'Level: ' + level;
  }

  function saveBest(){ try{ if(score>best){ best=score; localStorage.setItem(HS_KEY,String(best)); bestEl.textContent='Best: '+best; } }catch(_){} }

  function drawCell(x,y,val,alpha=1){
    const cw = canvas.width/ W; const ch = canvas.height/ H;
    const px = Math.floor(x*cw), py=Math.floor(y*ch);
    ctx.globalAlpha = alpha; ctx.fillStyle = COLORS[val]||'#fff';
    ctx.fillRect(px+1, py+1, Math.floor(cw-2), Math.floor(ch-2));
    ctx.globalAlpha = 1;
  }

  function drawCellOutline(x, y, color, alpha, width = 2){
    const cw = canvas.width / W; const ch = canvas.height / H;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.strokeRect(Math.floor(x * cw) + 2, Math.floor(y * ch) + 2, Math.floor(cw - 4), Math.floor(ch - 4));
    ctx.restore();
  }

  // --- Grid overlay ---
  const GRID_COLOR = '#1a2742';
  const GRID_ALPHA = 0.25;
  function drawGrid(){
    const cw = canvas.width / W, ch = canvas.height / H;
    ctx.save();
    ctx.globalAlpha = GRID_ALPHA;
    ctx.fillStyle = GRID_COLOR;
    for (let x = 1; x < W; x++) ctx.fillRect(Math.round(x*cw), 0, 1, canvas.height);
    for (let y = 1; y < H; y++) ctx.fillRect(0, Math.round(y*ch), canvas.width, 1);
    ctx.restore();
  }

  // Congrats toast
  let congratsText = ''; let congratsTimer = 0;
  function triggerCongrats(text){ congratsText = text; congratsTimer = 1100; }
  function drawCongrats(){
    if (congratsTimer <= 0) return;
    const t = Math.max(0, Math.min(1, congratsTimer / 1100));
    const y = canvas.height * 0.26 - (1 - t) * 10;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '26px system-ui, sans-serif';
    const padX = 14;
    const w = ctx.measureText(congratsText).width + padX*2;
    const x = canvas.width/2 - w/2;
    ctx.globalAlpha = 0.55 * t; ctx.fillStyle = '#111827'; ctx.fillRect(x, y - 26, w, 36);
    ctx.globalAlpha = 0.95 * t; ctx.fillStyle = '#e6edf3'; ctx.fillText(congratsText, canvas.width/2, y);
    ctx.restore();
  }

  function drawFeedbackBehind(){
    const cw = canvas.width / W;
    const ch = canvas.height / H;
    ctx.save();
    feedback.dropTrails.forEach((trail)=>{
      const t = Math.max(0, 1 - trail.age / trail.ttl);
      const x = trail.x * cw + cw / 2;
      const y1 = Math.max(0, trail.fromY * ch + ch / 2);
      const y2 = trail.toY * ch + ch / 2;
      ctx.globalAlpha = 0.28 * t;
      ctx.strokeStyle = COLORS[trail.value] || '#7dd3fc';
      ctx.lineWidth = Math.max(2, cw * 0.22);
      ctx.beginPath();
      ctx.moveTo(x, y1);
      ctx.lineTo(x, y2);
      ctx.stroke();
    });
    feedback.rowFlashes.forEach((flash)=>{
      const t = Math.max(0, 1 - flash.age / flash.ttl);
      ctx.globalAlpha = 0.18 + 0.42 * t;
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(0, flash.row * ch, canvas.width, ch);
      ctx.globalAlpha = 0.6 * t;
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = Math.max(1, ch * 0.08);
      ctx.strokeRect(1, flash.row * ch + 1, canvas.width - 2, ch - 2);
    });
    ctx.restore();
  }

  function drawLockWarning(){
    if(!cur || feedback.lockWarning <= 0) return;
    const alpha = 0.22 + feedback.lockWarning * 0.48;
    const pulse = 0.6 + Math.abs(Math.sin(feedback.time / 65)) * 0.4;
    pieceSnapshot(cur).cells.forEach((cell)=>{
      if(cell.y >= 0) drawCellOutline(cell.x, cell.y, '#facc15', alpha * pulse, Math.max(1.5, canvas.width / W * 0.07));
    });
  }

  function drawFeedbackOverlay(){
    const cw = canvas.width / W;
    const ch = canvas.height / H;
    ctx.save();
    feedback.particles.forEach((particle)=>{
      const t = Math.max(0, 1 - particle.age / particle.ttl);
      ctx.globalAlpha = t;
      ctx.fillStyle = particle.color;
      ctx.beginPath();
      ctx.arc(particle.x * cw, particle.y * ch, Math.max(2, cw * particle.size), 0, Math.PI * 2);
      ctx.fill();
    });
    feedback.pops.forEach((pop)=>{
      const t = Math.max(0, 1 - pop.age / pop.ttl);
      ctx.globalAlpha = t;
      ctx.font = '800 ' + Math.max(14, cw * pop.size) + 'px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(3, cw * 0.1);
      ctx.strokeStyle = 'rgba(6, 10, 18, 0.86)';
      ctx.fillStyle = pop.color;
      ctx.strokeText(pop.text, pop.x * cw, pop.y * ch);
      ctx.fillText(pop.text, pop.x * cw, pop.y * ch);
    });
    ctx.restore();
  }

  function drawScreenFeedback(){
    if(feedback.screenFlash <= 0) return;
    ctx.save();
    ctx.fillStyle = 'rgba(248, 113, 113, ' + Math.min(0.25, feedback.screenFlash * 0.22) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const shake = feedback.screenShake > 0 ? feedback.screenShake * Math.max(1, canvas.width / W * 0.12) : 0;
    const shakeX = shake ? Math.sin(feedback.time * 0.12) * shake : 0;
    const shakeY = shake ? Math.cos(feedback.time * 0.16) * shake : 0;
    ctx.save();
    if(shake) ctx.translate(shakeX, shakeY);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(board[y][x]) drawCell(x,y,board[y][x]); else drawCell(x,y,0); }
    drawFeedbackBehind();
    if(cur){
      const s=cur.shape;
      for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++){
        const v=s[y][x]; if(!v) continue; const gx=cur.x+x, gy=ghostY+y; if(gy>=0) drawCell(gx,gy,v,0.18);
      }
      for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++){
        const v=s[y][x]; if(!v) continue; const bx=cur.x+x, by=cur.y+y; if(by>=0) drawCell(bx,by,v,1);
      }
    }
    drawLockWarning();
    drawGrid();
    drawFeedbackOverlay();
    drawCongrats();

    if(gameOver){
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#e6edf3';
      ctx.textAlign = 'center';
      ctx.font = '32px system-ui, sans-serif';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 16);
      ctx.font = '18px system-ui, sans-serif';
      ctx.fillText('Score: '+score+'  |  Best: '+best, canvas.width/2, canvas.height/2 + 10);
      ctx.fillText('Press Space or click Reset to restart', canvas.width/2, canvas.height/2 + 36);
    }
    ctx.restore();
    drawScreenFeedback();
  }

  function updateGhost(){ let y = cur.y; while(!collide(cur.x, y+1, cur.shape)) y++; ghostY = y; }

  // Exponential speed curve like modern Tetris; clamp at 60ms/step.
  function speedForLevel(l){
    // NES frames/row @60Hz: 0:48,1:43,2:38,3:33,4:28,5:23,6:18,7:13,8:8,9:6,
    // 10-12:5, 13-15:4, 16-18:3, 19-28:2, 29+:1
    const L = Math.max(0, l - 1);
    let frames;
    if (L <= 9)        frames = [48,43,38,33,28,23,18,13,8,6][L];
    else if (L <= 12)  frames = 5;
    else if (L <= 15)  frames = 4;
    else if (L <= 18)  frames = 3;
    else if (L <= 28)  frames = 2;
    else               frames = 1;

    return Math.max(16, Math.round(frames * (1000/60))); // ms per row
  }


  let dropAcc=0; let fallDelay=speedForLevel(1);
  let running=false, gameOver=false;
  let score=0, lines=0, level=1;

  function newGame(){
    for(let y=0;y<H;y++) for(let x=0;x<W;x++) board[y][x]=0;
    score=0; lines=0; level=1; fallDelay=speedForLevel(1); dropAcc=0; running=true; gameOver=false; statusEl.textContent='Press P to Pause';
    combo = -1; b2b = false; clearLock(); clearMoveState();
    feedback.particles = []; feedback.pops = []; feedback.rowFlashes = []; feedback.dropTrails = [];
    feedback.screenFlash = 0; feedback.screenShake = 0; feedback.lockWarning = 0;
    feedback.lastMoveAge = feedback.lastRotateAge = feedback.lastDropAge = feedback.lastLockAge = feedback.lastClearAge = feedback.lastTopOutAge = feedback.lastLevelUpAge = null;
    feedback.lastClearRows = []; feedback.lastClearCount = 0; feedback.lastClearLabel = null;
    feedback.counters.move = 0; feedback.counters.rotate = 0; feedback.counters.drop = 0; feedback.counters.lock = 0; feedback.counters.clear = 0; feedback.counters.topOut = 0;
    refillBag(); holdType=null; holdUsed=false; drawHold(); drawNext();
    spawn(); updateHUD();
    updateStartPanel();
    ensureAudio(); if(!muted) startMusic(); else stopMusic();
  }

  function togglePause(){
    if(gameOver) return;
    if(running){
      running = false;
      clearMoveState();
      SFX.pause();
      stopMusic();
      showHelp('pause');                 // show instructions on pause
    } else {
      // If overlay is hidden (edge case), allow P to resume directly.
      if (!helpUp){
        clearMoveState();
        running = true;
        if (statusEl) statusEl.textContent = 'Press P to Pause';
        updateStartPanel();
        ensureAudio(); if (!muted) startMusic();
        SFX.resume();
      }
    }
  }


  function tick(dt){
    updateFeedback(dt);
    if(!running || gameOver) return;
    dropAcc += dt;
    if (congratsTimer > 0) congratsTimer -= dt;

    while (dropAcc >= fallDelay){
      dropAcc -= fallDelay;
      if(!stepDown(false)) break;
    }

    handleAutoShift(dt);

    if(cur && isOnGround(cur)){
      lockTimer += dt;
      if(lockTimer >= LOCK_DELAY){
        lock();
        return;
      }
    } else {
      clearLock();
    }
  }


  let last = performance.now();
  function loop(){
    const now=performance.now(); const dt=Math.min(48, now-last); last=now;
    tick(dt); draw(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function onKey(e){
    if (e.code === 'Key' + SOUND_SHORTCUT){
      e.preventDefault();
      setMuted(!muted);
      return;
    }
    // HELP: while overlay is up, only Space/Enter (and P if paused) dismiss it
    if (helpUp){
      if (e.code === 'Tab') {
        const focusables = helpFocusables();
        if (focusables.length) {
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus({ preventScroll:true });
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus({ preventScroll:true });
          }
        }
        return;
      }
      if (
        e.code === 'Space' ||
        e.code === 'Enter' ||
        (helpMode === 'pause' && e.code === 'KeyP') // resume with P
      ){
        e.preventDefault();
        dismissHelp(helpMode === 'pause' ? 'resume' : 'start');
      } else if (e.code === 'Escape' && helpMode === 'start') {
        e.preventDefault();
        hideHelp();
      }
      return;
    }
    if (e.target && e.target.closest && e.target.closest('button, a, input, select, textarea') && e.code !== 'Tab' && e.code !== 'Escape') return;

    const isLeft = (e.code === 'ArrowLeft' || e.code === 'KeyA');
    const isRight = (e.code === 'ArrowRight' || e.code === 'KeyD');
    if (isLeft || isRight){
      e.preventDefault();
      if (e.repeat) return;
      if (running){
        if (isLeft) leftHeld = true;
        if (isRight) rightHeld = true;
        updateMoveDir();
      }
      return;
    }

    if(e.code==='Space'){ if(!running||gameOver){ newGame(); } else { hardDrop(); } }
    else if(e.code==='ArrowDown'|| e.code==='KeyS'){ e.preventDefault(); if(running) softDrop(); }
    else if(e.code==='ArrowUp'  || e.code==='KeyW'){ e.preventDefault(); if(running) rotate(1); }
    else if(e.code==='KeyZ'){ e.preventDefault(); if(running) rotate(-1); }
    else if(e.code==='KeyX'){ e.preventDefault(); if(running) rotate(1); }
    else if(e.code==='KeyC' || e.code==='ShiftLeft' || e.code==='ShiftRight'){ e.preventDefault(); if(running) doHold(); }
    else if(e.code==='KeyP'){ togglePause(); }
  }

  function onKeyUp(e){
    const isLeft = (e.code === 'ArrowLeft' || e.code === 'KeyA');
    const isRight = (e.code === 'ArrowRight' || e.code === 'KeyD');
    if (isLeft || isRight){
      e.preventDefault();
      if (isLeft) leftHeld = false;
      if (isRight) rightHeld = false;
      updateMoveDir();
    }
  }
  window.addEventListener('keydown', onKey, {passive:false});
  window.addEventListener('keyup', onKeyUp, {passive:false});

  function bindBtn(id, fn){
    const el=document.getElementById(id);
    if(!el) return;
    el.addEventListener('click',()=>{ if(gameOver){ newGame(); } else if(!running){ togglePause(); fn(); } else { fn(); } });
  }

  function bindHoldBtn(id, dir){
    const el=document.getElementById(id);
    if(!el) return;
    const setHeld = (isDown)=>{
      if(!running || gameOver){
        if(isDown) newGame();
        return;
      }
      if(dir === 'left') leftHeld = isDown;
      if(dir === 'right') rightHeld = isDown;
      updateMoveDir();
    };
    el.addEventListener('pointerdown',(e)=>{
      e.preventDefault();
      if(el.setPointerCapture) el.setPointerCapture(e.pointerId);
      setHeld(true);
    });
    const clear = (e)=>{ if(e) e.preventDefault(); setHeld(false); };
    el.addEventListener('pointerup', clear);
    el.addEventListener('pointercancel', clear);
    el.addEventListener('pointerleave', clear);
  }

  bindHoldBtn('leftBtn', 'left');
  bindHoldBtn('rightBtn', 'right');
  bindBtn('rotLBtn', ()=>rotate(-1));
  bindBtn('rotRBtn', ()=>rotate(1));
  bindBtn('hardBtn', ()=>hardDrop());

  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.addEventListener('click', () => newGame());
  if (playBtn) playBtn.addEventListener('click', () => newGame());
  if (openHelpBtn) openHelpBtn.addEventListener('click', () => showHelp('start'));

  // 🔊 Sound toggle (HUD)
  const soundBtn = document.getElementById('soundBtn');
  function updateSoundBtn(){
    const label = muted ? 'Sound: Off' : 'Sound: On';
    const text = label + ' (' + SOUND_SHORTCUT + ')';
    if(soundBtn){
      soundBtn.textContent = text;
      soundBtn.setAttribute('aria-label', 'Toggle sound (' + SOUND_SHORTCUT + ')');
      soundBtn.setAttribute('aria-pressed', muted ? 'false' : 'true');
    }
    if(helpMute) helpMute.textContent = text;
  }
  function setMuted(m){
    muted = !!m; writeSoundPreference(!muted); updateSoundBtn();
    if(muted){ stopMusic(); } else if(running && !gameOver){ ensureAudio(); startMusic(); }
  }
  if (soundBtn) soundBtn.addEventListener('click', ()=> setMuted(!muted));

  // 📖 HELP wiring
  function hideHelp(){
    helpUp = false;
    if (helpEl) helpEl.classList.remove('show');
    updateStartPanel();
    restoreHelpTrigger();
  }

  function dismissHelp(action){ // 'start' | 'resume'
    hideHelp();
    if (action === 'start'){
      newGame();
    } else if (action === 'resume'){
      clearMoveState();
      running = true;
      if (statusEl) statusEl.textContent = 'Press P to Pause';
      updateStartPanel();
      ensureAudio(); if (!muted) startMusic();
      SFX.resume();
    }
  }

  if (helpPlay) helpPlay.addEventListener('click', ()=> dismissHelp(helpMode === 'pause' ? 'resume' : 'start'));
  if (helpMute) helpMute.addEventListener('click', ()=> setMuted(!muted));
  if (helpEl)   helpEl.addEventListener('click',  ()=> helpMode === 'pause' ? dismissHelp('resume') : hideHelp());
  if (helpCard) helpCard.addEventListener('click', (e)=> e.stopPropagation());

  updateSoundBtn();
  updateStartPanel();

  window.addEventListener('blur', ()=>{ if(running) togglePause(); });
  window.addEventListener('beforeunload', saveBest);

  // Diagnostics for automated smoke/debug tooling.
  function pieceSnapshot(piece){
    if(!piece) return null;
    const cells = [];
    for(let y=0;y<piece.shape.length;y++){
      for(let x=0;x<piece.shape[y].length;x++){
        if(piece.shape[y][x]) cells.push({ x: piece.x + x, y: piece.y + y, value: piece.shape[y][x] });
      }
    }
    return { type: piece.type, x: piece.x, y: piece.y, rot: piece.rot, cells };
  }

  function occupiedCells(){
    const cells = [];
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        if(board[y][x]) cells.push({ x, y, value: board[y][x] });
      }
    }
    return cells;
  }

  function renderGameToText(){
    const occupied = occupiedCells();
    const lastSoundAge = audioSoundAge();
    return JSON.stringify({
      game: 'Block Drop',
      coordinateSystem: 'grid cells, origin top-left, x right, y down',
      grid: { width: W, height: H },
      running: !!running,
      paused: !running && !gameOver && !helpUp,
      helpOpen: !!helpUp,
      helpMode,
      gameOver: !!gameOver,
      score,
      best,
      lines,
      level,
      current: pieceSnapshot(cur),
      hold: { type: holdType, used: !!holdUsed },
      next: bag.length ? bag[bag.length - 1] : null,
      ghostY,
      occupiedCount: occupied.length,
      occupiedCells: occupied.slice(0, 80),
      timers: {
        dropAcc: Math.round(dropAcc),
        fallDelay,
        lockTimer: Math.round(lockTimer),
        lockResets,
        dasTimer: Math.round(dasTimer),
        arrTimer: Math.round(arrTimer),
        moveDir
      },
      combo,
      backToBack: !!b2b,
      feedback: {
        lastMoveAge: feedbackAge(feedback.lastMoveAge),
        lastRotateAge: feedbackAge(feedback.lastRotateAge),
        lastDropAge: feedbackAge(feedback.lastDropAge),
        lastLockAge: feedbackAge(feedback.lastLockAge),
        lastClearAge: feedbackAge(feedback.lastClearAge),
        lastTopOutAge: feedbackAge(feedback.lastTopOutAge),
        lastLevelUpAge: feedbackAge(feedback.lastLevelUpAge),
        lastClearRows: feedback.lastClearRows.slice(),
        lastClearCount: feedback.lastClearCount,
        lastClearLabel: feedback.lastClearLabel,
        lockWarning: feedback.lockWarning,
        moveCount: feedback.counters.move,
        rotateCount: feedback.counters.rotate,
        dropCount: feedback.counters.drop,
        lockCount: feedback.counters.lock,
        clearCount: feedback.counters.clear,
        topOutCount: feedback.counters.topOut,
        particleCount: feedback.particles.length + feedback.rowFlashes.length + feedback.dropTrails.length,
        popupCount: feedback.pops.length,
        screenFlash: round(feedback.screenFlash, 3),
        screenShake: round(feedback.screenShake, 3)
      },
      audio: {
        muted: !!muted,
        soundEnabled: !muted,
        musicOn: !!music.on,
        audioReady: !!audioCtx,
        audioState: audioCtx ? audioCtx.state : null,
        lastSound: audioState.lastSound,
        lastSoundAge: lastSoundAge === null ? null : round(lastSoundAge),
        soundCount: audioState.soundCount,
        persistedKey: SOUND_STORAGE_KEY
      },
      muted: !!muted,
      status: statusEl.textContent
    });
  }

  window.render_game_to_text = renderGameToText;
  window.advanceTime = function advanceTime(ms = 0){
    const steps = Math.max(1, Math.round(Math.max(0, ms) / (1000 / 60)));
    for(let i = 0; i < steps; i++){
      tick(1000 / 60);
    }
    draw();
    return renderGameToText();
  };


})();
</script>
