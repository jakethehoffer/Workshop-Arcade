<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const TAU = Math.PI * 2;
  const BEST_KEY = "packet-pilot.bestScore.v1";
  const SOUND_KEY = "packet-pilot.sound.v1";
  const dirs = ["up", "right", "down", "left"];
  const vec = {
    up: { x: 0, y: -1, label: "U" },
    right: { x: 1, y: 0, label: "R" },
    down: { x: 0, y: 1, label: "D" },
    left: { x: -1, y: 0, label: "L" }
  };
  const els = {
    stage: document.getElementById("stageValue"),
    score: document.getElementById("scoreValue"),
    best: document.getElementById("bestValue"),
    goal: document.getElementById("goalValue"),
    lost: document.getElementById("lostValue"),
    steps: document.getElementById("stepValue"),
    time: document.getElementById("timeValue"),
    status: document.getElementById("statusLine"),
    flow: document.getElementById("flowBtn"),
    cycle: document.getElementById("cycleBtn"),
    cycleTouch: document.getElementById("cycleTouchBtn"),
    restart: document.getElementById("restartBtn"),
    sound: document.getElementById("soundBtn"),
    full: document.getElementById("fullBtn"),
    goalPill: document.getElementById("goalPill"),
    stepPill: document.getElementById("stepPill"),
    timePill: document.getElementById("timePill")
  };

  const STAGES = [
    {
      name: "Loopback Lab",
      goal: 3,
      packetLimit: 5,
      maxLost: 2,
      stepBudget: 8,
      timeLimit: 18,
      interval: 1.35,
      speed: 0.55,
      source: "A",
      target: "E",
      nodes: [
        { id: "A", x: 0.15, y: 0.50, type: "source" },
        { id: "B", x: 0.34, y: 0.32 },
        { id: "C", x: 0.34, y: 0.68 },
        { id: "D", x: 0.58, y: 0.50 },
        { id: "E", x: 0.82, y: 0.50, type: "target" }
      ],
      links: [
        ["A", "B", "up"], ["A", "C", "down"], ["B", "D", "right"], ["C", "D", "right"], ["D", "E", "right"], ["D", "B", "left"]
      ],
      routers: { A: "down", B: "right", C: "right", D: "right" }
    },
    {
      name: "Firewall Fork",
      goal: 4,
      packetLimit: 6,
      maxLost: 1,
      stepBudget: 9,
      timeLimit: 20,
      interval: 1.18,
      speed: 0.58,
      source: "A",
      target: "G",
      nodes: [
        { id: "A", x: 0.12, y: 0.50, type: "source" },
        { id: "B", x: 0.30, y: 0.50 },
        { id: "C", x: 0.48, y: 0.28 },
        { id: "D", x: 0.48, y: 0.72, type: "drop" },
        { id: "E", x: 0.66, y: 0.28 },
        { id: "F", x: 0.66, y: 0.72 },
        { id: "G", x: 0.84, y: 0.50, type: "target" }
      ],
      links: [
        ["A", "B", "right"], ["B", "C", "up"], ["B", "D", "down"], ["C", "E", "right"], ["D", "F", "right"], ["E", "G", "right"], ["F", "G", "right"], ["E", "B", "left"]
      ],
      routers: { A: "right", B: "down", C: "right", D: "right", E: "left", F: "right" }
    },
    {
      name: "Clocked Relay",
      goal: 4,
      packetLimit: 7,
      maxLost: 2,
      stepBudget: 10,
      timeLimit: 22,
      interval: 1.05,
      speed: 0.6,
      source: "A",
      target: "H",
      nodes: [
        { id: "A", x: 0.10, y: 0.30, type: "source" },
        { id: "B", x: 0.28, y: 0.30 },
        { id: "C", x: 0.28, y: 0.70 },
        { id: "D", x: 0.46, y: 0.30 },
        { id: "E", x: 0.46, y: 0.70 },
        { id: "F", x: 0.64, y: 0.50 },
        { id: "G", x: 0.64, y: 0.82, type: "drop" },
        { id: "H", x: 0.84, y: 0.50, type: "target" }
      ],
      links: [
        ["A", "B", "right"], ["B", "C", "down"], ["B", "D", "right"], ["C", "E", "right"], ["D", "F", "right"], ["E", "F", "right"], ["F", "H", "right"], ["F", "G", "down"], ["E", "C", "left"], ["D", "B", "left"]
      ],
      routers: { A: "right", B: "right", C: "right", D: "right", E: "right", F: "down" }
    },
    {
      name: "Branch Cache",
      goal: 5,
      packetLimit: 8,
      maxLost: 2,
      stepBudget: 12,
      timeLimit: 24,
      interval: 0.95,
      speed: 0.62,
      source: "A",
      target: "I",
      nodes: [
        { id: "A", x: 0.10, y: 0.50, type: "source" },
        { id: "B", x: 0.26, y: 0.50 },
        { id: "C", x: 0.42, y: 0.22 },
        { id: "D", x: 0.42, y: 0.50 },
        { id: "E", x: 0.42, y: 0.78 },
        { id: "F", x: 0.60, y: 0.22, type: "drop" },
        { id: "G", x: 0.60, y: 0.50 },
        { id: "H", x: 0.60, y: 0.78 },
        { id: "I", x: 0.84, y: 0.50, type: "target" }
      ],
      links: [
        ["A", "B", "right"], ["B", "C", "up"], ["B", "D", "right"], ["B", "E", "down"], ["C", "F", "right"], ["C", "G", "down"], ["D", "G", "right"], ["E", "H", "right"], ["H", "G", "up"], ["G", "I", "right"], ["G", "D", "left"], ["H", "I", "right"]
      ],
      routers: { A: "right", B: "up", C: "right", D: "right", E: "right", G: "left", H: "right" }
    },
    {
      name: "Core Uplink",
      goal: 6,
      packetLimit: 9,
      maxLost: 2,
      stepBudget: 14,
      timeLimit: 26,
      interval: 0.86,
      speed: 0.66,
      source: "A",
      target: "J",
      nodes: [
        { id: "A", x: 0.10, y: 0.48, type: "source" },
        { id: "B", x: 0.24, y: 0.30 },
        { id: "C", x: 0.24, y: 0.66 },
        { id: "D", x: 0.40, y: 0.30 },
        { id: "E", x: 0.40, y: 0.66 },
        { id: "F", x: 0.56, y: 0.20, type: "drop" },
        { id: "G", x: 0.56, y: 0.48 },
        { id: "H", x: 0.56, y: 0.76 },
        { id: "I", x: 0.72, y: 0.48 },
        { id: "J", x: 0.88, y: 0.48, type: "target" }
      ],
      links: [
        ["A", "B", "up"], ["A", "C", "down"], ["B", "D", "right"], ["C", "E", "right"], ["D", "F", "up"], ["D", "G", "down"], ["E", "H", "down"], ["E", "G", "up"], ["G", "I", "right"], ["H", "I", "right"], ["I", "J", "right"], ["I", "G", "left"], ["G", "D", "up"], ["H", "E", "up"]
      ],
      routers: { A: "down", B: "right", C: "right", D: "up", E: "up", G: "left", H: "right", I: "left" }
    }
  ];

  const storage = {
    getNumber(key, fallback) {
      try {
        const raw = window.localStorage.getItem(key);
        const value = Number(raw);
        return Number.isFinite(value) ? value : fallback;
      } catch {
        return fallback;
      }
    },
    getBool(key, fallback) {
      try {
        const raw = window.localStorage.getItem(key);
        if (raw === null) return fallback;
        return raw === "1" || raw === "true";
      } catch {
        return fallback;
      }
    },
    set(key, value) {
      try {
        window.localStorage.setItem(key, String(value));
      } catch {}
    }
  };

  let audioCtx = null;
  let userGesture = false;
  let lastSound = "none";
  let packetSeq = 1;
  const state = {
    mode: "setup",
    stageIndex: 0,
    score: 0,
    bestScore: storage.getNumber(BEST_KEY, 0),
    delivered: 0,
    lost: 0,
    stageDelivered: 0,
    stageLost: 0,
    spawned: 0,
    packets: [],
    routers: {},
    cursorId: "",
    selectedId: "",
    stepsRemaining: 0,
    timeRemaining: 0,
    spawnTimer: 0,
    feedback: "ready",
    feedbackMs: 0,
    soundEnabled: storage.getBool(SOUND_KEY, true),
    complete: false,
    gameOver: false,
    pulse: 0
  };

  function stage() {
    return STAGES[state.stageIndex];
  }

  function nodeMap() {
    return new Map(stage().nodes.map((node) => [node.id, node]));
  }

  function getNode(id) {
    return nodeMap().get(id);
  }

  function linkData() {
    const nodes = nodeMap();
    return stage().links.map(([from, to, explicitDir]) => {
      const a = nodes.get(from);
      const b = nodes.get(to);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      let dir = explicitDir || (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      return { from, to, dir, length: Math.hypot(dx, dy) };
    });
  }

  function exitsFor(id) {
    return linkData().filter((link) => link.from === id);
  }

  function routerChoices(id) {
    return dirs.filter((dir) => exitsFor(id).some((link) => link.dir === dir));
  }

  function activeRouter(id) {
    return state.routers[id] || null;
  }

  function routeFrom(id) {
    const wanted = activeRouter(id);
    const exits = exitsFor(id);
    return exits.find((link) => link.dir === wanted) || null;
  }

  function markGesture() {
    userGesture = true;
    canvas.focus({ preventScroll: true });
  }

  function ensureAudio() {
    if (!state.soundEnabled || !userGesture || audioCtx) return;
    const AudioType = window.AudioContext || window.webkitAudioContext;
    if (!AudioType) return;
    try {
      audioCtx = new AudioType();
    } catch {}
  }

  function playSound(name) {
    lastSound = state.soundEnabled ? name : `muted-${name}`;
    if (!state.soundEnabled || !userGesture) return;
    ensureAudio();
    if (!audioCtx) return;
    const map = { route: 360, start: 440, pause: 210, deliver: 760, lost: 130, clear: 620, over: 90, next: 520, full: 300 };
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = name === "lost" || name === "over" ? "sawtooth" : "triangle";
    osc.frequency.setValueAtTime(map[name] || 320, now);
    if (name === "clear") osc.frequency.linearRampToValueAtTime(880, now + 0.16);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.055, now + 0.014);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.2);
  }

  function resetStage(index = state.stageIndex) {
    state.stageIndex = Math.max(0, Math.min(STAGES.length - 1, index));
    const current = stage();
    state.mode = "setup";
    state.stageDelivered = 0;
    state.stageLost = 0;
    state.spawned = 0;
    state.packets = [];
    state.routers = { ...current.routers };
    state.cursorId = current.nodes.find((node) => !node.type || node.type === "source")?.id || current.nodes[0].id;
    state.selectedId = state.cursorId;
    state.stepsRemaining = current.stepBudget;
    state.timeRemaining = current.timeLimit;
    state.spawnTimer = 0;
    state.feedback = `${current.name}: route ${current.goal} packets`;
    state.feedbackMs = 900;
    state.complete = false;
    state.gameOver = false;
    render();
  }

  function restartRun() {
    state.score = 0;
    state.delivered = 0;
    state.lost = 0;
    packetSeq = 1;
    resetStage(0);
    playSound("next");
  }

  function updateBest() {
    if (state.score > state.bestScore) {
      state.bestScore = state.score;
      storage.set(BEST_KEY, state.bestScore);
    }
  }

  function setFeedback(text, ms = 650) {
    state.feedback = text;
    state.feedbackMs = ms;
  }

  function cycleRouter(id = state.selectedId) {
    if (state.gameOver || state.complete || state.mode === "running") {
      setFeedback(state.mode === "running" ? "pause before rerouting" : "restart for new route", 520);
      playSound("pause");
      render();
      return;
    }
    const node = getNode(id);
    if (!node || node.type === "target" || node.type === "drop") {
      setFeedback("node has no router", 460);
      playSound("pause");
      render();
      return;
    }
    if (state.stepsRemaining <= 0) {
      state.mode = "game-over";
      state.gameOver = true;
      setFeedback("step budget expired", 900);
      updateBest();
      playSound("over");
      render();
      return;
    }
    const choices = routerChoices(id);
    if (!choices.length) return;
    const current = activeRouter(id);
    const next = choices[(choices.indexOf(current) + 1 + choices.length) % choices.length];
    state.routers[id] = next;
    state.stepsRemaining -= 1;
    state.selectedId = id;
    state.cursorId = id;
    setFeedback(`${id} routes ${next}`, 520);
    playSound("route");
    render();
  }

  function startPause() {
    if (state.complete) {
      restartRun();
      return;
    }
    if (state.mode === "stage-clear") {
      resetStage(state.stageIndex + 1);
      playSound("next");
      return;
    }
    if (state.gameOver) {
      restartRun();
      return;
    }
    if (state.mode === "running") {
      state.mode = "paused";
      setFeedback("packet stream paused", 540);
      playSound("pause");
    } else {
      state.mode = "running";
      state.spawnTimer = 0;
      setFeedback("packet stream live", 540);
      playSound("start");
    }
    render();
  }

  function spawnPacket() {
    if (state.spawned >= stage().packetLimit) return;
    const first = routeFrom(stage().source);
    state.spawned += 1;
    if (!first) {
      losePacket({ id: packetSeq++, reason: "source-unrouted" });
      return;
    }
    const fromNode = getNode(first.from);
    const toNode = getNode(first.to);
    state.packets.push({
      id: packetSeq++,
      from: first.from,
      to: first.to,
      dir: first.dir,
      progress: 0,
      speed: stage().speed / Math.max(0.1, first.length),
      x: fromNode.x,
      y: fromNode.y,
      hops: 0,
      path: [first.from],
      colorPhase: state.spawned % 3
    });
    setFeedback(`packet ${state.spawned} launched`, 360);
  }

  function losePacket(packet) {
    state.stageLost += 1;
    state.lost += 1;
    setFeedback(`packet lost: ${packet.reason || "bad route"}`, 720);
    playSound("lost");
    if (state.stageLost > stage().maxLost) {
      endGame("loss budget exceeded");
    }
  }

  function deliverPacket(packet) {
    state.stageDelivered += 1;
    state.delivered += 1;
    const timeBonus = Math.max(0, Math.ceil(state.timeRemaining * 3));
    const stepBonus = Math.max(0, state.stepsRemaining * 4);
    state.score += 120 + timeBonus + stepBonus;
    setFeedback(`delivered ${state.stageDelivered}/${stage().goal}`, 600);
    playSound("deliver");
    if (state.stageDelivered >= stage().goal) clearStage();
  }

  function clearStage() {
    const current = stage();
    state.score += 300 + Math.round(state.timeRemaining * 10) + state.stepsRemaining * 18;
    updateBest();
    if (state.stageIndex >= STAGES.length - 1) {
      state.mode = "complete";
      state.complete = true;
      state.gameOver = false;
      setFeedback("run complete: uplink stable", 1200);
      playSound("clear");
    } else {
      state.mode = "stage-clear";
      setFeedback(`${current.name} clear`, 1000);
      playSound("clear");
    }
    state.packets = [];
  }

  function endGame(reason) {
    state.mode = "game-over";
    state.gameOver = true;
    state.complete = false;
    state.packets = [];
    setFeedback(reason, 1100);
    updateBest();
    playSound("over");
  }

  function advancePacket(packet, dt) {
    const a = getNode(packet.from);
    const b = getNode(packet.to);
    packet.progress += dt * packet.speed;
    const t = Math.min(1, packet.progress);
    packet.x = a.x + (b.x - a.x) * t;
    packet.y = a.y + (b.y - a.y) * t;
    if (packet.progress < 1) return true;
    packet.hops += 1;
    packet.path.push(packet.to);
    const arrived = getNode(packet.to);
    if (arrived.type === "target") {
      deliverPacket(packet);
      return false;
    }
    if (arrived.type === "drop") {
      packet.reason = "firewall";
      losePacket(packet);
      return false;
    }
    if (packet.hops > 12 || packet.path.filter((id) => id === packet.to).length > 3) {
      packet.reason = "loop";
      losePacket(packet);
      return false;
    }
    const next = routeFrom(packet.to);
    if (!next) {
      packet.reason = "unrouted";
      losePacket(packet);
      return false;
    }
    packet.from = next.from;
    packet.to = next.to;
    packet.dir = next.dir;
    packet.progress = 0;
    packet.speed = stage().speed / Math.max(0.1, next.length);
    return true;
  }

  function update(dt) {
    state.pulse += dt;
    state.feedbackMs = Math.max(0, state.feedbackMs - dt * 1000);
    if (state.mode !== "running") return;
    state.timeRemaining = Math.max(0, state.timeRemaining - dt);
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0 && state.spawned < stage().packetLimit) {
      spawnPacket();
      state.spawnTimer += stage().interval;
    }
    state.packets = state.packets.filter((packet) => advancePacket(packet, dt));
    if (state.mode !== "running") return;
    const exhausted = state.spawned >= stage().packetLimit && state.packets.length === 0 && state.stageDelivered < stage().goal;
    if (state.timeRemaining <= 0) endGame("time budget expired");
    else if (exhausted) endGame("packet pool exhausted");
  }

  function moveCursor(dx, dy) {
    const current = getNode(state.cursorId) || stage().nodes[0];
    let best = null;
    let bestScore = Infinity;
    for (const node of stage().nodes) {
      if (node.id === current.id) continue;
      const vx = node.x - current.x;
      const vy = node.y - current.y;
      if (dx && Math.sign(vx) !== Math.sign(dx)) continue;
      if (dy && Math.sign(vy) !== Math.sign(dy)) continue;
      const primary = dx ? Math.abs(vx) : Math.abs(vy);
      if (primary < 0.02) continue;
      const secondary = dx ? Math.abs(vy) : Math.abs(vx);
      const score = primary * 2 + secondary;
      if (score < bestScore) {
        bestScore = score;
        best = node;
      }
    }
    if (best) {
      state.cursorId = best.id;
      state.selectedId = best.id;
      setFeedback(`selected ${best.id}`, 320);
      render();
    }
  }

  function pointToNode(event) {
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width;
    const y = (event.clientY - rect.top) / rect.height;
    let best = null;
    let bestDist = Infinity;
    for (const node of stage().nodes) {
      const d = Math.hypot(node.x - x, node.y - y);
      if (d < bestDist) {
        bestDist = d;
        best = node;
      }
    }
    return bestDist < 0.085 ? best : null;
  }

  function toggleSound() {
    state.soundEnabled = !state.soundEnabled;
    storage.set(SOUND_KEY, state.soundEnabled ? "1" : "0");
    playSound("route");
    render();
  }

  function toggleFullscreen() {
    playSound("full");
    const target = document.fullscreenElement ? document.exitFullscreen() : canvas.requestFullscreen?.();
    if (target && typeof target.catch === "function") target.catch(() => {});
  }

  function pct(node) {
    return { x: node.x * W, y: node.y * H };
  }

  function drawBackground() {
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#071018");
    bg.addColorStop(1, "#101827");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(94,234,212,.08)";
    ctx.lineWidth = 1;
    for (let x = -W; x < W * 2; x += 44) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + W * 0.45, H);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(34,211,238,.05)";
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.14, 150 + Math.sin(state.pulse * 2) * 6, 0, TAU);
    ctx.fill();
  }

  function drawLinks() {
    const nodes = nodeMap();
    for (const link of linkData()) {
      const a = pct(nodes.get(link.from));
      const b = pct(nodes.get(link.to));
      const glow = state.packets.some((p) => p.from === link.from && p.to === link.to);
      ctx.save();
      ctx.lineCap = "round";
      ctx.strokeStyle = glow ? "rgba(94,234,212,.88)" : "rgba(94,234,212,.24)";
      ctx.shadowColor = "#22d3ee";
      ctx.shadowBlur = glow ? 18 : 4;
      ctx.lineWidth = glow ? 5 : 3;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      const ax = a.x + (b.x - a.x) * 0.62;
      const ay = a.y + (b.y - a.y) * 0.62;
      ctx.fillStyle = glow ? "#fbbf24" : "rgba(148,163,184,.7)";
      ctx.beginPath();
      ctx.moveTo(ax + Math.cos(angle) * 12, ay + Math.sin(angle) * 12);
      ctx.lineTo(ax + Math.cos(angle + 2.55) * 8, ay + Math.sin(angle + 2.55) * 8);
      ctx.lineTo(ax + Math.cos(angle - 2.55) * 8, ay + Math.sin(angle - 2.55) * 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawNode(node) {
    const p = pct(node);
    const selected = node.id === state.selectedId;
    const cursor = node.id === state.cursorId;
    const router = activeRouter(node.id);
    const isTarget = node.type === "target";
    const isSource = node.type === "source";
    const isDrop = node.type === "drop";
    const radius = isSource || isTarget ? 26 : 22;
    ctx.save();
    ctx.shadowColor = isTarget ? "#fbbf24" : isDrop ? "#fb7185" : "#5eead4";
    ctx.shadowBlur = selected ? 26 : 12;
    ctx.fillStyle = isTarget ? "#fbbf24" : isSource ? "#5eead4" : isDrop ? "#fb7185" : "#111827";
    ctx.strokeStyle = cursor ? "#f8fafc" : isDrop ? "#fb7185" : "rgba(94,234,212,.82)";
    ctx.lineWidth = cursor ? 5 : 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = isTarget || isSource || isDrop ? "#061018" : "#e6edf3";
    ctx.font = "900 15px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(node.id, p.x, p.y + (router ? -8 : 0));
    if (router) {
      const d = vec[router];
      ctx.fillStyle = isSource ? "#061018" : "#fbbf24";
      ctx.beginPath();
      ctx.moveTo(p.x + d.x * 14, p.y + d.y * 14 + 5);
      ctx.lineTo(p.x + d.y * 6 - d.x * 2, p.y - d.x * 6 - d.y * 2 + 5);
      ctx.lineTo(p.x - d.y * 6 - d.x * 2, p.y + d.x * 6 - d.y * 2 + 5);
      ctx.closePath();
      ctx.fill();
    }
    if (isDrop) {
      ctx.strokeStyle = "#061018";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p.x - 9, p.y - 9);
      ctx.lineTo(p.x + 9, p.y + 9);
      ctx.moveTo(p.x + 9, p.y - 9);
      ctx.lineTo(p.x - 9, p.y + 9);
      ctx.stroke();
    }
    if (selected) {
      ctx.strokeStyle = "rgba(251,191,36,.94)";
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 7]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius + 12 + Math.sin(state.pulse * 6) * 2, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPackets() {
    for (const packet of state.packets) {
      const p = { x: packet.x * W, y: packet.y * H };
      const color = ["#22d3ee", "#f472b6", "#fbbf24"][packet.colorPhase] || "#22d3ee";
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 22;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 9, 0, TAU);
      ctx.fill();
      const d = vec[packet.dir] || vec.right;
      ctx.fillStyle = "#061018";
      ctx.beginPath();
      ctx.moveTo(p.x + d.x * 7, p.y + d.y * 7);
      ctx.lineTo(p.x - d.x * 5 + d.y * 4, p.y - d.y * 5 - d.x * 4);
      ctx.lineTo(p.x - d.x * 5 - d.y * 4, p.y - d.y * 5 + d.x * 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawOverlay() {
    if (!state.gameOver && !state.complete && state.mode !== "stage-clear") return;
    ctx.save();
    ctx.fillStyle = "rgba(3,7,18,.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f8fbff";
    ctx.font = "900 38px system-ui";
    const title = state.complete ? "RUN COMPLETE" : state.gameOver ? "ROUTE FAILED" : "STAGE CLEAR";
    ctx.fillText(title, W / 2, H / 2 - 20);
    ctx.fillStyle = "#5eead4";
    ctx.font = "900 18px system-ui";
    ctx.fillText(`Score ${state.score}  Delivered ${state.delivered}  Lost ${state.lost}`, W / 2, H / 2 + 18);
    ctx.fillStyle = "#fbbf24";
    ctx.font = "800 14px system-ui";
    ctx.fillText(state.complete || state.gameOver ? "Restart to run again" : "Start advances to next stage", W / 2, H / 2 + 48);
    ctx.restore();
  }

  function render() {
    const current = stage();
    els.stage.textContent = `${state.stageIndex + 1}/${STAGES.length}`;
    els.score.textContent = state.score;
    els.best.textContent = state.bestScore;
    els.goal.textContent = `${state.stageDelivered}/${current.goal}`;
    els.lost.textContent = `${state.stageLost}/${current.maxLost}`;
    els.steps.textContent = state.stepsRemaining;
    els.time.textContent = state.timeRemaining.toFixed(1);
    els.status.textContent = state.feedbackMs > 0 || state.mode !== "setup" ? state.feedback : `${current.name}: ${current.goal} packet goal`;
    els.flow.textContent = state.mode === "running" ? "Pause" : state.mode === "stage-clear" ? "Next" : state.complete || state.gameOver ? "New Run" : "Start";
    els.sound.textContent = state.soundEnabled ? "Sound On" : "Sound Off";
    els.sound.setAttribute("aria-pressed", String(state.soundEnabled));
    els.goalPill.dataset.hot = String(state.stageDelivered >= current.goal);
    els.stepPill.dataset.hot = String(state.stepsRemaining <= 3);
    els.timePill.dataset.hot = String(state.timeRemaining <= 6);
    drawBackground();
    drawLinks();
    stage().nodes.forEach(drawNode);
    drawPackets();
    drawOverlay();
  }

  function routerSnapshot() {
    return stage().nodes.map((node) => ({
      id: node.id,
      type: node.type || "router",
      router: activeRouter(node.id),
      choices: routerChoices(node.id),
      selected: node.id === state.selectedId,
      cursor: node.id === state.cursorId
    }));
  }

  function packetSnapshot() {
    return state.packets.map((packet) => ({
      id: packet.id,
      from: packet.from,
      to: packet.to,
      dir: packet.dir,
      progress: Number(packet.progress.toFixed(3)),
      x: Number(packet.x.toFixed(3)),
      y: Number(packet.y.toFixed(3)),
      hops: packet.hops
    }));
  }

  function renderGameToText() {
    const cursorNode = getNode(state.cursorId);
    const selectedNode = getNode(state.selectedId);
    const current = stage();
    return JSON.stringify({
      mode: state.mode,
      stage: { index: state.stageIndex + 1, total: STAGES.length, name: current.name },
      score: state.score,
      bestScore: state.bestScore,
      delivered: { stage: state.stageDelivered, total: state.delivered },
      lost: { stage: state.stageLost, total: state.lost },
      remaining: {
        steps: state.stepsRemaining,
        time: Number(state.timeRemaining.toFixed(3)),
        packets: Math.max(0, current.packetLimit - state.spawned)
      },
      stepsRemaining: state.stepsRemaining,
      timeRemaining: Number(state.timeRemaining.toFixed(3)),
      cursor: cursorNode ? { id: cursorNode.id, x: cursorNode.x, y: cursorNode.y } : null,
      selected: selectedNode ? { id: selectedNode.id, router: activeRouter(selectedNode.id), choices: routerChoices(selectedNode.id) } : null,
      routers: routerSnapshot(),
      packets: packetSnapshot(),
      goals: {
        deliver: current.goal,
        packetLimit: current.packetLimit,
        maxLost: current.maxLost,
        stepBudget: current.stepBudget,
        timeLimit: current.timeLimit
      },
      soundEnabled: state.soundEnabled,
      lastSound,
      feedback: state.feedback,
      complete: state.complete,
      gameOver: state.gameOver
    });
  }

  canvas.addEventListener("pointerdown", (event) => {
    markGesture();
    const node = pointToNode(event);
    if (!node) return;
    state.selectedId = node.id;
    state.cursorId = node.id;
    cycleRouter(node.id);
  });

  window.addEventListener("keydown", (event) => {
    const key = event.key;
    const movement = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], W: [0, -1], s: [0, 1], S: [0, 1], a: [-1, 0], A: [-1, 0], d: [1, 0], D: [1, 0]
    };
    if (movement[key] || [" ", "Enter", "r", "R", "f", "F", "m", "M"].includes(key)) event.preventDefault();
    markGesture();
    if ((key === "s" || key === "S") && !event.ctrlKey && !event.metaKey && !event.altKey) return startPause();
    if (movement[key]) return moveCursor(...movement[key]);
    if (key === " " || key === "Enter") return cycleRouter();
    if (key === "r" || key === "R") return restartRun();
    if (key === "f" || key === "F") return toggleFullscreen();
    if (key === "m" || key === "M") return toggleSound();
  });

  els.flow.addEventListener("click", () => { markGesture(); startPause(); });
  els.restart.addEventListener("click", () => { markGesture(); restartRun(); });
  els.sound.addEventListener("click", () => { markGesture(); toggleSound(); });
  els.full.addEventListener("click", () => { markGesture(); toggleFullscreen(); });
  els.cycle.addEventListener("click", () => { markGesture(); cycleRouter(); });
  els.cycleTouch.addEventListener("click", () => { markGesture(); cycleRouter(); });
  document.querySelectorAll("[data-move]").forEach((button) => {
    button.addEventListener("click", () => {
      markGesture();
      moveCursor(...button.dataset.move.split(",").map(Number));
    });
  });

  window.render_game_to_text = renderGameToText;
  window.advanceTime = function advanceTime(ms = 0) {
    const total = Math.max(0, Number(ms) || 0);
    const frames = Math.max(1, Math.round(total / (1000 / 60)));
    for (let i = 0; i < frames; i += 1) update(1 / 60);
    render();
    return renderGameToText();
  };

  let last = performance.now();
  let accumulator = 0;
  function loop(now) {
    accumulator += Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    while (accumulator >= 1 / 60) {
      update(1 / 60);
      accumulator -= 1 / 60;
    }
    render();
    requestAnimationFrame(loop);
  }

  resetStage(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
