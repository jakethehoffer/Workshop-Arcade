<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Bloomkeeper Grid</span></div>
    <div class="hud" aria-label="Bloomkeeper status">
      <span class="pill"><span class="label">Stage</span><span class="value" id="stageValue">1/5</span></span>
      <span class="pill"><span class="label">Day</span><span class="value" id="dayValue">0</span></span>
      <span class="pill"><span class="label">Moves</span><span class="value" id="moveValue">0</span></span>
      <span class="pill"><span class="label">Score</span><span class="value" id="scoreValue">0</span></span>
      <span class="pill"><span class="label">Best</span><span class="value" id="bestValue">0</span></span>
    </div>
  </header>
  <main aria-label="Bloomkeeper Grid game">
    <section class="primaryPanel" id="firstActionPanel" aria-label="Current garden action">
      <div class="actionMeta">
        <div class="actionRow">
          <span class="selectedCue" id="toolCue" aria-live="polite"><span class="label">Selected Tool</span><span class="value">Seed</span></span>
          <div class="goalStrip" id="goalStrip" aria-label="Current goal progress"></div>
        </div>
        <div class="status" id="statusLine" aria-live="polite">Place seeds near future water waves.</div>
        <div class="palette" aria-label="Tool palette">
          <button class="btn primary" type="button" data-tool="seed" aria-pressed="true">1 Seed</button>
          <button class="btn" type="button" data-tool="sprinkler" aria-pressed="false">2 Sprinkler</button>
          <button class="btn" type="button" data-tool="shade" aria-pressed="false">3 Shade</button>
        </div>
      </div>
      <button class="btn primary" id="dayBtn" type="button">Day</button>
    </section>
    <div class="stage"><canvas id="game" width="900" height="560" tabindex="0" aria-label="Bloomkeeper Grid. Move the cursor with arrows or WASD, select seed sprinkler or shade, place items, and advance days to meet garden goals."></canvas></div>
  </main>
  <div class="controls" aria-label="Run controls">
    <button class="btn warn" id="restartBtn" type="button">Restart</button>
    <button class="btn" id="soundBtn" type="button" aria-pressed="true">Sound On</button>
    <button class="btn" id="fullBtn" type="button">Fullscreen</button>
  </div>
  <div class="help"><span class="kbd">Arrows</span>/<span class="kbd">WASD</span> cursor <span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span> tools <span class="kbd">Enter</span>/<span class="kbd">Space</span> place <span class="kbd">N</span> day <span class="kbd">R</span> restart <span class="kbd">F</span> fullscreen</div>
</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const N = 7;
  const BOARD = { x: 164, y: 72, w: 490, h: 490 };
  const CELL = BOARD.w / N;
  const BEST_KEY = "bloomkeeper-grid.best.v1";
  const SOUND_KEY = "bloomkeeper-grid.sound.v1";
  const TOOLS = ["seed", "sprinkler", "shade"];
  const COLORS = {
    red: "#ff7b9b", yellow: "#ffd166", blue: "#6ecbff", green: "#69e6a8",
    seed: "#dac08a", sprinkler: "#6ecbff", shade: "#b9a6ff"
  };
  const STAGES = [
    { name: "First Rain", moves: 5, maxDays: 3, soil: ["rryybbb","rryybbb","ggyybbb","gggrrbb","gggrrbb","yyyyrrr","yyyyrrr"], goals: [{ color: "red", shape: "bloom", need: 2 }, { color: "yellow", shape: "sprout", need: 1 }] },
    { name: "Blue Shade", moves: 6, maxDays: 3, soil: ["bbbyyrr","bbbyyrr","gggbbrr","gggbbyy","rrggbyy","rrggbyy","yyyybbb"], goals: [{ color: "blue", shape: "leaf", need: 2 }, { color: "green", shape: "bloom", need: 1 }] },
    { name: "Mixed Beds", moves: 7, maxDays: 4, soil: ["rgbrygb","ygrbygr","brygbry","gbrygbr","rygbryg","bgrybgr","yrgbryg"], goals: [{ color: "green", shape: "bloom", need: 2 }, { color: "yellow", shape: "leaf", need: 2 }] },
    { name: "Quiet Canopy", moves: 8, maxDays: 4, soil: ["gggbyyy","grrbyyb","grrbbby","yyybbbr","yyyggrr","bbgggrr","bbbyygg"], goals: [{ color: "red", shape: "leaf", need: 2 }, { color: "blue", shape: "star", need: 1 }] },
    { name: "Keeper Pattern", moves: 9, maxDays: 5, soil: ["rgybrgy","gybrgyb","ybrgybr","brgybrg","rgybrgy","gybrgyb","ybrgybr"], goals: [{ color: "green", shape: "star", need: 2 }, { color: "yellow", shape: "bloom", need: 2 }, { color: "blue", shape: "leaf", need: 1 }] }
  ];
  const els = {
    stage: document.getElementById("stageValue"), day: document.getElementById("dayValue"),
    moves: document.getElementById("moveValue"), score: document.getElementById("scoreValue"),
    best: document.getElementById("bestValue"), status: document.getElementById("statusLine"),
    dayBtn: document.getElementById("dayBtn"), restart: document.getElementById("restartBtn"),
    sound: document.getElementById("soundBtn"), full: document.getElementById("fullBtn"),
    toolCue: document.getElementById("toolCue"), goalStrip: document.getElementById("goalStrip"),
    firstAction: document.getElementById("firstActionPanel")
  };
  function storage() {
    if (window.workshopStorage) return window.workshopStorage;
    try { return window.localStorage; } catch (_) { return null; }
  }
  function getStored(key, fallback) {
    const s = storage(); if (!s) return fallback;
    try { const raw = s.getItem(key); return raw == null ? fallback : JSON.parse(raw); } catch (_) { return fallback; }
  }
  function setStored(key, value) {
    const s = storage(); if (!s) return;
    try { s.setItem(key, JSON.stringify(value)); } catch (_) {}
  }
  const state = {
    mode: "planning", stageIndex: 0, day: 0, score: 0, best: Number(getStored(BEST_KEY, 0)) || 0,
    movesLeft: 0, selectedTool: "seed", cursor: { r: 3, c: 3 }, cells: [], feedback: "Place seeds near future water waves.",
    feedbackMs: 1600, complete: false, fail: false, runComplete: false, sound: getStored(SOUND_KEY, true) !== false,
    lastSound: "none", soundCount: 0, gesture: false, lastGrowth: [], solvedStages: [], lastAction: "ready"
  };
  let audio = null;
  function stage() { return STAGES[state.stageIndex]; }
  function soilColor(r, c) {
    return { r: "red", y: "yellow", b: "blue", g: "green" }[stage().soil[r][c]];
  }
  function newCells() {
    return Array.from({ length: N }, (_, r) => Array.from({ length: N }, (_, c) => ({
      r, c, soil: soilColor(r, c), item: "", age: 0, watered: false, shaded: false, shape: "bare", color: soilColor(r, c), wave: 0
    })));
  }
  function cell(r, c) { return state.cells[r] && state.cells[r][c]; }
  function flatCells() { return state.cells.flat(); }
  function setFeedback(text, ms = 1500) {
    state.feedback = text;
    state.feedbackMs = ms;
    els.status.textContent = text;
  }
  function persist() {
    if (state.score > state.best) state.best = state.score;
    setStored(BEST_KEY, state.best);
    setStored(SOUND_KEY, state.sound);
  }
  function markGesture() { state.gesture = true; }
  function ensureAudio() {
    if (!state.sound || !state.gesture) return null;
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { audio = null; }
    }
    if (audio && audio.state === "suspended") audio.resume().catch(() => {});
    return audio;
  }
  function tone(name) {
    state.lastSound = state.sound ? name : "muted-" + name;
    if (!state.sound) return;
    const ac = ensureAudio(); if (!ac) return;
    state.soundCount += 1;
    const freq = { place: 430, day: 520, solve: 720, fail: 160, complete: 860, restart: 260, toggle: 480, move: 320 }[name] || 380;
    const t = ac.currentTime, osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = name === "fail" ? "sawtooth" : "sine";
    osc.frequency.setValueAtTime(freq, t);
    if (name === "solve" || name === "complete") osc.frequency.linearRampToValueAtTime(freq + 180, t + .14);
    gain.gain.setValueAtTime(.0001, t);
    gain.gain.exponentialRampToValueAtTime(.045, t + .01);
    gain.gain.exponentialRampToValueAtTime(.0001, t + .18);
    osc.connect(gain).connect(ac.destination);
    osc.start(t); osc.stop(t + .2);
  }
  function loadStage(index, keepScore = true) {
    state.stageIndex = Math.max(0, Math.min(STAGES.length - 1, index));
    state.day = 0;
    state.movesLeft = stage().moves;
    state.cells = newCells();
    state.cursor = { r: 3, c: 3 };
    state.selectedTool = "seed";
    state.mode = "planning";
    state.fail = false;
    state.complete = false;
    state.runComplete = false;
    state.lastGrowth = [];
    state.lastAction = "stage-load";
    if (!keepScore) {
      state.score = 0;
      state.solvedStages = [];
    }
    setFeedback(stage().name + ": place the garden plan.", 1800);
    syncHud();
    render();
  }
  function restartRun() {
    markGesture();
    loadStage(0, false);
    state.lastAction = "restart";
    tone("restart");
  }
  function countItems(type) { return flatCells().filter((x) => x.item === type).length; }
  function hasNeighborType(r, c, type) {
    return [[1,0],[-1,0],[0,1],[0,-1]].some(([dr, dc]) => {
      const n = cell(r + dr, c + dc);
      return n && n.item === type;
    });
  }
  function sprinklerDistance(r, c) {
    let best = 99;
    flatCells().forEach((x) => {
      if (x.item === "sprinkler") best = Math.min(best, Math.abs(x.r - r) + Math.abs(x.c - c));
    });
    return best;
  }
  function derivePlant(x) {
    if (x.item !== "seed") {
      x.age = 0; x.watered = false; x.shaded = x.item === "shade"; x.shape = "bare"; x.color = x.soil; x.wave = 0;
      return;
    }
    const dist = sprinklerDistance(x.r, x.c);
    const shaded = hasNeighborType(x.r, x.c, "shade") || x.item === "shade";
    const watered = dist <= state.day + 1;
    x.watered = watered;
    x.shaded = shaded;
    x.wave = dist < 99 ? Math.max(0, state.day + 1 - dist) : 0;
    if (watered) x.age = Math.min(4, x.age + 1);
    else if (state.day > 0) x.age = Math.max(0, x.age - 1);
    if (watered && shaded && x.age >= 3) x.shape = "star";
    else if (shaded && x.age >= 1) x.shape = "leaf";
    else if (watered && x.age >= 2) x.shape = "bloom";
    else if (x.age >= 1) x.shape = "sprout";
    else x.shape = "seed";
    x.color = x.soil;
  }
  function goalProgress() {
    const plants = flatCells().filter((x) => x.item === "seed");
    return stage().goals.map((g) => {
      const have = plants.filter((x) => x.color === g.color && x.shape === g.shape).length;
      return { color: g.color, shape: g.shape, need: g.need, have, done: have >= g.need };
    });
  }
  function goalsMet() { return goalProgress().every((g) => g.done); }
  function toolLabel(tool) {
    return tool === "sprinkler" ? "Sprinkler" : tool === "shade" ? "Shade" : "Seed";
  }
  function goalPhrase(g) {
    return g.have + "/" + g.need + " " + g.color + " " + g.shape;
  }
  function goalReadiness() {
    const progress = goalProgress();
    const remaining = progress.filter((g) => !g.done);
    return {
      allGoalsReady: remaining.length === 0,
      readyCount: progress.length - remaining.length,
      totalGoals: progress.length,
      nextGoal: remaining.length ? goalPhrase(remaining[0]) : "all ready",
      remaining: remaining.map((g) => ({ color: g.color, shape: g.shape, need: g.need, have: g.have }))
    };
  }
  function syncActionPanel() {
    if (els.toolCue) {
      const value = els.toolCue.querySelector(".value");
      if (value) value.textContent = toolLabel(state.selectedTool);
      els.toolCue.dataset.tool = state.selectedTool;
    }
    if (els.goalStrip) {
      els.goalStrip.replaceChildren();
      goalProgress().forEach((g) => {
        const chip = document.createElement("span");
        chip.className = "goalChip" + (g.done ? " done" : "");
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = g.done ? "Ready" : "Goal";
        const value = document.createElement("span");
        value.className = "value";
        value.textContent = goalPhrase(g);
        chip.append(label, value);
        els.goalStrip.appendChild(chip);
      });
    }
  }
  function firstActionVisibility() {
    const panel = els.firstAction;
    const day = els.dayBtn;
    const panelRect = panel ? panel.getBoundingClientRect() : null;
    const dayRect = day ? day.getBoundingClientRect() : null;
    const canvasRect = canvas.getBoundingClientRect();
    const visible = !!panelRect && panelRect.width > 0 && panelRect.height > 0 && panelRect.bottom > 0 && panelRect.top < window.innerHeight;
    return {
      visible,
      beforeCanvas: !!panelRect && panelRect.top <= canvasRect.top,
      top: panelRect ? Math.round(panelRect.top) : null,
      bottom: panelRect ? Math.round(panelRect.bottom) : null,
      dayButton: day ? { text: day.textContent.trim(), visible: Boolean(day.offsetParent), top: dayRect ? Math.round(dayRect.top) : null } : null,
      selectedTool: toolLabel(state.selectedTool),
      status: els.status ? els.status.textContent.trim() : "",
      goals: goalProgress().map(goalPhrase)
    };
  }
  function advanceDay() {
    state.lastAction = state.complete && !state.runComplete ? "next-stage" : "advance-day";
    if (state.complete || state.runComplete) {
      if (!state.runComplete) nextStage();
      return;
    }
    if (state.fail) return;
    markGesture();
    state.day += 1;
    const before = flatCells().map((x) => x.shape);
    flatCells().forEach(derivePlant);
    state.lastGrowth = flatCells().filter((x, i) => x.shape !== before[i]).map((x) => ({ r: x.r, c: x.c, shape: x.shape, color: x.color }));
    const progress = goalProgress();
    if (goalsMet()) {
      const bonus = Math.max(80, 260 + (stage().maxDays - state.day) * 60 + state.movesLeft * 25 + countItems("seed") * 8);
      state.score += bonus;
      state.complete = true;
      state.mode = "stage-complete";
      state.lastAction = "stage-complete";
      if (!state.solvedStages.includes(state.stageIndex)) state.solvedStages.push(state.stageIndex);
      setFeedback(stage().name + " complete. +" + bonus, 2400);
      tone(state.stageIndex === STAGES.length - 1 ? "complete" : "solve");
      persist();
      if (state.stageIndex === STAGES.length - 1) {
        state.runComplete = true;
        state.mode = "run-complete";
        state.lastAction = "run-complete";
        setFeedback("Run complete. Final score " + state.score + ".", 3200);
      }
    } else if (state.day >= stage().maxDays) {
      state.fail = true;
      state.mode = "fail";
      state.lastAction = "garden-failed";
      setFeedback("Garden failed: " + progress.filter((g) => !g.done).map((g) => g.color + " " + g.shape).join(", ") + " still needed.", 3000);
      tone("fail");
    } else {
      state.lastAction = "day-advanced";
      setFeedback("Day " + state.day + ": growth waves reached " + state.lastGrowth.length + " plants.", 1500);
      tone("day");
    }
    syncHud();
    render();
  }
  function nextStage() {
    if (state.stageIndex >= STAGES.length - 1) {
      state.runComplete = true;
      state.mode = "run-complete";
      state.lastAction = "run-complete";
      persist();
      render();
      return;
    }
    loadStage(state.stageIndex + 1, true);
  }
  function canPlace(x, tool) {
    if (!x || state.fail || state.complete || state.runComplete) return false;
    if (state.movesLeft <= 0 && x.item !== tool) return false;
    return true;
  }
  function placeTool() {
    const x = cell(state.cursor.r, state.cursor.c);
    if (!canPlace(x, state.selectedTool)) {
      state.lastAction = "blocked-place";
      setFeedback(state.fail ? "Restart after a failed garden." : "No moves left for this stage.", 1500);
      tone("fail");
      return;
    }
    const prev = x.item;
    x.item = prev === state.selectedTool ? "" : state.selectedTool;
    x.age = 0;
    derivePlant(x);
    if (prev !== x.item && state.movesLeft > 0) state.movesLeft -= 1;
    state.lastAction = x.item ? "place-" + state.selectedTool : "clear-cell";
    setFeedback(x.item ? state.selectedTool + " placed." : "Cell cleared.", 1000);
    tone("place");
    syncHud();
    render();
  }
  function selectTool(tool) {
    if (!TOOLS.includes(tool)) return;
    state.selectedTool = tool;
    state.lastAction = "select-" + tool;
    document.querySelectorAll("[data-tool]").forEach((button) => {
      const active = button.dataset.tool === tool;
      button.classList.toggle("primary", active);
      button.setAttribute("aria-pressed", String(active));
    });
    syncActionPanel();
    render();
  }
  function moveCursor(dr, dc) {
    state.cursor.r = (state.cursor.r + dr + N) % N;
    state.cursor.c = (state.cursor.c + dc + N) % N;
    state.lastAction = "move-cursor";
    tone("move");
    render();
  }
  function toggleSound() {
    markGesture();
    state.sound = !state.sound;
    state.lastAction = "toggle-sound";
    if (state.sound) tone("toggle"); else state.lastSound = "sound-off";
    persist();
    syncHud();
  }
  function toggleFullscreen() {
    markGesture();
    state.lastAction = "toggle-fullscreen";
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    else document.documentElement.requestFullscreen?.().catch(() => {});
    setTimeout(render, 80);
  }
  function update(ms) {
    state.feedbackMs = Math.max(0, state.feedbackMs - Math.max(0, ms));
    if (state.feedbackMs === 0) {
      if (state.runComplete) state.feedback = "Run complete.";
      else if (state.fail) state.feedback = "Failed garden. Restart to try a new plan.";
      else if (state.complete) state.feedback = "Stage complete. Press Day or N for the next plot.";
      else state.feedback = stage().name + ": " + goalProgress().map((g) => g.have + "/" + g.need + " " + g.color + " " + g.shape).join(" | ");
      els.status.textContent = state.feedback;
    }
    render();
  }
  function syncHud() {
    els.stage.textContent = (state.stageIndex + 1) + "/" + STAGES.length;
    els.day.textContent = state.day + "/" + stage().maxDays;
    els.moves.textContent = String(state.movesLeft);
    els.score.textContent = String(state.score);
    els.best.textContent = String(state.best);
    els.dayBtn.textContent = state.complete && !state.runComplete ? "Next" : "Day";
    els.dayBtn.setAttribute("aria-label", state.complete && !state.runComplete ? "Next plot" : "Advance day");
    els.dayBtn.disabled = state.fail;
    els.sound.textContent = state.sound ? "Sound On" : "Sound Off";
    els.sound.setAttribute("aria-pressed", String(state.sound));
    els.full.textContent = document.fullscreenElement ? "Exit Fullscreen" : "Fullscreen";
    syncActionPanel();
  }
  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) ctx.fill(); if (stroke) ctx.stroke();
  }
  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a1915"); g.addColorStop(1, "#050b0a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = .22;
    ctx.fillStyle = "#69e6a8"; ctx.beginPath(); ctx.arc(110, 50, 170, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#6ecbff"; ctx.beginPath(); ctx.arc(806, 76, 150, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#f2fff8"; ctx.font = "950 23px system-ui"; ctx.fillText(stage().name, 28, 62);
    ctx.fillStyle = "rgba(169,194,182,.9)"; ctx.font = "800 12px system-ui";
    ctx.fillText("Tool " + state.selectedTool.toUpperCase() + "   Seeds " + countItems("seed") + "   Sprinklers " + countItems("sprinkler") + "   Shade " + countItems("shade"), 28, 88);
  }
  function drawBoard() {
    ctx.fillStyle = "rgba(7,17,15,.78)"; ctx.strokeStyle = "rgba(130,238,178,.32)"; ctx.lineWidth = 2;
    roundRect(BOARD.x - 16, BOARD.y - 16, BOARD.w + 32, BOARD.h + 32, 14, true, true);
    for (let r = 0; r < N; r += 1) for (let c = 0; c < N; c += 1) {
      const x = BOARD.x + c * CELL, y = BOARD.y + r * CELL, data = cell(r, c);
      ctx.fillStyle = data.soil === "red" ? "rgba(255,123,155,.15)" : data.soil === "yellow" ? "rgba(255,209,102,.15)" : data.soil === "blue" ? "rgba(110,203,255,.15)" : "rgba(105,230,168,.15)";
      ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
      ctx.strokeStyle = "rgba(130,238,178,.16)"; ctx.lineWidth = 1; ctx.strokeRect(x + 2, y + 2, CELL - 4, CELL - 4);
      if (data.wave > 0) {
        ctx.fillStyle = "rgba(110,203,255,.08)";
        ctx.beginPath(); ctx.arc(x + CELL / 2, y + CELL / 2, Math.min(CELL * .45, 8 + data.wave * 8), 0, Math.PI * 2); ctx.fill();
      }
      drawItem(data, x + CELL / 2, y + CELL / 2);
    }
    const cx = BOARD.x + state.cursor.c * CELL, cy = BOARD.y + state.cursor.r * CELL;
    ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 4; roundRect(cx + 7, cy + 7, CELL - 14, CELL - 14, 8, false, true);
    ctx.strokeStyle = "#f2fff8"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]); roundRect(cx + 13, cy + 13, CELL - 26, CELL - 26, 7, false, true); ctx.setLineDash([]);
  }
  function drawItem(data, x, y) {
    if (data.item === "sprinkler") {
      ctx.save(); ctx.strokeStyle = COLORS.sprinkler; ctx.lineWidth = 3; ctx.globalAlpha = .95;
      for (let i = 1; i <= 3; i += 1) { ctx.beginPath(); ctx.arc(x, y, i * 13, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke(); }
      ctx.fillStyle = COLORS.sprinkler; ctx.fillRect(x - 12, y + 9, 24, 8); ctx.fillRect(x - 4, y - 11, 8, 25); ctx.restore(); return;
    }
    if (data.item === "shade") {
      ctx.save(); ctx.fillStyle = "rgba(185,166,255,.25)"; ctx.strokeStyle = COLORS.shade; ctx.lineWidth = 3;
      roundRect(x - 23, y - 18, 46, 29, 8, true, true); ctx.beginPath(); ctx.moveTo(x, y + 11); ctx.lineTo(x, y + 25); ctx.stroke(); ctx.restore(); return;
    }
    if (data.item !== "seed") return;
    const color = COLORS[data.color];
    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3; ctx.shadowColor = color; ctx.shadowBlur = data.shape === "star" || data.shape === "bloom" ? 16 : 6;
    if (data.shape === "seed") { ctx.beginPath(); ctx.ellipse(x, y, 9, 13, -.5, 0, Math.PI * 2); ctx.fill(); }
    else if (data.shape === "sprout") { ctx.beginPath(); ctx.moveTo(x, y + 18); ctx.lineTo(x, y - 14); ctx.stroke(); ctx.beginPath(); ctx.ellipse(x - 8, y - 3, 9, 5, -.6, 0, Math.PI * 2); ctx.fill(); }
    else if (data.shape === "leaf") { ctx.beginPath(); ctx.moveTo(x, y + 18); ctx.lineTo(x, y - 12); ctx.stroke(); ctx.beginPath(); ctx.ellipse(x - 10, y - 2, 13, 7, -.65, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x + 10, y - 8, 13, 7, .65, 0, Math.PI * 2); ctx.fill(); }
    else if (data.shape === "bloom") { for (let i = 0; i < 6; i += 1) { const a = i * Math.PI / 3; ctx.beginPath(); ctx.ellipse(x + Math.cos(a) * 11, y + Math.sin(a) * 11, 7, 12, a, 0, Math.PI * 2); ctx.fill(); } ctx.fillStyle = "#fff6bd"; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill(); }
    else if (data.shape === "star") { ctx.beginPath(); for (let i = 0; i < 10; i += 1) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? 9 : 23; const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); } ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  function drawGoals() {
    const goals = goalProgress();
    const x = 680, y = 104;
    ctx.fillStyle = "rgba(7,17,15,.72)"; ctx.strokeStyle = "rgba(130,238,178,.25)"; ctx.lineWidth = 2; roundRect(x, y, 190, 240, 13, true, true);
    ctx.fillStyle = "#f2fff8"; ctx.font = "950 18px system-ui"; ctx.fillText("Goals", x + 18, y + 34);
    goals.forEach((g, i) => {
      const yy = y + 64 + i * 54;
      ctx.fillStyle = g.done ? "rgba(105,230,168,.18)" : "rgba(255,255,255,.04)";
      ctx.strokeStyle = g.done ? "rgba(105,230,168,.7)" : "rgba(130,238,178,.18)";
      roundRect(x + 14, yy - 22, 162, 42, 8, true, true);
      ctx.fillStyle = COLORS[g.color]; ctx.beginPath(); ctx.arc(x + 34, yy - 1, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = g.done ? "#69e6a8" : "#f2fff8"; ctx.font = "900 13px system-ui";
      ctx.fillText(g.have + "/" + g.need + " " + g.color + " " + g.shape, x + 52, yy + 3);
    });
    ctx.fillStyle = "rgba(169,194,182,.9)"; ctx.font = "800 12px system-ui";
    ctx.fillText("Water makes blooms.", x + 18, y + 198);
    ctx.fillText("Shade makes leaves.", x + 18, y + 218);
  }
  function drawOverlay() {
    if (!state.fail && !state.complete && !state.runComplete) return;
    ctx.save(); ctx.fillStyle = "rgba(3,8,7,.68)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(7,17,15,.92)"; ctx.strokeStyle = state.fail ? "#ff7b9b" : "#69e6a8"; ctx.lineWidth = 2; roundRect(220, 206, 460, 130, 15, true, true);
    ctx.textAlign = "center"; ctx.fillStyle = state.fail ? "#ff7b9b" : state.runComplete ? "#ffd166" : "#69e6a8"; ctx.font = "950 30px system-ui";
    ctx.fillText(state.fail ? "GARDEN FAILED" : state.runComplete ? "RUN COMPLETE" : "STAGE COMPLETE", W / 2, 252);
    ctx.fillStyle = "#f2fff8"; ctx.font = "850 15px system-ui"; ctx.fillText("Score " + state.score + " / Best " + state.best, W / 2, 282);
    ctx.fillStyle = "rgba(169,194,182,.9)"; ctx.font = "800 12px system-ui";
    ctx.fillText(state.fail ? "Press R to restart." : state.runComplete ? "Press R for a fresh run." : "Press N or Day for the next plot.", W / 2, 307);
    ctx.restore();
  }
  function render() {
    drawBg(); drawBoard(); drawGoals(); drawOverlay();
  }
  function pointerCell(event) {
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) * (W / rect.width);
    const y = (event.clientY - rect.top) * (H / rect.height);
    if (x < BOARD.x || y < BOARD.y || x >= BOARD.x + BOARD.w || y >= BOARD.y + BOARD.h) return null;
    return { r: Math.floor((y - BOARD.y) / CELL), c: Math.floor((x - BOARD.x) / CELL) };
  }
  function isInteractive(target) {
    return target instanceof HTMLElement && (target.isContentEditable || target.matches("button,input,select,textarea,[role='button'],[role='textbox']"));
  }
  function gridSummary() {
    const plants = flatCells().filter((x) => x.item === "seed");
    const byShape = {}, byColor = {};
    plants.forEach((x) => { byShape[x.shape] = (byShape[x.shape] || 0) + 1; byColor[x.color] = (byColor[x.color] || 0) + 1; });
    return {
      seeds: countItems("seed"), sprinklers: countItems("sprinkler"), shade: countItems("shade"),
      byShape, byColor,
      occupied: flatCells().filter((x) => x.item).map((x) => ({ r: x.r, c: x.c, item: x.item, color: x.color, shape: x.shape, age: x.age, watered: x.watered, shaded: x.shaded }))
    };
  }
  function renderGameToText() {
    return JSON.stringify({
      mode: state.mode,
      stage: { index: state.stageIndex + 1, total: STAGES.length, name: stage().name, maxDays: stage().maxDays },
      day: state.day,
      score: state.score,
      best: state.best,
      movesLeft: state.movesLeft,
      selectedTool: state.selectedTool,
      cursor: { r: state.cursor.r, c: state.cursor.c },
      grid: gridSummary(),
      goalProgress: goalProgress(),
      goalReadiness: goalReadiness(),
      goalReady: goalReadiness().allGoalsReady,
      feedback: state.feedback,
      feedbackActive: state.feedbackMs > 0,
      lastAction: state.lastAction,
      visibleFirstAction: firstActionVisibility(),
      soundEnabled: state.sound,
      lastSound: state.lastSound,
      soundCount: state.soundCount,
      fullscreen: !!document.fullscreenElement,
      complete: state.complete || state.runComplete,
      fail: state.fail,
      runComplete: state.runComplete,
      lastGrowth: state.lastGrowth,
      coordinateSystem: "7x7 grid, r/c zero-based from top-left; pointer cells map to the canvas garden board."
    });
  }
  canvas.addEventListener("pointerdown", (event) => {
    event.preventDefault(); markGesture(); canvas.focus();
    const p = pointerCell(event);
    if (!p) return;
    state.cursor = p;
    placeTool();
  });
  document.querySelectorAll("[data-tool]").forEach((button) => button.addEventListener("click", () => {
    markGesture(); selectTool(button.dataset.tool); canvas.focus();
  }));
  els.dayBtn.addEventListener("click", advanceDay);
  els.restart.addEventListener("click", restartRun);
  els.sound.addEventListener("click", toggleSound);
  els.full.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", () => { syncHud(); render(); });
  window.addEventListener("keydown", (event) => {
    if (event.altKey || event.ctrlKey || event.metaKey || isInteractive(event.target)) return;
    const key = event.key.toLowerCase();
    const move = { arrowup: [-1,0], w: [-1,0], arrowdown: [1,0], s: [1,0], arrowleft: [0,-1], a: [0,-1], arrowright: [0,1], d: [0,1] }[key];
    if (move) { event.preventDefault(); moveCursor(move[0], move[1]); return; }
    if (key === "1") { event.preventDefault(); markGesture(); selectTool("seed"); }
    else if (key === "2") { event.preventDefault(); markGesture(); selectTool("sprinkler"); }
    else if (key === "3") { event.preventDefault(); markGesture(); selectTool("shade"); }
    else if (key === "enter" || event.code === "Space") { event.preventDefault(); markGesture(); placeTool(); }
    else if (key === "n") { event.preventDefault(); advanceDay(); }
    else if (key === "r") { event.preventDefault(); restartRun(); }
    else if (key === "f") { event.preventDefault(); toggleFullscreen(); }
    else if (key === "m") { event.preventDefault(); toggleSound(); }
  });
  window.render_game_to_text = renderGameToText;
  window.advanceTime = function advanceTime(ms = 0) {
    const total = Math.max(0, Number(ms) || 0);
    if (total === 0) update(0);
    let left = total;
    while (left > 0) {
      const step = Math.min(1000 / 60, left);
      update(step);
      left -= step;
    }
    return renderGameToText();
  };
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, Math.max(0, now - last));
    last = now;
    update(dt);
    requestAnimationFrame(frame);
  }
  loadStage(0, false);
  requestAnimationFrame(frame);
})();
</script>
