<main class="shell" aria-label="Patchwork Foundry game">

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const BEST_KEY = "patchwork-foundry.best.v1";
  const SOUND_KEY = "patchwork-foundry.sound.v1";
  const COLORS = ["#22d3ee","#fbbf24","#a78bfa","#34d399","#fb7185","#f97316"];
  const BOARDS = [
    { name:"Bus Primer", w:7, h:5, budget:4, vents:[[3,2]], ports:[[0,2],[6,2]], pieces:[
      { id:"beam-a", cells:[[0,0],[1,0],[2,0]] }, { id:"elbow-a", cells:[[0,0],[0,1],[1,1]] },
      { id:"bar-a", cells:[[0,0],[1,0]] }, { id:"stub-a", cells:[[0,0],[0,1]] }
    ] },
    { name:"Vent Dogleg", w:8, h:6, budget:5, vents:[[3,2],[4,2]], ports:[[0,1],[7,4]], pieces:[
      { id:"zig-b", cells:[[0,0],[1,0],[1,1],[2,1]] }, { id:"long-b", cells:[[0,0],[1,0],[2,0],[3,0]] },
      { id:"tee-b", cells:[[0,0],[1,0],[2,0],[1,1]] }, { id:"dot-b", cells:[[0,0]] }, { id:"elbow-b", cells:[[0,0],[0,1],[1,1]] }
    ] },
    { name:"Triple Tap", w:8, h:7, budget:6, vents:[[2,3],[5,3]], ports:[[0,0],[7,0],[3,6]], pieces:[
      { id:"tee-c", cells:[[0,0],[1,0],[2,0],[1,1]] }, { id:"long-c", cells:[[0,0],[0,1],[0,2],[0,3]] },
      { id:"zig-c", cells:[[0,0],[1,0],[1,1],[2,1]] }, { id:"corner-c", cells:[[0,0],[1,0],[0,1],[0,2]] },
      { id:"bar-c", cells:[[0,0],[1,0],[2,0]] }, { id:"dot-c", cells:[[0,0]] }
    ] },
    { name:"Cold Aisles", w:9, h:6, budget:6, vents:[[3,1],[3,2],[5,3],[5,4]], ports:[[0,3],[8,1],[8,5]], pieces:[
      { id:"snake-d", cells:[[0,0],[1,0],[1,1],[2,1],[2,2]] }, { id:"tee-d", cells:[[0,0],[1,0],[2,0],[1,1]] },
      { id:"long-d", cells:[[0,0],[1,0],[2,0],[3,0]] }, { id:"elbow-d", cells:[[0,0],[0,1],[1,1]] },
      { id:"bar-d", cells:[[0,0],[1,0],[2,0]] }, { id:"dot-d", cells:[[0,0]] }
    ] },
    { name:"Final Weave", w:9, h:7, budget:7, vents:[[4,1],[4,2],[4,4],[4,5]], ports:[[0,1],[0,5],[8,3],[6,6]], pieces:[
      { id:"cross-e", cells:[[1,0],[0,1],[1,1],[2,1],[1,2]] }, { id:"snake-e", cells:[[0,0],[1,0],[1,1],[2,1],[2,2]] },
      { id:"tee-e", cells:[[0,0],[1,0],[2,0],[1,1]] }, { id:"long-e", cells:[[0,0],[0,1],[0,2],[0,3]] },
      { id:"corner-e", cells:[[0,0],[1,0],[0,1],[0,2]] }, { id:"bar-e", cells:[[0,0],[1,0],[2,0]] },
      { id:"dot-e", cells:[[0,0]] }
    ] }
  ];
  const els = {
    stage: document.getElementById("stageValue"), moves: document.getElementById("movesValue"), ports: document.getElementById("portsValue"),
    score: document.getElementById("scoreValue"), best: document.getElementById("bestValue"), status: document.getElementById("statusLine"),
    selection: document.getElementById("selectionLine"),
    left: document.getElementById("rotateLeftBtn"), right: document.getElementById("rotateRightBtn"), restart: document.getElementById("restartBtn"),
    sound: document.getElementById("soundBtn"), full: document.getElementById("fullBtn")
  };
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const cellKey = (x, y) => x + "," + y;
  const norm = (value) => Math.round(value * 100) / 100;
  function store() {
    if (window.workshopStorage) return window.workshopStorage;
    try { return window.localStorage; } catch (_) { return null; }
  }
  function read(key, fallback) {
    const s = store();
    if (!s) return fallback;
    try { const raw = s.getItem(key); return raw === null ? fallback : raw; } catch (_) { return fallback; }
  }
  function write(key, value) {
    const s = store();
    if (!s) return;
    try { s.setItem(key, String(value)); } catch (_) {}
  }
  function readSound() {
    return !["0","false","off","muted"].includes(String(read(SOUND_KEY, "1")).toLowerCase());
  }
  // Number(read(...)) || 0 accepted Infinity, -5, 12.7 and 1e24 verbatim.
  const BEST_CAP = 100000;
  function readBest() {
    const raw = Number(read(BEST_KEY, "0"));
    if (!Number.isInteger(raw) || raw < 0 || raw > BEST_CAP) return 0;
    return raw;
  }
  const state = {
    mode:"playing", stage:0, score:0, best:readBest(), movesLeft:0, placed:[], selectedPiece:0,
    cursor:{ x:0, y:0 }, hover:null, dragging:false, soundEnabled:readSound(), lastSound:"none", userGesture:false,
    feedback:"Select a plate and bridge the first power bus.", feedbackMs:1200, complete:false, fail:false,
    lastConnected:0, lastBlocked:0, timeMs:0, selectionPulseMs:900, rotationPulseMs:0
  };
  let boardRect = { x:52, y:66, size:52 };
  let trayRects = [];
  let audio = null;
  function board() { return BOARDS[state.stage]; }
  function stagePieces() { return board().pieces; }
  function placedIds() { return new Set(state.placed.map((p) => p.id)); }
  function openPieces() {
    const ids = placedIds();
    return stagePieces().filter((p) => !ids.has(p.id));
  }
  function pieceById(id) { return stagePieces().find((p) => p.id === id); }
  function selectedBase() {
    const open = openPieces();
    if (!open.length) return null;
    state.selectedPiece = clamp(state.selectedPiece, 0, open.length - 1);
    return open[state.selectedPiece];
  }
  function pieceLabel(piece) {
    return piece ? piece.id.replace(/-/g, " ").toUpperCase() : "NO PLATE";
  }
  function issueLabel(issue) {
    if (issue === "vent") return "Vent conflict";
    if (issue === "overlap") return "Overlap";
    if (issue === "outside") return "Outside grid";
    return "Ready";
  }
  function rotatedCells(cells, rot) {
    let out = cells.map(([x, y]) => ({ x, y }));
    for (let i = 0; i < ((rot % 4) + 4) % 4; i += 1) out = out.map((c) => ({ x:-c.y, y:c.x }));
    const minX = Math.min(...out.map((c) => c.x));
    const minY = Math.min(...out.map((c) => c.y));
    return out.map((c) => ({ x:c.x - minX, y:c.y - minY }));
  }
  function cellsFor(piece, x, y, rot) {
    return rotatedCells(piece.cells, rot).map((c) => ({ x:x + c.x, y:y + c.y }));
  }
  function allPlateCells() {
    const cells = [];
    for (const placed of state.placed) {
      const base = pieceById(placed.id);
      if (base) cellsFor(base, placed.x, placed.y, placed.rot).forEach((c) => cells.push({ ...c, id:placed.id }));
    }
    return cells;
  }
  function ventSet() { return new Set(board().vents.map(([x, y]) => cellKey(x, y))); }
  function portSet() { return new Set(board().ports.map(([x, y]) => cellKey(x, y))); }
  function placementIssue(piece, x, y, rot) {
    const b = board();
    const vents = ventSet();
    const occupied = new Set(allPlateCells().map((c) => cellKey(c.x, c.y)));
    for (const c of cellsFor(piece, x, y, rot)) {
      const key = cellKey(c.x, c.y);
      if (c.x < 0 || c.y < 0 || c.x >= b.w || c.y >= b.h) return "outside";
      if (vents.has(key)) return "vent";
      if (occupied.has(key)) return "overlap";
    }
    return "";
  }
  function connectionStats(extra = null) {
    const b = board();
    const conductive = new Set();
    allPlateCells().forEach((c) => conductive.add(cellKey(c.x, c.y)));
    if (extra) extra.forEach((c) => conductive.add(cellKey(c.x, c.y)));
    b.ports.forEach(([x, y]) => conductive.add(cellKey(x, y)));
    if (!b.ports.length) return { connected:0, total:0, ventsBlocked:0 };
    const start = cellKey(b.ports[0][0], b.ports[0][1]);
    const seen = new Set([start]);
    const q = [b.ports[0]];
    while (q.length) {
      const [x, y] = q.shift();
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => {
        const nx = x + dx, ny = y + dy, key = cellKey(nx, ny);
        if (!seen.has(key) && conductive.has(key)) {
          seen.add(key);
          q.push([nx, ny]);
        }
      });
    }
    const connected = b.ports.filter(([x, y]) => seen.has(cellKey(x, y))).length;
    const vents = ventSet();
    let blocked = 0;
    allPlateCells().forEach((c) => { if (vents.has(cellKey(c.x, c.y))) blocked += 1; });
    return { connected, total:b.ports.length, ventsBlocked:blocked };
  }
  // What the currently-aimed placement would achieve, answered with the SAME
  // breadth-first connectivity search the real placement is judged by.
  // connectionStats() has always taken an `extra` argument for precisely this
  // question and not one call site ever passed it, so the player spent moves from
  // a fixed budget without ever being told what a move would buy.
  function placementOutlook(x, y) {
    const piece = selectedBase();
    if (!piece || state.complete || state.fail) return null;
    const rot = piece.rot || 0;
    const issue = placementIssue(piece, x, y, rot);
    const now = connectionStats();
    if (issue) {
      return { legal: false, issue, reason: issueLabel(issue), connectedNow: now.connected, total: now.total,
               connectedAfter: now.connected, gain: 0, ventsBlocked: now.ventsBlocked, wouldComplete: false, movesLeftAfter: state.movesLeft };
    }
    const after = connectionStats(cellsFor(piece, x, y, rot));
    const movesLeftAfter = state.movesLeft - 1;
    return {
      legal: true, issue: "", reason: "",
      connectedNow: now.connected, total: now.total, connectedAfter: after.connected,
      gain: after.connected - now.connected, ventsBlocked: after.ventsBlocked,
      wouldComplete: after.connected === after.total && after.ventsBlocked === 0,
      movesLeftAfter
    };
  }
  function setFeedback(text, ms = 900) {
    state.feedback = text;
    state.feedbackMs = Math.max(state.feedbackMs, ms);
  }
  function markGesture() {
    state.userGesture = true;
    canvas.focus({ preventScroll:true });
  }
  function ensureAudio() {
    if (!state.soundEnabled || !state.userGesture) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      if (!audio) audio = new AC();
      if (audio.state === "suspended") audio.resume().catch(() => {});
      return audio;
    } catch (_) {
      audio = null;
      return null;
    }
  }
  function sound(kind) {
    state.lastSound = state.soundEnabled ? kind : "muted-" + kind;
    const ac = ensureAudio();
    if (!ac) return;
    try {
      const freq = { select:320, rotate:430, place:620, bad:130, stage:760, fail:100, done:880, restart:260, toggle:500 }[kind] || 400;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = kind === "bad" || kind === "fail" ? "sawtooth" : "triangle";
      osc.frequency.setValueAtTime(freq, ac.currentTime);
      if (kind === "place" || kind === "done") osc.frequency.linearRampToValueAtTime(freq + 160, ac.currentTime + .13);
      gain.gain.setValueAtTime(.0001, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(kind === "fail" ? .07 : .04, ac.currentTime + .012);
      gain.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .18);
      osc.connect(gain).connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + .2);
    } catch (_) {}
  }
  function persistBest() {
    if (state.score > state.best) {
      state.best = state.score;
      write(BEST_KEY, state.best);
    }
  }
  function loadStage(index, keepScore = true) {
    state.stage = index;
    board().pieces.forEach((piece) => { piece.rot = 0; });
    state.mode = "playing";
    state.movesLeft = board().budget;
    state.placed = [];
    state.selectedPiece = 0;
    state.cursor = { x:Math.floor(board().w / 2), y:Math.floor(board().h / 2) };
    state.hover = null;
    state.dragging = false;
    state.complete = false;
    state.fail = false;
    state.selectionPulseMs = 900;
    state.rotationPulseMs = 0;
    if (!keepScore) state.score = 0;
    setFeedback(board().name + ": place plates, keep vents open.", 1300);
    sync();
    render();
  }
  function restartRun() {
    loadStage(0, false);
    sound("restart");
  }
  function nextStage() {
    if (state.stage >= BOARDS.length - 1) {
      state.mode = "run-complete";
      state.complete = true;
      persistBest();
      setFeedback("Run complete. Foundry grid fully commissioned.", 2200);
      sound("done");
      sync();
      render();
      return;
    }
    loadStage(state.stage + 1, true);
    sound("stage");
  }
  function failStage(reason) {
    state.mode = "fail";
    state.fail = true;
    setFeedback(reason, 1800);
    sound("fail");
  }
  function tryPlace(x = state.cursor.x, y = state.cursor.y) {
    if (state.complete) {
      restartRun();
      return;
    }
    if (state.fail) {
      loadStage(state.stage, true);
      sound("restart");
      return;
    }
    const piece = selectedBase();
    if (!piece) return;
    const rot = piece.rot || 0;
    const issue = placementIssue(piece, x, y, rot);
    if (issue) {
      state.selectionPulseMs = 800;
      setFeedback(issue === "vent" ? "Vent blocked. Leave blue grate cells open." : issue === "overlap" ? "Plate overlaps installed machinery." : "Plate hangs outside the foundry frame.", 1100);
      sound("bad");
      sync();
      render();
      return;
    }
    state.placed.push({ id:piece.id, x, y, rot });
    state.movesLeft -= 1;
    state.cursor = { x, y };
    state.selectionPulseMs = 900;
    const stats = connectionStats();
    const stageGain = stats.connected * 30 + state.movesLeft * 4 + state.placed.length * 3;
    setFeedback("Plate installed. Power ports online " + stats.connected + "/" + stats.total + ".", 1000);
    sound("place");
    if (stats.connected === stats.total && stats.ventsBlocked === 0) {
      state.score += stageGain + 80;
      persistBest();
      if (state.stage === BOARDS.length - 1) nextStage();
      else {
        state.mode = "stage-complete";
        state.complete = true;
        setFeedback(board().name + " complete. Press Enter or click board for next stage.", 1800);
        sound("stage");
      }
    } else if (state.movesLeft <= 0) {
      failStage("Move budget exhausted before all ports connected.");
    }
    sync();
    render();
  }
  function rotateSelected(dir) {
    const piece = selectedBase();
    if (!piece || state.complete || state.fail) return;
    piece.rot = ((piece.rot || 0) + dir + 4) % 4;
    state.selectionPulseMs = 900;
    state.rotationPulseMs = 900;
    setFeedback("Rotated " + piece.id.replace(/-/g, " ") + " to " + ((piece.rot || 0) * 90) + " deg.", 700);
    sound("rotate");
    sync();
    render();
  }
  function selectPiece(index) {
    state.selectedPiece = index;
    const piece = selectedBase();
    state.selectionPulseMs = 900;
    setFeedback(piece ? "Selected " + piece.id.replace(/-/g, " ") + "." : "All plates installed.", 700);
    sound("select");
    sync();
    render();
  }
  function boardCellFromPoint(px, py) {
    const { x, y, size } = boardRect;
    return { x:Math.floor((px - x) / size), y:Math.floor((py - y) / size) };
  }
  function pointFromEvent(ev) {
    const rect = canvas.getBoundingClientRect();
    return { x:(ev.clientX - rect.left) * W / rect.width, y:(ev.clientY - rect.top) * H / rect.height };
  }
  function trayHit(px, py) {
    return trayRects.findIndex((r) => px >= r.x && py >= r.y && px <= r.x + r.w && py <= r.y + r.h);
  }
  function handleCanvasPointer(ev, up = false) {
    markGesture();
    const p = pointFromEvent(ev);
    const hit = trayHit(p.x, p.y);
    if (hit >= 0) {
      selectPiece(hit);
      state.dragging = true;
      return;
    }
    const c = boardCellFromPoint(p.x, p.y);
    const b = board();
    if (c.x >= 0 && c.y >= 0 && c.x < b.w && c.y < b.h) {
      state.cursor = c;
      state.hover = c;
      if (up || ev.type === "pointerdown") {
        if (state.complete && state.mode === "stage-complete") nextStage();
        else tryPlace(c.x, c.y);
      }
    }
  }
  function targetIsControl(target) {
    return target instanceof HTMLElement && target.matches("button,input,select,textarea,[role='button']");
  }
  function keydown(ev) {
    if (ev.altKey || ev.ctrlKey || ev.metaKey || targetIsControl(ev.target)) return;
    const key = ev.key.toLowerCase();
    const handled = ["arrowleft","arrowright","arrowup","arrowdown","a","d","w","s","q","e","r","f","m","enter"," ","tab"].includes(key);
    if (!handled) return;
    ev.preventDefault();
    markGesture();
    if (key === "q") rotateSelected(-1);
    else if (key === "e") rotateSelected(1);
    else if (key === "r") restartRun();
    else if (key === "f") toggleFullscreen();
    else if (key === "m") toggleSound();
    else if (key === "tab") selectPiece(state.selectedPiece + 1);
    else if (key === "enter" || key === " ") {
      if (state.complete && state.mode === "stage-complete") nextStage();
      else tryPlace();
    } else {
      const dx = key === "arrowleft" || key === "a" ? -1 : key === "arrowright" || key === "d" ? 1 : 0;
      const dy = key === "arrowup" || key === "w" ? -1 : key === "arrowdown" || key === "s" ? 1 : 0;
      state.cursor.x = clamp(state.cursor.x + dx, 0, board().w - 1);
      state.cursor.y = clamp(state.cursor.y + dy, 0, board().h - 1);
      sync();
      render();
    }
  }
  function toggleSound() {
    markGesture();
    state.soundEnabled = !state.soundEnabled;
    write(SOUND_KEY, state.soundEnabled ? "1" : "0");
    sound("toggle");
    sync();
  }
  async function toggleFullscreen() {
    markGesture();
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await canvas.requestFullscreen();
    } catch (_) {}
    sync();
    render();
  }
  function update(ms) {
    state.timeMs += ms;
    state.feedbackMs = Math.max(0, state.feedbackMs - ms);
    state.selectionPulseMs = Math.max(0, state.selectionPulseMs - ms);
    state.rotationPulseMs = Math.max(0, state.rotationPulseMs - ms);
  }
  function sync() {
    const stats = connectionStats();
    const selected = selectedBase();
    const issue = selected && !state.complete && !state.fail ? placementIssue(selected, state.cursor.x, state.cursor.y, selected.rot || 0) : "";
    const rotation = selected ? (selected.rot || 0) * 90 : 0;
    state.lastConnected = stats.connected;
    state.lastBlocked = stats.ventsBlocked;
    els.stage.textContent = (state.stage + 1) + "/" + BOARDS.length;
    els.moves.textContent = String(state.movesLeft);
    els.ports.textContent = stats.connected + "/" + stats.total;
    els.score.textContent = String(state.score);
    els.best.textContent = String(state.best);
    els.status.textContent = state.feedbackMs > 0 || state.complete || state.fail ? state.feedback : "Patch plates between ports. Vents must stay open.";
    if (state.mode === "run-complete") {
      els.selection.textContent = "Run complete | score " + state.score + " | best " + state.best;
      els.selection.dataset.state = "clear";
    } else if (state.complete) {
      els.selection.textContent = board().name + " clear | press Enter or click board";
      els.selection.dataset.state = "clear";
    } else if (state.fail) {
      els.selection.textContent = "Retry " + board().name + " | " + state.feedback;
      els.selection.dataset.state = "blocked";
    } else if (selected) {
      // Say what this move would BUY, not just where the cursor is. The budget is
      // fixed, so "ports 2/4 -> 3/4, 2 moves left after" is the whole decision.
      const look = placementOutlook(state.cursor.x, state.cursor.y);
      let line = "Plate " + pieceLabel(selected) + " | rot " + rotation + " deg | at " + state.cursor.x + "," + state.cursor.y;
      if (look && !look.legal) {
        line += " | " + look.reason;
      } else if (look) {
        line += " | ports " + look.connectedNow + "/" + look.total + " to " + look.connectedAfter + "/" + look.total;
        line += look.gain > 0 ? " (+" + look.gain + ")" : " (no gain)";
        if (look.ventsBlocked > 0) line += " | blocks " + look.ventsBlocked + " vent" + (look.ventsBlocked === 1 ? "" : "s");
        line += " | " + look.movesLeftAfter + " move" + (look.movesLeftAfter === 1 ? "" : "s") + " left after";
        if (look.wouldComplete) line += " | COMPLETES THE STAGE";
        else if (look.movesLeftAfter <= 0) line += " | LAST MOVE, would not finish";
      }
      els.selection.textContent = line;
      els.selection.dataset.state = issue ? "blocked" : (look && look.wouldComplete) ? "clear" : "ready";
    } else {
      els.selection.textContent = "All plates installed";
      els.selection.dataset.state = "clear";
    }
    els.sound.textContent = state.soundEnabled ? "Sound On" : "Sound Off";
    els.sound.setAttribute("aria-pressed", String(state.soundEnabled));
    els.full.textContent = document.fullscreenElement ? "Exit Fullscreen" : "Fullscreen";
  }
  function drawRound(x, y, w, h, r, fill, stroke = "") {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  function compactCanvasLayout() {
    return Boolean(window.matchMedia && window.matchMedia("(max-width: 720px)").matches);
  }
  function drawGrid() {
    const b = board();
    const compact = compactCanvasLayout();
    const size = Math.min(compact ? 68 : 72, Math.floor(Math.min((compact ? 760 : 560) / b.w, (compact ? 372 : 410) / b.h)));
    boardRect = { x:compact ? Math.round((W - b.w * size) / 2) : 54, y:compact ? 76 : 72, size };
    const bw = b.w * size, bh = b.h * size;
    ctx.lineWidth = 2;
    drawRound(boardRect.x - 14, boardRect.y - 14, bw + 28, bh + 28, 12, "rgba(5,12,22,.88)", "rgba(103,232,249,.28)");
    ctx.lineWidth = 1.25;
    for (let y = 0; y < b.h; y += 1) {
      for (let x = 0; x < b.w; x += 1) {
        const px = boardRect.x + x * size, py = boardRect.y + y * size;
        drawRound(px + 2, py + 2, size - 4, size - 4, 7, "rgba(16,31,49,.9)", "rgba(103,232,249,.18)");
      }
    }
    b.vents.forEach(([x, y]) => {
      const px = boardRect.x + x * size, py = boardRect.y + y * size;
      drawRound(px + 8, py + 8, size - 16, size - 16, 6, "#113044", "#67e8f9");
      ctx.strokeStyle = "rgba(103,232,249,.75)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i += 1) {
        ctx.beginPath();
        ctx.moveTo(px + 14, py + 16 + i * 9);
        ctx.lineTo(px + size - 14, py + 16 + i * 9);
        ctx.stroke();
      }
    });
    b.ports.forEach(([x, y], i) => {
      const px = boardRect.x + x * size, py = boardRect.y + y * size;
      drawRound(px + 6, py + 6, size - 12, size - 12, 9, i === 0 ? "#fbbf24" : "#1dd3b0", "#fff7b8");
      ctx.fillStyle = "#071018";
      ctx.font = "1000 16px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(i === 0 ? "P" : String(i), px + size / 2, py + size / 2 + 6);
    });
    drawPlaced(size);
    drawGhost(size);
    const selected = selectedBase();
    const issue = selected ? placementIssue(selected, state.cursor.x, state.cursor.y, selected.rot || 0) : "";
    ctx.save();
    ctx.strokeStyle = issue ? "#fb7185" : "#fbbf24";
    ctx.lineWidth = compact ? 5 : 4;
    if (issue) ctx.setLineDash([8, 5]);
    ctx.strokeRect(boardRect.x + state.cursor.x * size + 4, boardRect.y + state.cursor.y * size + 4, size - 8, size - 8);
    if (state.selectionPulseMs > 0) {
      ctx.setLineDash([]);
      ctx.globalAlpha = Math.min(.55, state.selectionPulseMs / 900);
      ctx.lineWidth = compact ? 8 : 6;
      ctx.strokeStyle = state.rotationPulseMs > 0 ? "#fbbf24" : "rgba(103,232,249,.9)";
      ctx.strokeRect(boardRect.x + state.cursor.x * size + 1, boardRect.y + state.cursor.y * size + 1, size - 2, size - 2);
    }
    ctx.restore();
  }
  function drawCell(x, y, size, color, alpha = 1) {
    const px = boardRect.x + x * size, py = boardRect.y + y * size;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineWidth = Math.max(1.5, size * .045);
    drawRound(px + 5, py + 5, size - 10, size - 10, 8, color, "rgba(255,255,255,.45)");
    ctx.fillStyle = "rgba(7,16,24,.25)";
    ctx.fillRect(px + size * .22, py + size * .45, size * .56, size * .1);
    ctx.restore();
  }
  function drawPlaced(size) {
    state.placed.forEach((placed, index) => {
      const p = pieceById(placed.id);
      if (!p) return;
      cellsFor(p, placed.x, placed.y, placed.rot).forEach((c) => drawCell(c.x, c.y, size, COLORS[index % COLORS.length], 1));
    });
  }
  function drawGhost(size) {
    const p = selectedBase();
    if (!p || state.complete || state.fail) return;
    const issue = placementIssue(p, state.cursor.x, state.cursor.y, p.rot || 0);
    const color = issue ? "#fb7185" : state.rotationPulseMs > 0 ? "#fbbf24" : "#e2e8f0";
    cellsFor(p, state.cursor.x, state.cursor.y, p.rot || 0).forEach((c) => drawCell(c.x, c.y, size, color, issue ? .52 : .58));
  }
  function drawPieceMini(piece, x, y, unit, color) {
    rotatedCells(piece.cells, piece.rot || 0).forEach((c) => {
      ctx.lineWidth = 1;
      drawRound(x + c.x * unit, y + c.y * unit, unit - 2, unit - 2, 3, color, "rgba(255,255,255,.4)");
    });
  }
  function drawTray() {
    const open = openPieces();
    const compact = compactCanvasLayout();
    trayRects = [];
    ctx.fillStyle = "#e9f2ff";
    ctx.font = "1000 18px system-ui";
    ctx.textAlign = "left";
    if (compact) {
      const y = 462, h = 58, gap = 8;
      const x0 = 36;
      const w = open.length ? Math.floor((W - x0 * 2 - gap * (open.length - 1)) / open.length) : 240;
      ctx.fillStyle = "#e9f2ff";
      ctx.font = "1000 16px system-ui";
      ctx.fillText("PLATES", x0, y - 10);
      open.forEach((piece, index) => {
        const x = x0 + index * (w + gap);
        const active = index === state.selectedPiece;
        const pulse = active ? Math.min(1, state.selectionPulseMs / 900) : 0;
        trayRects.push({ x, y, w, h });
        ctx.lineWidth = active ? 3 : 1.5;
        drawRound(x, y, w, h, 9, active ? "rgba(251,191,36," + (.17 + pulse * .13) + ")" : "rgba(15,27,43,.94)", active ? "#fbbf24" : "rgba(103,232,249,.28)");
        ctx.fillStyle = COLORS[index % COLORS.length];
        ctx.font = "1000 12px system-ui";
        ctx.fillText(String(index + 1) + " " + piece.id.split("-")[0].toUpperCase(), x + 8, y + 18);
        drawPieceMini(piece, x + 9, y + 29, 9, COLORS[index % COLORS.length]);
        ctx.fillStyle = active && state.rotationPulseMs > 0 ? "#fbbf24" : "#9fb3c7";
        ctx.font = "900 10px system-ui";
        ctx.textAlign = "right";
        ctx.fillText(((piece.rot || 0) * 90) + " deg", x + w - 7, y + h - 8);
        ctx.textAlign = "left";
      });
      if (!open.length) {
        drawRound(x0, y, 240, 58, 9, "rgba(15,27,43,.94)", "rgba(103,232,249,.28)");
        ctx.fillStyle = "#9fb3c7";
        ctx.font = "900 13px system-ui";
        ctx.fillText("All plates installed", x0 + 12, y + 34);
      }
      return;
    }
    ctx.fillText("MACHINE PLATES", 660, 84);
    open.forEach((piece, index) => {
      const x = 660, y = 104 + index * 58, w = 250, h = 54;
      const active = index === state.selectedPiece;
      const pulse = active ? Math.min(1, state.selectionPulseMs / 900) : 0;
      trayRects.push({ x, y, w, h });
      ctx.lineWidth = active ? 3 : 1.5;
      drawRound(x, y, w, h, 8, active ? "rgba(251,191,36," + (.18 + pulse * .14) + ")" : "rgba(15,27,43,.92)", active ? "#fbbf24" : "rgba(103,232,249,.24)");
      ctx.fillStyle = COLORS[index % COLORS.length];
      ctx.font = "1000 12px system-ui";
      ctx.fillText(String(index + 1) + " " + piece.id.toUpperCase().replace(/-/g, " "), x + 10, y + 20);
      drawPieceMini(piece, x + 12, y + 30, 13, COLORS[index % COLORS.length]);
      if (active) {
        drawRound(x + w - 70, y + 7, 58, 18, 6, "rgba(251,191,36,.92)", "");
        ctx.fillStyle = "#321a05";
        ctx.font = "1000 10px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("ACTIVE", x + w - 41, y + 20);
        ctx.textAlign = "left";
      }
      ctx.fillStyle = active && state.rotationPulseMs > 0 ? "#fbbf24" : "#9fb3c7";
      ctx.font = "800 11px system-ui";
      ctx.textAlign = "right";
      ctx.fillText("rot " + ((piece.rot || 0) * 90) + " deg", x + w - 10, y + 32);
      ctx.textAlign = "left";
    });
    if (!open.length) {
      drawRound(660, 104, 250, 54, 8, "rgba(15,27,43,.92)", "rgba(103,232,249,.24)");
      ctx.fillStyle = "#9fb3c7";
      ctx.font = "900 13px system-ui";
      ctx.fillText("All plates installed", 674, 136);
    }
  }
  function drawTraceOverlay() {
    const stats = connectionStats();
    if (compactCanvasLayout()) {
      drawRound(54, 20, W - 108, 38, 9, "rgba(5,12,22,.78)", "rgba(103,232,249,.22)");
      ctx.fillStyle = "#e9f2ff";
      ctx.font = "1000 15px system-ui";
      ctx.textAlign = "left";
      ctx.fillText(board().name, 72, 45);
      ctx.fillStyle = "#67e8f9";
      ctx.font = "900 13px system-ui";
      ctx.textAlign = "right";
      ctx.fillText("Ports " + stats.connected + "/" + stats.total + " | Moves " + state.movesLeft + " | Vents " + stats.ventsBlocked, W - 72, 45);
      ctx.textAlign = "left";
      return;
    }
    ctx.fillStyle = "#9fb3c7";
    ctx.font = "900 13px system-ui";
    ctx.textAlign = "left";
    ctx.fillText(board().name, 54, 38);
    ctx.fillText("Connect all ports. Vents blocked: " + stats.ventsBlocked, 54, 56);
    drawRound(668, 414, 238, 74, 9, "rgba(15,27,43,.88)", "rgba(103,232,249,.2)");
    ctx.fillStyle = "#67e8f9";
    ctx.font = "1000 14px system-ui";
    ctx.fillText("POWER NETWORK", 684, 440);
    ctx.fillStyle = "#e9f2ff";
    ctx.font = "1000 24px system-ui";
    ctx.fillText(stats.connected + "/" + stats.total, 684, 470);
    ctx.fillStyle = "#9fb3c7";
    ctx.font = "800 12px system-ui";
    ctx.fillText("moves left " + state.movesLeft + "   score " + state.score, 750, 468);
  }
  function drawOverlay() {
    if (!state.complete && !state.fail) return;
    ctx.fillStyle = "rgba(4,8,15,.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = state.fail ? "#fb7185" : "#fbbf24";
    ctx.font = "1000 42px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(state.fail ? "RUN FAILED" : state.mode === "run-complete" ? "RUN COMPLETE" : "STAGE COMPLETE", W / 2, H / 2 - 18);
    ctx.fillStyle = "#e9f2ff";
    ctx.font = "850 16px system-ui";
    ctx.fillText(state.feedback, W / 2, H / 2 + 22);
  }
  function render() {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#08111d");
    bg.addColorStop(1, "#101827");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(103,232,249,.06)";
    for (let x = -120; x < W + 160; x += 42) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + 120, H);
      ctx.stroke();
    }
    drawGrid();
    drawTray();
    drawTraceOverlay();
    drawOverlay();
  }
  function snapshot() {
    const b = board();
    const stats = connectionStats();
    const selected = selectedBase();
    const issue = selected && !state.complete && !state.fail ? placementIssue(selected, state.cursor.x, state.cursor.y, selected.rot || 0) : "";
    return JSON.stringify({
      mode: state.mode,
      stage: state.stage + 1,
      stageName: b.name,
      score: state.score,
      best: state.best,
      board: { width:b.w, height:b.h },
      "board size": { width:b.w, height:b.h },
      placedPieces: state.placed.map((p) => ({ id:p.id, x:p.x, y:p.y, rotation:p.rot })),
      "placed pieces": state.placed.length,
      selectedPiece: selected ? { id:selected.id, rotation:selected.rot || 0, cells:rotatedCells(selected.cells, selected.rot || 0) } : null,
      "selected piece": selected ? selected.id : null,
      selectedRotationDegrees: selected ? (selected.rot || 0) * 90 : 0,
      selectedPlacement: selected ? { status:issue || "ready", label:issueLabel(issue), cursor:{ x:state.cursor.x, y:state.cursor.y } } : null,
      cursor: { x:state.cursor.x, y:state.cursor.y },
      // What the aimed placement would achieve, from the same search that judges
      // the real one. Published so the forecast is testable, not merely visible.
      placementOutlook: placementOutlook(state.cursor.x, state.cursor.y),
      selectionLine: els.selection ? els.selection.textContent : "",
      powerConnectedCount: stats.connected,
      "power connected count": stats.connected,
      powerPortTotal: stats.total,
      ventsBlocked: stats.ventsBlocked,
      "vents blocked": stats.ventsBlocked,
      movesLeft: state.movesLeft,
      feedback: state.feedback,
      visibleFeedback: els.status.textContent,
      selectionFeedback: els.selection.textContent,
      feedbackActive: state.feedbackMs > 0 || state.selectionPulseMs > 0 || state.rotationPulseMs > 0,
      soundEnabled: state.soundEnabled,
      lastSound: state.lastSound,
      fullscreen: Boolean(document.fullscreenElement),
      complete: state.complete || state.mode === "run-complete",
      fail: state.fail,
      runComplete: state.mode === "run-complete",
      coordinateSystem: "canvas board cells, origin top-left, x right, y down"
    });
  }
  canvas.addEventListener("pointerdown", (ev) => handleCanvasPointer(ev, false));
  canvas.addEventListener("pointermove", (ev) => {
    const p = pointFromEvent(ev);
    const c = boardCellFromPoint(p.x, p.y);
    if (c.x >= 0 && c.y >= 0 && c.x < board().w && c.y < board().h) {
      state.cursor = c;
      sync();
      render();
    }
  });
  canvas.addEventListener("pointerup", (ev) => {
    if (state.dragging) {
      state.dragging = false;
      handleCanvasPointer(ev, true);
    }
  });
  els.left.addEventListener("click", () => { markGesture(); rotateSelected(-1); });
  els.right.addEventListener("click", () => { markGesture(); rotateSelected(1); });
  els.restart.addEventListener("click", () => { markGesture(); restartRun(); });
  els.sound.addEventListener("click", toggleSound);
  els.full.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", () => { sync(); render(); });
  window.addEventListener("keydown", keydown);
  window.render_game_to_text = snapshot;
  window.advanceTime = (ms = 0) => {
    const safe = Math.max(0, Number(ms) || 0);
    const frames = Math.max(1, Math.round(safe / (1000 / 60)));
    for (let i = 0; i < frames; i += 1) update(1000 / 60);
    sync();
    render();
    return snapshot();
  };
  loadStage(0, true);
})();
</script>
</body>
</html>
