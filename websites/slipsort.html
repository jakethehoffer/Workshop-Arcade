*{box-sizing:border-box}

.pill{min-width:0;border-radius:8px;padding:7px 5px;text-align:center}.label{display:block;color:#5eead4;font-size:9px;font-weight:950;text-transform:uppercase;white-space:nowrap}.value{display:block;margin-top:2px;color:#f8fbff;font-size:17px;font-weight:950;font-variant-numeric:tabular-nums;white-space:nowrap}

<body>
<main class="app" id="app" aria-label="Slipsort sliding puzzle">
  <header class="top">
    <div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Slipsort</span></div>
    <div class="help">Arrow keys or WASD move the gap; a tile slides in. Tap any tile in the gap's row or column to slide it over. Sort 1 upward to clear. R resets, N restarts.</div>
  </header>
  <section class="hud" aria-label="Game status">
    <div class="pill"><span class="label">Level</span><span class="value" id="levelValue">1/3</span></div>
    <div class="pill"><span class="label">Size</span><span class="value" id="sizeValue">3×3</span></div>
    <div class="pill"><span class="label">Moves</span><span class="value" id="movesValue">0</span></div>
    <div class="pill"><span class="label">Ordered</span><span class="value" id="orderedValue">0/8</span></div>
    <div class="pill"><span class="label">Best</span><span class="value" id="bestValue">—</span></div>
    <div class="pill"><span class="label">Solved</span><span class="value" id="solvedValue">0/3</span></div>
  </section>
  <div class="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Slipsort sliding-tile board. Slide numbered tiles into the gap to order them 1 upward."></canvas></div>
  <div class="status" id="statusLine" aria-live="polite">Slide the tiles into ascending order, gap last.</div>
  <div class="sr-only" id="liveStatus" role="status" aria-live="polite" aria-atomic="true">Slipsort ready.</div>
  <section class="bar" aria-label="Actions">
    <button class="btn primary" id="newBtn" type="button">New Game</button>
    <button class="btn" id="resetBtn" type="button">Reset Level</button>
    <button class="btn" id="soundBtn" type="button" aria-pressed="true">Sound On</button>
  </section>
  <section class="touch" aria-label="Touch controls">
    <button type="button" data-key="ArrowUp">Up</button><button type="button" data-key="n" class="wide">New</button><button type="button" data-key="r">Reset</button>
    <button type="button" data-key="ArrowLeft">Left</button><button type="button" data-key="ArrowDown">Down</button><button type="button" data-key="ArrowRight">Right</button>
  </section>
</main>
<script>
(() => {
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const STATS_KEY="slipsort.stats.v1",SOUND_KEY="slipsort.sound.v1";
const SIZES=[3,4,5],SEEDS=[1734,28591,50273],TOTAL=SIZES.length;
const $=id=>document.getElementById(id);
const els={level:$("levelValue"),size:$("sizeValue"),moves:$("movesValue"),ordered:$("orderedValue"),best:$("bestValue"),solved:$("solvedValue"),status:$("statusLine"),live:$("liveStatus"),sound:$("soundBtn"),neww:$("newBtn"),reset:$("resetBtn")};
const saved=readStats();
const state={idx:0,size:3,board:[],blank:0,moves:0,mode:"playing",best:saved.best,solvedSizes:saved.solved,sound:readSound(),feedback:"Slide the tiles into ascending order, gap last.",lastMoved:-1,flash:0,time:0};
let audio=null;

function store(){try{return window.localStorage||window.workshopStorage}catch(_){return window.workshopStorage||null}}
function readStats(){try{const v=JSON.parse((store()||{}).getItem(STATS_KEY));if(v&&typeof v==="object")return{best:(v.best&&typeof v.best==="object")?v.best:{},solved:Array.isArray(v.solved)?v.solved.filter(n=>typeof n==="number"):[]}}catch(_){}return{best:{},solved:[]}}
function saveStats(){try{(store()||{}).setItem(STATS_KEY,JSON.stringify({best:state.best,solved:state.solvedSizes}))}catch(_){}}
function readSound(){try{const v=(store()||{}).getItem(SOUND_KEY);return v==null?true:v==="true"}catch(_){return true}}
function saveSound(){try{(store()||{}).setItem(SOUND_KEY,String(state.sound))}catch(_){}}
function say(t){state.feedback=t;els.status.textContent=t;els.live.textContent=t}
function vibe(n){try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(n)}catch(_){}}
function tone(kind){if(!state.sound)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;const f={slide:300,clear:520,win:660,bad:150}[kind]||260;o.type="triangle";o.frequency.setValueAtTime(f,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.06,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.16);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.18)}catch(_){}}

function solvedBoard(size){const a=[];for(let i=1;i<size*size;i++)a.push(i);a.push(0);return a}
function isSolvedArr(b,size){for(let i=0;i<size*size-1;i++)if(b[i]!==i+1)return false;return b[size*size-1]===0}
function neighbors(idx,size){const r=Math.floor(idx/size),c=idx%size,out=[];if(r>0)out.push(idx-size);if(r<size-1)out.push(idx+size);if(c>0)out.push(idx-1);if(c<size-1)out.push(idx+1);return out}
// Scramble by applying legal gap-moves from the solved board, so the result is
// always solvable. A fixed per-level LCG seed makes it deterministic (and the
// `last` guard avoids immediately undoing the previous slide).
function scramble(size,seed){const b=solvedBoard(size);let blank=size*size-1,s=seed>>>0,last=-1;const k=size*size*16;for(let i=0;i<k;i++){const nb=neighbors(blank,size).filter(x=>x!==last);s=(s*1103515245+12345)&0x7fffffff;const pick=nb[s%nb.length];b[blank]=b[pick];b[pick]=0;last=blank;blank=pick}if(isSolvedArr(b,size)){const nb=neighbors(blank,size);b[blank]=b[nb[0]];b[nb[0]]=0;blank=nb[0]}return{board:b,blank}}
function orderedCount(){let n=0;for(let i=0;i<state.size*state.size-1;i++)if(state.board[i]===i+1)n++;return n}

function loadLevel(i){state.idx=i;state.size=SIZES[i];const sc=scramble(state.size,SEEDS[i]);state.board=sc.board;state.blank=sc.blank;state.moves=0;state.mode="playing";state.lastMoved=-1;update();draw()}

function doSwap(from){state.board[state.blank]=state.board[from];state.board[from]=0;state.lastMoved=state.blank;state.blank=from;state.moves++;state.flash=1}
function moveGap(dir){if(state.mode!=="playing")return;const size=state.size,r=Math.floor(state.blank/size),c=state.blank%size;let from=-1;
  if(dir==="up"&&r>0)from=state.blank-size;else if(dir==="down"&&r<size-1)from=state.blank+size;else if(dir==="left"&&c>0)from=state.blank-1;else if(dir==="right"&&c<size-1)from=state.blank+1;
  if(from<0){tone("bad");return}
  doSwap(from);tone("slide");vibe(8);afterMove()}
function slideTo(target){if(state.mode!=="playing"||target===state.blank)return;const size=state.size,bR=Math.floor(state.blank/size),bC=state.blank%size,tR=Math.floor(target/size),tC=target%size;
  if(bR===tR){const step=tC>bC?1:-1;while(state.blank%size!==tC)doSwap(state.blank+step);tone("slide");vibe(8);afterMove()}
  else if(bC===tC){const step=tR>bR?size:-size;while(Math.floor(state.blank/size)!==tR)doSwap(state.blank+step);tone("slide");vibe(8);afterMove()}
  else{say("Tap a tile in the gap's row or column.");tone("bad");draw()}}

function afterMove(){if(isSolvedArr(state.board,state.size)){solveLevel();return}const o=orderedCount();say(o+" of "+(state.size*state.size-1)+" tiles home · "+state.moves+" move"+(state.moves===1?"":"s")+".");update();draw()}
function solveLevel(){const key=String(state.size),prev=state.best[key];if(prev==null||state.moves<prev){state.best[key]=state.moves}if(!state.solvedSizes.includes(state.size))state.solvedSizes.push(state.size);saveStats();
  if(state.idx<TOTAL-1){state.mode="clear";state.nextAt=state.idx+1;state.clearWait=0;tone("clear");vibe([22,22]);say("Level "+(state.idx+1)+" sorted in "+state.moves+" moves! Loading "+SIZES[state.idx+1]+"×"+SIZES[state.idx+1]+"…")}
  else{state.mode="allclear";tone("win");vibe([30,30,40]);say("Every grid sorted — Slipsort complete! Press New Game.")}
  update();draw()}

function reset(){loadLevel(state.idx);say("Level "+(state.idx+1)+" reshuffled.");tone("slide")}
function newGame(){loadLevel(0);say("New run — sort each grid 1 upward with the gap last.");tone("slide")}

function update(){els.level.textContent=(state.idx+1)+"/"+TOTAL;els.size.textContent=state.size+"×"+state.size;els.moves.textContent=String(state.moves);els.ordered.textContent=orderedCount()+"/"+(state.size*state.size-1);const b=state.best[String(state.size)];els.best.textContent=b==null?"—":String(b);els.solved.textContent=state.solvedSizes.length+"/"+TOTAL;els.sound.textContent=state.sound?"Sound On":"Sound Off";els.sound.setAttribute("aria-pressed",String(state.sound))}

function gridRect(){const n=state.size,cell=Math.min((canvas.width-250)/n,(canvas.height-104)/n);return{cell,n,x:46,y:Math.round((canvas.height-cell*n)/2)+8}}
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);if(fill)ctx.fill();if(stroke)ctx.stroke()}
function cellXY(idx,g){const r=Math.floor(idx/g.n),c=idx%g.n;return{x:c*g.cell,y:r*g.cell}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const bg=ctx.createLinearGradient(0,0,0,canvas.height);bg.addColorStop(0,"#07182a");bg.addColorStop(1,"#050a16");ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
  const g=gridRect(),cell=g.cell,n=g.n,pad=Math.max(3,cell*.05);
  ctx.textAlign="left";ctx.fillStyle="#5eead4";ctx.font="900 20px system-ui";ctx.fillText("Slipsort",30,36);
  ctx.fillStyle="#9fb3c8";ctx.font="700 12px system-ui";ctx.fillText("Slide tiles into the gap until they read 1 upward, gap last.",30,53);
  ctx.save();ctx.translate(g.x,g.y);
  ctx.fillStyle="#0a1a2c";roundRect(-9,-9,cell*n+18,cell*n+18,12,true,false);
  for(let i=0;i<n*n;i++){const v=state.board[i];const p=cellXY(i,g),lx=p.x+pad,ly=p.y+pad,sz=cell-pad*2;
    if(v===0){ctx.fillStyle="#06101d";roundRect(lx,ly,sz,sz,Math.min(12,cell*.12),true,false);ctx.strokeStyle="rgba(94,234,212,.10)";ctx.lineWidth=2;roundRect(lx+.5,ly+.5,sz-1,sz-1,Math.min(12,cell*.12),false,true);continue}
    const home=v===i+1;
    if(home){const gr=ctx.createLinearGradient(lx,ly,lx,ly+sz);gr.addColorStop(0,"#2dd4bf");gr.addColorStop(1,"#168f86");ctx.fillStyle=gr}
    else{const gr=ctx.createLinearGradient(lx,ly,lx,ly+sz);gr.addColorStop(0,"#1b314f");gr.addColorStop(1,"#122237");ctx.fillStyle=gr}
    if(i===state.lastMoved&&state.flash>0){ctx.shadowColor="rgba(126,249,255,.8)";ctx.shadowBlur=cell*.2}
    roundRect(lx,ly,sz,sz,Math.min(14,cell*.14),true,false);ctx.shadowBlur=0;
    ctx.strokeStyle=home?"rgba(255,255,255,.4)":"rgba(94,234,212,.22)";ctx.lineWidth=2;roundRect(lx+.5,ly+.5,sz-1,sz-1,Math.min(14,cell*.14),false,true);
    ctx.fillStyle=home?"#04221f":"#eaf6ff";ctx.font="950 "+Math.round(cell*.34)+"px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(v),lx+sz/2,ly+sz/2+1);ctx.textAlign="left";ctx.textBaseline="alphabetic"}
  ctx.restore();
  drawSide(g);
  if(state.mode==="allclear"){ctx.fillStyle="rgba(3,7,18,.80)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.textAlign="center";ctx.fillStyle="#5eead4";ctx.font="950 46px system-ui";ctx.fillText("ALL CLEAR",canvas.width/2,canvas.height/2-6);ctx.fillStyle="#dbeafe";ctx.font="800 18px system-ui";ctx.fillText(state.feedback,canvas.width/2,canvas.height/2+30);ctx.textAlign="left"}}
function drawSide(g){const px=g.x+g.cell*g.n+34;let py=g.y+10;ctx.textAlign="left";
  const block=(label,val,color)=>{ctx.fillStyle="#9fb3c8";ctx.font="800 12px system-ui";ctx.fillText(label,px,py+6);ctx.fillStyle=color||"#f3fbff";ctx.font="950 27px system-ui";ctx.fillText(val,px,py+34);py+=62};
  block("LEVEL",(state.idx+1)+" / "+TOTAL);
  block("GRID",state.size+"×"+state.size);
  const total=state.size*state.size-1,o=orderedCount();
  block("ORDERED",o+" / "+total,o===total?"#5eead4":"#7ef9ff");
  block("MOVES · BEST",state.moves+" · "+(state.best[String(state.size)]==null?"—":state.best[String(state.size)]))}

function tick(dt){state.time+=dt;if(state.flash>0)state.flash=Math.max(0,state.flash-dt/200);if(state.mode==="clear"&&state.nextAt!=null){state.clearWait+=dt;if(state.clearWait>=600){const ni=state.nextAt;state.nextAt=null;loadLevel(ni);say("Level "+(ni+1)+" — sort the "+SIZES[ni]+"×"+SIZES[ni]+" grid.")}}draw()}
window.advanceTime=ms=>{const n=Math.max(1,Math.ceil(ms/40));for(let i=0;i<n;i++)tick(ms/n);return window.render_game_to_text()};
window.render_game_to_text=function render_game_to_text(){return JSON.stringify({mode:state.mode,level:state.idx+1,total:TOTAL,size:state.size,moves:state.moves,ordered:orderedCount(),tiles:state.size*state.size-1,best:state.best[String(state.size)]??null,solved:state.solvedSizes.length,blank:state.blank,lastMoved:state.lastMoved,sound:state.sound,feedback:state.feedback,board:state.board.slice(),coordinateSystem:"board is row-major length size*size; 0 is the gap; solved = 1..size*size-1 then 0"})};

document.addEventListener("keydown",e=>{const t=e.target;if(t&&/^(button|input|select|textarea)$/i.test(t.tagName||""))return;const k=e.key;if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(k))e.preventDefault();
  if(k==="ArrowLeft"||k==="a")moveGap("left");else if(k==="ArrowRight"||k==="d")moveGap("right");else if(k==="ArrowUp"||k==="w")moveGap("up");else if(k==="ArrowDown"||k==="s")moveGap("down");else if(k==="r")reset();else if(k==="n")newGame()});
canvas.addEventListener("pointerdown",e=>{canvas.focus();const b=canvas.getBoundingClientRect(),px=(e.clientX-b.left)/b.width*canvas.width,py=(e.clientY-b.top)/b.height*canvas.height,g=gridRect(),c=Math.floor((px-g.x)/g.cell),r=Math.floor((py-g.y)/g.cell);if(c>=0&&r>=0&&c<g.n&&r<g.n)slideTo(r*g.n+c)});
els.neww.addEventListener("click",newGame);
els.reset.addEventListener("click",reset);
els.sound.addEventListener("click",()=>{state.sound=!state.sound;saveSound();update();say(state.sound?"Sound enabled.":"Sound muted.");tone("slide")});
document.querySelectorAll("[data-key]").forEach(btn=>btn.addEventListener("click",()=>{canvas.focus();const k=btn.dataset.key;if(k==="ArrowLeft")moveGap("left");else if(k==="ArrowRight")moveGap("right");else if(k==="ArrowUp")moveGap("up");else if(k==="ArrowDown")moveGap("down");else if(k==="r")reset();else if(k==="n")newGame()}));
loadLevel(0);
let last=performance.now();function frame(now){const dt=Math.min(80,now-last);last=now;tick(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
