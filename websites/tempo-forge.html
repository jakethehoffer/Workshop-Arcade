<body>
<script src="workshop-runtime.js"></script>
<div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Tempo Forge</span></div>
<main class="panel" aria-label="Tempo Forge game">
  <div class="hud" aria-label="Tempo Forge status">
    <div class="pill"><span class="label">Level</span><span class="value" id="levelValue">1</span></div>
    <div class="pill"><span class="label">Score</span><span class="value" id="scoreValue">0</span></div>
    <div class="pill"><span class="label">Streak</span><span class="value" id="streakValue">0</span></div>
    <div class="pill"><span class="label">Best</span><span class="value" id="bestValue">0</span></div>
  </div>
  <div class="stage"><canvas id="game" width="640" height="360" tabindex="0" aria-label="Tempo Forge rhythm display. Match the highlighted target rhythm by toggling four pads across four steps."></canvas></div>
  <div class="editor-cluster">
    <div class="grid" id="grid" aria-label="Pattern editor"></div>
    <div class="forge-strip" aria-label="Playback and check controls">
      <div>
        <div class="status" id="statusLine" aria-live="polite">Forge the target rhythm, then check the loop.</div>
        <div class="step-cue" id="stepCue">Step 1 ready. Kick focused.</div>
      </div>
      <div class="controls">
        <button class="btn primary" type="button" id="playBtn">Play</button>
        <button class="btn" type="button" id="checkBtn">Check</button>
        <button class="btn" type="button" id="nextBtn">Next</button>
        <button class="btn" type="button" id="restartBtn">Restart</button>
        <button class="btn" type="button" id="soundBtn" aria-pressed="true">Sound On</button>
      </div>
    </div>
  </div>
  <p class="hint">Arrows move focus. Space toggles. 1-4 toggle the focused pad's steps. P plays, Enter checks, R restarts.</p>
  <div class="sr" id="liveLine" aria-live="polite"></div>
</main>
<script>
(function(){
  "use strict";
  const PADS = 4;
  const STEPS = 4;
  const STEP_MS = 360;
  const BEST_KEY = "tempo-forge.best.v1";
  const SOUND_KEY = "tempo-forge.sound.v1";
  const padNames = ["Kick","Snare","Hat","Clap"];
  const padColors = ["#5eead4","#fbbf24","#7c9eff","#fb7185"];
  const freqs = [98,196,392,294];
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const grid = document.getElementById("grid");
  const els = {
    level:document.getElementById("levelValue"),score:document.getElementById("scoreValue"),streak:document.getElementById("streakValue"),
    best:document.getElementById("bestValue"),status:document.getElementById("statusLine"),stepCue:document.getElementById("stepCue"),live:document.getElementById("liveLine"),
    play:document.getElementById("playBtn"),check:document.getElementById("checkBtn"),next:document.getElementById("nextBtn"),
    restart:document.getElementById("restartBtn"),sound:document.getElementById("soundBtn")
  };
  const safeStorage = {
    get(key,fallback){try{const value=localStorage.getItem(key);return value===null?fallback:value}catch(_){return fallback}},
    set(key,value){try{localStorage.setItem(key,String(value))}catch(_){}}
  };
  let audioCtx = null;
  const state = {
    mode:"edit",level:1,pattern:[],playerPattern:blank(),beat:0,beatTimer:0,score:0,streak:0,
    best:Number(safeStorage.get(BEST_KEY,"0"))||0,sound:safeStorage.get(SOUND_KEY,"1")!=="0",
    feedback:"Forge the target rhythm.",focusPad:0,focusStep:0,flash:0
  };
  function blank(){return Array.from({length:PADS},()=>Array(STEPS).fill(0))}
  function clonePattern(source){return source.map(row=>row.slice())}
  function makePattern(level){
    const p = blank();
    for(let pad=0;pad<PADS;pad++){
      for(let step=0;step<STEPS;step++){
        const seed = (level*17 + pad*11 + step*7 + ((level+pad) % 3)*5) % 13;
        p[pad][step] = seed < 4 || (step === (pad + level) % STEPS && level > 2) ? 1 : 0;
      }
    }
    if(!p.some(row=>row.some(Boolean))) p[level % PADS][level % STEPS] = 1;
    return p;
  }
  function rebuildGrid(){
    grid.textContent = "";
    for(let pad=0;pad<PADS;pad++){
      const label = document.createElement("div");
      label.className = "pad-label";
      label.textContent = padNames[pad];
      grid.appendChild(label);
      for(let step=0;step<STEPS;step++){
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cell";
        btn.dataset.pad = String(pad);
        btn.dataset.step = String(step);
        btn.setAttribute("aria-label", padNames[pad] + " step " + (step + 1));
        btn.addEventListener("click",()=>toggleCell(pad,step,true));
        grid.appendChild(btn);
      }
    }
  }
  function setFeedback(text){
    state.feedback = text;
    els.status.textContent = text;
    els.live.textContent = text;
  }
  function ensureAudio(){
    if(!state.sound) return null;
    const AudioClass = window.AudioContext || window.webkitAudioContext;
    if(!AudioClass) return null;
    if(!audioCtx) audioCtx = new AudioClass();
    if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    return audioCtx;
  }
  function tone(pad, duration){
    const ac = ensureAudio();
    if(!ac) return;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = pad === 2 ? "square" : "sine";
    osc.frequency.value = freqs[pad];
    gain.gain.setValueAtTime(.0001, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(.055, ac.currentTime + .012);
    gain.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + duration);
    osc.connect(gain).connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + duration + .02);
  }
  function loadLevel(level){
    state.level = level;
    state.pattern = makePattern(level);
    state.playerPattern = blank();
    state.mode = "edit";
    state.beat = 0;
    state.beatTimer = 0;
    state.flash = 0;
    state.focusPad = 0;
    state.focusStep = 0;
    setFeedback("Forge the target rhythm, then check the loop.");
    sync();
  }
  function toggleCell(pad,step,play){
    state.playerPattern[pad][step] = state.playerPattern[pad][step] ? 0 : 1;
    state.focusPad = pad;
    state.focusStep = step;
    state.mode = "edit";
    if(play) tone(pad,.09);
    setFeedback(padNames[pad] + " step " + (step + 1) + (state.playerPattern[pad][step] ? " on." : " off."));
    sync();
  }
  function compare(){
    let matches = 0;
    let total = PADS * STEPS;
    for(let pad=0;pad<PADS;pad++) for(let step=0;step<STEPS;step++) if(state.pattern[pad][step] === state.playerPattern[pad][step]) matches++;
    return {matches,total,complete:matches===total};
  }
  function stepCounts(step){
    let target = 0, forged = 0;
    for(let pad=0;pad<PADS;pad++){
      if(state.pattern[pad][step]) target++;
      if(state.playerPattern[pad][step]) forged++;
    }
    return {target,forged};
  }
  function getStepFeedback(){
    const step = state.mode === "playback" ? state.beat : state.focusStep;
    const counts = stepCounts(step);
    const label = "Step " + (step + 1);
    if(state.mode === "playback"){
      return {activeStep:step + 1,status:label + " playing. Target " + counts.target + ", forged " + counts.forged + "."};
    }
    if(state.mode === "complete"){
      return {activeStep:step + 1,status:"Level complete. Next is ready."};
    }
    return {activeStep:step + 1,status:label + " ready. " + padNames[state.focusPad] + " focused. Target " + counts.target + ", forged " + counts.forged + "."};
  }
  function checkPattern(){
    const result = compare();
    if(result.complete){
      const gain = 100 + state.level * 25 + state.streak * 15;
      state.score += gain;
      state.streak += 1;
      state.best = Math.max(state.best,state.score);
      safeStorage.set(BEST_KEY,state.best);
      state.mode = "complete";
      setFeedback("Level complete. +" + gain + " points.");
      [0,1,2,3].forEach((pad,i)=>setTimeout(()=>tone(pad,.08),i*55));
    } else {
      state.streak = 0;
      state.mode = "edit";
      setFeedback(result.matches + " of " + result.total + " hits match. Refine the forge.");
      tone(3,.08);
    }
    sync();
  }
  function playLoop(){
    state.mode = "playback";
    state.beat = 0;
    state.beatTimer = 0;
    state.flash = 140;
    playBeat();
    setFeedback("Playing target and forged rhythm.");
    sync();
  }
  function playBeat(){
    for(let pad=0;pad<PADS;pad++){
      if(state.pattern[pad][state.beat]) tone(pad,.075);
      if(state.playerPattern[pad][state.beat]) setTimeout(()=>tone(pad,.055),90);
    }
  }
  function update(ms){
    if(state.flash > 0) state.flash = Math.max(0,state.flash - ms);
    if(state.mode !== "playback") return;
    state.beatTimer += ms;
    while(state.beatTimer >= STEP_MS){
      state.beatTimer -= STEP_MS;
      state.beat = (state.beat + 1) % STEPS;
      state.flash = 140;
      playBeat();
    }
  }
  function sync(){
    els.level.textContent = state.level;
    els.score.textContent = state.score;
    els.streak.textContent = state.streak;
    els.best.textContent = state.best;
    els.sound.textContent = state.sound ? "Sound On" : "Sound Off";
    els.sound.setAttribute("aria-pressed", String(state.sound));
    els.stepCue.textContent = getStepFeedback().status;
    document.querySelectorAll(".cell").forEach(btn=>{
      const pad = Number(btn.dataset.pad);
      const step = Number(btn.dataset.step);
      btn.dataset.on = String(!!state.playerPattern[pad][step]);
      btn.dataset.target = String(!!state.pattern[pad][step]);
      btn.dataset.beat = String(state.mode === "playback" && state.beat === step);
      btn.tabIndex = pad === state.focusPad && step === state.focusStep ? 0 : -1;
    });
    render();
  }
  function render(){
    ctx.clearRect(0,0,640,360);
    const g = ctx.createLinearGradient(0,0,640,360);
    g.addColorStop(0,"#07101a");g.addColorStop(1,"#111827");
    ctx.fillStyle = g;ctx.fillRect(0,0,640,360);
    ctx.strokeStyle = "rgba(94,234,212,.08)";
    for(let x=0;x<640;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,360);ctx.stroke()}
    for(let y=0;y<360;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke()}
    ctx.fillStyle = "#e6edf3";ctx.font = "900 24px system-ui";ctx.fillText("TEMPO FORGE",28,42);
    ctx.fillStyle = "rgba(182,196,220,.88)";ctx.font = "700 13px system-ui";ctx.fillText("Target ghosts sit behind your forged hits.",28,66);
    const left = 118, top = 98, cellW = 96, cellH = 44, gap = 12;
    for(let step=0;step<STEPS;step++){
      ctx.fillStyle = step === state.beat && state.mode === "playback" ? "#fbbf24" : "rgba(182,196,220,.72)";
      ctx.font = "800 12px system-ui";ctx.fillText("STEP " + (step+1),left+step*(cellW+gap)+18,88);
    }
    for(let pad=0;pad<PADS;pad++){
      const y = top + pad*(cellH+gap);
      ctx.fillStyle = padColors[pad];ctx.font = "900 13px system-ui";ctx.fillText(padNames[pad],28,y+27);
      for(let step=0;step<STEPS;step++){
        const x = left + step*(cellW+gap);
        const beatOn = state.mode === "playback" && state.beat === step;
        ctx.fillStyle = beatOn ? "rgba(251,191,36,.18)" : "rgba(15,23,42,.82)";
        ctx.strokeStyle = beatOn ? "#fbbf24" : "rgba(94,234,212,.25)";
        ctx.lineWidth = 2;
        roundRect(x,y,cellW,cellH,10,true,true);
        if(state.pattern[pad][step]){
          ctx.fillStyle = "rgba(251,191,36,.34)";
          roundRect(x+14,y+13,cellW-28,cellH-26,8,true,false);
        }
        if(state.playerPattern[pad][step]){
          ctx.fillStyle = padColors[pad];
          ctx.shadowColor = padColors[pad];ctx.shadowBlur = state.flash && beatOn ? 22 : 10;
          roundRect(x+28,y+10,cellW-56,cellH-20,8,true,false);
          ctx.shadowBlur = 0;
        }
      }
    }
    const result = compare();
    ctx.fillStyle = "rgba(94,234,212,.9)";ctx.font = "900 14px system-ui";ctx.fillText("MATCH " + result.matches + "/" + result.total,28,332);
    ctx.fillStyle = "rgba(230,237,243,.88)";ctx.font = "800 13px system-ui";ctx.fillText(state.feedback,174,332);
  }
  function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
    if(fill) ctx.fill(); if(stroke) ctx.stroke();
  }
  function moveFocus(dp,ds){
    state.focusPad = (state.focusPad + dp + PADS) % PADS;
    state.focusStep = (state.focusStep + ds + STEPS) % STEPS;
    sync();
    const cell = document.querySelector(`.cell[data-pad="${state.focusPad}"][data-step="${state.focusStep}"]`);
    if(cell) cell.focus();
  }
  document.addEventListener("keydown",(ev)=>{
    const key = ev.key.toLowerCase();
    if(["arrowup","arrowdown","arrowleft","arrowright"," ","enter","p","r"].includes(key) || /^[1-4]$/.test(key)) ev.preventDefault();
    if(key === "arrowup") moveFocus(-1,0);
    else if(key === "arrowdown") moveFocus(1,0);
    else if(key === "arrowleft") moveFocus(0,-1);
    else if(key === "arrowright") moveFocus(0,1);
    else if(key === " ") toggleCell(state.focusPad,state.focusStep,true);
    else if(/^[1-4]$/.test(key)) toggleCell(state.focusPad,Number(key)-1,true);
    else if(key === "p") playLoop();
    else if(key === "enter") state.mode === "complete" ? loadLevel(state.level+1) : checkPattern();
    else if(key === "r") loadLevel(1);
  });
  els.play.addEventListener("click",playLoop);
  els.check.addEventListener("click",checkPattern);
  els.next.addEventListener("click",()=>loadLevel(state.mode === "complete" ? state.level + 1 : state.level));
  els.restart.addEventListener("click",()=>{state.score=0;state.streak=0;loadLevel(1)});
  els.sound.addEventListener("click",()=>{state.sound=!state.sound;safeStorage.set(SOUND_KEY,state.sound?"1":"0");setFeedback(state.sound?"Sound enabled.":"Sound disabled.");sync()});
  window.render_game_to_text = function(){
    const stepFeedback = getStepFeedback();
    return JSON.stringify({mode:state.mode,level:state.level,pattern:clonePattern(state.pattern),playerPattern:clonePattern(state.playerPattern),beat:state.beat,activeStep:stepFeedback.activeStep,activeStepFeedback:stepFeedback.status,score:state.score,streak:state.streak,best:state.best,sound:state.sound,feedback:state.feedback,statusText:els.status.textContent,visibleFeedback:{status:els.status.textContent,stepCue:els.stepCue.textContent,active:state.mode==="playback"||state.flash>0}});
  };
  window.advanceTime = function(ms){update(Math.max(0,Number(ms)||0));sync();return window.render_game_to_text()};
  rebuildGrid();
  loadLevel(1);
})();
</script>
