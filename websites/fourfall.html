<body>
<main class="app" id="app" aria-label="Fourfall connect-four game">
  <header class="top">
    <div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Fourfall</span></div>
    <div class="help">Arrow keys or 1-7 pick a column. Enter, Down, or tap a column drops a dark disc. Line up four to beat the CPU. N starts a new game.</div>
  </header>
  <section class="hud" aria-label="Game status">
    <div class="pill"><span class="label">Turn</span><span class="value" id="turnValue">You</span></div>
    <div class="pill"><span class="label">Result</span><span class="value" id="resultValue">—</span></div>
    <div class="pill"><span class="label">Moves</span><span class="value" id="movesValue">0</span></div>
    <div class="pill"><span class="label">Wins</span><span class="value" id="winsValue">0</span></div>
    <div class="pill"><span class="label">Streak</span><span class="value" id="streakValue">0</span></div>
    <div class="pill"><span class="label">Best</span><span class="value" id="bestValue">0</span></div>
  </section>
  <div class="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Fourfall 7 column by 6 row connect-four board. You drop the dark discs against the CPU's light discs."></canvas></div>
  <div class="status" id="statusLine" aria-live="polite">Your move — pick a column and drop a dark disc.</div>
  <div class="sr-only" id="liveStatus" role="status" aria-live="polite" aria-atomic="true">Fourfall ready.</div>
  <section class="bar" aria-label="Actions">
    <button class="btn primary" id="newBtn" type="button">New Game</button>
    <button class="btn" id="soundBtn" type="button" aria-pressed="true">Sound On</button>
  </section>
  <section class="touch" aria-label="Touch controls">
    <button type="button" data-key="ArrowLeft">Left</button><button type="button" data-key="Enter" class="wide">Drop</button><button type="button" data-key="ArrowRight">Right</button><button type="button" data-key="n">New</button>
  </section>
</main>
<script>
(() => {
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),COLS=7,ROWS=6,MAXD=5,AI_DELAY=440;
const STATS_KEY="fourfall.stats.v1",SOUND_KEY="fourfall.sound.v1";
const ORDER=[3,2,4,1,5,0,6];
const $=id=>document.getElementById(id);
const els={turn:$("turnValue"),result:$("resultValue"),moves:$("movesValue"),wins:$("winsValue"),streak:$("streakValue"),best:$("bestValue"),status:$("statusLine"),live:$("liveStatus"),sound:$("soundBtn"),neww:$("newBtn")};
const stats=readStats();
const state={board:[],turn:1,mode:"playing",result:null,cursor:3,moveCount:0,lastMove:null,winLine:null,cpuThinking:false,aiTimer:0,wins:stats.wins,streak:stats.streak,best:stats.best,sound:readSound(),feedback:"Your move — pick a column and drop a dark disc.",time:0};
let audio=null;

function store(){try{return window.localStorage||window.workshopStorage}catch(_){return window.workshopStorage||null}}
function readStats(){try{const v=JSON.parse((store()||{}).getItem(STATS_KEY));if(v&&typeof v==="object")return{wins:v.wins|0,streak:v.streak|0,best:v.best|0}}catch(_){}return{wins:0,streak:0,best:0}}
function saveStats(){try{(store()||{}).setItem(STATS_KEY,JSON.stringify({wins:state.wins,streak:state.streak,best:state.best}))}catch(_){}}
function readSound(){try{const v=(store()||{}).getItem(SOUND_KEY);return v==null?true:v==="true"}catch(_){return true}}
function saveSound(){try{(store()||{}).setItem(SOUND_KEY,String(state.sound))}catch(_){}}
function say(t){state.feedback=t;els.status.textContent=t;els.live.textContent=t}
function vibe(n){try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(n)}catch(_){}}
function tone(kind){if(!state.sound)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;const f={drop:300,cpu:230,win:640,loss:120,draw:200,bad:140}[kind]||260;o.type=kind==="loss"?"sawtooth":"triangle";o.frequency.setValueAtTime(f,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.07,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.18);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.2)}catch(_){}}

function newBoard(){return Array.from({length:ROWS},()=>new Array(COLS).fill(0))}
function dropRow(b,c){for(let r=ROWS-1;r>=0;r--)if(b[r][c]===0)return r;return -1}
function validCols(b){const v=[];for(let c=0;c<COLS;c++)if(b[0][c]===0)v.push(c);return v}
function lineAt(b,r,c,color){const dirs=[[0,1],[1,0],[1,1],[1,-1]];for(const[dr,dc]of dirs){const cells=[[r,c]];for(const s of[1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&b[rr][cc]===color){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s}}if(cells.length>=4)return cells}return null}
function winAt(b,r,c,color){return lineAt(b,r,c,color)!==null}

function lineScore(b,r,c,dr,dc){let cpu=0,you=0;for(let i=0;i<4;i++){const v=b[r+dr*i][c+dc*i];if(v===2)cpu++;else if(v===1)you++}if(cpu&&you)return 0;if(cpu)return cpu===3?50:cpu===2?5:1;if(you)return you===3?-60:you===2?-5:-1;return 0}
function scoreBoard(b){let s=0;for(let r=0;r<ROWS;r++)if(b[r][3]===2)s+=3;else if(b[r][3]===1)s-=3;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(c+3<COLS)s+=lineScore(b,r,c,0,1);if(r+3<ROWS)s+=lineScore(b,r,c,1,0);if(r+3<ROWS&&c+3<COLS)s+=lineScore(b,r,c,1,1);if(r+3<ROWS&&c-3>=0)s+=lineScore(b,r,c,1,-1)}return s}
function minimax(b,depth,alpha,beta,toMove){if(depth===0||validCols(b).length===0)return scoreBoard(b);
  if(toMove===2){let best=-Infinity;for(const c of ORDER){if(b[0][c]!==0)continue;const r=dropRow(b,c);b[r][c]=2;const val=winAt(b,r,c,2)?100000-(MAXD-depth):minimax(b,depth-1,alpha,beta,1);b[r][c]=0;if(val>best)best=val;if(best>alpha)alpha=best;if(alpha>=beta)break}return best}
  let best=Infinity;for(const c of ORDER){if(b[0][c]!==0)continue;const r=dropRow(b,c);b[r][c]=1;const val=winAt(b,r,c,1)?-100000+(MAXD-depth):minimax(b,depth-1,alpha,beta,2);b[r][c]=0;if(val<best)best=val;if(best<beta)beta=best;if(alpha>=beta)break}return best}
function bestCpuCol(){const b=state.board;let best=-Infinity,bestC=ORDER.find(c=>b[0][c]===0);for(const c of ORDER){if(b[0][c]!==0)continue;const r=dropRow(b,c);b[r][c]=2;const val=winAt(b,r,c,2)?100000:minimax(b,MAXD-1,-Infinity,Infinity,1);b[r][c]=0;if(val>best){best=val;bestC=c}}return bestC}

function drop(c,color){const r=dropRow(state.board,c);if(r<0)return -1;state.board[r][c]=color;state.lastMove={r,c,by:color};state.moveCount++;const line=lineAt(state.board,r,c,color);if(line)state.winLine=line;state.turn=color===1?2:1;return r}
function tryDrop(c){if(state.mode!=="playing"||state.turn!==1||state.cpuThinking)return;if(c<0||c>=COLS)return;if(state.board[0][c]!==0){say("Column "+(c+1)+" is full — pick another.");tone("bad");vibe(4);draw();return}
  drop(c,1);tone("drop");vibe(12);
  if(state.winLine){endGame("win");return}
  if(!validCols(state.board).length){endGame("draw");return}
  say("You dropped in column "+(c+1)+". CPU is thinking…");scheduleCpu()}
function scheduleCpu(){state.cpuThinking=true;state.aiTimer=AI_DELAY;update();draw();ensureLoop()}
function doCpu(){if(state.mode!=="playing")return;const c=bestCpuCol();drop(c,2);tone("cpu");vibe(8);
  if(state.winLine){endGame("loss");return}
  if(!validCols(state.board).length){endGame("draw");return}
  state.cursor=Math.max(0,Math.min(COLS-1,state.cursor));say("CPU dropped in column "+(c+1)+". Your move.");update();draw()}

function endGame(result){state.mode="over";state.cpuThinking=false;state.result=result;
  if(result==="win"){state.wins++;state.streak++;if(state.streak>state.best)state.best=state.streak;saveStats();say("Four in a row — you win! Press New Game.");tone("win");vibe([26,26,40])}
  else if(result==="loss"){state.streak=0;saveStats();say("CPU connected four. Press New Game.");tone("loss");vibe(50)}
  else{state.streak=0;saveStats();say("Board full — a draw. Press New Game.");tone("draw");vibe(20)}
  update();draw()}

function reset(){state.board=newBoard();state.turn=1;state.mode="playing";state.result=null;state.moveCount=0;state.lastMove=null;state.winLine=null;state.cpuThinking=false;state.aiTimer=0;state.cursor=3;say("New game — you are the dark discs. Connect four to beat the CPU.");update();draw()}
function moveCursor(d){state.cursor=Math.max(0,Math.min(COLS-1,state.cursor+d));draw()}

function update(){els.turn.textContent=state.mode==="over"?"Over":(state.cpuThinking?"CPU…":(state.turn===1?"You":"CPU"));els.result.textContent=state.result==="win"?"Win":state.result==="loss"?"Lose":state.result==="draw"?"Draw":"—";els.moves.textContent=String(state.moveCount);els.wins.textContent=String(state.wins);els.streak.textContent=String(state.streak);els.best.textContent=String(state.best);els.sound.textContent=state.sound?"Sound On":"Sound Off";els.sound.setAttribute("aria-pressed",String(state.sound))}

function gridRect(){const cell=Math.min((canvas.width-232)/COLS,(canvas.height-92)/ROWS);return{cell,x:38,y:Math.round((canvas.height-cell*ROWS)/2)+10}}
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);if(fill)ctx.fill();if(stroke)ctx.stroke()}
function drawDisc(cx,cy,rad,v){ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);const gr=ctx.createRadialGradient(cx-rad*.32,cy-rad*.32,rad*.2,cx,cy,rad);if(v===1){gr.addColorStop(0,"#46597a");gr.addColorStop(1,"#0a1322")}else{gr.addColorStop(0,"#ffffff");gr.addColorStop(1,"#b7c5d6")}ctx.fillStyle=gr;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=v===1?"rgba(94,234,212,.55)":"rgba(15,23,36,.5)";ctx.stroke()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const bg=ctx.createLinearGradient(0,0,0,canvas.height);bg.addColorStop(0,"#07182a");bg.addColorStop(1,"#050a16");ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
  const g=gridRect(),cell=g.cell,rad=cell*.40,hole=cell*.43;
  ctx.textAlign="left";ctx.fillStyle="#5eead4";ctx.font="900 20px system-ui";ctx.fillText("Fourfall",30,36);
  ctx.fillStyle="#9fb3c8";ctx.font="700 12px system-ui";ctx.fillText("Drop a disc; connect four in any direction to win.",30,53);
  ctx.save();ctx.translate(g.x,g.y);
  const grd=ctx.createLinearGradient(0,0,0,cell*ROWS);grd.addColorStop(0,"#1b3a86");grd.addColorStop(1,"#122a63");ctx.fillStyle=grd;roundRect(-11,-7,cell*COLS+22,cell*ROWS+14,14,true,false);
  if(state.mode==="playing"&&state.turn===1&&!state.cpuThinking){ctx.fillStyle="rgba(94,234,212,.10)";ctx.fillRect(state.cursor*cell,-7,cell,cell*ROWS+14)}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cx=c*cell+cell/2,cy=r*cell+cell/2,v=state.board[r][c];ctx.fillStyle="#06101d";ctx.beginPath();ctx.arc(cx,cy,hole,0,Math.PI*2);ctx.fill();if(v)drawDisc(cx,cy,rad,v)}
  if(state.mode==="playing"&&state.turn===1&&!state.cpuThinking){const dr=dropRow(state.board,state.cursor);if(dr>=0){ctx.globalAlpha=.34;drawDisc(state.cursor*cell+cell/2,dr*cell+cell/2,rad,1);ctx.globalAlpha=1}}
  if(state.winLine){ctx.strokeStyle="#facc15";ctx.lineWidth=6;ctx.lineCap="round";const a=state.winLine[0],b=state.winLine[state.winLine.length-1];ctx.beginPath();ctx.moveTo(a[1]*cell+cell/2,a[0]*cell+cell/2);ctx.lineTo(b[1]*cell+cell/2,b[0]*cell+cell/2);ctx.stroke();ctx.lineCap="butt"}
  else if(state.lastMove){ctx.strokeStyle="#facc15";ctx.lineWidth=3;ctx.beginPath();ctx.arc(state.lastMove.c*cell+cell/2,state.lastMove.r*cell+cell/2,rad+3,0,Math.PI*2);ctx.stroke()}
  ctx.restore();
  drawSide(g);
  if(state.mode==="over"){ctx.fillStyle="rgba(3,7,18,.78)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.textAlign="center";ctx.fillStyle=state.result==="win"?"#5eead4":state.result==="loss"?"#fb7185":"#facc15";ctx.font="950 46px system-ui";ctx.fillText(state.result==="win"?"YOU WIN":state.result==="loss"?"CPU WINS":"DRAW",canvas.width/2,canvas.height/2-6);ctx.fillStyle="#dbeafe";ctx.font="800 18px system-ui";ctx.fillText(state.feedback,canvas.width/2,canvas.height/2+30);ctx.textAlign="left"}}
function drawSide(g){const px=g.x+g.cell*COLS+34;let py=g.y+12;ctx.textAlign="left";
  const block=(label,val,disc,color)=>{if(disc)drawDisc(px+13,py+12,13,disc);ctx.fillStyle="#9fb3c8";ctx.font="800 12px system-ui";ctx.fillText(label,px+(disc?34:0),py+6);ctx.fillStyle=color||"#f3fbff";ctx.font="950 26px system-ui";ctx.fillText(val,px+(disc?34:0),py+34);py+=64};
  block("YOU · dark",state.result==="win"?"WIN":"—",1,state.result==="win"?"#5eead4":"#f3fbff");
  block("CPU · light",state.result==="loss"?"WIN":"—",2,state.result==="loss"?"#fb7185":"#f3fbff");
  block("TURN",state.mode==="over"?"Over":(state.cpuThinking?"CPU…":(state.turn===1?"You":"CPU")),null,state.mode==="over"?"#facc15":(state.turn===1?"#5eead4":"#fb7185"));
  block("STREAK · BEST",state.streak+" · "+state.best,null)}

function tick(dt){state.time+=dt;if(state.cpuThinking){state.aiTimer-=dt;if(state.aiTimer<=0){state.cpuThinking=false;doCpu()}}draw()}
window.advanceTime=ms=>{stopLoop();const n=Math.max(1,Math.ceil(ms/40));for(let i=0;i<n;i++)tick(ms/n);ensureLoop();return window.render_game_to_text()};
window.render_game_to_text=function render_game_to_text(){return JSON.stringify({mode:state.mode,result:state.result,turn:state.mode==="over"?"over":(state.cpuThinking?"cpu":(state.turn===1?"you":"cpu")),cpuThinking:state.cpuThinking,moveCount:state.moveCount,cursor:state.cursor,lastMove:state.lastMove,winLine:state.winLine,wins:state.wins,streak:state.streak,best:state.best,sound:state.sound,feedback:state.feedback,board:state.board.map(row=>row.join("")),coordinateSystem:"board[row][col], row 0 top..5 bottom, col 0 left..6 right; 1=dark(you), 2=light(cpu)"})};

document.addEventListener("keydown",e=>{const t=e.target;if(t&&/^(button|input|select|textarea)$/i.test(t.tagName||""))return;const k=e.key;if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(k))e.preventDefault();
  if(k==="ArrowLeft"||k==="a")moveCursor(-1);else if(k==="ArrowRight"||k==="d")moveCursor(1);else if(k==="Enter"||k===" "||k==="ArrowDown"||k==="s")tryDrop(state.cursor);else if(k==="n"||k==="r")reset();else if(k>="1"&&k<="7"){state.cursor=Number(k)-1;tryDrop(state.cursor)}});
canvas.addEventListener("pointerdown",e=>{canvas.focus();const b=canvas.getBoundingClientRect(),px=(e.clientX-b.left)/b.width*canvas.width,g=gridRect(),c=Math.floor((px-g.x)/g.cell);if(c>=0&&c<COLS){state.cursor=c;tryDrop(c)}});
els.neww.addEventListener("click",()=>{reset();tone("drop")});
els.sound.addEventListener("click",()=>{state.sound=!state.sound;saveSound();update();say(state.sound?"Sound enabled.":"Sound muted.");tone("drop")});
document.querySelectorAll("[data-key]").forEach(btn=>btn.addEventListener("click",()=>{canvas.focus();const k=btn.dataset.key;if(k==="ArrowLeft")moveCursor(-1);else if(k==="ArrowRight")moveCursor(1);else if(k==="Enter")tryDrop(state.cursor);else if(k==="n")reset()}));
reset();
let raf=0,last=0;
function loopActive(){return state.cpuThinking}
function ensureLoop(){if(raf||!loopActive())return;last=performance.now();raf=requestAnimationFrame(frame)}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=0;last=0}
function frame(now){raf=0;const dt=Math.min(80,last?now-last:0);last=now;tick(dt);if(loopActive())raf=requestAnimationFrame(frame);else last=0}
ensureLoop();
})();
</script>
</body>
</html>
