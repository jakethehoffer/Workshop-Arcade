<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const LANES = [300, 480, 660];
  const PLAYER_Y = 424;
  const LAP_LENGTH = 1180;
  const TOTAL_LAPS = 3;
  const TOTAL_DISTANCE = LAP_LENGTH * TOTAL_LAPS;
  const BEST_KEY = "slipstream-sprint.best.v1";
  const SOUND_KEY = "slipstream-sprint.sound.v1";
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const round = (n) => Math.round(n * 10) / 10;
  const $ = (id) => document.getElementById(id);
  const els = {
    lap: $("lapValue"), sector: $("sectorValue"), boost: $("boostValue"), integrity: $("integrityValue"),
    score: $("scoreValue"), best: $("bestValue"), status: $("statusLine"), live: $("liveStatus"),
    start: $("startBtn"), left: $("leftBtn"), right: $("rightBtn"), boostBtn: $("boostBtn"), brakeBtn: $("brakeBtn"),
    restart: $("restartBtn"), sound: $("soundBtn"), full: $("fullBtn"), app: $("app")
  };
  const stars = Array.from({ length: 80 }, (_, i) => ({ x: (i * 131 + i * i * 17) % W, y: 12 + (i * 71 + i * i * 13) % 520, r: .45 + (i % 5) * .2 }));
  const eventSeeds = [
    { offset: 150, lane: 1, type: "traffic", color: "#fb7185" },
    { offset: 270, lane: 0, type: "boost" },
    { offset: 400, lane: 2, type: "barrier" },
    { offset: 560, lane: 1, type: "traffic", color: "#facc15" },
    { offset: 725, lane: 2, type: "boost" },
    { offset: 855, lane: 0, type: "traffic", color: "#60a5fa" },
    { offset: 1015, lane: 1, type: "barrier" }
  ];

  function buildEvents() {
    const events = [];
    for (let lap = 0; lap < TOTAL_LAPS; lap += 1) {
      for (let i = 0; i < eventSeeds.length; i += 1) {
        const seed = eventSeeds[i];
        const laneShift = seed.type === "boost" ? lap % 3 : (lap + i) % 3;
        events.push({
          id: "L" + lap + "-" + i,
          lap,
          distance: lap * LAP_LENGTH + seed.offset + lap * 18,
          lane: (seed.lane + laneShift) % 3,
          type: seed.type,
          color: seed.color || "#67e8f9",
          resolved: false,
          hit: false
        });
      }
    }
    return events;
  }

  function storage() {
    if (window.workshopStorage) return window.workshopStorage;
    try { return window.localStorage; } catch (_) { return null; }
  }
  function readStore(key, fallback) {
    const source = storage();
    if (!source) return fallback;
    try {
      const value = source.getItem(key);
      return value === null ? fallback : value;
    } catch (_) {
      return fallback;
    }
  }
  function writeStore(key, value) {
    const source = storage();
    if (!source) return;
    try { source.setItem(key, String(value)); } catch (_) {}
  }
  function readSound() {
    return !["0", "false", "off", "muted"].includes(String(readStore(SOUND_KEY, "1")).toLowerCase());
  }

  const state = {
    mode: "ready",
    distance: 0,
    speed: 0,
    lane: 1,
    laneX: LANES[1],
    targetLane: 1,
    boost: 54,
    integrity: 100,
    score: 0,
    best: Number(readStore(BEST_KEY, "0")) || 0,
    overtakes: 0,
    collisions: 0,
    draftSeconds: 0,
    runTime: 0,
    events: buildEvents(),
    boosting: false,
    braking: false,
    sound: readSound(),
    feedback: "Press Start. Draft rivals, collect boost pads, and avoid barriers.",
    feedbackTimer: 0,
    lastEvent: "ready",
    lastInput: "none",
    shake: 0,
    flash: 0,
    finishTime: null,
    failedReason: ""
  };
  let audio = null;
  let lastFrame = 0;
  let simTime = 0;
  let boostAutoOffTimer = null;
  let brakeAutoOffTimer = null;
  // Honor prefers-reduced-motion: gate decorative parallax starfield, screen
  // shake, and full-screen pickup flash (cosmetic, no gameplay effect) for
  // motion-sensitive players.
  let reducedMotion = false;
  try {
    const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    reducedMotion = motionQuery.matches;
    motionQuery.addEventListener("change", (event) => { reducedMotion = event.matches; });
  } catch (_) {}

  function setFeedback(text, event = "status", duration = 1.6) {
    state.feedback = text;
    state.feedbackTimer = duration;
    state.lastEvent = event;
    els.status.textContent = text;
    els.live.textContent = text;
  }
  function ensureAudio() {
    if (!state.sound || audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
  }
  function tone(freq, dur = .07, gain = .035, type = "triangle") {
    if (!state.sound) return;
    ensureAudio();
    if (!audio) return;
    const osc = audio.createOscillator();
    const amp = audio.createGain();
    const now = audio.currentTime;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    amp.gain.setValueAtTime(.0001, now);
    amp.gain.exponentialRampToValueAtTime(gain, now + .01);
    amp.gain.exponentialRampToValueAtTime(.0001, now + dur);
    osc.connect(amp).connect(audio.destination);
    osc.start(now);
    osc.stop(now + dur + .02);
  }
  function markInput(source, action) {
    state.lastInput = source;
    if (source === "touch" && navigator.vibrate) {
      try { navigator.vibrate(8); } catch (_) {}
    }
    if (action) state.lastEvent = action;
  }
  function clearButtonAutoOffTimers() {
    if (boostAutoOffTimer !== null) {
      clearTimeout(boostAutoOffTimer);
      boostAutoOffTimer = null;
    }
    if (brakeAutoOffTimer !== null) {
      clearTimeout(brakeAutoOffTimer);
      brakeAutoOffTimer = null;
    }
  }
  function resetRace(keepReady = false) {
    clearButtonAutoOffTimers();
    Object.assign(state, {
      mode: keepReady ? "ready" : "running",
      distance: 0,
      speed: keepReady ? 0 : 230,
      lane: 1,
      laneX: LANES[1],
      targetLane: 1,
      boost: 54,
      integrity: 100,
      score: 0,
      overtakes: 0,
      collisions: 0,
      draftSeconds: 0,
      runTime: 0,
      events: buildEvents(),
      boosting: false,
      braking: false,
      feedback: keepReady ? "Press Start. Draft rivals, collect boost pads, and avoid barriers." : "Green light. Stay in the slipstream.",
      feedbackTimer: keepReady ? 0 : 1.3,
      lastEvent: keepReady ? "ready" : "start",
      shake: 0,
      flash: 0,
      finishTime: null,
      failedReason: ""
    });
    syncHud();
    draw();
  }
  function startRace() {
    ensureAudio();
    if (state.mode === "running") return;
    resetRace(false);
    setFeedback("Green light. Stay in the slipstream.", "start", 1.4);
    tone(520, .08, .04);
    canvas.focus({ preventScroll: true });
  }
  function finishRace() {
    state.mode = "finished";
    state.boosting = false;
    state.braking = false;
    state.finishTime = state.runTime;
    const finishBonus = Math.max(0, Math.round(1800 - state.runTime * 25));
    state.score += finishBonus + Math.round(state.integrity * 8) + Math.round(state.boost * 4);
    state.score = Math.round(state.score);
    if (state.score > state.best) {
      state.best = state.score;
      writeStore(BEST_KEY, state.best);
    }
    setFeedback("Sprint cleared. Final score " + state.score + ".", "finish", 5);
    tone(760, .18, .05);
  }
  function failRace(reason) {
    state.mode = "crashed";
    state.failedReason = reason;
    state.boosting = false;
    state.braking = false;
    setFeedback(reason + " Restart to try the sprint again.", "failed", 5);
    tone(150, .18, .05, "sawtooth");
  }
  function laneMove(delta, source = "keyboard") {
    if (state.mode !== "running" && state.mode !== "ready") return;
    const next = clamp(state.targetLane + delta, 0, LANES.length - 1);
    if (next === state.targetLane) {
      setFeedback(delta < 0 ? "Left shoulder is closed." : "Right shoulder is closed.", "lane-edge", .9);
      return;
    }
    state.targetLane = next;
    state.lane = next;
    markInput(source, delta < 0 ? "lane-left" : "lane-right");
    setFeedback(next === 0 ? "Inside lane." : next === 2 ? "Outside lane." : "Center lane.", "lane", .8);
    tone(360 + next * 60, .045, .022);
  }
  function setBoost(on, source = "keyboard") {
    state.boosting = Boolean(on) && state.mode === "running" && state.boost > 2;
    els.boostBtn.dataset.active = String(state.boosting);
    els.boostBtn.setAttribute("aria-pressed", String(state.boosting));
    markInput(source, state.boosting ? "boost" : "boost-off");
  }
  function setBrake(on, source = "keyboard") {
    state.braking = Boolean(on) && state.mode === "running";
    els.brakeBtn.dataset.active = String(state.braking);
    els.brakeBtn.setAttribute("aria-pressed", String(state.braking));
    markInput(source, state.braking ? "brake" : "brake-off");
  }
  function currentLap() {
    return clamp(Math.floor(state.distance / LAP_LENGTH), 0, TOTAL_LAPS - 1);
  }
  function sector() {
    return clamp(Math.floor((state.distance % LAP_LENGTH) / (LAP_LENGTH / 3)) + 1, 1, 3);
  }
  function eventY(event) {
    const rel = event.distance - state.distance;
    return PLAYER_Y - rel * .55;
  }
  function visibleEvents() {
    return state.events
      .filter((event) => !event.resolved)
      .map((event) => ({ event, rel: event.distance - state.distance, y: eventY(event) }))
      .filter((item) => item.rel > -140 && item.rel < 840);
  }
  function nearestDraftTarget() {
    return visibleEvents()
      .filter((item) => item.event.type === "traffic" && item.event.lane === state.targetLane && item.rel > 75 && item.rel < 205)
      .sort((a, b) => a.rel - b.rel)[0] || null;
  }
  function handleEvents(dt) {
    const draft = nearestDraftTarget();
    if (draft && !state.boosting) {
      state.draftSeconds += dt;
      state.boost = clamp(state.boost + dt * 28, 0, 100);
      state.score += dt * 8;
      if (state.feedbackTimer <= 0) setFeedback("Drafting rival wake. Boost is charging.", "draft", .8);
    }
    for (const event of state.events) {
      if (event.resolved) continue;
      const rel = event.distance - state.distance;
      if (rel < -80) {
        event.resolved = true;
        if (event.type === "traffic") {
          state.overtakes += 1;
          state.score += 45;
        }
        continue;
      }
      if (rel > 52 || Math.abs(rel) > 52 || event.lane !== state.targetLane) continue;
      event.resolved = true;
      event.hit = true;
      if (event.type === "boost") {
        state.boost = clamp(state.boost + 36, 0, 100);
        state.score += 120;
        state.flash = .18;
        setFeedback("Boost pad collected.", "boost-pad", 1.2);
        tone(680, .08, .04);
      } else if (event.type === "traffic") {
        if (state.boosting && state.boost > 3) {
          state.overtakes += 1;
          state.score += 210;
          state.flash = .14;
          setFeedback("Boost overtake clean.", "overtake", 1.2);
          tone(800, .08, .042);
        } else {
          state.collisions += 1;
          state.integrity = clamp(state.integrity - 18, 0, 100);
          state.speed *= .55;
          state.shake = .25;
          setFeedback("Rival clipped. Integrity down.", "collision", 1.4);
          tone(170, .12, .045, "sawtooth");
        }
      } else if (event.type === "barrier") {
        state.collisions += 1;
        const loss = state.boosting ? 15 : 27;
        state.integrity = clamp(state.integrity - loss, 0, 100);
        state.speed *= .45;
        state.shake = .34;
        setFeedback(state.boosting ? "Boost scraped through the barrier." : "Barrier hit. Integrity down.", "barrier", 1.5);
        tone(130, .14, .048, "square");
      }
    }
  }
  function update(dt) {
    simTime += dt;
    if (state.feedbackTimer > 0) state.feedbackTimer -= dt;
    state.shake = Math.max(0, state.shake - dt * 1.8);
    state.flash = Math.max(0, state.flash - dt * 1.4);
    state.laneX += (LANES[state.targetLane] - state.laneX) * Math.min(1, dt * 13);
    if (state.mode !== "running") return;
    state.runTime += dt;
    if (state.boosting && state.boost <= 0) setBoost(false, state.lastInput);
    const boostPower = state.boosting ? 165 : 0;
    const brakePower = state.braking ? -90 : 0;
    const damageDrag = (100 - state.integrity) * .55;
    const targetSpeed = clamp(270 + boostPower + brakePower - damageDrag, 115, 470);
    state.speed += (targetSpeed - state.speed) * Math.min(1, dt * 4.8);
    if (state.boosting) {
      state.boost = clamp(state.boost - dt * 31, 0, 100);
      state.score += dt * 14;
    }
    state.distance = clamp(state.distance + state.speed * dt, 0, TOTAL_DISTANCE);
    state.score += state.speed * dt * .018;
    handleEvents(dt);
    if (state.integrity <= 0) {
      failRace("Integrity failed.");
    } else if (state.distance >= TOTAL_DISTANCE) {
      finishRace();
    }
  }
  function syncHud() {
    els.lap.textContent = Math.min(TOTAL_LAPS, currentLap() + 1) + "/" + TOTAL_LAPS;
    els.sector.textContent = String(sector());
    els.boost.textContent = String(Math.round(state.boost));
    els.integrity.textContent = String(Math.round(state.integrity));
    els.integrity.className = "value " + (state.integrity > 55 ? "good" : state.integrity > 25 ? "hot" : "bad");
    els.score.textContent = String(Math.round(state.score));
    els.best.textContent = String(Math.round(state.best));
    els.start.textContent = state.mode === "running" ? "Racing" : state.mode === "finished" ? "Race Again" : state.mode === "crashed" ? "Retry" : "Start Race";
    els.boostBtn.disabled = state.mode !== "running";
    els.brakeBtn.disabled = state.mode !== "running";
    els.boostBtn.dataset.active = String(state.boosting);
    els.brakeBtn.dataset.active = String(state.braking);
    els.boostBtn.setAttribute("aria-pressed", String(state.boosting));
    els.brakeBtn.setAttribute("aria-pressed", String(state.braking));
    els.sound.textContent = state.sound ? "Sound On" : "Sound Off";
    els.sound.setAttribute("aria-pressed", String(state.sound));
    const full = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    els.full.textContent = full ? "Exit Fullscreen" : "Fullscreen";
    els.full.setAttribute("aria-pressed", String(full));
  }
  function drawRoad(offset) {
    const gradient = ctx.createLinearGradient(0, 40, 0, H);
    gradient.addColorStop(0, "#08192a");
    gradient.addColorStop(1, "#07111d");
    ctx.fillStyle = gradient;
    ctx.fillRect(180, 32, 600, 500);
    ctx.strokeStyle = "rgba(103,232,249,.24)";
    ctx.lineWidth = 4;
    ctx.strokeRect(180, 32, 600, 500);
    ctx.strokeStyle = "rgba(250,204,21,.34)";
    ctx.lineWidth = 3;
    for (let i = 0; i < LANES.length - 1; i += 1) {
      const x = (LANES[i] + LANES[i + 1]) / 2;
      for (let y = 42 + offset % 66; y < 532; y += 66) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + 28);
        ctx.stroke();
      }
    }
    for (let y = 55 + offset % 90; y < 520; y += 90) {
      ctx.strokeStyle = "rgba(103,232,249,.13)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(205, y);
      ctx.lineTo(755, y);
      ctx.stroke();
    }
  }
  function drawCar(x, y, color, scale = 1, label = "") {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.shadowColor = color;
    ctx.shadowBlur = 16;
    ctx.fillStyle = "rgba(3,7,18,.86)";
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(-34, -34, 68, 68, 12);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.fillRect(-21, -25, 42, 11);
    ctx.fillRect(-24, 12, 48, 9);
    ctx.fillStyle = "#e0fbff";
    ctx.fillRect(-14, -6, 28, 17);
    if (label) {
      ctx.fillStyle = "#06111e";
      ctx.font = "900 12px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(label, 0, 6);
    }
    ctx.restore();
  }
  function drawEvent(item) {
    const { event, y, rel } = item;
    const x = LANES[event.lane];
    const scale = clamp(1.18 - rel / 1250, .62, 1.12);
    if (event.type === "traffic") {
      drawCar(x, y, event.color, scale, "R");
    } else if (event.type === "boost") {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.shadowColor = "#a3e635";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "rgba(163,230,53,.14)";
      ctx.strokeStyle = "#a3e635";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(-42, -22, 84, 44, 12);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#ecfccb";
      ctx.font = "950 18px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("BOOST", 0, 7);
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.shadowColor = "#fb7185";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "rgba(251,113,133,.18)";
      ctx.strokeStyle = "#fb7185";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(-48, -26, 96, 52, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#fecdd3";
      ctx.font = "950 18px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("BLOCK", 0, 7);
      ctx.restore();
    }
  }
  function draw() {
    const shakeX = state.shake && !reducedMotion ? Math.sin(simTime * 64) * state.shake * 12 : 0;
    const shakeY = state.shake && !reducedMotion ? Math.cos(simTime * 53) * state.shake * 8 : 0;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(shakeX, shakeY);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#06111e");
    bg.addColorStop(1, "#030713");
    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = "rgba(231,249,255,.74)";
    for (const star of stars) {
      const parallax = reducedMotion ? 0 : state.distance * .022;
      const y = (star.y + parallax) % H;
      ctx.globalAlpha = .35 + (star.r % 1) * .45;
      ctx.beginPath();
      ctx.arc(star.x, y, star.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawRoad(state.distance * .55);
    for (const item of visibleEvents().sort((a, b) => a.y - b.y)) {
      drawEvent(item);
    }
    if (state.boosting) {
      ctx.fillStyle = "rgba(250,204,21,.18)";
      ctx.beginPath();
      ctx.moveTo(state.laneX - 30, PLAYER_Y + 38);
      ctx.lineTo(state.laneX - 70, PLAYER_Y + 110);
      ctx.lineTo(state.laneX + 70, PLAYER_Y + 110);
      ctx.lineTo(state.laneX + 30, PLAYER_Y + 38);
      ctx.closePath();
      ctx.fill();
    }
    drawCar(state.laneX, PLAYER_Y, state.boosting ? "#facc15" : "#67e8f9", 1.12, "YOU");
    const progress = state.distance / TOTAL_DISTANCE;
    ctx.fillStyle = "rgba(6,17,30,.82)";
    ctx.strokeStyle = "rgba(103,232,249,.32)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(252, 18, 456, 18, 9);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = state.mode === "finished" ? "#a3e635" : "#67e8f9";
    ctx.beginPath();
    ctx.roundRect(256, 22, 448 * progress, 10, 5);
    ctx.fill();
    if (state.flash > 0 && !reducedMotion) {
      ctx.fillStyle = "rgba(250,204,21," + (state.flash * .42) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
    if (state.mode !== "running") {
      ctx.fillStyle = "rgba(3,7,18,.62)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#eff9ff";
      ctx.font = "950 34px system-ui";
      ctx.textAlign = "center";
      const title = state.mode === "finished" ? "Sprint Cleared" : state.mode === "crashed" ? "Race Stopped" : "Slipstream Sprint";
      ctx.fillText(title, W / 2, 210);
      ctx.fillStyle = "#a7c1d5";
      ctx.font = "800 17px system-ui";
      const copy = state.mode === "ready" ? "Press Start Race. Arrow keys switch lanes, Space boosts, Down brakes." : state.feedback;
      wrapText(copy, W / 2, 246, 640, 24);
    }
  }
  function wrapText(text, x, y, maxWidth, lineHeight) {
    const words = String(text).split(/\s+/);
    let line = "";
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, y);
        line = word;
        y += lineHeight;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x, y);
  }
  function snapshot() {
    const active = visibleEvents().slice(0, 8).map((item) => ({
      id: item.event.id,
      type: item.event.type,
      lane: item.event.lane,
      distanceAhead: round(item.rel),
      y: round(item.y),
      resolved: item.event.resolved
    }));
    const next = state.events.find((event) => !event.resolved && event.distance - state.distance > -30);
    return {
      game: "slipstream-sprint",
      coordinateSystem: "canvas 960x540, origin top-left, x increases right, y increases down",
      mode: state.mode,
      player: { x: round(state.laneX), y: PLAYER_Y, lane: state.targetLane },
      lane: state.targetLane,
      laneName: ["inside", "center", "outside"][state.targetLane],
      lap: currentLap() + 1,
      totalLaps: TOTAL_LAPS,
      sector: sector(),
      distance: round(state.distance),
      totalDistance: TOTAL_DISTANCE,
      speed: round(state.speed),
      boost: round(state.boost),
      boosting: state.boosting,
      braking: state.braking,
      integrity: round(state.integrity),
      score: Math.round(state.score),
      best: Math.round(state.best),
      overtakes: state.overtakes,
      collisions: state.collisions,
      draftSeconds: round(state.draftSeconds),
      runTime: round(state.runTime),
      feedback: state.feedback,
      feedbackActive: state.feedbackTimer > 0,
      lastInput: state.lastInput,
      lastEvent: state.lastEvent,
      failedReason: state.failedReason,
      finishTime: state.finishTime == null ? null : round(state.finishTime),
      activeEvents: active,
      nextEvent: next ? { id: next.id, type: next.type, lane: next.lane, distanceAhead: round(next.distance - state.distance) } : null,
      soundEnabled: state.sound,
      reducedMotion
    };
  }
  function renderText() {
    return JSON.stringify(snapshot());
  }
  function stepMs(ms) {
    const total = clamp(Number(ms) || 0, 0, 10000);
    let elapsed = 0;
    while (elapsed < total) {
      const chunk = Math.min(50, total - elapsed) / 1000;
      update(chunk);
      elapsed += chunk * 1000;
    }
    syncHud();
    draw();
    return renderText();
  }
  function loop(ts) {
    if (!lastFrame) lastFrame = ts;
    const dt = Math.min(.05, Math.max(0, (ts - lastFrame) / 1000));
    lastFrame = ts;
    update(dt);
    syncHud();
    draw();
    requestAnimationFrame(loop);
  }

  els.start.addEventListener("click", startRace);
  els.restart.addEventListener("click", () => {
    markInput("button", "restart");
    resetRace(false);
    setFeedback("Race restarted.", "restart", 1.1);
    tone(300, .06, .035);
    canvas.focus({ preventScroll: true });
  });
  els.left.addEventListener("click", () => laneMove(-1, "button"));
  els.right.addEventListener("click", () => laneMove(1, "button"));
  els.boostBtn.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    setBoost(true, event.pointerType === "touch" ? "touch" : "button");
  });
  els.boostBtn.addEventListener("pointerup", () => setBoost(false, "button"));
  els.boostBtn.addEventListener("pointerleave", () => setBoost(false, "button"));
  els.boostBtn.addEventListener("click", () => {
    if (state.mode === "running") {
      setBoost(!state.boosting, "button");
      if (state.boosting) {
        if (boostAutoOffTimer !== null) clearTimeout(boostAutoOffTimer);
        boostAutoOffTimer = setTimeout(() => {
          boostAutoOffTimer = null;
          setBoost(false, "button");
        }, 520);
      }
    }
  });
  els.brakeBtn.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    setBrake(true, event.pointerType === "touch" ? "touch" : "button");
  });
  els.brakeBtn.addEventListener("pointerup", () => setBrake(false, "button"));
  els.brakeBtn.addEventListener("pointerleave", () => setBrake(false, "button"));
  els.brakeBtn.addEventListener("click", () => {
    if (state.mode === "running") {
      setBrake(!state.braking, "button");
      if (state.braking) {
        if (brakeAutoOffTimer !== null) clearTimeout(brakeAutoOffTimer);
        brakeAutoOffTimer = setTimeout(() => {
          brakeAutoOffTimer = null;
          setBrake(false, "button");
        }, 420);
      }
    }
  });
  els.sound.addEventListener("click", () => {
    state.sound = !state.sound;
    writeStore(SOUND_KEY, state.sound ? "1" : "0");
    setFeedback(state.sound ? "Sound on." : "Sound off.", "sound", .8);
    syncHud();
    if (state.sound) tone(460, .06, .03);
  });
  els.full.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
      } else if (els.app.requestFullscreen) {
        await els.app.requestFullscreen();
      } else if (els.app.webkitRequestFullscreen) {
        els.app.webkitRequestFullscreen();
      }
    } catch (_) {
      setFeedback("Fullscreen unavailable in this browser.", "fullscreen-error", 1.3);
    }
    syncHud();
  });
  document.addEventListener("fullscreenchange", syncHud);
  canvas.addEventListener("pointerdown", (event) => {
    if (state.mode !== "running") {
      startRace();
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const lane = x < rect.width / 3 ? 0 : x > rect.width * 2 / 3 ? 2 : 1;
    if (lane !== state.targetLane) {
      state.targetLane = lane;
      state.lane = lane;
      markInput(event.pointerType === "touch" ? "touch" : "pointer", "tap-lane");
      setFeedback("Touch lane " + (lane + 1) + ".", "lane", .8);
    } else {
      setBoost(true, event.pointerType === "touch" ? "touch" : "pointer");
    }
  });
  canvas.addEventListener("pointerup", () => setBoost(false, "pointer"));
  document.addEventListener("keydown", (event) => {
    if (event.defaultPrevented) return;
    const key = event.key.toLowerCase();
    if (key === "arrowleft" || key === "a") {
      event.preventDefault();
      laneMove(-1, "keyboard");
    } else if (key === "arrowright" || key === "d") {
      event.preventDefault();
      laneMove(1, "keyboard");
    } else if (key === " " || key === "enter" || key === "w" || key === "arrowup") {
      event.preventDefault();
      if (state.mode !== "running") startRace();
      else setBoost(true, "keyboard");
    } else if (key === "arrowdown" || key === "s") {
      event.preventDefault();
      setBrake(true, "keyboard");
    } else if (key === "r") {
      event.preventDefault();
      resetRace(false);
      setFeedback("Race restarted.", "restart", 1.1);
    } else if (key === "f") {
      event.preventDefault();
      els.full.click();
    }
  });
  document.addEventListener("keyup", (event) => {
    const key = event.key.toLowerCase();
    if (key === " " || key === "enter" || key === "w" || key === "arrowup") setBoost(false, "keyboard");
    if (key === "arrowdown" || key === "s") setBrake(false, "keyboard");
  });
  window.addEventListener("blur", () => {
    setBoost(false, "keyboard");
    setBrake(false, "keyboard");
  });

  window.render_game_to_text = renderText;
  window.advanceTime = stepMs;

  resetRace(true);
  syncHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
