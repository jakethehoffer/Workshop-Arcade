<script>
/* =========================
   Metro Dash — Enhanced Edition
   Canvas 2D pseudo-3D endless runner
   ========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });

/* ===== DISPLAY ===== */
let W, H, dpr;
function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
}
window.addEventListener("resize", resizeCanvas, { passive: true });
resizeCanvas();

/* ===== PERSPECTIVE ===== */
const VAN_Y = 0.32;
const TRACK_BOT = 0.92;
const TRACK_TOP = 0.06;
const LANES = 3;
const PLAYER_Z = 0.08;

function vanishY() { return H * VAN_Y; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function projX(lane, z) {
  const tw = lerp(W * TRACK_BOT, W * TRACK_TOP, z);
  return W / 2 + lane * (tw / LANES);
}
function projY(z) { return lerp(H, vanishY(), z); }
function projS(z) { return lerp(1, 0.015, z); }

/* ===== PARTICLES ===== */
const particles = [];
const scorePops = [];
const pickupRings = [];
const feedback = {
  nearMissCount: 0,
  dangerCue: 0,
  dangerLane: 0,
  crashFlash: 0,
  lastPickupAge: 999,
  lastNearMissAge: 999,
  lastEvent: null,
  lastEventAge: null,
  activeCueCount: 0,
  startCount: 0,
  laneChangeCount: 0,
  jumpCount: 0,
  slideCount: 0,
  lastLaneDelta: 0
};
function emitParticles(x, y, color, count, spread, life) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * spread, vy: -Math.random() * spread * 0.7 - 1,
      life: life || 30, maxLife: life || 30, color, r: 1.5 + Math.random() * 2
    });
  }
}
function emitScorePop(text, x, y, color) {
  scorePops.push({ text, x, y, vy: -0.9, life: 42, maxLife: 42, color });
}
function emitPickupRing(x, y, color) {
  pickupRings.push({ x, y, r: 10, life: 28, maxLife: 28, color });
}
function updateParticles(dt60) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt60; p.y += p.vy * dt60; p.vy += 0.08 * dt60;
    p.life -= dt60;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function updateFeedback(dt60) {
  feedback.lastPickupAge += dt60;
  feedback.lastNearMissAge += dt60;
  if (feedback.lastEventAge !== null) {
    feedback.lastEventAge += dt60;
    feedback.activeCueCount = feedback.lastEventAge <= 42 ? 1 : 0;
  }
  feedback.dangerCue = Math.max(0, feedback.dangerCue - 0.08 * dt60);
  feedback.crashFlash = Math.max(0, feedback.crashFlash - 0.045 * dt60);
  for (let i = scorePops.length - 1; i >= 0; i--) {
    const p = scorePops[i];
    p.y += p.vy * dt60;
    p.vy -= 0.015 * dt60;
    p.life -= dt60;
    if (p.life <= 0) scorePops.splice(i, 1);
  }
  for (let i = pickupRings.length - 1; i >= 0; i--) {
    const r = pickupRings[i];
    r.r += 1.7 * dt60;
    r.life -= dt60;
    if (r.life <= 0) pickupRings.splice(i, 1);
  }
}
function recordActionFeedback(type, details = {}) {
  feedback.lastEvent = type;
  feedback.lastEventAge = 0;
  feedback.activeCueCount = 1;
  if (type === "start") feedback.startCount += 1;
  if (type === "lane-change") {
    feedback.laneChangeCount += 1;
    feedback.lastLaneDelta = details.delta || 0;
  }
  if (type === "jump") feedback.jumpCount += 1;
  if (type === "slide") feedback.slideCount += 1;
  const px = projX(player.laneX, PLAYER_Z);
  const py = projY(PLAYER_Z) - 44 * projS(PLAYER_Z);
  if (type === "lane-change") {
    emitPickupRing(px, py, "#65e6ff");
  } else if (type === "jump") {
    emitPickupRing(px, py, "#ffe26d");
    emitScorePop("JUMP", px, py - 12, "#ffe26d");
  } else if (type === "slide") {
    emitPickupRing(px, py + 10, "#ffae72");
    emitScorePop("SLIDE", px, py - 4, "#ffae72");
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFeedback() {
  for (const r of pickupRings) {
    const a = clamp(r.life / r.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3;
    ctx.shadowColor = r.color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  for (const p of scorePops) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `bold ${18 * (0.8 + 0.25 * a)}px system-ui, -apple-system, Segoe UI, Arial`;
    ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(0,0,0,0.72)";
    ctx.lineWidth = 4;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }
  if (feedback.crashFlash > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.55, feedback.crashFlash * 0.55);
    ctx.fillStyle = "#fb3f5c";
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

/* ===== SCREEN SHAKE ===== */
let shakeX = 0, shakeY = 0, shakeTimer = 0;
function triggerShake(intensity, dur) { shakeTimer = dur; shakeX = intensity; shakeY = intensity; }
function updateShake(dt60) {
  if (shakeTimer > 0) {
    shakeTimer -= dt60;
    const t = clamp(shakeTimer / 10, 0, 1);
    shakeX = (Math.random() - 0.5) * 8 * t;
    shakeY = (Math.random() - 0.5) * 6 * t;
  } else { shakeX = 0; shakeY = 0; }
}

/* ===== TUNNEL RENDERING ===== */
let tieOffset = 0;

function drawScene(dt60, speed) {
  const cx = W / 2, vy = vanishY();
  const tbW = W * TRACK_BOT, ttW = W * TRACK_TOP;
  const speedIntensity = state === "playing" ? clamp((gameSpeed - 3) / 6, 0, 1) : 0;

  // Sky / distant tunnel glow
  const skyG = ctx.createRadialGradient(cx, vy, 10, cx, vy, H * 0.8);
  skyG.addColorStop(0, "#27345c");
  skyG.addColorStop(0.46, "#10182d");
  skyG.addColorStop(1, "#050711");
  ctx.fillStyle = skyG;
  ctx.fillRect(0, 0, W, H);

  // Atmospheric fog at vanishing point
  const fogG = ctx.createRadialGradient(cx, vy, 0, cx, vy, W * 0.15);
  fogG.addColorStop(0, "rgba(88,210,255,0.22)");
  fogG.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = fogG;
  ctx.fillRect(0, 0, W, H);

  // === WALLS with brick pattern ===
  // Left wall
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(cx - ttW / 2, vy);
  ctx.lineTo(cx - tbW / 2, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.clip();
  const lwG = ctx.createLinearGradient(0, 0, cx * 0.4, 0);
  lwG.addColorStop(0, "#090c19"); lwG.addColorStop(1, "#1f2942");
  ctx.fillStyle = lwG; ctx.fill();
  // Brick rows on left wall
  for (let i = 0; i < 30; i++) {
    const z = i / 30;
    const y1 = projY(z), y2 = projY(z + 1/30);
    const x1 = lerp(cx - tbW/2, cx - ttW/2, z);
    const x2 = lerp(cx - tbW/2, cx - ttW/2, z + 1/30);
    ctx.strokeStyle = `rgba(88,120,170,${0.46 * (1-z)})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y1); ctx.lineTo(x1, y1); ctx.stroke();
    // Vertical brick joints
    const bricks = 3 + Math.floor((1-z) * 5);
    for (let b = 0; b < bricks; b++) {
      const bx = lerp(0, x1, (b + (i%2)*0.5) / bricks);
      ctx.beginPath(); ctx.moveTo(bx, y1); ctx.lineTo(lerp(0, x2, (b + (i%2)*0.5) / bricks), y2); ctx.stroke();
    }
  }
  ctx.restore();

  // Right wall
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(W, 0); ctx.lineTo(cx + ttW / 2, vy);
  ctx.lineTo(cx + tbW / 2, H); ctx.lineTo(W, H); ctx.closePath();
  ctx.clip();
  const rwG = ctx.createLinearGradient(W, 0, cx + W * 0.3, 0);
  rwG.addColorStop(0, "#090c19"); rwG.addColorStop(1, "#1f2942");
  ctx.fillStyle = rwG; ctx.fill();
  for (let i = 0; i < 30; i++) {
    const z = i / 30;
    const y1 = projY(z);
    const y2 = projY(z + 1/30);
    const x1 = lerp(cx + tbW/2, cx + ttW/2, z);
    const x2 = lerp(cx + tbW/2, cx + ttW/2, z + 1/30);
    ctx.strokeStyle = `rgba(88,120,170,${0.46 * (1-z)})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W, y1); ctx.lineTo(x1, y1); ctx.stroke();
    const bricks = 3 + Math.floor((1-z) * 5);
    for (let b = 0; b < bricks; b++) {
      const bx = lerp(W, x1, (b + (i%2)*0.5) / bricks);
      ctx.beginPath(); ctx.moveTo(bx, y1); ctx.lineTo(lerp(W, x2, (b + (i%2)*0.5) / bricks), y2); ctx.stroke();
    }
  }
  ctx.restore();

  // === TRACK FLOOR ===
  ctx.beginPath();
  ctx.moveTo(cx - tbW/2, H); ctx.lineTo(cx - ttW/2, vy);
  ctx.lineTo(cx + ttW/2, vy); ctx.lineTo(cx + tbW/2, H);
  ctx.closePath();
  const floorG = ctx.createLinearGradient(0, vy, 0, H);
  floorG.addColorStop(0, "#202d4d"); floorG.addColorStop(0.58, "#273858"); floorG.addColorStop(1, "#3c4663");
  ctx.fillStyle = floorG; ctx.fill();

  // Active lane geometry: stronger rails make lateral movement easier to read.
  if (state === "playing") {
    const traceLine = (offset, color, width, alpha, dash = []) => {
      ctx.save();
      ctx.beginPath();
      if (dash.length) ctx.setLineDash(dash);
      for (let z = 0; z <= 1; z += 0.012) {
        const tw = lerp(tbW, ttW, z);
        const x = cx + tw * offset;
        const y = projY(z);
        z === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = width;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10 + speedIntensity * 14;
      ctx.stroke();
      ctx.restore();
    };
    traceLine(-0.5, "#46e9ff", 2.8, 0.42 + speedIntensity * 0.18);
    traceLine(0.5, "#46e9ff", 2.8, 0.42 + speedIntensity * 0.18);
    traceLine(-1 / 6, "#ffd666", 1.8, 0.48, [10, 12]);
    traceLine(1 / 6, "#ffd666", 1.8, 0.48, [10, 12]);

    for (let i = 0; i < 18; i++) {
      const z = (i / 18 + tieOffset * 0.7) % 1;
      if (z > 0.96) continue;
      const y = projY(z);
      const s = projS(z);
      const tickW = Math.max(4, 42 * s);
      ctx.fillStyle = `rgba(230,250,255,${0.18 + (1 - z) * 0.24})`;
      ctx.fillRect(cx - tickW / 2, y - Math.max(1, 2.5 * s), tickW, Math.max(1, 4 * s));
    }
  }

  // Track ties (scrolling)
  tieOffset = (tieOffset + speed * dt60 * 0.015) % 0.04;
  for (let i = 0; i < 50; i++) {
    const z = (i / 50 + tieOffset) % 1;
    if (z > 0.98) continue;
    const y = projY(z), s = projS(z);
    const tw = lerp(tbW, ttW, z);
    const h = Math.max(0.5, 2.5 * s);
    const a = 0.5 * (1-z);
    ctx.fillStyle = `rgba(245,191,90,${a})`;
    ctx.fillRect(cx - tw/2, y - h/2, tw, h);
  }

  // Lane dividers (dashed yellow)
  for (let d = -1; d <= 1; d += 2) {
    ctx.beginPath();
    ctx.setLineDash([8, 12]);
    ctx.strokeStyle = "rgba(255,220,90,0.58)";
    ctx.lineWidth = 2;
    const off = d * 0.333;
    for (let z = 0; z < 1; z += 0.005) {
      const x = projX(off, z), y = projY(z);
      z === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (feedback.dangerCue > 0 && state === "playing") {
    const pulse = 0.5 + Math.sin(performance.now() / 75) * 0.35;
    const lane = feedback.dangerLane || 0;
    ctx.save();
    ctx.globalAlpha = Math.min(0.38, feedback.dangerCue * (0.18 + pulse * 0.16));
    ctx.fillStyle = "#fb3f5c";
    ctx.beginPath();
    ctx.moveTo(projX(lane - 0.5, 0), H);
    ctx.lineTo(projX(lane - 0.5, 1), vy);
    ctx.lineTo(projX(lane + 0.5, 1), vy);
    ctx.lineTo(projX(lane + 0.5, 0), H);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // === CEILING ===
  ctx.fillStyle = "#0a0a16";
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(cx - ttW/2, vy); ctx.lineTo(cx + ttW/2, vy); ctx.lineTo(W, 0);
  ctx.closePath(); ctx.fill();

  // Ceiling lights with glow
  for (let i = 0; i < 25; i++) {
    const z = i / 25;
    const y = projY(z), s = projS(z);
    const lw = 50 * s, lh = 3 * s;
    if (lh < 0.3) continue;
    const a = 0.7 * (1-z);
    // Glow
    const glow = ctx.createRadialGradient(cx, y - 6*s, 0, cx, y - 6*s, 40*s);
    glow.addColorStop(0, `rgba(255,220,160,${a * 0.2})`);
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(cx - 40*s, y - 46*s, 80*s, 80*s);
    // Light fixture
    ctx.fillStyle = `rgba(255,230,180,${a})`;
    ctx.fillRect(cx - lw/2, y - 8*s, lw, lh);
    // Light cone on floor
    const coneA = a * 0.06;
    const coneG = ctx.createRadialGradient(cx, y, 0, cx, y, 60 * s);
    coneG.addColorStop(0, `rgba(255,220,150,${coneA})`);
    coneG.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = coneG;
    ctx.fillRect(cx - 60*s, y - 30*s, 120*s, 60*s);
  }

  // === SPEED LINES (during gameplay) ===
  if (state === "playing") {
    const intensity = speedIntensity;
    ctx.strokeStyle = `rgba(150,210,255,${0.08 + intensity * 0.22})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
      const sx = Math.random() * W;
      const sy = H * 0.3 + Math.random() * H * 0.5;
      const len = 36 + intensity * 64 + Math.random() * 50;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + len); ctx.stroke();
    }
    ctx.strokeStyle = `rgba(72,233,255,${0.08 + intensity * 0.2})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 7; i++) {
      const z = (tieOffset + i * 0.13) % 1;
      const y = projY(z);
      const tw = lerp(tbW, ttW, z);
      const side = i % 2 ? -1 : 1;
      const x = cx + side * tw * (0.38 + 0.08 * Math.sin(i));
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - side * 18, y + 48 + intensity * 40);
      ctx.stroke();
    }
  }
}

/* ===== PLAYER ===== */
const player = {
  lane: 0, targetLane: 0, laneX: 0,
  y: 0, vy: 0,
  isJumping: false, isSliding: false,
  slideTimer: 0, height: 1, runPhase: 0,
};
const LANE_SPEED = 0.15, JUMP_VEL = -0.55, GRAV = 0.032, SLIDE_DUR = 30;

function updatePlayer(dt60) {
  player.laneX = lerp(player.laneX, player.targetLane, 1 - Math.pow(1 - LANE_SPEED, dt60));
  if (player.isJumping) {
    player.vy += GRAV * dt60; player.y += player.vy * dt60;
    if (player.y >= 0) { player.y = 0; player.vy = 0; player.isJumping = false; }
  }
  if (player.isSliding) {
    player.slideTimer -= dt60; player.height = 0.5;
    if (player.slideTimer <= 0) { player.isSliding = false; player.height = 1; }
  } else { player.height = 1; }
  if (state === "playing") player.runPhase += dt60 * 0.35;
}

function drawPlayer() {
  const z = PLAYER_Z, s = projS(z);
  const baseH = 90 * s;
  const h = baseH * player.height;
  const w = 34 * s;
  const x = projX(player.laneX, z);
  const baseY = projY(z);
  const jumpOff = player.y * 220 * s;
  const y = baseY + jumpOff;
  const by = y - h;

  // Shadow on ground
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  const shadowScale = player.isJumping ? 0.6 : 1;
  ctx.ellipse(x, baseY + 2, w * 0.7 * shadowScale, 4 * s * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs (animated running)
  const legSwing = Math.sin(player.runPhase) * 10 * s;
  const legW = w * 0.28, legH = h * 0.42;
  // Back leg
  ctx.fillStyle = "#0d47a1";
  const bl = by + h * 0.55;
  ctx.beginPath();
  ctx.roundRect(x - w * 0.28, bl, legW, legH - legSwing, 3 * s);
  ctx.fill();
  // Front leg
  ctx.fillStyle = "#1565c0";
  ctx.beginPath();
  ctx.roundRect(x + w * 0.02, bl, legW, legH + legSwing, 3 * s);
  ctx.fill();

  // Body (hoodie)
  const bodyG = ctx.createLinearGradient(x - w/2, by, x + w/2, by);
  bodyG.addColorStop(0, "#29b6f6"); bodyG.addColorStop(0.5, "#4fc3f7"); bodyG.addColorStop(1, "#0288d1");
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.roundRect(x - w/2, by, w, h * 0.58, [6*s, 6*s, 2*s, 2*s]);
  ctx.fill();

  // Hoodie stripe
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.fillRect(x - 1*s, by + 4*s, 2*s, h * 0.5);

  // Arms (animated)
  const armSwing = Math.sin(player.runPhase + Math.PI) * 6 * s;
  ctx.fillStyle = "#0288d1";
  ctx.beginPath();
  ctx.roundRect(x - w/2 - 5*s, by + 6*s + armSwing, 6*s, h * 0.3, 3*s);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(x + w/2 - 1*s, by + 6*s - armSwing, 6*s, h * 0.3, 3*s);
  ctx.fill();

  // Head
  const hr = 11 * s;
  const headY = by - hr * 0.3;
  // Skin
  ctx.fillStyle = "#ffe0b2";
  ctx.beginPath(); ctx.arc(x, headY, hr, 0, Math.PI * 2); ctx.fill();
  // Hair / beanie
  ctx.fillStyle = "#e53935";
  ctx.beginPath();
  ctx.arc(x, headY - hr * 0.15, hr * 1.08, Math.PI * 1.15, Math.PI * 1.85);
  ctx.lineTo(x + hr * 1.1, headY - hr * 0.15);
  ctx.arc(x, headY - hr * 0.15, hr * 1.1, 0, Math.PI * 0.15);
  ctx.closePath();
  ctx.fill();
  // Beanie fold
  ctx.fillStyle = "#c62828";
  ctx.fillRect(x - hr * 1.05, headY - hr * 0.05, hr * 2.1, hr * 0.25);
  // Eyes
  ctx.fillStyle = "#333";
  ctx.beginPath(); ctx.arc(x - 3.5*s, headY + 1*s, 1.8*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 3.5*s, headY + 1*s, 1.8*s, 0, Math.PI*2); ctx.fill();
  // Eye shine
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(x - 3*s, headY + 0.3*s, 0.8*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 4*s, headY + 0.3*s, 0.8*s, 0, Math.PI*2); ctx.fill();
}

/* ===== OBSTACLES ===== */
const obstacles = [];
let spawnTimer = 0;
const OBS_TYPES = ["barrier", "train", "overhead"];

function spawnObstacle() {
  const type = OBS_TYPES[Math.floor(Math.random() * OBS_TYPES.length)];
  let lane, width;
  if (type === "train") {
    lane = Math.floor(Math.random() * 3) - 1;
    width = Math.random() < 0.35 ? 2 : 1;
    if (width === 2 && lane === 1) lane = 0;
  } else {
    lane = Math.floor(Math.random() * 3) - 1;
    width = 1;
  }
  obstacles.push({ type, lane, width, z: 1.0 });
}

function obstacleCoversLane(o, lane) {
  for (let l = 0; l < o.width; l++) {
    if (o.lane + l === lane) return true;
  }
  return false;
}

function obstacleThreat(o) {
  if (state !== "playing" || !obstacleCoversLane(o, player.targetLane)) return 0;
  if (o.z < PLAYER_Z - 0.04 || o.z > 0.42) return 0;
  const avoidActive = (o.type === "barrier" && player.isJumping) || (o.type === "overhead" && player.isSliding);
  const proximity = 1 - clamp(Math.abs(o.z - PLAYER_Z) / 0.34, 0, 1);
  return proximity * (avoidActive ? 0.35 : 1);
}

function updateObstacles(dt60) {
  const speed = gameSpeed * 0.004 * dt60;
  spawnTimer += dt60;
  const interval = Math.max(35, 65 - distance * 0.025);
  if (spawnTimer >= interval) { spawnObstacle(); spawnTimer = 0; }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    const prevZ = o.z;
    o.z -= speed;
    if (o.z < -0.05) { obstacles.splice(i, 1); continue; }
    const threat = obstacleThreat(o);
    if (threat > feedback.dangerCue) {
      feedback.dangerCue = threat;
      feedback.dangerLane = player.targetLane;
    }
    if (o.z > PLAYER_Z - 0.025 && o.z < PLAYER_Z + 0.025) {
      let hit = false;
      for (let l = 0; l < o.width; l++) {
        if (o.lane + l === player.targetLane) {
          if (o.type === "barrier" && player.isJumping) continue;
          if (o.type === "overhead" && player.isSliding) continue;
          hit = true;
        }
      }
      if (hit) setGameOver();
    }
    if (!o.nearMissFired && prevZ >= PLAYER_Z && o.z < PLAYER_Z) {
      const centerLane = o.lane + (o.width - 1) / 2;
      const closeLane = Math.abs(centerLane - player.targetLane) <= 1.05;
      if (state === "playing" && closeLane) {
        o.nearMissFired = true;
        feedback.nearMissCount++;
        feedback.lastNearMissAge = 0;
        feedback.dangerCue = Math.max(feedback.dangerCue, 0.7);
        feedback.dangerLane = player.targetLane;
        const px = projX(player.laneX, PLAYER_Z);
        const py = projY(PLAYER_Z) - 64 * projS(PLAYER_Z);
        emitScorePop("CLOSE", px, py, "#7dd3fc");
        emitParticles(px, py, "#7dd3fc", 6, 3, 18);
        triggerShake(2, 5);
      }
    }
  }
}

function drawObstacles() {
  const sorted = [...obstacles].sort((a, b) => b.z - a.z);
  for (const o of sorted) {
    if (o.z < 0 || o.z > 1) continue;
    const s = projS(o.z), y = projY(o.z);
    const fogA = clamp(1 - o.z * 0.6, 0.3, 1);
    const threat = obstacleThreat(o);

    for (let l = 0; l < o.width; l++) {
      const x = projX(o.lane + l, o.z);
      ctx.globalAlpha = fogA;
      if (threat > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(0.58, threat * 0.62);
        ctx.shadowColor = "#fb3f5c";
        ctx.shadowBlur = 26 * s + 12;
        ctx.fillStyle = "#fb3f5c";
        ctx.beginPath();
        ctx.ellipse(x, y - 28 * s, 42 * s, 28 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.globalAlpha = fogA;
      }

      if (o.type === "barrier") {
        const bw = 44 * s, bh = 28 * s;
        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.fillRect(x - bw/2 + 2, y - 2, bw, 4);
        // Main body
        const bg = ctx.createLinearGradient(x - bw/2, y - bh, x + bw/2, y);
        bg.addColorStop(0, "#ffb74d"); bg.addColorStop(0.5, "#ff9800"); bg.addColorStop(1, "#e65100");
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.roundRect(x - bw/2, y - bh, bw, bh, 3*s); ctx.fill();
        // Warning stripes
        ctx.fillStyle = "rgba(0,0,0,0.2)";
        for (let st = 0; st < 3; st++) {
          ctx.fillRect(x - bw/2 + st * bw/3, y - bh, bw/6, bh);
        }
        // Top edge highlight
        ctx.fillStyle = "rgba(255,255,255,0.2)";
        ctx.fillRect(x - bw/2, y - bh, bw, 2*s);

      } else if (o.type === "train") {
        const tw = 50 * s, th = 90 * s;
        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath(); ctx.ellipse(x, y + 2, tw*0.5, 4*s, 0, 0, Math.PI*2); ctx.fill();
        // Train body
        const tg = ctx.createLinearGradient(x - tw/2, 0, x + tw/2, 0);
        tg.addColorStop(0, "#0d47a1"); tg.addColorStop(0.3, "#1565c0");
        tg.addColorStop(0.7, "#1976d2"); tg.addColorStop(1, "#0d47a1");
        ctx.fillStyle = tg;
        ctx.beginPath(); ctx.roundRect(x - tw/2, y - th, tw, th, [5*s, 5*s, 2*s, 2*s]); ctx.fill();
        // Windows
        ctx.fillStyle = "#bbdefb";
        const winW = tw * 0.2, winH = 14 * s, winY2 = y - th * 0.68;
        ctx.beginPath(); ctx.roundRect(x - tw * 0.35, winY2, winW, winH, 2*s); ctx.fill();
        ctx.beginPath(); ctx.roundRect(x - tw * 0.05, winY2, winW, winH, 2*s); ctx.fill();
        ctx.beginPath(); ctx.roundRect(x + tw * 0.18, winY2, winW, winH, 2*s); ctx.fill();
        // Window glow
        ctx.fillStyle = "rgba(187,222,251,0.15)";
        ctx.fillRect(x - tw * 0.4, winY2 + winH, tw * 0.8, 10 * s);
        // Bottom stripe
        const stripe = ctx.createLinearGradient(x, y - th*0.12, x, y);
        stripe.addColorStop(0, "#ff9800"); stripe.addColorStop(1, "#e65100");
        ctx.fillStyle = stripe;
        ctx.fillRect(x - tw/2, y - th * 0.12, tw, th * 0.12);
        // Roof
        ctx.fillStyle = "#0d47a1";
        ctx.beginPath(); ctx.roundRect(x - tw/2 - 2*s, y - th - 3*s, tw + 4*s, 5*s, 2*s); ctx.fill();
        // Headlight
        ctx.fillStyle = "#fff9c4";
        ctx.beginPath(); ctx.arc(x, y - th * 0.35, 3*s, 0, Math.PI*2); ctx.fill();

      } else if (o.type === "overhead") {
        const ow = 55 * s, oh = 8 * s;
        const beamY = y - 65 * s;
        // Support posts
        ctx.fillStyle = "#546e7a";
        const postW = 5 * s;
        ctx.beginPath(); ctx.roundRect(x - ow/2, beamY, postW, y - beamY, 1*s); ctx.fill();
        ctx.beginPath(); ctx.roundRect(x + ow/2 - postW, beamY, postW, y - beamY, 1*s); ctx.fill();
        // Beam
        const beamG = ctx.createLinearGradient(x, beamY, x, beamY + oh);
        beamG.addColorStop(0, "#78909c"); beamG.addColorStop(1, "#546e7a");
        ctx.fillStyle = beamG;
        ctx.beginPath(); ctx.roundRect(x - ow/2, beamY, ow, oh, 2*s); ctx.fill();
        // Warning tape
        ctx.fillStyle = "rgba(255,235,59,0.5)";
        ctx.fillRect(x - ow/2, beamY + oh - 2*s, ow, 2*s);
        // Highlight
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(x - ow/2, beamY, ow, 2*s);
      }
      if (threat > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(0.9, 0.35 + threat * 0.65);
        ctx.strokeStyle = "#ff6b7f";
        ctx.lineWidth = Math.max(2, 4 * s);
        ctx.shadowColor = "#fb3f5c";
        ctx.shadowBlur = 16 * s + 8;
        ctx.beginPath();
        ctx.ellipse(x, y - 30 * s, 48 * s, 32 * s, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }
}

/* ===== COINS ===== */
const coinObjects = [];
let coinSpawnTimer = 0, coinSpin = 0;

function spawnCoinRow() {
  const lane = Math.floor(Math.random() * 3) - 1;
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) coinObjects.push({ lane, z: 1.0 + i * 0.025, collected: false });
}

function updateCoins(dt60) {
  const speed = gameSpeed * 0.004 * dt60;
  coinSpawnTimer += dt60;
  coinSpin += dt60 * 0.1;
  if (coinSpawnTimer >= 50) { spawnCoinRow(); coinSpawnTimer = 0; }
  for (let i = coinObjects.length - 1; i >= 0; i--) {
    const c = coinObjects[i];
    c.z -= speed;
    if (c.z < -0.05) { coinObjects.splice(i, 1); continue; }
    if (!c.collected && c.z > PLAYER_Z - 0.02 && c.z < PLAYER_Z + 0.02) {
      if (c.lane === player.targetLane) {
        c.collected = true; coins += 10; SFX.coin();
        const cx2 = projX(c.lane, c.z), cy2 = projY(c.z) - 20 * projS(c.z);
        feedback.lastPickupAge = 0;
        emitParticles(cx2, cy2, "#ffd700", 12, 4.8, 22);
        emitPickupRing(cx2, cy2, "#ffd700");
        emitScorePop("+10", cx2, cy2 - 18 * projS(c.z), "#ffe08a");
        triggerShake(1.2, 3);
      }
    }
  }
}

function drawCoins() {
  for (const c of coinObjects) {
    if (c.collected || c.z < 0 || c.z > 1) continue;
    const s = projS(c.z);
    const x = projX(c.lane, c.z);
    const y = projY(c.z) - 22 * s;
    const r = 9 * s;
    if (r < 0.8) continue;
    const fogA = clamp(1 - c.z * 0.5, 0.3, 1);
    ctx.globalAlpha = fogA;
    // Coin spin effect (ellipse width oscillates)
    const spinW = Math.abs(Math.cos(coinSpin + c.z * 10));
    // Outer
    ctx.fillStyle = "#ffc107";
    ctx.beginPath(); ctx.ellipse(x, y, r * Math.max(0.3, spinW), r, 0, 0, Math.PI*2); ctx.fill();
    // Inner
    ctx.fillStyle = "#ffecb3";
    ctx.beginPath(); ctx.ellipse(x, y, r * 0.55 * Math.max(0.3, spinW), r * 0.55, 0, 0, Math.PI*2); ctx.fill();
    // Shine
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath(); ctx.ellipse(x - r*0.15, y - r*0.2, r*0.25 * Math.max(0.3, spinW), r*0.2, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ===== AUDIO ===== */
let audioCtx = null, masterGain = null, sfxGain = null, musicGain = null;

function ensureAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.8;
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 3;
  masterGain.connect(comp); comp.connect(audioCtx.destination);
  sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(masterGain);
  musicGain = audioCtx.createGain(); musicGain.gain.value = 0.2; musicGain.connect(masterGain);
}
function resumeAudio() { ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }

function playTone(freq, time, dur, type, gain, target) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type || "sine"; osc.frequency.setValueAtTime(freq, time);
  g.gain.setValueAtTime(0.001, time);
  g.gain.exponentialRampToValueAtTime(gain || 0.1, time + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  osc.connect(g).connect(target || sfxGain);
  osc.start(time); osc.stop(time + dur + 0.05);
}

const SFX = {
  coin() { ensureAudio(); if (!audioCtx) return; const t = audioCtx.currentTime; playTone(880, t, 0.08, "triangle", 0.1); playTone(1320, t + 0.06, 0.1, "triangle", 0.08); },
  jump() { ensureAudio(); if (!audioCtx) return; const t = audioCtx.currentTime; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = "triangle"; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(600, t + 0.12); g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(0.1, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15); o.connect(g).connect(sfxGain); o.start(t); o.stop(t + 0.2); },
  slide() { ensureAudio(); if (!audioCtx) return; const t = audioCtx.currentTime; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = "sawtooth"; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(100, t + 0.1); g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12); o.connect(g).connect(sfxGain); o.start(t); o.stop(t + 0.15); },
  hit() { ensureAudio(); if (!audioCtx) return; const t = audioCtx.currentTime; playTone(200, t, 0.25, "sine", 0.18); playTone(80, t + 0.1, 0.35, "sine", 0.12); },
  newHigh() { ensureAudio(); if (!audioCtx) return; const t = audioCtx.currentTime; playTone(523, t, 0.12, "triangle", 0.1); playTone(659, t + 0.1, 0.12, "triangle", 0.08); playTone(784, t + 0.2, 0.18, "triangle", 0.08); }
};

/* ===== MUSIC ===== */
const TEMPO = 130, STEP_DUR = 60 / TEMPO / 4;
let mus = { on: false, timer: null, next: 0, step: 0 };

function schedStep(time, step) {
  const pos = step % 16;
  if (pos % 4 === 0) playTone(55, time, 0.15, "sine", 0.15, musicGain);
  if (pos % 2 === 0 && audioCtx) {
    const buf = audioCtx.createBuffer(1, Math.round(audioCtx.sampleRate * 0.03), audioCtx.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.03, time); g.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
    const f = audioCtx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 8000;
    src.connect(f).connect(g).connect(musicGain); src.start(time); src.stop(time + 0.05);
  }
  if (pos === 0 || pos === 8) {
    const notes = [55, 55, 65.41, 73.42];
    playTone(notes[Math.floor(step / 16) % 4], time, 0.3, "sine", 0.1, musicGain);
  }
  // Melody line
  if (pos % 4 === 0) {
    const melody = [196, 220, 262, 220, 196, 165, 196, 220];
    playTone(melody[Math.floor(step / 4) % melody.length], time, 0.18, "triangle", 0.04, musicGain);
  }
}
function startMusic() { ensureAudio(); if (!audioCtx || mus.on) return; mus.on = true; mus.next = audioCtx.currentTime + 0.05; mus.timer = setInterval(() => { if (!mus.on || !audioCtx) return; while (mus.next < audioCtx.currentTime + 0.15) { schedStep(mus.next, mus.step); mus.next += STEP_DUR; mus.step++; } }, 25); }
function stopMusic() { if (mus.timer) clearInterval(mus.timer); mus.timer = null; mus.on = false; }

/* ===== GAME STATE ===== */
let state = "title", lastTime = null, gameSpeed = 3, distance = 0, coins = 0, newBest = false;
const HS_KEY = "metrodash_highscore";
let highScore = 0;
try { highScore = Number(localStorage.getItem(HS_KEY) || 0); } catch(_) {}

function startGame() {
  state = "playing"; distance = 0; coins = 0; gameSpeed = 3;
  Object.assign(player, { lane:0, targetLane:0, laneX:0, y:0, vy:0, isJumping:false, isSliding:false, slideTimer:0, height:1, runPhase:0 });
  obstacles.length = 0; coinObjects.length = 0; particles.length = 0; scorePops.length = 0; pickupRings.length = 0;
  Object.assign(feedback, {
    nearMissCount: 0,
    dangerCue: 0,
    dangerLane: 0,
    crashFlash: 0,
    lastPickupAge: 999,
    lastNearMissAge: 999,
    lastEvent: null,
    lastEventAge: null,
    activeCueCount: 0,
    startCount: 0,
    laneChangeCount: 0,
    jumpCount: 0,
    slideCount: 0,
    lastLaneDelta: 0
  });
  spawnTimer = 0; coinSpawnTimer = 0; newBest = false;
  pauseBtn.style.display = "block";
  recordActionFeedback("start");
  resumeAudio(); startMusic();
}

function setGameOver() {
  if (state === "gameover") return;
  state = "gameover"; stopMusic(); pauseBtn.style.display = "none";
  feedback.crashFlash = 1;
  feedback.dangerCue = 0;
  triggerShake(16, 20);
  // Explosion particles at player position
  const px = projX(player.laneX, PLAYER_Z), py = projY(PLAYER_Z) - 40 * projS(PLAYER_Z);
  emitParticles(px, py, "#ff5252", 20, 8, 40);
  emitParticles(px, py, "#ffd700", 10, 6, 30);
  if (Math.floor(distance) > highScore) {
    highScore = Math.floor(distance); newBest = true;
    try { localStorage.setItem(HS_KEY, String(highScore)); } catch(_) {}
    SFX.newHigh();
  } else { SFX.hit(); }
}

function togglePause() {
  if (state === "playing") {
    state = "paused";
    stopMusic();
    pauseOverlay.classList.add("show");
    activateDialog(pauseOverlay, pauseBtn, resumeBtn, () => togglePause());
  }
  else if (state === "paused") {
    state = "playing";
    deactivateDialog(pauseOverlay);
    pauseOverlay.classList.remove("show");
    lastTime = null;
    startMusic();
  }
}

/* ===== INPUT ===== */
function moveLeft() {
  if (state !== "playing" || player.targetLane <= -1) return;
  player.targetLane--;
  recordActionFeedback("lane-change", { delta: -1 });
}
function moveRight() {
  if (state !== "playing" || player.targetLane >= 1) return;
  player.targetLane++;
  recordActionFeedback("lane-change", { delta: 1 });
}
function doJump() {
  if (state !== "playing" || player.isJumping || player.isSliding) return;
  player.isJumping = true; player.vy = JUMP_VEL;
  recordActionFeedback("jump");
  SFX.jump();
}
function doSlide() {
  if (state !== "playing" || player.isJumping || player.isSliding) return;
  player.isSliding = true; player.slideTimer = SLIDE_DUR;
  recordActionFeedback("slide");
  SFX.slide();
}

document.addEventListener("keydown", e => {
  if (e.target && e.target.closest && e.target.closest("button, a, input, select, textarea") && e.code !== "Tab" && e.code !== "Escape") return;
  if (e.repeat) return;
  if (state === "title" && (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW")) { startGame(); return; }
  if (state === "gameover" && (e.code === "Space" || e.code === "Enter")) { startGame(); return; }
  if (e.code === "KeyP" || (e.code === "Escape" && (state === "playing" || state === "paused"))) { togglePause(); return; }
  if (e.code === "KeyH") { if (helpOverlay.classList.contains("show")) closeHelp(); else openHelp(); return; }
  if (e.code === "ArrowLeft" || e.code === "KeyA") moveLeft();
  if (e.code === "ArrowRight" || e.code === "KeyD") moveRight();
  if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") doJump();
  if (e.code === "ArrowDown" || e.code === "KeyS") doSlide();
});

let touchSX = 0, touchSY = 0, touchST = 0;
canvas.addEventListener("touchstart", e => { e.preventDefault(); const t = e.touches[0]; touchSX = t.clientX; touchSY = t.clientY; touchST = performance.now(); if (state === "title" || state === "gameover") startGame(); }, { passive: false });
canvas.addEventListener("touchend", e => { e.preventDefault(); const t = e.changedTouches[0], dx = t.clientX - touchSX, dy = t.clientY - touchSY; if (performance.now() - touchST > 300) return; if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) { dx < 0 ? moveLeft() : moveRight(); } else if (Math.abs(dy) > 30) { dy < 0 ? doJump() : doSlide(); } }, { passive: false });
canvas.addEventListener("mousedown", () => { if (state === "title" || state === "gameover") startGame(); });

/* ===== TEXT ===== */
function drawText(txt, x, y, size, align, color, outline) {
  ctx.font = `bold ${size || 24}px system-ui, -apple-system, Segoe UI, Arial`;
  ctx.textAlign = align || "center";
  if (outline) { ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.lineWidth = 4; ctx.strokeText(txt, x, y); }
  else { ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillText(txt, x + 2, y + 2); }
  ctx.fillStyle = color || "#fff";
  ctx.fillText(txt, x, y);
}

/* ===== HUD ===== */
function drawHUD() {
  if (state !== "playing") return;
  // Distance
  drawText(Math.floor(distance) + "m", W/2, 38, 30, "center", "#fff", true);
  // Speed indicator
  const speedPct = clamp((gameSpeed - 3) / 7, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.roundRect(W/2 - 50, 48, 100, 6, 3); ctx.fill();
  const speedColor = speedPct < 0.5 ? "#4caf50" : speedPct < 0.8 ? "#ff9800" : "#f44336";
  ctx.fillStyle = speedColor;
  ctx.beginPath(); ctx.roundRect(W/2 - 50, 48, 100 * speedPct, 6, 3); ctx.fill();
  // Coins
  ctx.fillStyle = "#ffc107";
  ctx.beginPath(); ctx.arc(28, 34, 10, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#ffecb3";
  ctx.beginPath(); ctx.arc(28, 34, 6, 0, Math.PI*2); ctx.fill();
  drawText(String(coins), 46, 40, 20, "left", "#ffd700", true);
}

function drawTitleRunwayPreview() {
  const pulse = 0.6 + Math.sin(performance.now() / 520) * 0.2;
  for (const lane of [-1, 0, 1]) {
    for (let i = 0; i < 5; i++) {
      const z = 0.18 + i * 0.14;
      const x = projX(lane, z);
      const y = projY(z) - 18 * projS(z);
      const s = Math.max(0.18, projS(z));
      ctx.globalAlpha = 0.46 * (1 - z) + pulse * 0.18;
      ctx.fillStyle = lane === 0 ? "#4fc3f7" : "#ffd166";
      ctx.beginPath();
      ctx.arc(x, y, 7 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.22 * (1 - z);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(x - 2 * s, y - 2 * s, 3 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ===== SCREENS ===== */
function drawTitleScreen() {
  ctx.fillStyle = "rgba(1,4,14,0.3)";
  ctx.fillRect(0, 0, W, H);
  const panelW = Math.min(W - 40, 420);
  const panelH = W < 520 ? 176 : 190;
  const panelX = W / 2 - panelW / 2;
  const panelY = Math.max(76, H * 0.18);
  const pg = ctx.createLinearGradient(panelX, panelY, panelX, panelY + panelH);
  pg.addColorStop(0, "rgba(6,18,38,0.86)");
  pg.addColorStop(1, "rgba(2,5,16,0.68)");
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.roundRect(panelX, panelY, panelW, panelH, 18); ctx.fill();
  ctx.strokeStyle = "rgba(79,195,247,0.42)";
  ctx.lineWidth = 1;
  ctx.stroke();

  const titleSize = Math.max(36, Math.min(60, W * 0.1));
  drawText("METRO DASH", W/2, panelY + 56, titleSize, "center", "#5ad7ff", true);
  drawText("Swipe lanes. Jump beams. Chase coins.", W/2, panelY + 90, W < 520 ? 14 : 17, "center", "#b9d6e8");

  // Pulsing start text
  const pulse = 0.7 + Math.sin(performance.now() / 400) * 0.3;
  ctx.globalAlpha = pulse;
  const btnW = Math.min(250, panelW - 72);
  const btnH = 44;
  const btnX = W / 2 - btnW / 2;
  const btnY = panelY + panelH - 66;
  const bg = ctx.createLinearGradient(btnX, btnY, btnX + btnW, btnY + btnH);
  bg.addColorStop(0, "#4fc3f7");
  bg.addColorStop(1, "#19e2a4");
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 14); ctx.fill();
  drawText("START RUN", W/2, btnY + 29, 18, "center", "#06111c");
  ctx.globalAlpha = 1;
  drawText("Tap or press SPACE", W/2, btnY + 66, 14, "center", "#e5f7ff");

  if (highScore > 0) {
    drawText("Best: " + highScore + "m", W/2, btnY + 90, 16, "center", "#ffd700");
  }
}

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0, 0, W, H);

  const title = newBest ? "New High Score!" : "Game Over";
  const titleColor = newBest ? "#ffd700" : "#f44336";
  drawText(title, W/2, H * 0.35, 40, "center", titleColor, true);

  // Stats box
  const bx = W/2 - 120, by2 = H * 0.35 + 20, bw2 = 240, bh2 = 100;
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.roundRect(bx, by2, bw2, bh2, 12); ctx.fill();

  drawText(Math.floor(distance) + "m", W/2, by2 + 35, 28, "center", "#4fc3f7");
  // Coin icon
  ctx.fillStyle = "#ffc107";
  ctx.beginPath(); ctx.arc(W/2 - 30, by2 + 62, 8, 0, Math.PI*2); ctx.fill();
  drawText(String(coins), W/2 - 14, by2 + 68, 20, "left", "#ffd700");
  drawText("Best: " + highScore + "m", W/2, by2 + 92, 16, "center", "#8899aa");

  const pulse2 = 0.6 + Math.sin(performance.now() / 400) * 0.4;
  ctx.globalAlpha = pulse2;
  drawText("Tap or SPACE to retry", W/2, H * 0.7, 20, "center", "#fff");
  ctx.globalAlpha = 1;
}

/* ===== OVERLAYS ===== */
const helpBtn = document.getElementById("helpBtn");
const helpOverlay = document.getElementById("helpOverlay");
const helpClose = document.getElementById("helpClose");
const pauseBtn = document.getElementById("pauseBtn");
const pauseOverlay = document.getElementById("pauseOverlay");
const resumeBtn = document.getElementById("resumeBtn");
const restartFromPause = document.getElementById("restartFromPause");
const FOCUSABLE_SELECTOR = 'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
let activeDialog = null;
let activeDialogTrigger = null;
let activeDialogClose = null;

let helpOpen = false;
function dialogFocusables(dialog) {
  return [...dialog.querySelectorAll(FOCUSABLE_SELECTOR)].filter(el => el.getClientRects().length > 0);
}
function activateDialog(dialog, trigger, preferred, closeFn) {
  activeDialog = dialog;
  activeDialogTrigger = trigger && typeof trigger.focus === "function" ? trigger : document.activeElement;
  activeDialogClose = closeFn || null;
  setTimeout(() => {
    const target = preferred && preferred.getClientRects().length > 0 ? preferred : (dialogFocusables(dialog)[0] || dialog);
    target.focus({ preventScroll: true });
  }, 0);
}
function deactivateDialog(dialog, restoreFocus = true) {
  if (activeDialog !== dialog) return;
  const target = activeDialogTrigger;
  activeDialog = null;
  activeDialogTrigger = null;
  activeDialogClose = null;
  if (restoreFocus && target && target.isConnected && target.getClientRects().length > 0) {
    setTimeout(() => target.focus({ preventScroll: true }), 0);
  }
}
document.addEventListener("keydown", e => {
  if (!activeDialog || !activeDialog.classList.contains("show") || e.defaultPrevented) return;
  if (e.key === "Escape" && activeDialogClose) {
    e.preventDefault();
    e.stopPropagation();
    activeDialogClose();
    return;
  }
  if (e.key !== "Tab") return;
  const focusables = dialogFocusables(activeDialog);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus({ preventScroll: true });
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus({ preventScroll: true });
  }
}, true);

function openHelp() {
  helpOpen = true;
  helpOverlay.classList.add("show");
  activateDialog(helpOverlay, helpBtn, helpClose, () => closeHelp());
}
function closeHelp() {
  helpOpen = false;
  deactivateDialog(helpOverlay);
  helpOverlay.classList.remove("show");
}

helpBtn.onclick = e => { e.preventDefault(); openHelp(); };
helpClose.onclick = e => { e.preventDefault(); closeHelp(); };
helpOverlay.addEventListener("click", e => { if (e.target === helpOverlay) closeHelp(); });
pauseBtn.onclick = e => { e.preventDefault(); togglePause(); };
resumeBtn.onclick = e => { e.preventDefault(); togglePause(); };
restartFromPause.onclick = e => { e.preventDefault(); deactivateDialog(pauseOverlay, false); pauseOverlay.classList.remove("show"); startGame(); };

document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "playing") stopMusic();
  else if (!document.hidden && state === "playing") startMusic();
});

/* ===== DIAGNOSTICS ===== */
function diagnosticFrame(dt60 = 1) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const spd = state === "playing" ? gameSpeed : 2;
  drawScene(dt60, spd);
  if (state === "title") drawTitleRunwayPreview();
  drawCoins();
  drawObstacles();
  if (state !== "gameover") drawPlayer();
  drawParticles();
  drawHUD();
  if (state === "title") drawTitleScreen();
  if (state === "gameover") drawGameOver();
  drawFeedback();
}

function renderGameToText() {
  return JSON.stringify({
    game: "Metro Dash",
    coordinateSystem: "runner lanes -1..1 and depth z 0 near to 1 far",
    state,
    distance: Math.floor(distance),
    coins,
    highScore,
    newBest: !!newBest,
    speed: Math.round(gameSpeed * 100) / 100,
    player: {
      lane: player.lane,
      targetLane: player.targetLane,
      laneX: Math.round(player.laneX * 100) / 100,
      y: Math.round(player.y * 100) / 100,
      vy: Math.round(player.vy * 100) / 100,
      jumping: !!player.isJumping,
      sliding: !!player.isSliding,
      slideTimer: Math.round(player.slideTimer * 100) / 100,
      height: Math.round(player.height * 100) / 100
    },
    obstacles: obstacles.slice(0, 12).map(o => ({
      type: o.type,
      lane: o.lane,
      width: o.width,
      z: Math.round(o.z * 1000) / 1000
    })),
    coinsVisible: coinObjects.filter(c => !c.collected).slice(0, 12).map(c => ({
      lane: c.lane,
      z: Math.round(c.z * 1000) / 1000
    })),
    counts: {
      obstacles: obstacles.length,
      coins: coinObjects.filter(c => !c.collected).length,
      particles: particles.length,
      feedbackParticles: particles.length + scorePops.length + pickupRings.length
    },
    feedback: {
      nearMissCount: feedback.nearMissCount,
      lastPickupAge: Math.round(feedback.lastPickupAge * 100) / 100,
      lastNearMissAge: Math.round(feedback.lastNearMissAge * 100) / 100,
      lastEvent: feedback.lastEvent,
      lastEventAge: feedback.lastEventAge === null ? null : Math.round(feedback.lastEventAge * 100) / 100,
      activeCueCount: feedback.activeCueCount,
      startCount: feedback.startCount,
      laneChangeCount: feedback.laneChangeCount,
      jumpCount: feedback.jumpCount,
      slideCount: feedback.slideCount,
      lastLaneDelta: feedback.lastLaneDelta,
      dangerCue: Math.round(feedback.dangerCue * 100) / 100,
      dangerLane: feedback.dangerLane,
      crashFlash: Math.round(feedback.crashFlash * 100) / 100,
      scorePops: scorePops.length,
      pickupRings: pickupRings.length,
      feedbackParticles: particles.length + scorePops.length + pickupRings.length
    },
    timers: {
      spawnTimer: Math.round(spawnTimer * 100) / 100,
      coinSpawnTimer: Math.round(coinSpawnTimer * 100) / 100,
      shakeTimer: Math.round(shakeTimer * 100) / 100
    },
    overlays: {
      helpOpen: !!helpOpen,
      pauseOpen: pauseOverlay.classList.contains("show")
    },
    musicOn: !!mus.on
  });
}

window.render_game_to_text = renderGameToText;
window.advanceTime = function advanceTime(ms = 0) {
  const steps = Math.max(1, Math.round(Math.max(0, ms) / (1000 / 60)));
  for (let i = 0; i < steps; i++) {
    const dt60 = 1;
    if (state !== "paused" && !helpOpen) {
      updateShake(dt60);
      if (state === "playing") {
        updatePlayer(dt60);
        distance += gameSpeed * dt60 * 0.1;
        gameSpeed = 3 + distance * 0.003;
        updateObstacles(dt60);
        updateCoins(dt60);
      }
      updateParticles(dt60);
      updateFeedback(dt60);
    }
  }
  diagnosticFrame(1);
  return renderGameToText();
};

/* ===== MAIN LOOP ===== */
function loop(now) {
  if (lastTime === null) { lastTime = now; requestAnimationFrame(loop); return; }
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;
  const dt60 = dt * 60;

  if (state === "paused" || helpOpen) { requestAnimationFrame(loop); return; }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Screen shake
  updateShake(dt60);
  if (shakeX || shakeY) ctx.translate(shakeX, shakeY);

  const spd = state === "playing" ? gameSpeed : 2;

  if (state === "playing") {
    updatePlayer(dt60);
    distance += spd * dt60 * 0.1;
    gameSpeed = 3 + distance * 0.003;
    updateObstacles(dt60);
    updateCoins(dt60);
  }
  updateParticles(dt60);
  updateFeedback(dt60);

  drawScene(dt60, spd);
  if (state === "title") drawTitleRunwayPreview();
  drawCoins();
  drawObstacles();
  if (state !== "gameover") drawPlayer();
  drawParticles();
  drawHUD();
  if (state === "title") drawTitleScreen();
  if (state === "gameover") drawGameOver();
  drawFeedback();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
