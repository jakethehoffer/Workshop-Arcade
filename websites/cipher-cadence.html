<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Cipher Cadence</span></div>
    <div class="help">Catch each cipher word on the pulse line. Keys: 1-4 pick a lane, arrows move, Space/Enter confirm, R restart, M sound, F fullscreen.</div>
  </header>
  <section class="hud" aria-label="Cipher Cadence score">
    <span class="pill"><span class="label">Track</span><span class="value" id="trackValue">1/5</span></span>
    <span class="pill"><span class="label">Word</span><span class="value" id="wordValue">1/4</span></span>
    <span class="pill"><span class="label">Beat</span><span class="value" id="beatValue">12</span></span>
    <span class="pill"><span class="label">Integrity</span><span class="value" id="integrityValue">6</span></span>
    <span class="pill"><span class="label">Combo</span><span class="value" id="comboValue">0</span></span>
    <span class="pill"><span class="label">Score</span><span class="value" id="scoreValue">0</span></span>
    <span class="pill"><span class="label">Best</span><span class="value" id="bestValue">0</span></span>
  </section>
  <main aria-label="Cipher Cadence rhythm word game">
    <div class="stage">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="Cipher Cadence game. Select the lane with the next target word and confirm near the pulse line."></canvas>
    </div>
  </main>
  <div class="choices" id="choiceRow" aria-label="Cipher Cadence word lanes"></div>
  <div class="status" id="statusLine" aria-live="polite">Start the cipher and catch the first word on beat.</div>
  <div class="sr-only" id="liveStatus" role="status" aria-live="polite" aria-atomic="true">Cipher Cadence ready.</div>
  <section class="actions" aria-label="Cipher Cadence controls">
    <button class="btn primary" id="startBtn" type="button">Start</button>
    <button class="btn good" id="confirmBtn" type="button">Confirm</button>
    <button class="btn warn" id="restartBtn" type="button">Restart</button>
    <button class="btn" id="soundBtn" type="button" aria-pressed="true">Sound On</button>
    <button class="btn" id="fullBtn" type="button" aria-pressed="false">Fullscreen</button>
  </section>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const BEST_KEY = "cipher-cadence.best.v1";
  const SOUND_KEY = "cipher-cadence.sound.v1";
  const TARGET_PROGRESS = .72;
  const TIMING_WINDOW = .17;
  const START_X = 126;
  const PULSE_X = 742;
  const LANES = [156, 226, 296, 366];
  const STAGES = [
    { name: "Blue Key", phrase: ["FIND","THE","BLUE","KEY"], beats: 12, tempo: 900 },
    { name: "Night Relay", phrase: ["SEND","QUIET","WORDS","AT","DAWN"], beats: 15, tempo: 860 },
    { name: "Clock Room", phrase: ["TURN","THE","CLOCK","ON","BEAT"], beats: 15, tempo: 820 },
    { name: "Signal Hall", phrase: ["MATCH","EVERY","WORD","TO","PULSE"], beats: 16, tempo: 780 },
    { name: "Final Cipher", phrase: ["CARRY","THE","FINAL","CODE","HOME"], beats: 15, tempo: 740 }
  ];
  const DECOYS = ["TRACE","LOCK","GLOW","MAP","RAIL","TOKEN","VAULT","SILENT","NORTH","SPARK","RIVER","GATE","MORSE","LASER","PANEL","VAULT","DRIFT","SIGNAL","BRIDGE","NOON","SHIFT","HARBOR","LUMEN","ORBIT","STACK","FORGE"];
  const $ = (id) => document.getElementById(id);
  const els = {
    track: $("trackValue"), word: $("wordValue"), beat: $("beatValue"), integrity: $("integrityValue"), combo: $("comboValue"),
    score: $("scoreValue"), best: $("bestValue"), status: $("statusLine"), live: $("liveStatus"), choices: $("choiceRow"),
    start: $("startBtn"), confirm: $("confirmBtn"), restart: $("restartBtn"), sound: $("soundBtn"), full: $("fullBtn"), app: $("app")
  };
  function storage() { if (window.workshopStorage) return window.workshopStorage; try { return window.localStorage; } catch (_) { return null; } }
  function read(key, fallback) { const s = storage(); if (!s) return fallback; try { const value = s.getItem(key); return value == null ? fallback : value; } catch (_) { return fallback; } }
  function write(key, value) { const s = storage(); if (!s) return; try { s.setItem(key, String(value)); } catch (_) {} }
  const soundRaw = String(read(SOUND_KEY, "1")).toLowerCase();
  const state = {
    mode: "menu", trackIndex: 0, wordIndex: 0, beatIndex: 0, beatElapsed: 0, selectedLane: 0, integrity: 6,
    score: 0, combo: 0, bestScore: Number(read(BEST_KEY, "0")) || 0, soundEnabled: !["0","false","off","muted"].includes(soundRaw),
    feedback: "Start the cipher and catch the first word on beat.", feedbackMs: 2600, lastInput: "none", lastEvent: "ready",
    userGesture: false, toneCount: 0, lastSound: "none", time: 0, flashLane: -1, flashMs: 0, candidateButtons: [], raf: 0, lastFrame: 0
  };
  let audio = null;
  const stage = () => STAGES[state.trackIndex];
  const expectedWord = () => stage().phrase[Math.min(state.wordIndex, stage().phrase.length - 1)] || "DONE";
  function setFeedback(text, ms = 1800) {
    state.feedback = text;
    state.feedbackMs = ms;
    els.status.textContent = text;
    els.live.textContent = text;
  }
  function markInput(source, action) {
    state.userGesture = true;
    state.lastInput = source;
    state.lastEvent = action;
    if ((source === "touch" || source === "pen") && navigator.vibrate) {
      try { navigator.vibrate(8); } catch (_) {}
    }
  }
  function ensureAudio() {
    if (!state.soundEnabled || !state.userGesture) return null;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume().catch(() => {});
      return audio;
    } catch (_) {
      audio = null;
      return null;
    }
  }
  function tone(name) {
    state.lastSound = state.soundEnabled ? name : "muted-" + name;
    if (!state.soundEnabled) return;
    state.toneCount += 1;
    const ac = ensureAudio();
    if (!ac) return;
    const freq = { start: 320, select: 430, hit: 720, miss: 170, complete: 860, fail: 120, toggle: 390 }[name] || 420;
    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = name === "miss" || name === "fail" ? "sawtooth" : "triangle";
    osc.frequency.setValueAtTime(freq, now);
    if (name === "hit" || name === "complete") osc.frequency.linearRampToValueAtTime(freq + 180, now + .16);
    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(.05, now + .012);
    gain.gain.exponentialRampToValueAtTime(.0001, now + .22);
    osc.connect(gain).connect(ac.destination);
    osc.start(now);
    osc.stop(now + .25);
  }
  function saveBest() {
    if (state.score > state.bestScore) {
      state.bestScore = state.score;
      write(BEST_KEY, String(state.bestScore));
    }
  }
  function candidateSeed(lane, offset = 0) {
    return (state.trackIndex * 19 + state.wordIndex * 11 + state.beatIndex * 7 + lane * 5 + offset * 3) % DECOYS.length;
  }
  function currentCandidates() {
    const expected = expectedWord();
    const correctLane = (state.trackIndex * 3 + state.wordIndex + state.beatIndex * 2) % 4;
    const used = new Set([expected]);
    const phraseWords = new Set(stage().phrase);
    return [0,1,2,3].map((lane) => {
      let word = expected;
      if (lane !== correctLane) {
        for (let offset = 0; offset < DECOYS.length; offset++) {
          const pick = DECOYS[candidateSeed(lane, offset)];
          if (!used.has(pick) && !phraseWords.has(pick)) {
            word = pick;
            break;
          }
        }
      }
      used.add(word);
      return { lane, word, isExpected: lane === correctLane };
    });
  }
  function progress() {
    if (state.mode !== "playing") return 0;
    return Math.max(0, Math.min(1, state.beatElapsed / stage().tempo));
  }
  function timingLabel(delta) {
    if (Math.abs(delta) <= TIMING_WINDOW) return "on-beat";
    return delta < 0 ? "early" : "late";
  }
  function beatsLeft() {
    return Math.max(0, stage().beats - state.beatIndex);
  }
  function buildChoices() {
    els.choices.textContent = "";
    state.candidateButtons = [0,1,2,3].map((lane) => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.type = "button";
      btn.dataset.lane = String(lane);
      btn.addEventListener("click", (event) => {
        selectLane(lane, event.pointerType === "mouse" ? "pointer" : event.pointerType || "button");
      });
      els.choices.appendChild(btn);
      return btn;
    });
  }
  function syncHud() {
    const st = stage();
    els.track.textContent = (state.trackIndex + 1) + "/" + STAGES.length;
    els.word.textContent = Math.min(state.wordIndex + 1, st.phrase.length) + "/" + st.phrase.length;
    els.beat.textContent = String(beatsLeft());
    els.integrity.textContent = String(state.integrity);
    els.combo.textContent = String(state.combo);
    els.score.textContent = String(state.score);
    els.best.textContent = String(Math.max(state.bestScore, state.score));
    const candidates = currentCandidates();
    state.candidateButtons.forEach((btn, lane) => {
      const item = candidates[lane];
      btn.innerHTML = '<span class="num">' + (lane + 1) + '</span>' + item.word;
      btn.disabled = state.mode !== "playing";
      btn.setAttribute("aria-pressed", String(lane === state.selectedLane));
      btn.setAttribute("aria-label", "Lane " + (lane + 1) + ": " + item.word);
    });
    els.start.textContent = state.mode === "menu" ? "Start" : state.mode === "track-complete" ? "Next Track" : state.mode === "run-complete" ? "New Run" : state.mode === "failed" ? "Retry" : "Playing";
    els.start.disabled = state.mode === "playing";
    els.confirm.disabled = state.mode !== "playing";
    els.sound.textContent = state.soundEnabled ? "Sound On" : "Sound Off";
    els.sound.setAttribute("aria-pressed", String(state.soundEnabled));
    const full = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    els.full.textContent = full ? "Exit Fullscreen" : "Fullscreen";
    els.full.setAttribute("aria-pressed", String(full));
  }
  function startRun(source = "button") {
    markInput(source, "start");
    state.trackIndex = 0;
    state.score = 0;
    state.combo = 0;
    state.integrity = 6;
    beginTrack(0, false);
    tone("start");
  }
  function beginTrack(index, keepScore = true) {
    state.trackIndex = Math.max(0, Math.min(STAGES.length - 1, index));
    state.wordIndex = 0;
    state.beatIndex = 0;
    state.beatElapsed = 0;
    state.selectedLane = (state.trackIndex + 1) % 4;
    state.mode = "playing";
    state.flashLane = -1;
    if (!keepScore) {
      state.score = 0;
      state.combo = 0;
    }
    setFeedback(stage().name + ": catch " + expectedWord() + " on the pulse.", 2400);
    syncHud();
    render();
  }
  function restartRun(source = "button") {
    markInput(source, "restart");
    state.score = 0;
    state.combo = 0;
    state.integrity = 6;
    beginTrack(0, false);
    tone("start");
  }
  function nextTrack(source = "button") {
    markInput(source, "next");
    if (state.mode === "run-complete" || state.mode === "failed" || state.mode === "menu") {
      startRun(source);
      return;
    }
    if (state.mode !== "track-complete") return;
    beginTrack(state.trackIndex + 1, true);
    tone("start");
  }
  function selectLane(lane, source = "keyboard") {
    if (state.mode !== "playing") return;
    markInput(source, "select");
    state.selectedLane = Math.max(0, Math.min(3, lane));
    setFeedback("Lane " + (state.selectedLane + 1) + " selected.", 900);
    tone("select");
    syncHud();
    render();
  }
  function spendIntegrity(reason) {
    state.integrity = Math.max(0, state.integrity - 1);
    state.combo = 0;
    if (state.integrity <= 0) {
      state.mode = "failed";
      saveBest();
      setFeedback("Cipher collapsed after " + reason + ". Restart the run.", 3600);
      tone("fail");
      return true;
    }
    return false;
  }
  function advanceBeat(afterEvent) {
    state.beatIndex += 1;
    state.beatElapsed = 0;
    if (state.mode !== "playing") return;
    if (state.beatIndex >= stage().beats) {
      state.mode = "failed";
      saveBest();
      setFeedback("Beat budget expired. Restart the run.", 3200);
      tone("fail");
      return;
    }
    if (!afterEvent) {
      setFeedback("Next beat: catch " + expectedWord() + ".", 1200);
    }
  }
  function completeTrack() {
    const trackBonus = 420 + beatsLeft() * 35 + state.integrity * 30 + state.combo * 20;
    state.score += trackBonus;
    saveBest();
    if (state.trackIndex >= STAGES.length - 1) {
      state.mode = "run-complete";
      setFeedback("All cipher tracks decoded. Score " + state.score + ".", 4200);
      state.lastEvent = "run-complete";
    } else {
      state.mode = "track-complete";
      setFeedback(stage().name + " decoded. +" + trackBonus + " points.", 3400);
      state.lastEvent = "track-complete";
    }
    tone("complete");
  }
  function confirmLane(source = "keyboard") {
    if (state.mode === "menu" || state.mode === "failed" || state.mode === "run-complete") {
      startRun(source);
      return;
    }
    if (state.mode === "track-complete") {
      nextTrack(source);
      return;
    }
    if (state.mode !== "playing") return;
    markInput(source, "confirm");
    const items = currentCandidates();
    const picked = items[state.selectedLane];
    const delta = progress() - TARGET_PROGRESS;
    const timing = timingLabel(delta);
    state.flashLane = state.selectedLane;
    state.flashMs = 240;
    if (!picked || picked.word !== expectedWord()) {
      state.lastEvent = "wrong-word";
      if (!spendIntegrity("a wrong word")) {
        setFeedback(picked.word + " is not next. Catch " + expectedWord() + ".", 1600);
        tone("miss");
        advanceBeat(true);
      }
      syncHud();
      render();
      return;
    }
    if (Math.abs(delta) > TIMING_WINDOW) {
      state.lastEvent = timing;
      if (!spendIntegrity(timing + " timing")) {
        setFeedback(timing === "early" ? "Too early. Hold for the pulse." : "Too late. Catch the word sooner.", 1600);
        tone("miss");
        advanceBeat(true);
      }
      syncHud();
      render();
      return;
    }
    const bonus = Math.round(130 + state.combo * 18 + (TIMING_WINDOW - Math.abs(delta)) * 260);
    state.score += bonus;
    state.combo += 1;
    state.wordIndex += 1;
    state.lastEvent = "hit";
    setFeedback("Decoded " + picked.word + ". +" + bonus + " points.", 1300);
    tone("hit");
    if (state.wordIndex >= stage().phrase.length) {
      completeTrack();
    } else {
      advanceBeat(true);
    }
    saveBest();
    syncHud();
    render();
  }
  function missBeat() {
    if (state.mode !== "playing") return;
    state.lastEvent = "miss";
    if (!spendIntegrity("a missed beat")) {
      setFeedback("Missed " + expectedWord() + ". Stay with the cadence.", 1500);
      tone("miss");
      advanceBeat(true);
    }
  }
  function toggleSound(source = "button") {
    markInput(source, "sound");
    state.soundEnabled = !state.soundEnabled;
    write(SOUND_KEY, state.soundEnabled ? "1" : "0");
    tone("toggle");
    setFeedback(state.soundEnabled ? "Sound on." : "Sound off.", 1000);
    syncHud();
  }
  function toggleFullscreen(source = "button") {
    markInput(source, "fullscreen");
    const active = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (active) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (els.app.requestFullscreen || els.app.webkitRequestFullscreen).call(els.app);
      }
    } catch (_) {
      setFeedback("Fullscreen is not available in this browser.", 1600);
    }
    syncHud();
    setTimeout(() => { syncHud(); render(); }, 120);
  }
  function update(ms) {
    const dt = Math.max(0, Math.min(120, Number(ms) || 0));
    state.time += dt;
    if (state.feedbackMs > 0) state.feedbackMs = Math.max(0, state.feedbackMs - dt);
    if (state.flashMs > 0) state.flashMs = Math.max(0, state.flashMs - dt);
    if (state.mode === "playing") {
      state.beatElapsed += dt;
      while (state.mode === "playing" && state.beatElapsed >= stage().tempo) {
        state.beatElapsed -= stage().tempo;
        missBeat();
      }
    }
  }
  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
  }
  function fitText(text, x, y, maxWidth, size, color, align = "center") {
    let fontSize = size;
    ctx.textAlign = align;
    ctx.fillStyle = color;
    do {
      ctx.font = "950 " + fontSize + "px system-ui,-apple-system,Segoe UI,sans-serif";
      if (ctx.measureText(text).width <= maxWidth || fontSize <= 11) break;
      fontSize -= 1;
    } while (fontSize > 11);
    ctx.fillText(text, x, y);
  }
  function render() {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#081a25");
    bg.addColorStop(1, "#050916");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(125,211,252,.09)";
    ctx.lineWidth = 1;
    for (let x = 48; x < W; x += 52) { ctx.beginPath(); ctx.moveTo(x, 84); ctx.lineTo(x - 80, H); ctx.stroke(); }
    ctx.fillStyle = "#5eead4";
    ctx.font = "950 23px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Cipher Cadence", 34, 44);
    ctx.fillStyle = "#9db7c9";
    ctx.font = "750 13px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.fillText(stage().name + " - " + stage().phrase.join(" "), 34, 66);
    ctx.fillStyle = "rgba(7,16,28,.7)";
    ctx.strokeStyle = "rgba(125,211,252,.26)";
    ctx.lineWidth = 2;
    roundRect(44, 86, W - 88, 58, 12, true, true);
    const phrase = stage().phrase;
    const tokenGap = 8;
    const tokenW = Math.min(128, Math.floor((W - 128 - tokenGap * (phrase.length - 1)) / phrase.length));
    const start = Math.round((W - phrase.length * tokenW - (phrase.length - 1) * tokenGap) / 2);
    for (let i = 0; i < phrase.length; i++) {
      const done = i < state.wordIndex;
      const current = i === state.wordIndex && state.mode === "playing";
      ctx.fillStyle = done ? "rgba(134,239,172,.24)" : current ? "rgba(255,209,102,.24)" : "rgba(125,211,252,.12)";
      ctx.strokeStyle = done ? "#86efac" : current ? "#ffd166" : "rgba(125,211,252,.28)";
      roundRect(start + i * (tokenW + tokenGap), 101, tokenW, 28, 8, true, true);
      fitText(phrase[i], start + i * (tokenW + tokenGap) + tokenW / 2, 121, tokenW - 12, 14, done ? "#d7ffe7" : "#f5fbff");
    }
    ctx.strokeStyle = "rgba(255,209,102,.78)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(PULSE_X, 142);
    ctx.lineTo(PULSE_X, 414);
    ctx.stroke();
    ctx.fillStyle = "#ffd166";
    ctx.font = "950 12px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("PULSE", PULSE_X, 432);
    const p = progress();
    const x = START_X + (PULSE_X - START_X) * Math.min(1.18, p / TARGET_PROGRESS);
    const candidates = currentCandidates();
    for (let lane = 0; lane < 4; lane++) {
      const y = LANES[lane];
      ctx.strokeStyle = lane === state.selectedLane ? "rgba(255,209,102,.88)" : "rgba(125,211,252,.24)";
      ctx.lineWidth = lane === state.selectedLane ? 4 : 2;
      ctx.beginPath();
      ctx.moveTo(80, y);
      ctx.lineTo(W - 80, y);
      ctx.stroke();
      ctx.fillStyle = lane === state.selectedLane ? "#ffd166" : "#7dd3fc";
      ctx.font = "950 13px system-ui,-apple-system,Segoe UI,sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("LANE " + (lane + 1), 40, y + 5);
      if (state.mode === "playing") {
        const item = candidates[lane];
        const w = 156;
        const h = 42;
        const tileX = Math.max(88, Math.min(W - 250, x - w / 2));
        const pulseDistance = Math.abs(p - TARGET_PROGRESS);
        const selected = lane === state.selectedLane;
        const flash = lane === state.flashLane && state.flashMs > 0;
        const grad = ctx.createLinearGradient(tileX, y - h / 2, tileX, y + h / 2);
        grad.addColorStop(0, flash ? "#2a5160" : selected ? "#19455a" : "#132d42");
        grad.addColorStop(1, flash ? "#14313d" : selected ? "#0e3141" : "#0b1d2d");
        ctx.fillStyle = grad;
        ctx.strokeStyle = selected ? "#ffd166" : item.isExpected && pulseDistance <= TIMING_WINDOW ? "#86efac" : "rgba(125,211,252,.42)";
        ctx.lineWidth = selected ? 4 : 2;
        ctx.shadowColor = selected ? "rgba(255,209,102,.35)" : "transparent";
        ctx.shadowBlur = selected ? 16 : 0;
        roundRect(tileX, y - h / 2, w, h, 12, true, true);
        ctx.shadowBlur = 0;
        fitText(item.word, tileX + w / 2, y + 7, w - 20, 21, "#f5fbff");
      }
    }
    const meterX = 112, meterY = 462, meterW = W - 224, meterH = 18;
    ctx.fillStyle = "rgba(7,16,28,.8)";
    ctx.strokeStyle = "rgba(125,211,252,.28)";
    roundRect(meterX, meterY, meterW, meterH, 9, true, true);
    ctx.fillStyle = "#5eead4";
    roundRect(meterX, meterY, Math.max(8, meterW * Math.min(1, p)), meterH, 9, true, false);
    const winX = meterX + meterW * TARGET_PROGRESS;
    ctx.fillStyle = "rgba(255,209,102,.28)";
    ctx.fillRect(winX - meterW * TIMING_WINDOW, meterY, meterW * TIMING_WINDOW * 2, meterH);
    ctx.fillStyle = state.mode === "failed" ? "#fb7185" : state.mode === "run-complete" || state.mode === "track-complete" ? "#86efac" : "#ffd166";
    ctx.font = "950 24px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.textAlign = "center";
    const banner = state.mode === "menu" ? "READY TO DECODE" : state.mode === "failed" ? "CIPHER COLLAPSED" : state.mode === "run-complete" ? "RUN DECODED" : state.mode === "track-complete" ? "TRACK DECODED" : "NEXT WORD: " + expectedWord();
    ctx.fillText(banner, W / 2, 505);
    ctx.fillStyle = "#9db7c9";
    ctx.font = "800 13px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.fillText(state.feedback, W / 2, 528);
    ctx.textAlign = "left";
  }
  function laneFromPointer(event) {
    const rect = canvas.getBoundingClientRect();
    const y = (event.clientY - rect.top) * (canvas.height / rect.height);
    let best = 0;
    let distance = Infinity;
    for (let i = 0; i < LANES.length; i++) {
      const d = Math.abs(y - LANES[i]);
      if (d < distance) { distance = d; best = i; }
    }
    return best;
  }
  function frame(now) {
    if (!state.lastFrame) state.lastFrame = now;
    const delta = now - state.lastFrame;
    state.lastFrame = now;
    update(delta);
    syncHud();
    render();
    state.raf = requestAnimationFrame(frame);
  }
  window.advanceTime = (ms) => {
    const total = Math.max(0, Number(ms) || 0);
    const steps = Math.max(1, Math.ceil(total / 40));
    for (let i = 0; i < steps; i++) update(total / steps);
    syncHud();
    render();
    return window.render_game_to_text();
  };
  window.render_game_to_text = function render_game_to_text() {
    const st = stage();
    const p = progress();
    const delta = p - TARGET_PROGRESS;
    const candidates = currentCandidates().map((item) => ({
      lane: item.lane + 1,
      word: item.word,
      isExpected: item.isExpected,
      selected: item.lane === state.selectedLane,
      progress: Number(p.toFixed(3)),
      timingDelta: Number(delta.toFixed(3)),
      timing: timingLabel(delta)
    }));
    return JSON.stringify({
      title: "Cipher Cadence",
      mode: state.mode,
      trackIndex: state.trackIndex,
      trackName: st.name,
      phrase: st.phrase.slice(),
      expectedWord: expectedWord(),
      wordIndex: state.wordIndex,
      beatIndex: state.beatIndex,
      beatsLeft: beatsLeft(),
      selectedLane: state.selectedLane + 1,
      visibleWords: candidates,
      timingWindow: { targetProgress: TARGET_PROGRESS, window: TIMING_WINDOW, progress: Number(p.toFixed(3)), msUntilPulse: Math.round((TARGET_PROGRESS - p) * st.tempo) },
      score: state.score,
      combo: state.combo,
      integrity: state.integrity,
      bestScore: Math.max(state.bestScore, state.score),
      soundEnabled: state.soundEnabled,
      lastSound: state.lastSound,
      toneCount: state.toneCount,
      feedback: state.feedback,
      feedbackActive: state.feedbackMs > 0,
      lastInput: state.lastInput,
      lastEvent: state.lastEvent,
      coordinateSystem: "Canvas coordinates use origin at top-left, x increases right, y increases down. Four word lanes are numbered top to bottom; confirm when the selected word reaches the vertical pulse line."
    });
  };
  document.addEventListener("keydown", (event) => {
    const target = event.target;
    if (target && /^(input|select|textarea)$/i.test(target.tagName || "")) return;
    const key = event.key;
    const lower = key.toLowerCase();
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","Enter"].includes(key) || /^[1-4]$/.test(key) || ["r","m","f"].includes(lower)) event.preventDefault();
    if (/^[1-4]$/.test(key)) selectLane(Number(key) - 1);
    else if (key === "ArrowUp" || key === "ArrowLeft") selectLane((state.selectedLane + 3) % 4);
    else if (key === "ArrowDown" || key === "ArrowRight") selectLane((state.selectedLane + 1) % 4);
    else if (key === " " || key === "Enter") confirmLane("keyboard");
    else if (lower === "r") restartRun("keyboard");
    else if (lower === "m") toggleSound("keyboard");
    else if (lower === "f") toggleFullscreen("keyboard");
  });
  canvas.addEventListener("pointerdown", (event) => {
    canvas.focus();
    selectLane(laneFromPointer(event), event.pointerType === "mouse" ? "pointer" : event.pointerType || "touch");
  });
  els.start.addEventListener("click", () => nextTrack("button"));
  els.confirm.addEventListener("click", () => confirmLane("button"));
  els.restart.addEventListener("click", () => restartRun("button"));
  els.sound.addEventListener("click", () => toggleSound("button"));
  els.full.addEventListener("click", () => toggleFullscreen("button"));
  document.addEventListener("fullscreenchange", syncHud);
  document.addEventListener("webkitfullscreenchange", syncHud);
  buildChoices();
  syncHud();
  render();
  state.raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
