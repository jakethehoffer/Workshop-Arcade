<div class="brand"><span class="eyebrow">Workshop Arcade</span><span class="title">Dungeon Circuit</span></div>
<main class="panel" aria-label="Dungeon Circuit game"><div class="hud"><div class="pill"><span class="label">Floor</span><span class="value" id="floorValue">1/5</span></div><div class="pill"><span class="label">HP</span><span class="value" id="hpValue">8</span></div><div class="pill"><span class="label">Energy</span><span class="value" id="energyValue">6</span></div><div class="pill"><span class="label">Score</span><span class="value" id="scoreValue">0</span></div><div class="pill"><span class="label">Best</span><span class="value" id="bestValue">0</span></div></div><div class="stage"><canvas id="game" width="720" height="720" tabindex="0" aria-label="Turn based dungeon grid. Use arrow keys or direction buttons to move, fight, collect pickups, and reach stairs."></canvas></div><div class="status" id="statusLine" aria-live="polite">Reach the exit circuit on floor five.</div><div class="toolbar"><button class="btn primary" id="newBtn" type="button">New Run</button><button class="btn" id="soundBtn" type="button" aria-pressed="true">Sound On</button></div><div class="pad" aria-label="Touch movement"><button class="btn dir" data-move="0,-1" type="button">Up</button><button class="btn dir" data-move="-1,0" type="button">Left</button><button class="btn dir" data-move="1,0" type="button">Right</button><button class="btn dir" data-move="0,1" type="button">Down</button></div><div class="help">Arrows or WASD move. Step into enemies to strike (costs energy — recharge by moving). Pickups restore HP or energy.</div></main>
<script>
(()=>{"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),els={floor:document.getElementById("floorValue"),hp:document.getElementById("hpValue"),energy:document.getElementById("energyValue"),score:document.getElementById("scoreValue"),best:document.getElementById("bestValue"),status:document.getElementById("statusLine"),sound:document.getElementById("soundBtn")};
const W=10,H=10,bestKey="dungeon-circuit.best.v1",soundKey="dungeon-circuit.sound.v1",safe={get(k,d){try{return JSON.parse(localStorage.getItem(k)??JSON.stringify(d))}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let audioCtx=null,lastSound="none";const state={mode:"ready",floor:1,turn:0,hp:8,energy:6,score:0,best:safe.get(bestKey,0),player:{x:1,y:1},exit:{x:8,y:8},walls:new Set(),enemies:[],pickups:[],feedback:"ready",feedbackMs:0,soundEnabled:safe.get(soundKey,true),gameOver:false,runComplete:false,lastAction:"none"};
function key(x,y){return x+","+y}function ensureAudio(){if(!state.soundEnabled||audioCtx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audioCtx=new AC()}catch{}}function tone(name){lastSound=state.soundEnabled?name:`muted-${name}`;if(!state.soundEnabled)return;ensureAudio();if(!audioCtx)return;const map={move:260,hit:170,loot:620,stairs:420,win:760,loss:110,wall:140,start:340},now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=name==="hit"||name==="wall"?"sawtooth":"triangle";o.frequency.setValueAtTime(map[name]||300,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.055,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.16);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+.18)}
function seeded(n){let x=(state.floor*928371+n*741103)>>>0;x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}
function generateFloor(){state.player={x:1,y:1};state.exit={x:8,y:8};state.walls=new Set();for(let x=0;x<W;x++){state.walls.add(key(x,0));state.walls.add(key(x,H-1))}for(let y=0;y<H;y++){state.walls.add(key(0,y));state.walls.add(key(W-1,y))}for(let i=0;i<10+state.floor;i++){const x=2+Math.floor(seeded(i)*6),y=1+Math.floor(seeded(i+20)*8);if((x<=2&&y<=2)||(x>=7&&y>=7))continue;state.walls.add(key(x,y))}state.enemies=[];for(let i=0;i<2+state.floor;i++){const x=2+Math.floor(seeded(i+40)*7),y=1+Math.floor(seeded(i+60)*8);if(state.walls.has(key(x,y))||key(x,y)===key(8,8))continue;state.enemies.push({id:i,x,y,hp:2+Math.floor(state.floor/2),kind:i%2?"spark":"guard"})}state.pickups=[{x:3,y:2,type:"energy"},{x:6,y:6,type:"hp"},{x:2+state.floor%4,y:7,type:"coin"}].filter(p=>!state.walls.has(key(p.x,p.y)));state.feedback=`floor ${state.floor}`;state.feedbackMs=700}
function startRun(){state.mode="playing";state.floor=1;state.turn=0;state.hp=8;state.energy=6;state.score=0;state.gameOver=false;state.runComplete=false;state.lastAction="start";generateFloor();tone("start");render()}
function enemyAt(x,y){return state.enemies.find(e=>e.x===x&&e.y===y)}function pickupAt(x,y){return state.pickups.find(p=>p.x===x&&p.y===y)}
function move(dx,dy){if(state.mode!=="playing"){startRun();return}if(state.gameOver||state.runComplete)return;canvas.focus();const nx=state.player.x+dx,ny=state.player.y+dy;if(state.walls.has(key(nx,ny))){state.feedback="wall";state.feedbackMs=360;state.lastAction="wall";tone("wall");render();return}const enemy=enemyAt(nx,ny);if(enemy){if(state.energy<=0){state.feedback="No energy — move to recharge";state.feedbackMs=520;state.lastAction="no-energy";tone("wall");render();return}enemy.hp-=2;state.energy=Math.max(0,state.energy-1);state.hp-=enemy.hp>0?1:0;state.score+=enemy.hp<=0?120:35;state.feedback=enemy.hp<=0?"enemy down":"clash";state.lastAction="combat";state.feedbackMs=620;tone("hit");state.enemies=state.enemies.filter(e=>e.hp>0);afterTurn();return}state.player={x:nx,y:ny};state.energy=Math.min(8,state.energy+1);state.turn++;state.lastAction="move";state.feedback="move";tone("move");const pickup=pickupAt(nx,ny);if(pickup){if(pickup.type==="hp")state.hp=Math.min(10,state.hp+2);if(pickup.type==="energy")state.energy=Math.min(10,state.energy+3);if(pickup.type==="coin")state.score+=200;state.pickups=state.pickups.filter(p=>p!==pickup);state.feedback=`${pickup.type} pickup`;state.feedbackMs=640;tone("loot")}if(nx===state.exit.x&&ny===state.exit.y){state.score+=500+state.floor*100;state.floor++;if(state.floor>5){state.runComplete=true;state.gameOver=true;state.mode="complete";state.best=Math.max(state.best,state.score);safe.set(bestKey,state.best);state.feedback="circuit cleared";state.feedbackMs=1200;tone("win")}else{tone("stairs");generateFloor()}}afterTurn()}
function afterTurn(){for(const e of state.enemies){const dist=Math.abs(e.x-state.player.x)+Math.abs(e.y-state.player.y);if(dist===1){state.hp--;state.feedback="ambushed";state.feedbackMs=680;tone("hit")}else if(dist<5&&state.turn%2===0){const dx=Math.sign(state.player.x-e.x),dy=Math.sign(state.player.y-e.y),ax=Math.abs(state.player.x-e.x)>Math.abs(state.player.y-e.y)?dx:0,ay=ax?0:dy,nx=e.x+ax,ny=e.y+ay;if(!state.walls.has(key(nx,ny))&&!enemyAt(nx,ny)&&key(nx,ny)!==key(state.player.x,state.player.y)){e.x=nx;e.y=ny}}}if(state.hp<=0){state.hp=0;state.mode="game-over";state.gameOver=true;state.best=Math.max(state.best,state.score);safe.set(bestKey,state.best);state.feedback="core lost";state.feedbackMs=1200;tone("loss")}render()}
function nearestTarget(){const opts=[...state.pickups.map(p=>({...p,kind:"pickup"})),...state.enemies.map(e=>({...e,kind:"enemy"})),{...state.exit,kind:"exit"}];opts.sort((a,b)=>Math.abs(a.x-state.player.x)+Math.abs(a.y-state.player.y)-Math.abs(b.x-state.player.x)-Math.abs(b.y-state.player.y));return opts[0]||null}
function render(){els.floor.textContent=Math.min(state.floor,5)+"/5";els.hp.textContent=state.hp;els.energy.textContent=state.energy;els.score.textContent=state.score;els.best.textContent=state.best;els.status.textContent=state.feedback;els.sound.textContent=state.soundEnabled?"Sound On":"Sound Off";els.sound.setAttribute("aria-pressed",String(state.soundEnabled));ctx.clearRect(0,0,720,720);const g=ctx.createLinearGradient(0,0,720,720);g.addColorStop(0,"#07101a");g.addColorStop(1,"#101827");ctx.fillStyle=g;ctx.fillRect(0,0,720,720);ctx.strokeStyle="rgba(94,234,212,.13)";for(let i=0;i<16;i++){ctx.beginPath();ctx.moveTo(0,i*48);ctx.lineTo(720,i*48-120);ctx.stroke()}const p=44,cell=(720-p*2)/W;for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=state.walls.has(key(x,y))?"#132033":"rgba(15,23,42,.78)";ctx.strokeStyle="rgba(94,234,212,.14)";round(p+x*cell+3,p+y*cell+3,cell-6,cell-6,8,true,true)}drawToken(state.exit.x,state.exit.y,"#fbbf24","stairs");for(const pck of state.pickups)drawToken(pck.x,pck.y,pck.type==="hp"?"#f472b6":pck.type==="energy"?"#22d3ee":"#84cc16","pickup");for(const e of state.enemies)drawToken(e.x,e.y,e.kind==="spark"?"#a78bfa":"#fb7185","enemy");drawToken(state.player.x,state.player.y,"#5eead4","player");if(state.gameOver){ctx.fillStyle="rgba(3,7,18,.72)";ctx.fillRect(0,0,720,720);ctx.fillStyle="#f8fbff";ctx.font="900 36px system-ui";ctx.textAlign="center";ctx.fillText(state.runComplete?"CIRCUIT CLEARED":"RUN ENDED",360,350);ctx.fillStyle="#5eead4";ctx.font="900 20px system-ui";ctx.fillText(`Score ${state.score}`,360,388)}function drawToken(x,y,color,type){const cx=p+x*cell+cell/2,cy=p+y*cell+cell/2;ctx.save();ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillStyle=color;if(type==="player"){ctx.beginPath();ctx.arc(cx,cy,cell*.28,0,Math.PI*2);ctx.fill();ctx.fillStyle="#041016";ctx.fillRect(cx-5,cy-5,10,10)}else if(type==="enemy"){ctx.beginPath();ctx.moveTo(cx,cy-cell*.28);ctx.lineTo(cx+cell*.28,cy+cell*.22);ctx.lineTo(cx-cell*.28,cy+cell*.22);ctx.closePath();ctx.fill()}else if(type==="stairs"){ctx.strokeStyle=color;ctx.lineWidth=4;ctx.strokeRect(cx-cell*.23,cy-cell*.23,cell*.46,cell*.46);ctx.beginPath();ctx.moveTo(cx-cell*.23,cy);ctx.lineTo(cx+cell*.23,cy);ctx.stroke()}else{ctx.beginPath();ctx.roundRect(cx-cell*.18,cy-cell*.18,cell*.36,cell*.36,6);ctx.fill()}ctx.restore()}}
function round(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill)ctx.fill();if(stroke)ctx.stroke()}
const keyMap={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
window.addEventListener("keydown",e=>{if(keyMap[e.key]){e.preventDefault();move(...keyMap[e.key])}else if(e.key==="r"||e.key==="R"){e.preventDefault();startRun()}});
document.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>move(...b.dataset.move.split(",").map(Number))));document.getElementById("newBtn").addEventListener("click",startRun);els.sound.addEventListener("click",()=>{state.soundEnabled=!state.soundEnabled;safe.set(soundKey,state.soundEnabled);tone("start");render()});
window.advanceTime=function(ms){let left=Math.max(0,Number(ms)||0);while(left>0){const dt=Math.min(1000/60,left);state.feedbackMs=Math.max(0,state.feedbackMs-dt);left-=dt}render();return renderGameToText()};
function renderGameToText(){return JSON.stringify({mode:state.mode,floor:state.floor,depth:state.floor,hp:state.hp,energy:state.energy,score:state.score,best:state.best,player:state.player,enemies:state.enemies,pickups:state.pickups,exit:state.exit,nextTarget:nearestTarget(),turn:state.turn,lastAction:state.lastAction,feedback:state.feedback,feedbackActive:state.feedbackMs>0,soundEnabled:state.soundEnabled,lastSound,gameOver:state.gameOver,runComplete:state.runComplete})}

})();
</script>
<script>
(()=>{
  const fullShortcutLabel = "F";
  const editable = (el) => el && (el.closest?.('input,textarea,select,button,[contenteditable="true"]') || el.isContentEditable);
  const active = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  const root = () => document.querySelector('.stage') || document.documentElement;
  let created = false;
  let button = document.getElementById('fullBtn') || document.querySelector('[data-fullscreen-control]');
  if (!button) {
    button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn wa-game-fullscreen';
    button.dataset.fullscreenControl = 'true';
    const host = document.querySelector('.toolbar,.controls,.actions,.topbar,header,main') || document.body;
    host.appendChild(button);
    created = true;
  }
  button.setAttribute('aria-label', 'Toggle game fullscreen');
  function sync(){
    const isActive = active();
    button.textContent = isActive ? 'Exit Fullscreen' : 'Fullscreen';
    button.title = isActive ? 'Exit fullscreen' : 'Enter fullscreen (' + fullShortcutLabel + ')';
    button.setAttribute('aria-pressed', String(isActive));
  }
  function toggle(){
    if (active()) {
      (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
    } else {
      const target = root();
      (target.requestFullscreen || target.webkitRequestFullscreen)?.call(target);
    }
    setTimeout(sync, 0);
  }
  button.addEventListener('keydown', (event) => {
    if (event.key === ' ' || event.key === 'Enter') event.stopPropagation();
  });
  if (created) button.addEventListener('click', toggle);
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  window.addEventListener('keydown', (event) => {
    if (event.defaultPrevented || editable(event.target)) return;
    const wants = event.key && event.key.toLowerCase() === 'f' && !event.shiftKey && !event.ctrlKey && !event.altKey && !event.metaKey;
    if (!wants) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    toggle();
  }, true);
  const previousRenderGameToText = window.render_game_to_text;
  if (typeof previousRenderGameToText === 'function') {
    window.render_game_to_text = function render_game_to_text_with_fullscreen(){
      const raw = previousRenderGameToText();
      try {
        const data = JSON.parse(String(raw));
        data.fullscreenActive = active();
        data.fullscreenShortcut = fullShortcutLabel;
        return JSON.stringify(data);
      } catch {
        return raw;
      }
    };
  }
  sync();
})();
</script>
