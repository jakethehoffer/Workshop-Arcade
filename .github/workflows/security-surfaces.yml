name: Security Surfaces

on:
  push:
    branches: [main]
  schedule:
    # Mondays at 12:30 UTC, after the weekly CodeQL schedule starts.
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  github-security-settings:
    name: GitHub security settings
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check GitHub-native security surfaces with maintainer token
        if: ${{ secrets.SECURITY_SURFACES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.SECURITY_SURFACES_TOKEN }}
          WORKSHOP_ARCADE_REPO: ${{ github.repository }}
        run: npm run test:github-security-settings

      - name: Probe GitHub-native security surfaces with GITHUB_TOKEN
        id: github-token-probe
        if: ${{ secrets.SECURITY_SURFACES_TOKEN == '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKSHOP_ARCADE_REPO: ${{ github.repository }}
        run: npm run test:github-security-settings

      - name: Record GITHUB_TOKEN limitation
        if: ${{ secrets.SECURITY_SURFACES_TOKEN == '' && steps.github-token-probe.outcome != 'success' }}
        run: |
          echo "::warning title=GitHub security settings token limitation::GITHUB_TOKEN cannot query all repository-native security endpoints in this repo. Configure a SECURITY_SURFACES_TOKEN repository secret with the required read permissions to make Security Surfaces a strict remote gate. The local npm run test:github-security-settings command remains strict."
