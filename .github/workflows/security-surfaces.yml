name: Security Surfaces

on:
  push:
    branches: [main]
  schedule:
    # Mondays at 12:30 UTC, after the weekly CodeQL schedule starts.
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  github-security-settings:
    name: GitHub security settings
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check GitHub-native security surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          WORKSHOP_ARCADE_REPO: ${{ github.repository }}
        run: npm run test:github-security-settings
