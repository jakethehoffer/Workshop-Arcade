name: Workshop Draft PR

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Workshop-request issue number to scaffold a draft PR for
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft-pr:
    name: Scaffold draft PR for workshop request
    runs-on: ubuntu-latest

    steps:
      - name: Resolve issue and scaffold draft PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issueNumber = parseInt(core.getInput('issue_number') || context.payload.inputs?.issue_number || '', 10);
            if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
              core.setFailed('issue_number must be a positive integer.');
              return;
            }

            let issue;
            try {
              const r = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              issue = r.data;
            } catch (err) {
              core.setFailed('Issue #' + issueNumber + ' not found: ' + (err.message || err.status));
              return;
            }
            if (issue.pull_request) {
              core.setFailed('#' + issueNumber + ' is a pull request, not an issue.');
              return;
            }
            if (issue.state !== 'open') {
              core.setFailed('Issue #' + issueNumber + ' is ' + issue.state + '. Re-open it before scaffolding a draft PR.');
              return;
            }
            const hasLabel = (issue.labels || []).some((l) => (typeof l === 'string' ? l : l.name) === 'workshop-request');
            if (!hasLabel) {
              core.setFailed('Issue #' + issueNumber + ' is not labeled workshop-request. The triage workflow should add it automatically when the issue is opened.');
              return;
            }

            const branch = 'codex/workshop-' + issueNumber;
            const ref = 'heads/' + branch;

            // Check if the branch already exists (idempotent re-run).
            let existingRef = null;
            try {
              const r = await github.rest.git.getRef({ owner, repo, ref });
              existingRef = r.data;
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            // Look for an existing PR from this branch as well.
            const pulls = await github.rest.pulls.list({
              owner, repo, head: owner + ':' + branch, state: 'all', per_page: 10
            });
            const existingPr = pulls.data[0] || null;

            if (existingRef && existingPr) {
              core.info('Branch and PR already exist: ' + existingPr.html_url);
              core.setOutput('pr_url', existingPr.html_url);
              return;
            }

            // Resolve current main SHA + tree.
            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const mainSha = mainRef.data.object.sha;
            const mainCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: mainSha });

            // Create the branch off of main if it does not already exist.
            if (!existingRef) {
              await github.rest.git.createRef({
                owner, repo,
                ref: 'refs/heads/' + branch,
                sha: mainSha
              });
              // Empty placeholder commit so the branch is distinct from main
              // (GitHub requires non-zero commits ahead of base to open a PR).
              const newCommit = await github.rest.git.createCommit({
                owner, repo,
                message: 'Open draft PR for workshop request #' + issueNumber,
                tree: mainCommit.data.tree.sha,
                parents: [mainSha]
              });
              await github.rest.git.updateRef({
                owner, repo,
                ref,
                sha: newCommit.data.sha
              });
            }

            // Open the draft PR if it does not already exist.
            let pr = existingPr;
            if (!pr) {
              const prBody = [
                '<!-- workshop-draft-pr -->',
                '## Workshop Draft PR',
                '',
                'Scaffold for [Issue #' + issueNumber + '](https://github.com/' + owner + '/' + repo + '/issues/' + issueNumber + ').',
                '',
                'Closes #' + issueNumber + '.',
                '',
                '### Status',
                'Draft. Push implementation commits to `' + branch + '` and convert this PR to ready-for-review when the validation suite passes.',
                '',
                '### Read / Implement / Verify',
                'See the [triage comment on issue #' + issueNumber + '](https://github.com/' + owner + '/' + repo + '/issues/' + issueNumber + '#issuecomment-) for the full checklist (file deep links, conventions, validation suite).',
                '',
                '### Validation suite (must all pass before flipping to ready)',
                '- `powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/validate-catalog.ps1`',
                '- `npm test`',
                '- `npm run test:games`',
                '- `npm run capture:games:ci` (every rendered surface must score 0)',
                '- `npm run audit:perf:ci`'
              ].join('\n');

              const created = await github.rest.pulls.create({
                owner, repo,
                title: '[Workshop #' + issueNumber + '] ' + issue.title,
                head: branch,
                base: 'main',
                body: prBody,
                draft: true,
                maintainer_can_modify: true
              });
              pr = created.data;
              core.info('Created draft PR ' + pr.html_url);
            }

            core.setOutput('pr_url', pr.html_url);

            // Comment on the issue with the PR link (or update an existing one).
            const issueCommentMarker = '<!-- workshop-draft-pr-link -->';
            const issueCommentBody = issueCommentMarker + '\n**Draft PR:** ' + pr.html_url + ' — push implementation commits to `' + branch + '`.';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100
            });
            const existingLinkComment = comments.find((c) => c.body && c.body.includes(issueCommentMarker));
            if (existingLinkComment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existingLinkComment.id, body: issueCommentBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: issueCommentBody });
            }
