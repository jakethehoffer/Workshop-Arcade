name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp -R \
            index.html \
            404.html \
            offline.html \
            app.webmanifest \
            sw.js \
            robots.txt \
            sitemap.xml \
            feed.json \
            humans.txt \
            LICENSE \
            README.md \
            SECURITY.md \
            package.json \
            package-lock.json \
            covers \
            docs \
            schemas \
            scripts \
            websites \
            .well-known \
            _site/

          touch _site/.nojekyll

          disallowed_dirs=(
            .git
            .github
            .codex
            .ai-sync
            .devcontainer
            .vscode
            node_modules
            output
            test-results
          )
          for dir in "${disallowed_dirs[@]}"; do
            if [ -e "_site/${dir}" ]; then
              echo "Refusing to publish internal path: ${dir}" >&2
              exit 1
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
