name: Workshop Request Triage

on:
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  triage:
    name: Prepare workshop request
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'workshop-request')

    steps:
      - name: Add labels and implementation checklist
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              core.info('No issue payload for workflow_dispatch.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labels = [
              { name: 'workshop-request', color: '0e8a16', description: 'Catalog-generated game improvement request' },
              { name: 'needs-implementation', color: '1d76db', description: 'Ready for an implementation pass' },
              { name: 'enhancement', color: 'a2eeef', description: 'Feature or improvement request' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issue.number,
              labels: labels.map((label) => label.name)
            });

            const marker = '<!-- workshop-triage-checklist -->';
            const branch = `codex/workshop-${issue.number}`;
            const body = `${marker}
            ## Workshop Implementation Checklist

            Suggested branch: \`${branch}\`

            1. Inspect the requested game file and \`websites/manifest.json\`.
            2. Keep the game self-contained and follow \`docs/game-contract.md\`.
            3. Update catalog metadata and cover art when user-visible behavior changes.
            4. Run \`powershell -NoProfile -ExecutionPolicy Bypass -File .\\scripts\\validate-catalog.ps1 -Fix\`.
            5. Run \`powershell -NoProfile -ExecutionPolicy Bypass -File .\\scripts\\validate-catalog.ps1\`.
            6. Run \`npm ci\` if dependencies are not installed, then \`npm run test:games\`.
            7. Open a PR using \`.github/pull_request_template.md\` and link this issue.

            This workflow does not run AI code generation. It prepares the request for a local agent or human implementation pass.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            }
