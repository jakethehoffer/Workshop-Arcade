name: Validate Catalog

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  catalog:
    name: Catalog links and assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run catalog validator
        shell: pwsh
        run: ./scripts/validate-catalog.ps1
