name: Validate Catalog

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  catalog-docs-a11y:
    name: Catalog, docs, and accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run tooling syntax checks
        run: npm run test:tools

      - name: Run test-aggregator contract check
        run: npm run test:test-aggregator

      - name: Run capture recipe preflight
        run: npm run test:capture-recipes

      - name: Run catalog validator
        shell: pwsh
        run: ./scripts/validate-catalog.ps1

      - name: Run docs drift check
        run: npm run test:docs

      - name: Run OSS meta-files contract check
        run: npm run test:meta-files

      - name: Run security workflows contract check
        run: npm run test:security-workflows

      - name: Run contributor-onboarding contract check
        run: npm run test:contributor-onboarding

      - name: Run catalog perf contract check
        run: npm run test:catalog-perf

      - name: Run random-game contract check
        run: npm run test:random-game

      - name: Run keyboard-help contract check
        run: npm run test:keyboard-help

      - name: Run deep-link and Share contract check
        run: npm run test:deep-links

      - name: Run PWA contract check
        run: npm run test:pwa

      - name: Run SW update toast contract check
        run: npm run test:sw-update-toast

      - name: Run fallback page contract check
        run: npm run test:fallback-pages

      - name: Run per-game OG image check
        run: npm run test:og-images

      - name: Run per-game JSON-LD check
        run: npm run test:game-jsonld

      - name: Run SEO contract check
        run: npm run test:seo

      - name: Run JSON Feed contract check
        run: npm run test:feed

      - name: Run accessibility regression check
        run: npm run test:a11y

      - name: Run accessibility polish contract check
        run: npm run test:a11y-polish

  game-smoke:
    name: Game smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run game smoke tests
        run: npm run test:games

  performance-audit:
    name: Performance audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run performance and SEO regression audit
        shell: bash
        run: |
          set -euo pipefail

          npm run start -- --host 127.0.0.1 --port 4173 > /tmp/workshop-arcade-server.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.25
          done

          curl -fsS http://127.0.0.1:4173/ >/dev/null
          WORKSHOP_ARCADE_URL=http://127.0.0.1:4173 npm run audit:perf:ci

      - name: Upload performance audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-audit
          path: test-results/lighthouse-baseline/**/report.md
          if-no-files-found: ignore
          retention-days: 14

  render-capture:
    name: Render capture
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run rendered-quality regression capture
        run: npm run capture:games:ci

      - name: Upload rendered-quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-ranking
          path: |
            test-results/render-ranking/**/summary.json
            test-results/render-ranking/**/contact-sheet.html
            test-results/render-ranking/**/contact-sheet.png
          if-no-files-found: ignore
          retention-days: 14
