name: Validate Catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-docs-a11y:
    name: Catalog, docs, and accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run tooling syntax checks
        run: npm run test:tools

      - name: Run test-aggregator contract check
        run: npm run test:test-aggregator

      - name: Run Playwright harness contract check
        run: npm run test:playwright-harness

      - name: Run publish-readiness contract check
        run: npm run test:publish-ready-contract

      - name: Run owned-domain rehearsal contract check
        run: npm run test:owned-domain-rehearsal-contract

      - name: Run owned-domain cutover preflight contract check
        run: npm run test:owned-domain-cutover-preflight-contract

      - name: Run capture recipe preflight
        run: npm run test:capture-recipes

      - name: Run generated-surface integration check
        run: npm run test:generated-surfaces

      - name: Run grid solvability check
        run: npm run test:grid-solvability

      - name: Run sudoku uniqueness check
        run: npm run test:sudoku-unique

      - name: Run breachline solvability check
        run: npm run test:breachline-solvable

      - name: Run orbit-salvage solvability check
        run: npm run test:orbit-salvage-solvable

      - name: Run chess draw-rule check
        run: npm run test:chess-draws

      - name: Run checkers draw-rule check
        run: npm run test:checkers-draws

      - name: Run shadow-switch solvability check
        run: npm run test:shadow-switch-solvable

      - name: Run shadow-vault solvability check
        run: npm run test:shadow-vault-solvable

      - name: Run validator fixture negative checks
        run: npm run test:validator-fixtures

      - name: Run manifest schema check
        run: npm run test:manifest-schema

      - name: Enforce catalog content freeze
        run: npm run test:catalog-freeze

      - name: Run tag coverage check
        run: npm run test:tag-coverage

      - name: Run catalog validator
        shell: pwsh
        run: ./scripts/validate-catalog.ps1

      - name: Run docs drift check
        run: npm run test:docs

      - name: Run OSS meta-files contract check
        run: npm run test:meta-files

      - name: Run security workflows contract check
        run: npm run test:security-workflows

      - name: Run live-smoke slug derivation fixtures
        run: npm run test:live-smoke-slugs

      - name: Run Pages artifact assembly check
        run: npm run test:pages-artifact

      - name: Run owned-domain readiness check
        run: npm run test:owned-domain-readiness

      - name: Run contributor-onboarding contract check
        run: npm run test:contributor-onboarding

      - name: Run architecture-doc contract check
        run: npm run test:architecture-doc

      - name: Run catalog perf contract check
        run: npm run test:catalog-perf

      - name: Run workshop feedback contract check
        run: npm run test:workshop-feedback

      - name: Run performance baseline truth check
        run: npm run test:performance-baseline

      - name: Run static page-weight contract check
        run: npm run test:page-weight

      - name: Run PWA install-payload budget check
        run: npm run test:pwa-install-budget

      - name: Run cover asset contract check
        run: npm run test:cover-assets

      - name: Run per-game diagnostic-hook contract check
        run: npm run test:game-contract

      - name: Run storage runtime contract check
        run: npm run test:storage-contract

      - name: Run CSP contract check
        run: npm run test:csp

      - name: Run game-page input-safety check
        run: npm run test:game-input-safety

      - name: Run random-game contract check
        run: npm run test:random-game

      - name: Run keyboard-help contract check
        run: npm run test:keyboard-help

      - name: Run deep-link and Share contract check
        run: npm run test:deep-links

      - name: Run URL filters contract check
        run: npm run test:url-filters

      - name: Run favorites contract check
        run: npm run test:favorites

      - name: Run PWA contract check
        run: npm run test:pwa

      - name: Run SW update toast contract check
        run: npm run test:sw-update-toast

      - name: Run fallback page contract check
        run: npm run test:fallback-pages

      - name: Run install prompt contract check
        run: npm run test:install-prompt

      - name: Run player fullscreen contract check
        run: npm run test:player-fullscreen

      - name: Run player data controls contract check
        run: npm run test:player-data-controls

      - name: Run player session contract check
        run: npm run test:player-session

      - name: Run per-game OG image check
        run: npm run test:og-images

      - name: Run per-game JSON-LD check
        run: npm run test:game-jsonld

      - name: Run SEO contract check
        run: npm run test:seo

      - name: Run JSON Feed contract check
        run: npm run test:feed

      - name: Run accessibility regression check
        run: npm run test:a11y

      - name: Run accessibility polish contract check
        run: npm run test:a11y-polish

  game-smoke:
    name: Game smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run runtime storage fallback probe
        run: npm run test:runtime-storage

      - name: Run player storage bridge probe
        run: npm run test:player-storage-bridge

      - name: Run reduced-motion baseline probe
        run: npm run test:reduced-motion

      - name: Run real-time progression probe
        run: npm run test:realtime-progression

      - name: Run best-score guard probe
        run: npm run test:best-score-guard

      - name: Run corrupt-storage robustness probe
        run: npm run test:corrupt-storage

      - name: Run best-on-fail persistence probe
        run: npm run test:best-on-fail-persistence

      - name: Run scoped verification contract probe
        run: npm run test:scoped-verification

      - name: Run PWA runtime probe
        run: npm run test:pwa-runtime

      - name: Run live canvas evidence fixture
        run: npm run test:live-canvas-evidence

      - name: Run game smoke tests
        run: npm run test:games

      - name: Run WCAG AA contrast gate
        run: npm run audit:contrast:ci

      - name: Upload game smoke summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-smoke-summary
          path: test-results/smoke-games/**/summary.json
          if-no-files-found: ignore
          retention-days: 14

  performance-audit:
    name: Performance audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run performance and SEO regression audit
        shell: bash
        run: |
          set -euo pipefail

          npm run start -- --host 127.0.0.1 --port 4173 > /tmp/workshop-arcade-server.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.25
          done

          curl -fsS http://127.0.0.1:4173/ >/dev/null
          WORKSHOP_ARCADE_URL=http://127.0.0.1:4173 npm run audit:perf:ci

      - name: Upload performance audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-audit
          path: |
            test-results/lighthouse-baseline/**/summary.json
            test-results/lighthouse-baseline/**/report.md
          if-no-files-found: ignore
          retention-days: 14

  render-capture:
    name: Render capture
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run rendered-quality regression capture
        run: npm run capture:games:ci

      - name: Upload rendered-quality report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-ranking
          path: |
            test-results/render-ranking/**/summary.json
            test-results/render-ranking/**/contact-sheet.html
            test-results/render-ranking/**/contact-sheet.png
          if-no-files-found: ignore
          retention-days: 14

  pages-build:
    name: Build static artifact
    needs:
      - catalog-docs-a11y
      - game-smoke
      - performance-audit
      - render-capture
    if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Check out validated revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Assemble static site
        run: node scripts/build-pages-artifact.mjs --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  pages-deploy:
    name: Deploy
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  live-smoke:
    name: Live Pages smoke
    needs: pages-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Select touched live smoke slugs
        run: node scripts/derive-live-smoke-slugs.mjs --event-name "${{ github.event_name }}" --base "${{ github.event.before }}" --head "${{ github.sha }}" --github-env "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run post-deploy live smoke
        shell: bash
        env:
          WORKSHOP_ARCADE_URL: ${{ needs.pages-deploy.outputs.page_url }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if npm run test:live-pages; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Live smoke attempt ${attempt} failed; waiting for Pages propagation..."
              sleep 15
            fi
          done

          echo "Live smoke failed after 3 attempts."
          exit 1

      - name: Upload live smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-pages-smoke
          path: test-results/live-pages-smoke/**
          if-no-files-found: ignore
          retention-days: 14
